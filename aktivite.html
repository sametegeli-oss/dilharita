<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📋 Bugünkü Aktivitem — Dil Harita</title>
<style>
:root{--bg:#0a1628;--card:#0f1f3a;--line:#1e3a5f;--tx:#e8eef7;--mut:#9fb3d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 14px}
.top a{color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
h1{font-size:17px;margin:0;flex:1}
.stats{max-width:720px;margin:0 auto 14px;display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;flex:1;min-width:90px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--mut)}
.feed{max-width:720px;margin:0 auto}
.hour-group{margin-bottom:16px}
.hour-label{font:800 11px system-ui;color:#60a5fa;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;padding-left:4px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 14px;margin-bottom:6px;font-size:13.5px}
.item.correct{border-left:4px solid #22c55e}
.item.wrong{border-left:4px solid #f59e0b}
.item.visit{border-left:4px solid #38bdf8;opacity:.85}
.time{color:var(--mut);font-size:11.5px;flex:0 0 auto;min-width:40px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
</style></head><body>
<div class="top"><a href="./index.html">←</a><h1>📋 Bugünkü Aktivitem</h1></div>
<div class="stats" id="stats"></div>
<div class="feed" id="feed"></div>

<script>
(function(){
  var K="dh-activity-log-v1";
  var log=[]; try{ log=JSON.parse(localStorage.getItem(K)||"[]")||[]; }catch(e){}
  var today=new Date().toISOString().slice(0,10);
  log=log.filter(function(e){ return e.d===today; }).sort(function(a,b){ return a.ts-b.ts; });

  var correct=0, wrong=0, visits=0;
  log.forEach(function(e){ if(e.kind==="correct")correct++; else if(e.kind==="wrong")wrong++; else if(e.kind==="visit")visits++; });
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b style="color:#4ade80">'+correct+'</b><span>doğru cevap</span></div>'
    +'<div class="stat"><b style="color:#f59e0b">'+wrong+'</b><span>yanlış cevap</span></div>'
    +'<div class="stat"><b style="color:#38bdf8">'+visits+'</b><span>sayfa ziyareti</span></div>'
    +'<div class="stat"><b>'+log.length+'</b><span>toplam olay</span></div>';

  var feed=document.getElementById("feed");
  if(!log.length){ feed.innerHTML='<div class="empty">Bugün henüz bir aktivite kaydedilmedi.<br>Bir modülde çalışmaya başlayınca burada anlık olarak görünecek.</div>'; return; }

  // saate göre grupla (en yeni üstte)
  var groups={}, order=[];
  log.slice().reverse().forEach(function(e){
    var h=new Date(e.ts).getHours();
    var key=(h<10?"0":"")+h+":00";
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(e);
  });
  feed.innerHTML = order.map(function(hk){
    return '<div class="hour-group"><div class="hour-label">'+hk+'</div>'
      + groups[hk].map(function(e){
          var t=new Date(e.ts); var tt=(t.getHours()<10?"0":"")+t.getHours()+":"+(t.getMinutes()<10?"0":"")+t.getMinutes();
          return '<div class="item '+(e.kind||"info")+'"><span class="time">'+tt+'</span><span>'+
            String(e.detail||"").replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c];})+'</span></div>';
        }).join("")
      + '</div>';
  }).join("");
})();
</script>
</body></html>
