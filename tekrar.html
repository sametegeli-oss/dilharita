<!-- TEKRAR.HTML İÇİN EKLENTİ BÖLÜMÜ -->

<!-- 1. Üst Kısımda Görünecek Dinamik Tuğla Duvarı -->
<style>
  .sharedBrickWrap{background:#0b172d; border:1px solid #1e3a5f; border-radius:12px; padding:10px 14px; margin:10px 15px 14px; display:flex; flex-direction:column; gap:5px;}
  .sharedBrickHeader{font-size:12px; color:#9fb3d9; font-weight:700; display:flex; justify-content:space-between;}
  .sharedBricksGrid{display:flex; gap:4px; flex-wrap:wrap; perspective: 1000px;}
  .s-brick{flex:1; min-width:16px; height:22px; background:#f59e0b; border-radius:3px; transition:all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);}
  .s-brick.done{transform: translateY(20px) rotateX(45deg) scale(0.5); opacity:0;}
  
  /* 2. Yüzen Koç Butonu */
  .floatingCoachBtn { position:fixed; right:20px; bottom:20px; width:60px; height:60px; border-radius:50%; background:#10264a; border:2px solid #10b981; box-shadow:0 4px 15px rgba(0,0,0,0.5); cursor:pointer; z-index:999; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:transform 0.2s;}
  .floatingCoachBtn:active { transform:scale(0.9); }
  .floatingCoachBtn img { width:100%; height:100%; object-fit:cover; }
</style>

<div id="topBrickContainer"></div>

<!-- Sağ Altta Koça Sor Butonu -->
<div class="floatingCoachBtn" onclick="askCoachAboutCurrentSentence()">
  <img src="./assets/avatars_v3/teacher/idle.webp" alt="Koç">
</div>

<script>
// Tuğla Duvarını Üst Menünün Altına Enjekte Et
var brickHTML = '<div class="sharedBrickWrap"><div class="sharedBrickHeader"><span>🏗️ Günlük Hedef Duvarı</span><span id="sbTxt">0/5</span></div><div class="sharedBricksGrid" id="sbGrid"></div></div>';
document.body.insertAdjacentHTML('afterbegin', brickHTML); // Sayfanın en üstüne ekler

var lastCompletedCount = -1;

function updateSharedBricks(){
  try{
    var t = JSON.parse(localStorage.getItem("dh-study-tracker-v1") || "{}");
    var todayStr = new Date().toISOString().slice(0,10);
    var d = (t.days || {})[todayStr] || {};
    var completed = d.sentences || d.reviews || 0;
    var goal = 5; 
    try { if(window.DHProfile) goal = DHProfile.hedef(); } catch(e){}

    var grid = document.getElementById("sbGrid");
    if(!grid) return;
    
    // Eğer yeni bir cümle yapıldıysa SES ÇAL!
    if(lastCompletedCount !== -1 && completed > lastCompletedCount) {
        if(window.playBrickSound) playBrickSound(); // index.html'deki ses fonksiyonu globaldeyse çalar
    }
    lastCompletedCount = completed;

    grid.innerHTML = "";
    document.getElementById("sbTxt").textContent = completed + " / " + goal + " Yıkıldı";

    for(var i = 0; i < goal; i++){
      var b = document.createElement("div");
      b.className = "s-brick" + (i < completed ? " done" : "");
      grid.appendChild(b);
    }
    
    // EĞER TEKRARLAR BİTTİYSE (Queue 0 ise) INDEX'E DÖNERKEN STATE KAYDET
    if (window.studyTracker && typeof window.studyTracker.getDueCount === 'function') {
        if(window.studyTracker.getDueCount() === 0) {
            localStorage.setItem("dh_coach_state", "tekrar_done");
            // Mevcut 'İleri' butonunuz tıklandığında index.html'e gidecek, koç kaldığı yerden devam edecek.
        }
    }

  }catch(e){}
}
setInterval(updateSharedBricks, 1000);

// Koça Anlık Soru Sorma Fonksiyonu
function askCoachAboutCurrentSentence() {
    // Ekranda o an çalışan cümleyi çek (HTML yapına göre sınıfı güncelle)
    var currentEn = document.querySelector('.en-sentence-class') ? document.querySelector('.en-sentence-class').innerText : "Bu cümle";
    
    var question = prompt("Koça bu cümle hakkında ne sormak istersin?\n\nCümle: " + currentEn);
    if(question) {
        alert("Koç Düşünüyor...\n(Soru: " + question + ")\n\nCevap: Bu cümlede 'Present Perfect Continuous' kullanılmıştır. Çünkü eylem geçmişte başlayıp hala devam etmektedir.");
        // Gerçek API bağlantısı varsa buraya `aiProviders.ask(...)` eklenebilir.
    }
}
</script>
