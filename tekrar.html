<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔁 Tekrar — Dil Harita</title>
<style>
:root{--bg:#0a1628;--card:#0f1f3a;--line:#1e3a5f;--tx:#e8eef7;--mut:#9fb3d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 12px}
.top a{color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
h1{font-size:17px;margin:0;flex:1}.cnt{color:var(--mut);font-size:12px;text-align:right}
.mode{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.mode button{background:#13294d;color:#9fb3d9;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:700 12px system-ui;cursor:pointer}
.mode button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.mode button.err-on{background:#dc2626;color:#fff;border-color:#dc2626}
.card{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.kind{font-size:11px;font-weight:800;letter-spacing:.5px;color:#38bdf8;text-transform:uppercase}
.kind .err{color:#fbbf24}.kind .leech{color:#f87171}
.q{font-size:23px;font-weight:800;margin:10px 0 4px}
.a{font-size:17px;color:#a7f3d0;min-height:26px;margin:8px 0}
.a.hid{visibility:hidden}
.inrow{display:flex;gap:8px;margin:10px 0 2px}
.inrow input{flex:1;background:#0a1628;border:1px solid var(--line);border-radius:11px;color:#fff;font:600 16px system-ui;padding:11px 13px}
.score{font-size:13px;font-weight:800;min-height:20px;margin:4px 0;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:12px 15px;font:800 14px system-ui;cursor:pointer;color:#fff}
.b-show{background:#334155;flex:1}.b-say{background:#0e7490}.b-mic{background:#7c3aed}.b-chk{background:#2563eb;flex:1}
.b-hard{background:#dc2626;flex:1}.b-easy{background:#16a34a;flex:1}.b-gemini{background:#4f46e5;flex:1}
.exp{margin-top:12px;background:#101c33;border:1px solid #274468;border-radius:12px;padding:12px;font-size:13.5px;display:none}
.exp b{color:#93c5fd}.exp .cm{color:#fbbf24;display:block;margin-top:6px}.exp .co{color:#86efac;display:block;margin-top:6px}
.exp .askrow{margin-top:10px}
.done{max-width:720px;margin:40px auto;text-align:center;color:var(--mut)}
.done b{color:#a7f3d0;font-size:20px;display:block;margin-bottom:8px}
.b-more{background:#2563eb;margin-top:12px}.b-next{background:#0e7490;margin:6px 4px 0}

/* Diff Visual Styles & Fixed Sizing for Auto-Wrap */
.diff-box{margin-top:6px; background:#071120; padding:8px; border-radius:8px; font-weight:normal; display:inline-block; width:100%; word-break:break-word; white-space:normal;}
.diff-match{color:#4ade80;margin-right:4px;font-weight:bold;display:inline-block;}
.diff-typo{color:#f59e0b;margin-right:4px;font-weight:bold;display:inline-block;border-bottom:2px dashed #f59e0b;cursor:help;}
.diff-wrong{color:#f87171;text-decoration:line-through;margin-right:4px;display:inline-block;}
.diff-missing{color:#6b7280;border-bottom:1px dashed #6b7280;margin-right:4px;display:inline-block;}
</style></head><body>
<div class="top"><a href="./index.html" id="btnHome">←</a><h1>🔁 Tekrar</h1><div class="cnt" id="cnt"></div></div>
<div class="mode">Mod:
  <button id="mProd">✍️ Üretim (TR→EN)</button>
  <button id="mClas">👁 Klasik (EN→TR)</button>
  <button id="mOnlyErrs">🚨 Sadece Hatalılar</button>
</div>
<div class="card" id="card" style="display:none">
  <div class="kind" id="kind"></div>
  <div class="q" id="q"></div>
  <div class="a hid" id="a"></div>
  <div id="prodBox" style="display:none">
    <div class="inrow"><input id="inp" autocomplete="off" autocapitalize="off" placeholder="İngilizcesini yaz…"><button class="b-mic" id="bMic" title="Mikrofonla söyle">🎤</button></div>
    <div class="score" id="score"></div>
  </div>
  <div class="row">
    <button class="b-show" id="bShow" style="display:none">👁 Göster</button>
    <button class="b-chk" id="bChk" style="display:none">Kontrol et</button>
    <button class="b-say" id="bSay">🔊</button>
  </div>
  <div class="row" id="grade" style="display:none">
    <button class="b-hard" id="bHard">Zor</button>
    <button class="b-gemini" id="bGemini">✨ Gemini'ye Sor</button>
    <button class="b-easy" id="bEasy">Bildim ✓</button>
  </div>
  <div class="exp" id="exp"></div>
</div>
<div class="done" id="done" style="display:none">
  <b id="doneTitle">🎉</b><span id="doneSub"></span><br>
  <button class="b-more" id="bMore" style="display:none">Sonraki 40'ı getir →</button>
  <div id="planNext" style="display:none;margin-top:14px">
    <div style="font-size:13px;margin-bottom:4px">☀️ Günün sıradaki adımı:</div>
    <a href="./index-app.html"><button class="b-next">🆕 Yeni cümleler</button></a>
    <a href="./chat.html"><button class="b-next">💬 1 dk konuşma</button></a>
  </div>
  <div style="margin-top:10px"><a href="./index.html" style="color:#38bdf8">Ana menü</a></div>
</div>

<script src="./auth-guard.js?v=2"></script>
<script src="./progress-engine.js?v=2"></script>
<script src="./cloud-sync-v8.js?v=1"></script>
<script>
(async function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var DAY=86400000, SESSION=40, now=Date.now();
  var PLAN=/[?&]plan=1/.test(location.search);
  var mode=localStorage.getItem("dh-tekrar-mode")||"prod";
  
  var showOnlyErrors = false; 
  localStorage.setItem("dh-only-errors", "0");

  /* ---- kv (practice ile ortak depo) ---- */
  function kvOpen(){ return new Promise(function(res){ try{ var r=indexedDB.open("sentence-mode",1); r.onsuccess=function(){res(r.result)}; r.onerror=function(){res(null)}; }catch(e){res(null)} }); }
  async function kvPrefix(pre){
    var db=await kvOpen(); if(!db) return {};
    return new Promise(function(res){
      try{ var out={}, req=db.transaction("kv","readonly").objectStore("kv").openCursor();
        req.onsuccess=function(e){ var c=e.target.result;
          if(c){ var k=String(c.key); if(k.indexOf(pre)===0) out[k.slice(pre.length)]=c.value; c.continue(); }
          else{ db.close(); res(out); } };
        req.onerror=function(){ db.close(); res({}); };
      }catch(e){ try{db.close()}catch(_){ } res({}); } });
  }
  async function kvPut(key,val){
    var db=await kvOpen(); if(!db) return;
    return new Promise(function(res){
      try{ var tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(val,key);
        tx.oncomplete=function(){db.close();res()}; tx.onerror=function(){db.close();res()};
      }catch(e){ try{db.close()}catch(_){ } res(); } });
  }

  /* ---- SM-2 (practice ile birebir) ---- */
  function srsStep(n, hard){
    n=n&&typeof n==="object"?n:{rep:0,ef:2.5,interval:0,due:0,last:0};
    var r=Date.now();
    if(hard){ n.rep=0; n.interval=0; n.ef=Math.max(1.3,(n.ef||2.5)-0.2); n.lapses=(n.lapses||0)+1; }
    else{ n.rep=(n.rep||0)+1;
      var q=4; n.ef=Math.max(1.3,(n.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02)));
      if(n.rep===1) n.interval=1; else if(n.rep===2) n.interval=4;
      else n.interval=Math.round((n.interval||4)*n.ef);
    }
    n.last=r; n.due=r+n.interval*DAY;
    return n;
  }

  /* ---- Levenshtein Distance Algoritması ---- */
  function getLevenshteinSimilarity(s1, s2) {
    var m = s1.length, n = s2.length;
    if (m === 0) return n === 0 ? 100 : 0;
    if (n === 0) return 0;
    var d = Array.from({ length: m + 1 }, function() { return new Array(n + 1).fill(0); });
    for (var i = 0; i <= m; i++) d[i][0] = i;
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        var cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      }
    }
    var maxLen = Math.max(m, n);
    return Math.round(((maxLen - d[m][n]) / maxLen) * 100);
  }

  /* ---- Veri Yükleme İşlemleri ---- */
  var srs = {}, wsrs = {};
  try {
    srs = await kvPrefix("srs:");
    wsrs = await kvPrefix("wsrs:");
  } catch(e) { console.error("Lokal DB okuma hatası:", e); }

  var mirror={}; try{ mirror=JSON.parse(localStorage.getItem("dh-progress-mirror-v1")||"{}")||{}; }catch(e){}
  var errs=[]; try{ if(window.LearningErrorDB&&LearningErrorDB.all) errs=await LearningErrorDB.all(); }catch(e){}
  var items=[], seen={};
  function push(kind,id,due,tag){ if(seen[kind+id]) return; seen[kind+id]=1; items.push({kind:kind,id:id,due:due||0,tag:tag||"",tries:0}); }
  
  for(var sid in srs){ if(srs.hasOwnProperty(sid)){ var r0=srs[sid]||{}; if((r0.due||0)<=now) push("s",sid,r0.due,(r0.lapses||0)>=3?"leech":""); } }
  for(var mid in mirror){ if(!mirror.hasOwnProperty(mid)) continue;
    if(mirror[mid]&&mirror[mid][0]===1){
      if(mid.indexOf("sentence:")===0){ var s1=mid.slice(9); if(!srs[s1]) push("s",s1,0,"yeni"); }
      else if(mid.indexOf("word:")===0){ var w1=mid.slice(5); var wr=wsrs[w1]; if(!wr) push("w",w1,0,"yeni"); else if((wr.due||0)<=now) push("w",w1,wr.due,(wr.lapses||0)>=3?"leech":""); }
    } }
  var errText={};
  errs.forEach(function(r){ var id=r&&(r.sentenceId||r.id); if(!id) return;
    if(!errText[id]) errText[id]={en:r.sentenceEN||r.sentence||r.en||"",tr:r.sentenceTR||r.tr||""};
    if(!srs[id]) push("s",id,0,"hata"); });

  if (showOnlyErrors) {
    items = items.filter(function(x) { return x.tag === "hata" || x.tag === "leech"; });
  }

  items.sort(function(a,b){ return (a.due||0)-(b.due||0); });
  var total=items.length, session=items.slice(0,SESSION), remaining=total-session.length;
  $("cnt").innerHTML=total?("bugün: <b style='color:#e8eef7'>"+total+"</b>"+(remaining?(" · oturum: "+session.length):"")):"";
  if(!total){ $("doneTitle").textContent="🎉 Bugünlük tekrar yok!"; $("doneSub").textContent="Vadesi gelen öğe bulunmuyor.";
    if(PLAN) $("planNext").style.display="block"; $("done").style.display="block"; return; }

  /* ---- metinler ---- */
  var sentMap={}, dict={};
  if(session.some(function(x){return x.kind==="s"})){
    try{ var all=await (await fetch("./data/sentences.json")).json(); all.forEach(function(s){sentMap[s.id]=s;}); }catch(e){}
  }
  if(session.some(function(x){return x.kind==="w"})){
    try{ dict=await (await fetch("./data/dictionary.json")).json()||{}; }catch(e){}
  }
  function texts(it){
    if(it.kind==="s"){ var s=sentMap[it.id]||errText[it.id]||{};
      return {en:s.en||it.id,tr:s.tr||"",exp:s.aiExplain||"",cm:s.commonMistake||"",
        co:Array.isArray(s.collocations)?s.collocations.slice(0,4).join(" · "):String(s.collocations||"")};
    }
    var d=dict[it.id]||dict[it.id.toLowerCase()];
    return {en:it.id,tr:(d&&d.anlamlar)?d.anlamlar.slice(0,3).join(", "):"",exp:"",cm:"",co:""};
  }

  /* ---- mod anahtarı ---- */
  function paintMode(){ 
    $("mProd").classList.toggle("on",mode==="prod"); 
    $("mClas").classList.toggle("on",mode==="clas"); 
    $("mOnlyErrs").classList.toggle("err-on", showOnlyErrors);
  }
  $("mProd").onclick=function(){ mode="prod"; localStorage.setItem("dh-tekrar-mode",mode); paintMode(); render(); };
  $("mClas").onclick=function(){ mode="clas"; localStorage.setItem("dh-tekrar-mode",mode); paintMode(); render(); };
  
  $("mOnlyErrs").onclick=function(){
    showOnlyErrors = !showOnlyErrors;
    localStorage.setItem("dh-only-errors", showOnlyErrors ? "1" : "0");
    location.reload();
  };
  paintMode();

  /* ---- benzerlik ---- */
  function norm(t){ return String(t||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim(); }
  function similarity(a,b){
    a=norm(a); b=norm(b);
    if(!a||!b) return 0;
    if(a===b) return 100;
    var A=a.split(" "), B=b.split(" "), setB={}, hit=0;
    B.forEach(function(w){ setB[w]=(setB[w]||0)+1; });
    A.forEach(function(w){ if(setB[w]){ hit++; setB[w]--; } });
    return Math.round(100*2*hit/(A.length+B.length));
  }

  /* ---- Gelişmiş Fark Analizi ---- */
  function getDiffHtml(userText, correctText) {
    var uArr = norm(userText).split(" ").filter(Boolean);
    var cArr = norm(correctText).split(" ").filter(Boolean);
    var html = "";
    var i = 0, j = 0;

    while (i < uArr.length || j < cArr.length) {
      if (i < uArr.length && j < cArr.length && uArr[i] === cArr[j]) {
        html += '<span class="diff-match">' + cArr[j] + '</span>';
        i++; j++;
      } else {
        var lookAheadUser = uArr.indexOf(cArr[j], i);
        var lookAheadCorrect = cArr.indexOf(uArr[i], j);

        if (lookAheadUser !== -1 && (lookAheadCorrect === -1 || lookAheadUser - i <= lookAheadCorrect - j)) {
          while (i < lookAheadUser) {
            var levSim = getLevenshteinSimilarity(uArr[i], cArr[j]);
            if(levSim >= 75) {
              html += '<span class="diff-typo" title="Yazım Hatası! (Doğrusu: ' + cArr[j] + ') -> Benzerlik: %' + levSim + '">' + uArr[i] + '</span>';
              j++;
            } else {
              html += '<span class="diff-wrong">' + uArr[i] + '</span>';
            }
            i++;
          }
        } else if (lookAheadCorrect !== -1) {
          while (j < lookAheadCorrect) {
            html += '<span class="diff-missing">' + cArr[j] + '</span>';
            j++;
          }
        } else {
          if (i < uArr.length && j < cArr.length) {
            var levSim = getLevenshteinSimilarity(uArr[i], cArr[j]);
            if(levSim >= 75) {
              html += '<span class="diff-typo" title="Yazım Hatası! (Doğrusu: ' + cArr[j] + ') -> Benzerlik: %' + levSim + '">' + uArr[i] + '</span>';
              i++; j++;
            } else {
              html += '<span class="diff-wrong">' + uArr[i] + '</span>'; i++;
              html += '<span class="diff-missing">' + cArr[j] + '</span>'; j++;
            }
          } else {
            if (i < uArr.length) { html += '<span class="diff-wrong">' + uArr[i] + '</span>'; i++; }
            if (j < cArr.length) { html += '<span class="diff-missing">' + cArr[j] + '</span>'; j++; }
          }
        }
      }
    }
    return html || "<span style='color:var(--mut)'>[Boş Giriş]</span>";
  }

  /* ---- açıklama paneli ---- */
  function showExplain(t, leech){
    var html="";
    if(t.exp) html+="<b>💡 Açıklama:</b> " + t.exp;
    if(t.cm)  html+='<span class="cm">⚠ Tipik hata: ' + t.cm + "</span>";
    if(t.co)  html+='<span class="co">🔗 Kalıplar: ' + t.co + "</span>";
    if(leech){
      html+='<div class="askrow"><b style="color:#f87171">🧲 İnatçı öğe</b> — kök kelimeleri oturumun önüne eklendi. '
          +'<button class="b-say" style="padding:7px 12px;font-size:12px" id="bAsk">🎓 Öğretmene sor</button></div>';
    }
    if(!html){ $("exp").style.display="none"; return; }
    $("exp").innerHTML=html; $("exp").style.display="block";
    var ba=$("bAsk");
    if(ba) ba.onclick=function(){
      var qq="Bu cümleyi bir türlü öğrenemiyorum, bana parçalayarak ve örneklerle anlatır mısın?\n\n"+$( "q").textContent+"\n"+($("a").textContent||"");
      try{ navigator.clipboard&&navigator.clipboard.writeText(qq); }catch(e){}
      window.open("./teacher.html","_blank");
    };
  }

  /* ---- akış ---- */
  var i=0, doneCount=0, cur=null, curT=null, revealed=false, lastSc=-1;
  function speak(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.__dhMixed=true; u.__longTTSAvatarSync=true; speechSynthesis.speak(u); }catch(e){} }

  /* Gelişmiş Toplu Bulut Senkronizasyonu (Kota Dostu Mod) */
  function triggerCloudSync() {
    try {
      if (window.DHCloudSync && window.DHCloudSync.push) {
        console.log("Oturum bitti veya çıkış yapılıyor, toplu bulut senkronizasyonu tetiklendi...");
        window.DHCloudSync.push();
      }
    } catch(e) { console.error("Bulut senkronizasyon hatası:", e); }
  }

  // Kullanıcı Ana Menü butonuna bastığında da toplu senkronizasyon tetiklensin
  $("btnHome").onclick = function() {
    triggerCloudSync();
  };

  function render(){
    if(i>=session.length){
      $("card").style.display="none";
      $("doneTitle").textContent="🎉 Oturum bitti!";
      $("doneSub").textContent=doneCount+" öğe tekrar edildi."+(remaining?(" Bekleyen: "+remaining):"");
      if(remaining) $("bMore").style.display="inline-block";
      if(PLAN) $("planNext").style.display="block";
      $("done").style.display="block";
      
      // Optimizasyon: Anlık istek yerine sadece oturum başarıyla bittiğinde 1 kere istek atılır!
      triggerCloudSync();
      return;
    }
    cur=session[i]; curT=texts(cur); revealed=false;
    var prod=(mode==="prod");
    var lbl=(cur.kind==="s"?"Cümle":"Kelime")+" "+(i+1)+"/"+session.length;
    $("kind").innerHTML=lbl
      +(cur.tag==="hata"?' <span class="err">⚠ hata defterinden</span>':"")
      +(cur.tag==="leech"?' <span class="leech">🧲 inatçı</span>':"")
      +(cur.tag==="yeni"?" · yeni":"");
    $("q").textContent = prod ? (curT.tr||curT.en) : curT.en;
    $("a").textContent = prod ? curT.en : (curT.tr||"—");
    $("a").classList.add("hid");
    $("prodBox").style.display=prod?"block":"none";
    $("inp").value=""; $("score").textContent="";
    $("bShow").style.display=prod?"none":"";
    $("bChk").style.display=prod?"":"none";
    $("grade").style.display="none";
    $("exp").style.display="none";
    $("card").style.display="block";
    $("bSay").onclick=function(){ speak(curT.en); };
    if(prod) setTimeout(function(){ try{$("inp").focus();}catch(e){} },50);
  }

  function reveal(auto){
    if(revealed) return; revealed=true;
    $("a").classList.remove("hid");
    $("grade").style.display="flex";
    $("bShow").style.display="none"; $("bChk").style.display="none";
    if(mode==="prod"){
      var userInputValue = $("inp").value;
      var sc=similarity(userInputValue, curT.en); lastSc=sc;
      
      var diffResult = getDiffHtml(userInputValue, curT.en);
      $("score").innerHTML="Benzerlik: <span style='color:"+(sc>=80?"#4ade80":(sc>=50?"#fbbf24":"#f87171"))+"'>%"+sc+"</span>"+(sc>=80?" — Bildim'e hazır ✓":"") + 
                           "<br><div class='diff-box'>" + diffResult + "</div>";
      
      if(sc<80) showExplain(curT,false);
      speak(curT.en);
    }
  }
  $("bShow").onclick=function(){ reveal(); };
  $("bChk").onclick=function(){ reveal(); };
  
  window.addEventListener("keydown", function(e) {
    var activeTag = document.activeElement.tagName.toLowerCase();
    if (activeTag === "input") {
      if (e.key === "Enter") reveal();
      return; 
    }
    if (revealed && $("grade").style.display === "flex") {
      var key = e.key.toLowerCase();
      if (key === "z") {
        $("bHard").click();
      } else if (key === "g") {
        $("bGemini").click();
      } else if (key === "b" || e.key === " ") {
        e.preventDefault();
        $("bEasy").click();
      }
    }
  });

  /* 🎤 mikrofon */
  $("bMic").onclick=function(){
    try {
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return alert("Bu tarayıcıda mikrofon tanıma yok.");
      var rec=new SR(); rec.lang="en-US"; rec.interimResults=false;
      $("bMic").textContent="🔴";
      rec.onresult=function(e){ $("inp").value=e.results[0][0].transcript; $("bMic").textContent="🎤"; reveal(); };
      rec.onerror=rec.onend=function(){ $("bMic").textContent="🎤"; };
      rec.start();
    }catch(e){ $("bMic").textContent="🎤"; }
  };

  /* Akıllı Ceza Kutusu Modülü */
  function injectLeechWords(sentenceEn) {
    var words = norm(sentenceEn).split(" ").filter(function(w) { return w.length > 3; });
    words.forEach(function(word) {
      if((dict[word] || dict[word.toLowerCase()]) && !seen["w" + word]) {
        session.splice(i + 1, 0, { kind: "w", id: word, due: 0, tag: "leech", tries: 0 });
      }
    });
  }

  async function grade(hard){
    var it=cur;
    var key=(it.kind==="s"?"srs:":"wsrs:")+it.id;
    var rec=srsStep(it.kind==="s"?srs[it.id]:wsrs[it.id], hard);
    if(!hard && mode==="prod" && lastSc>=0 && lastSc<50){
      rec.interval=Math.max(1,Math.round(rec.interval/2)); rec.due=Date.now()+rec.interval*DAY;
    }
    lastSc=-1;
    var leech = hard && (rec.lapses||0)>=3;
    
    if(leech){ 
      rec.interval=1; rec.due=Date.now()+DAY; 
      if(it.kind === "s") {
        injectLeechWords(curT.en);
      }
    }
    
    if(it.kind==="s") srs[it.id]=rec; else wsrs[it.id]=rec;
    try { await kvPut(key, rec); } catch(e) {}
    try{ if(window.DHProgress&&DHProgress.recordResult) DHProgress.recordResult((it.kind==="s"?"sentence:":"word:")+it.id, !hard); }catch(e){}
    
    // NOT: Anlık çalışan DHCloudSync.push() tetikleyicisi Firebase kotalarını korumak için buradan tamamen kaldırıldı.
    
    if(hard){
      showExplain(curT, leech);
      if(!leech && it.tries<2){ it.tries++; session.push(it); }
      $("grade").style.display="none";
      var go=document.createElement("button"); go.className="b-chk"; go.style.marginTop="10px"; go.textContent="Devam →";
      go.onclick=function(){ go.remove(); doneOrNext(!leech&&it.tries<=2&&false); };
      $("exp").appendChild(go);
      function doneOrNext(){ i++; render(); }
      return;
    }
    doneCount++; i++; render();
  }
  $("bHard").onclick=function(){ grade(true); };
  $("bEasy").onclick=function(){ grade(false); };

  /* Gelişmiş Gemini Entegrasyonu */
  $("bGemini").onclick = function() {
    var trSentence = (mode === "prod") ? $("q").textContent : (curT.tr || "");
    var correctEn = curT.en;
    var userEn = $("inp").value.trim() || "[Kullanıcı boş bıraktı]";
    
    var systemNotes = "";
    if (curT.cm) systemNotes += "\n⚠️ Bu cümle için bilinen tipik hata: " + curT.cm;
    if (curT.exp) systemNotes += "\n💡 Sistem açıklaması: " + curT.exp;

    var promptText = "Bir İngilizce öğrenme uygulamasında TR->EN üretimi çalışıyorum. Aşağıdaki eşleşmeyi analiz et:\n\n" +
                     "🇹🇷 Türkçe Kaynak: " + trSentence + "\n" +
                     "✅ Altın Standart Çeviri: " + correctEn + "\n" +
                     "✍️ Benim Yazdığım Çeviri: " + userEn + "\n" +
                     systemNotes + "\n\n" +
                     "Senden ricam:\n" +
                     "1) Benim cümlemi dil bilgisi ve yazım (spelling) açısından incele.\n" +
                     "2) Eğer yapısal olarak doğruysa ama 'Altın Standart' ile farklıysa, iki cümle arasındaki nüans/anlam farkını (resmiyet, vurgu, ton) açıkla.\n" +
                     "3) Benim yazdığım alternatife 10 üzerinden bir doğallık puanı ver.\n" +
                     "4) Bu cümlenin günlük konuşma dilinde (Spoken English) sıkça kullanılan 1 alternatifini göster.";

    var geminiUrl = "https://gemini.google.com/app?prompt=" + encodeURIComponent(promptText);

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(promptText);
      }
    } catch (e) { console.error(e); }

    window.open(geminiUrl, "_blank");
  };

  $("bMore").onclick=function(){ location.reload(); };
  render();
})();
</script>
</body></html>
