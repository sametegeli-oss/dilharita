<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔁 Tekrar — Dil Harita</title>
<style>
:root{--bg:#0a1628;--card:#0f1f3a;--line:#1e3a5f;--tx:#e8eef7;--mut:#9fb3d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 12px}
.top a{color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
h1{font-size:17px;margin:0;flex:1}.cnt{color:var(--mut);font-size:12px;text-align:right}
.mode{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.mode button{background:#13294d;color:#9fb3d9;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:700 12px system-ui;cursor:pointer}
.mode button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.mode button.err-on{background:#dc2626;color:#fff;border-color:#dc2626}
.card{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.kind{font-size:11px;font-weight:800;letter-spacing:.5px;color:#38bdf8;text-transform:uppercase}
.kind .err{color:#fbbf24}.kind .leech{color:#f87171}
.q{font-size:23px;font-weight:800;margin:10px 0 4px;line-height:1.4}
.q span, .a span {cursor:pointer;margin-right:4px;display:inline-block;}
.q span:hover, .a span:hover {color:#38bdf8;}
.a{font-size:17px;color:#a7f3d0;min-height:26px;margin:8px 0;line-height:1.4}
.a.hid{visibility:hidden}
.inrow{display:flex;gap:8px;margin:10px 0 2px;align-items:stretch}
.inrow textarea{flex:1;background:#0a1628;border:1px solid var(--line);border-radius:11px;color:#fff;font:600 16px system-ui;padding:11px 13px;resize:none;height:50px;line-height:1.4;word-wrap:break-word}
.inrow textarea:focus{outline:none;border-color:#2563eb}
.score{font-size:13px;font-weight:800;min-height:20px;margin:4px 0;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:12px 15px;font:800 14px system-ui;cursor:pointer;color:#fff}
.b-show{background:#334155;flex:1}.b-say{background:#0e7490}.b-mic{background:#7c3aed;min-width:50px}.b-chk{background:#2563eb;flex:1}
.b-hard{background:#dc2626;flex:1}.b-easy{background:#16a34a;flex:1}.b-gemini{background:#4f46e5;flex:1}.b-retry{background:#64748b;flex:1}.b-trans{background:#0284c7;flex:1}
.exp{margin-top:12px;background:#101c33;border:1px solid #274468;border-radius:12px;padding:12px;font-size:13.5px;display:none}
.exp b{color:#93c5fd}.exp .cm{color:#fbbf24;display:block;margin-top:6px}.exp .co{color:#86efac;display:block;margin-top:6px}
.exp .askrow{margin-top:10px}
.done{max-width:720px;margin:40px auto;text-align:center;color:var(--mut)}
.done b{color:#a7f3d0;font-size:20px;display:block;margin-bottom:8px}
.b-more{background:#2563eb;margin-top:12px}.b-next{background:#0e7490;margin:6px 4px 0}

/* Diff Visual Styles & Fixed Sizing for Auto-Wrap */
.diff-box{margin-top:6px; background:#071120; padding:8px; border-radius:8px; font-weight:normal; display:inline-block; width:100%; word-break:break-word; white-space:normal;}
.diff-box span{cursor:pointer; margin-right:4px; display:inline-block;}
.diff-box span:hover{opacity:0.8;}
.diff-match{color:#4ade80;font-weight:bold;}
.diff-typo{color:#f59e0b;font-weight:bold;border-bottom:2px dashed #f59e0b;}
.diff-wrong{color:#f87171;text-decoration:line-through;}
.diff-missing{color:#6b7280;border-bottom:1px dashed #6b7280;}
</style></head><body>
<div class="top"><a href="./index.html" id="btnHome">←</a><h1>🔁 Tekrar</h1><div class="cnt" id="cnt"></div></div>
<div class="mode">Mod:
  <button id="mProd">✍️ Üretim (TR→EN)</button>
  <button id="mClas">👁 Klasik (EN→TR)</button>

<div class="card" id="card" style="display:none">
  <div class="kind" id="kind"></div>

  <div class="a hid no-wordpop" id="a"></div>
  <div id="prodBox" style="display:none">
    <div class="inrow"><textarea id="inp" placeholder="İngilizcesini yaz…"></textarea><button class="b-retry" id="bListenRetry" style="display:none;padding:11px 13px;max-width:50px;min-width:50px" title="Kendi sesini tekrar dinle">👂</button><button class="b-mic" id="bMic" title="Mikrofonla söyle">🎤</button></div>
    <div class="score" id="score"></div>
  </div>
  <div class="row">
    <button class="b-show" id="bShow" style="display:none">👁 Göster</button>
    <button class="b-chk" id="bChk" style="display:none">Kontrol et</button>
    <button class="b-say" id="bSay">🔊</button>
  </div>
  <div class="row" id="grade" style="display:none">
    <button class="b-hard" id="bHard">Zor</button>
    <button class="b-retry" id="bRetry">🔄 Tekrar</button>
    <button class="b-trans" id="bTrans">🌐 Çeviri</button>
    <button class="b-gemini" id="bGemini">✨ Gemini</button>

    <div style="font-size:13px;margin-bottom:4px">☀️ Günün sıradaki adımı:</div>
    <a href="./index-app.html"><button class="b-next">🆕 Yeni cümleler</button></a>
    <a href="./chat.html"><button class="b-next">💬 1 dk konuşma</button></a>
  </div>
  <div style="margin-top:10px"><a href="./index.html" style="color:#38bdf8">Ana menu</a></div>
</div>

<script src="./auth-guard.js?v=2"></script>
<script src="./progress-engine.js?v=2"></script>
<script src="./cloud-sync-v8.js?v=1"></script>
<script src="./ai-providers.js?v=1"></script>
<script src="./word-popup.js?v=2"></script>
<script>
(async function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var DAY=86400000, SESSION=25, now=Date.now();
  var PLAN=/[?&]plan=1/.test(location.search);
  var mode=localStorage.getItem("dh-tekrar-mode")||"prod";
  
  var showOnlyErrors = false; 
  localStorage.setItem("dh-only-errors", "0");

  var mediaRecorder = null, audioChunks = [], audioUrl = null, audioStream = null, activeAudioObj = null;
  var recognitionInstance = null, isRecording = false, accumulatedTranscript = "";

  // KESİN KORUMA: cloud-sync kütüphanesinin anlık yazma kancasını (auto sync) tamamen pasifleştiriyoruz.
  if (window.DHCloudSync) {
    window.DHCloudSync.autoPush = false; 
    console.log("Firebase anlık tetikleyicileri bu sayfa için tamamen susturuldu.");
  }

  /* ---- kv (practice ile ortak depo) ---- */
  function kvOpen(){ return new Promise(function(res){ try{ var r=indexedDB.open("sentence-mode",1); r.onsuccess=function(){res(r.result)}; r.onerror=function(){res(null)}; }catch(e){res(null)} }); }
  async function kvPrefix(pre){
    var db=await kvOpen(); if(!db) return {};
    return new Promise(function(res){
      try{ var out={}, req=db.transaction("kv","readonly").objectStore("kv").openCursor();
        req.onsuccess=function(e){ var c=e.target.result;
          if(c){ var k=String(c.key); if(k.indexOf(pre)===0) out[k.slice(pre.length)]=c.value; c.continue(); }
          else{ db.close(); res(out); } };
        req.onerror=function(){ db.close(); res({}); };
      }catch(e){ try{db.close()}catch(_){ } res({}); } });
  }
  async function kvPut(key,val){
    var db=await kvOpen(); if(!db) return;
    return new Promise(function(res){
      try{ var tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(val,key);
        tx.oncomplete=function(){db.close();res()}; tx.onerror=function(){db.close();res()};
      }catch(e){ try{db.close()}catch(_){ } res(); } });
  }

  /* ---- SM-2 (practice ile birebir) ---- */
  function srsStep(n, hard){
    n=n&&typeof n==="object"?n:{rep:0,ef:2.5,interval:0,due:0,last:0};
    var r=Date.now();
    if(hard){ n.rep=0; n.interval=0; n.ef=Math.max(1.3,(n.ef||2.5)-0.2); n.lapses=(n.lapses||0)+1; }
    else{ n.rep=(n.rep||0)+1;
      var q=4; n.ef=Math.max(1.3,(n.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02)));
      if(n.rep===1) n.interval=1; else if(n.rep===2) n.interval=4;
      else n.interval=Math.round((n.interval||4)*n.ef);
    }
    n.last=r; n.due=r+n.interval*DAY;
    return n;
  }

  /* ---- Levenshtein Distance Algoritması ---- */
  function getLevenshteinSimilarity(s1, s2) {
    var m = s1.length, n = s2.length;
    if (m === 0) return n === 0 ? 100 : 0;
    if (n === 0) return 0;
    var d = Array.from({ length: m + 1 }, function() { return new Array(n + 1).fill(0); });
    for (var i = 0; i <= m; i++) d[i][0] = i;
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        var cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      }
    }
    var maxLen = Math.max(m, n);
    return Math.round(((maxLen - d[m][n]) / maxLen) * 100);
  }

  var mirror={}; try{ mirror=JSON.parse(localStorage.getItem("dh-progress-mirror-v1")||"{}")||{}; }catch(e){}
  var errs=[]; try{ if(window.LearningErrorDB&&LearningErrorDB.all) errs=await LearningErrorDB.all(); }catch(e){}
  var items=[], seen={};
  function push(kind,id,due,tag){ if(seen[kind+id]) return; seen[kind+id]=1; items.push({kind:kind,id:id,due:due||0,tag:tag||"",tries:0}); }
  
  /* ---- Metin Normalizasyonu ---- */
  var CONTRACTIONS = {
    "i'm":"i am","i'll":"i will","i've":"i have","i'd":"i would",
    "you're":"you are","you'll":"you will","you've":"you have","you'd":"you would",
    "we're":"we are","we'll":"we will","we've":"we have","we'd":"we would",
    "they're":"they are","they'll":"they will","they've":"they have","they'd":"they would",
    "he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is",
    "who's":"who is","what's":"what is","let's":"let us",
    "don't":"do not","doesn't":"does not","didn't":"did not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not",
    "couldn't":"could not","shouldn't":"should not","mustn't":"must not",
    "haven't":"have not","hasn't":"has not","hadn't":"had not"
  };
  function expandContractions(t){
    return String(t||"").toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(
      /\b(i'm|i'll|i've|i'd|you're|you'll|you've|you'd|we're|we'll|we've|we'd|they're|they'll|they've|they'd|he's|she's|it's|that's|there's|who's|what's|let's|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|can't|cannot|won't|wouldn't|couldn't|shouldn't|mustn't|haven't|hasn't|hadn't)\b/g,
      function(m){ return CONTRACTIONS[m]||m; });
  }
  function norm(t){ 
    return expandContractions(t)
      .replace(/-/g, " ") 
      .replace(/['\u2019\u2018]/g, "")   // kalan tüm kesme işaretleri kaldırılır — tırnak kaynaklı uyumsuzluk kabul edilir
      .replace(/[^a-z0-9 ]+/g," ")
      .replace(/\s+/g," ")
      .trim(); 
  }

  /* ---- Anlamsız/bozuk cümle tespiti ---- */
  function looksLikeSentence(en){
    var t=String(en||"").trim();
    if(!t) return false;
    var segs=t.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(segs.length>=2){
      var allSingleWords=segs.every(function(s){ return s && !/\s/.test(s) && /^[a-zA-ZçğıöşüÇĞİÖŞÜ'-]+$/.test(s); });
      if(allSingleWords) return false;
    }
    return true;
  }

  function similarity(a,b){
    a=norm(a); b=norm(b);
    if(!a||!b) return 0;
    if(a===b) return 100;
    if(a.replace(/\s+/g,"") === b.replace(/\s+/g,"")) return 95; 
    var A=a.split(" "), B=b.split(" "), setB={}, hit=0;
    B.forEach(function(w){ setB[w]=(setB[w]||0)+1; });
    A.forEach(function(w){ if(setB[w]){ hit++; setB[w]--; } });
    return Math.round(100*2*hit/(A.length+B.length));
  }

  /* ---- Kelime Tıklama Tetikleyicisi ---- */
  window.handleWordClick = function(word) {
    if (window.DHWordPop && DHWordPop.lookup) { DHWordPop.lookup(word); return; }
    var cleaned = word.toLowerCase().replace(/[^a-z0-9']+/g, "");
    var d = dict[cleaned];
    if (d && d.anlamlar) {
      var html = "<b>📕 " + cleaned + "</b>: " + d.anlamlar.slice(0, 4).join(", ");
      $("exp").innerHTML = html;
      $("exp").style.display = "block";
      speak(cleaned);
    }
  };

  /* ---- Gelişmiş LCS Tabanlı Fark Analizi ---- */
  function getDiffHtml(userText, correctText) {
    var uArr = String(userText || "").split(" ").filter(Boolean);
    var cArr = String(correctText || "").split(" ").filter(Boolean);
    
    var m = uArr.length, n = cArr.length;
    var dp = Array.from({ length: m + 1 }, function() { return new Array(n + 1).fill(0); });
    
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        if (norm(uArr[i - 1]) === norm(cArr[j - 1])) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
    }
    
    var htmlArr = [];
    var i = m, j = n;
    
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && norm(uArr[i - 1]) === norm(cArr[j - 1])) {
        htmlArr.unshift('<span class="diff-match" onclick="handleWordClick(\''+cArr[j - 1]+'\')">' + cArr[j - 1] + '</span>');
        i--; j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        htmlArr.unshift('<span class="diff-missing" onclick="handleWordClick(\''+cArr[j - 1]+'\')">' + cArr[j - 1] + '</span>');
        j--;
      } else {
        var typoMatched = false;
        if (j > 0) {
          var levSim = getLevenshteinSimilarity(norm(uArr[i - 1]), norm(cArr[j - 1]));
          if (levSim >= 75) {
            htmlArr.unshift('<span class="diff-typo" title="Yazım Hatası! (Doğrusu: ' + cArr[j - 1] + ')" onclick="handleWordClick(\''+cArr[j - 1]+'\')">' + uArr[i - 1] + '</span>');
            i--; j--;
            typoMatched = true;
          }
        }
        if (! typoMatched) {
          htmlArr.unshift('<span class="diff-wrong" onclick="handleWordClick(\''+uArr[i - 1]+'\')">' + uArr[i - 1] + '</span>');
          i--;
        }
      }
    }
    
    return htmlArr.join("") || "<span style='color:var(--mut)'>[Boş Giriş]</span>";
  }

  /* ---- Cümleleri Tıklanabilir Span Yapısına Dönüştüren Fonksiyon ---- */
  function makeTextClickable(text) {
    if (!text) return "";
    var words = text.split(" ");
    return words.map(function(w) {
      var clean = w.replace(/[^a-zA-Z0-9çğıöşüÇĞİÖŞÜ']+/g, "");
      return '<span onclick="handleWordClick(\'' + clean + '\')">' + w + '</span>';
    }).join(" ");
  }

  /* ---- Metin Sözlük ve Anlam Çözücü Yardımcı Fonksiyon ---- */
  var sentMap={}, dict={};
  function texts(it){
    if(it.kind==="s"){ var s=sentMap[it.id]||errText[it.id]||{};
      return {en:s.en||it.id,tr:s.tr||"",exp:s.aiExplain||"",cm:s.commonMistake||"",
        co:Array.isArray(s.collocations)?s.collocations.slice(0,4).join(" · "):String(s.collocations||"")};
    }
    var d=dict[it.id]||dict[it.id.toLowerCase()];
    return {en:it.id,tr:(d&&d.anlamlar)?d.anlamlar.slice(0,3).join(", "):"",exp:"",cm:"",co:""};
  }

  /* ---- açıklama paneli ---- */
  function showExplain(t, leech){
    var html="";
    if(t.exp) html+="<b>💡 Açıklama:</b> " + t.exp;
    if(t.cm)  html+='<span class="cm">⚠ Tipik hata: ' + t.cm + '</span>';
    if(t.co)  html+='<span class="co">🔗 Kalıplar: ' + t.co + '</span>';
    if(leech){
      html+='<div class="askrow"><b style="color:#f87171">🧲 İnatçı öğe</b> — kök kelimeleri oturumun önüne eklendi. '
          +'<button class="b-say" style="padding:7px 12px;font-size:12px" id="bAsk">🎓 Öğretmene sor</button></div>';
    }
    if(!html){ $("exp").style.display="none"; return; }
    $("exp").innerHTML=html; $("exp").style.display="block";
    var ba=$("bAsk");
    if(ba) ba.onclick=function(){
      var qq="Bu cümleyi bir türlü öğrenemiyorum, bana parçalayarak ve örneklerle anlatır mısın?\n\n"+$("q").textContent+"\n"+($("a").textContent||"");
      try{ navigator.clipboard&&navigator.clipboard.writeText(qq); }catch(e){}
      window.open("./teacher.html","_blank");
    };
  }

  /* ---- akış ---- */
  var i=0, doneCount=0, cur=null, curT=null, revealed=false, lastSc=-1, lastSemanticOk=false, viaMic=false, semanticNo=false;
  function speak(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.__dhMixed=true; u.__longTTSAvatarSync=true; speechSynthesis.speak(u); }catch(e){} }

  /* Bulut Senkronizasyonu */
  function triggerCloudSync() {
    try {
      if (window.DHCloudSync && window.DHCloudSync.push) {
        console.log("Oturum tetiklendi, toplu bulut senkronizasyonu başlatılıyor...");
        window.DHCloudSync.push();
      }
    } catch(e) { console.error("Bulut senkronizasyon hatası:", e); }
  }

  $("btnHome").onclick = function() {
    triggerCloudSync();
  };

  var total = 0, session = [], remaining = 0;
  var errText={};
  var srs={}, wsrs={};

  async function loadData() {
    try {
      srs = await kvPrefix("srs:");
      wsrs = await kvPrefix("wsrs:");
      await initApp();
    } catch(e) { console.error("Lokal DB okuma hatası:", e); await initApp(); }
  }

  /* ---- mod anahtarı ---- */
  function paintMode(){ 
    $("mProd").classList.toggle("on",mode==="prod"); 
    $("mClas").classList.toggle("on",mode==="clas"); 
    $("mOnlyErrs").classList.toggle("err-on", showOnlyErrors);
  }
  $("mProd").onclick=function(){ mode="prod"; localStorage.setItem("dh-tekrar-mode",mode); paintMode(); render(); };
  $("mClas").onclick=function(){ mode="clas"; localStorage.setItem("dh-tekrar-mode",mode); paintMode(); render(); };
  
  $("mOnlyErrs").onclick=function(){
    showOnlyErrors = !showOnlyErrors;
    localStorage.setItem("dh-only-errors", showOnlyErrors ? "1" : "0");
    location.reload();
  };
  paintMode();
  $("bMore").textContent = "Sonraki "+SESSION+"'i getir →";

  async function initApp() {
    for(var sid in srs){ if(srs.hasOwnProperty(sid)){ var r0=srs[sid]||{}; if((r0.due||0)<=now) push("s",sid,r0.due,(r0.lapses||0)>=3?"leech":""); } }
    for(var mid in mirror){ if(!mirror.hasOwnProperty(mid)) continue;
      if(mirror[mid]&&mirror[mid][0]===1){
        if(mid.indexOf("sentence:")===0){ var s1=mid.slice(9); if(!srs[s1]) push("s",s1,0,"yeni"); }
      } }
    
    errs.forEach(function(r){ var id=r&&(r.sentenceId||r.id); if(!id) return;
      if(!errText[id]) errText[id]={en:r.sentenceEN||r.sentence||r.en||"",tr:r.sentenceTR||r.tr||""};
      if(!srs[id]) push("s",id,0,"hata"); });

    if (showOnlyErrors) {
      items = items.filter(function(x) { return x.tag === "hata" || x.tag === "leech"; });
    }

    items.sort(function(a,b){ return (a.due||0)-(b.due||0); });
    total=items.length; session=items.slice(0,SESSION); remaining=total-session.length;
    $("cnt").innerHTML=total?("bugün: <b style='color:#e8eef7'>"+total+"</b>"+(remaining?(" · oturum: "+session.length):"")):"";
    if(!total){ $("doneTitle").textContent="🎉 Bugünlük tekrar yok!"; $("doneSub").textContent="Vadesi gelen öğe bulunmuyor.";
      if(PLAN) $("planNext").style.display="block"; $("done").style.display="block"; return; }

    if(session.some(function(x){return x.kind==="s"})){
      try { var all=await (await fetch("./data/sentences.json")).json(); all.forEach(function(s){sentMap[s.id]=s;}); }catch(e){}
    }
    if(session.some(function(x){return x.kind==="w"})){
      try { dict=await (await fetch("./data/dictionary.json")).json()||{}; }catch(e){}
    }
    render();
  }

  function stopActiveAudio() {
    if (activeAudioObj) {
      try { activeAudioObj.pause(); } catch(e){}
      activeAudioObj = null;
    }
    $("bListenRetry").textContent = "👂";
  }

  function render(){
    if(i>=session.length){
      $("card").style.display="none";
      $("doneTitle").textContent="🎉 Oturum bitti!";
      $("doneSub").textContent=doneCount+" öğe tekrar edildi."+(remaining?(" Bekleyen: "+remaining):"");
      if(remaining) $("bMore").style.display="inline-block";
      if(PLAN) $("planNext").style.display="block";
      $("done").style.display="block";
      
      triggerCloudSync();
      return;
    }
    cur=session[i]; curT=texts(cur); revealed=false; viaMic=false;
    try{ var oldHint=document.getElementById("micHintNote"); if(oldHint) oldHint.remove(); }catch(e){}
    if(cur.kind==="s" && !looksLikeSentence(curT.en)){ i++; return render(); } 
    if(cur.kind==="s" && curT.tr && similarity(curT.tr, curT.en)>=70){ i++; return render(); } 
    var prod=(mode==="prod");
    var lbl=(cur.kind==="s"?"Cümle":"Kelime")+" "+(i+1)+"/"+session.length;
    $("kind").innerHTML=lbl
      +(cur.tag==="hata"?' <span class="err">⚠ hata defterinden</span>':"")
      +(cur.tag==="leech"?' <span class="leech">🧲 inatçı</span>':"")
      +(cur.tag==="yeni"?" · yeni":"");
    
    var rawQuestion = prod ? (curT.tr||curT.en) : curT.en;
    $("q").innerHTML = makeTextClickable(rawQuestion);
    
    var rawAnswer = prod ? curT.en : (curT.tr||"—");
    $("a").innerHTML = makeTextClickable(rawAnswer);
    
    $("a").classList.add("hid");
    $("prodBox").style.display=prod?"block":"none";
    $("inp").value=""; $("score").textContent="";
    $("bShow").style.display=prod?"none":"";
    $("bChk").style.display=prod?"":"none";
    stopActiveAudio();
    $("bListenRetry").style.display="none";
    if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
    $("grade").style.display="none";
    $("exp").style.display="none";
    $("card").style.display="block";
    $("bSay").onclick=function(){ speak(curT.en); };
    if(prod) setTimeout(function(){ try{$("inp").focus();}catch(e){} },50);
  }

  function reveal(auto){
    if(revealed) return; revealed=true;
    $("a").classList.remove("hid");
    $("grade").style.display="flex";
    $("bShow").style.display="none"; $("bChk").style.display="none";
    if(mode==="prod"){
      var userInputValue = $("inp").value;
      var sc=similarity(userInputValue, curT.en); lastSc=sc; lastSemanticOk=false; semanticNo=false;
      
      var diffResult = getDiffHtml(userInputValue, curT.en);
      var diffStyle = viaMic ? " style='opacity:.55'" : "";
      var micTag = viaMic ? "🎤 " : "";
      $("score").innerHTML="Benzerlik: <span style='color:"+(sc>=80?"#4ade80":(sc>=50?"#fbbf24":"#f87171"))+"'>%"+sc+"</span>"+(sc>=80?" — Bildim'e hazır ✓":"") + 
                           "<br><div class='diff-box no-wordpop'"+diffStyle+">"+micTag+diffResult+"</div>";
      if(viaMic && sc<80){
        var micNote=document.createElement("div");
        micNote.id="micHintNote"; micNote.style.cssText="margin-top:6px;font-size:11.5px;color:#9fb3d9";
        micNote.textContent="🎤 Mikrofonla söylendi — kelime kelime farklar daha toleranslı değerlendiriliyor.";
        $("score").appendChild(micNote);
      }
      if(sc<80 && !viaMic) showExplain(curT,false);
      speak(curT.en);
      
      var bandLo = viaMic ? 10 : 25, bandHi = viaMic ? 95 : 80;
      if(sc>=bandLo && sc<bandHi && userInputValue.trim().length>2){
        var hasKey = window.DHProviders && DHProviders.chat && DHProviders.hasAnyKey && DHProviders.hasAnyKey();
        if(!hasKey){
          var noteEl=document.createElement("div");
          noteEl.style.cssText="margin-top:8px;font-size:12px;color:#9fb3d9";
          noteEl.textContent="🤖 Farklı ama doğru olabilecek cümleleri otomatik kontrol etmek için bir API anahtarı ekle (Ayarlar).";
          $("score").appendChild(noteEl);
        } else {
          var checkFor=cur, checkInput=userInputValue, checkTarget=curT.en;
          var waitEl=document.createElement("div");
          waitEl.id="semCheckNote";
          waitEl.style.cssText="margin-top:8px;font-size:12px;color:#9fb3d9";
          waitEl.textContent="🤖 Farklı yazdığın için anlamca kontrol ediliyor…";
          $("score").appendChild(waitEl);
          var semMsgs=[
            {role:"system",content:"Bir İngilizce öğrenme uygulamasında öğrencinin cümlesinin referans cümleyle AYNI ANLAMA gelip gelmediğini değerlendiriyorsun (farklı kelimeler/yapı olabilir, önemli olan anlam). SADECE tek kelime cevap ver: EVET ya da HAYIR. Başka hiçbir şey yazma."},
            {role:"user",content:"Referans: "+checkTarget+"\nÖğrenci: "+checkInput}
          ];
          function runSemCheck(tokBudget, isRetry){
            DHProviders.chat(semMsgs,{temperature:0,max_tokens:tokBudget}).then(function(out){
              if(cur!==checkFor) return;
              var t=String(out||"").trim();
              var w=document.getElementById("semCheckNote"); if(!w) return;
              if(/evet|yes/i.test(t)){
                lastSemanticOk=true;
                w.style.color="#4ade80";
                w.textContent="🤖 ✓ Anlamca doğru (farklı ama geçerli bir ifade) — Bildim'e hazır";
                try{
                  var dbox=document.querySelector(".diff-box");
                  if(dbox){
                    dbox.style.opacity="0.55";
                    var hint=document.getElementById("micHintNote");
                    if(!hint){ hint=document.createElement("div"); hint.id="micHintNote"; hint.style.cssText="margin-top:6px;font-size:11.5px;color:#9fb3d9"; dbox.insertAdjacentElement("afterend", hint); }
                    hint.textContent="ℹ️ Yukarıdaki fark muhtemelen mikrofonun yanlış duyup yazması — anlam AI tarafından doğru kabul edildi, kelime kelime eşleşme aranmıyor.";
                  }
                }catch(e){}
              } else if(/hayır|hayir|no/i.test(t)){
                semanticNo=true;
                w.style.color="#f87171";
                w.textContent="🤖 Anlamca da farklı görünüyor — açıklamaya bak.";
                if(viaMic){
                  try{
                    var dbox2=document.querySelector(".diff-box"); if(dbox2) dbox2.style.opacity="1";
                    var oldHint2=document.getElementById("micHintNote"); if(oldHint2) oldHint2.remove();
                  }catch(e){}
                  showExplain(curT,false);  
                }
              } else if(!isRetry){
                runSemCheck(220, true);  
              } else {
                w.style.color="#f87171";
                w.textContent="🤖 Model net cevap vermedi, tekrar deneyebilirsin.";
              }
            }).catch(function(err){
              console.warn("[tekrar] semantik kontrol hatası:", err);
              if(!isRetry && err && err.code==="empty"){ return runSemCheck(220, true); } 
              var w=document.getElementById("semCheckNote"); if(!w) return;
              w.style.color="#f87171";
              var code=err&&err.code;
              var msg = code==="no-key" ? "🤖 Kontrol edilemedi: hiç API anahtarı bulunamadı."
                : code==="all-failed" || code==="all-keys-failed" ? "🤖 Kontrol edilemedi: sağlayıcı(lar) şu an yanıt vermiyor (kota/limit dolmuş olabilir)."
                : code==="empty" ? "🤖 Model boş cevap verdi (iki denemede de). Başka bir sağlayıcı/model dene."
                : "🤖 Kontrol edilemedi ("+(code||(err&&err.message)||"bilinmeyen hata")+"). Konsolu kontrol et.";
              w.textContent=msg;
            });
          }
          runSemCheck(120, false);
        }
      }
    }
  }
  $("bShow").onclick=function(){ reveal(); };
  $("bChk").onclick=function(){ reveal(); };
  
  /* 🔄 Tekrar Dene Butonu */
  $("bRetry").onclick = function() {
    revealed = false;
    $("a").classList.add("hid");
    $("grade").style.display = "none";
    $("exp").style.display = "none";
    $("score").textContent = "";
    stopActiveAudio();
    $("bListenRetry").style.display = "none";
    if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
    
    if (mode === "prod") {
      $("bChk").style.display = "";
      $("inp").value = "";
      setTimeout(function(){ try { $("inp").focus(); } catch(e){} }, 30);
    } else {
      $("bShow").style.display = "";
    }
  };

  /* Enter ile Gönderme Mantığı */
  $("inp").onkeydown = function(e) {
    if(e.key!=="Enter" && e.key!=="Tab") viaMic=false;  
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault(); 
      reveal();
    }
  };

  window.addEventListener("keydown", function(e) {
    var activeTag = document.activeElement.tagName.toLowerCase();
    if (activeTag === "textarea") return; 
    if (revealed && $("grade").style.display === "flex") {
      var key = e.key.toLowerCase();
      if (key === "z") {
        $("bHard").click();
      } else if (key === "g") {
        $("bGemini").click();
      } else if (key === "t") {
        $("bTrans").click();
      } else if (key === "r") {
        $("bRetry").click();
      } else if (key === "b" || e.key === " ") {
        e.preventDefault();
        $("bEasy").click();
      }
    }
  });

  /* 🎤 Mobil Uyumlu Güvenli Mikrofon Kontrolü */
  $("bMic").onclick=function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return alert("Bu tarayıcıda mikrofon tanıma yok.");
    var SGL=window.SpeechGrammarList||window.webkitSpeechGrammarList;
    
    if (!isRecording) {
      isRecording = true;
      $("bMic").textContent="🔴";
      stopActiveAudio();
      $("bListenRetry").style.display = "none";
      if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
      accumulatedTranscript = "";
      $("inp").value = ""; 
      viaMic = true;

      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        audioStream = stream;
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = function() {
          var audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
          audioUrl = URL.createObjectURL(audioBlob);
          $("bListenRetry").style.display = "";
        };
        mediaRecorder.start();
      }).catch(function(err) { 
        console.error("Mikrofon donanımına erişilemedi:", err); 
        isRecording = false; 
        $("bMic").textContent="🎤"; 
      });

      recognitionInstance = new SR();
      recognitionInstance.lang = "en-US";
      
      // Mobil Chrome bindirme/mükerrer kelime yazma bug'ını engellemek için continuous ayarı kontrolü
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      recognitionInstance.continuous = !isMobile; 
      recognitionInstance.interimResults = true;

      if (SGL && curT.en) {
        var grammarListInstance = new SGL();
        var cleanWords = curT.en.toLowerCase().replace(/[^a-z0-9 ]+/g, "");
        var grammarPattern = '#JSGF V1.0; grammar targetWords; public <word> = ' + cleanWords.split(" ").join(" | ") + ' ;';
        grammarListInstance.addFromString(grammarPattern, 1.5);
        recognitionInstance.grammars = grammarListInstance;
      }

      recognitionInstance.onresult = function(e) {
        var finalTranscript = "";
        var interimTranscript = "";
        
        for (var idx = e.resultIndex; idx < e.results.length; ++idx) {
          var text = e.results[idx][0].transcript;
          if (e.results[idx].isFinal) {
            finalTranscript += text + " ";
          } else {
            interimTranscript += text;
          }
        }
        
        if (finalTranscript) {
          // Mobil klavye buffer mükerrerliklerini engelleme kontrolü
          if (!accumulatedTranscript.includes(finalTranscript.trim())) {
            accumulatedTranscript += finalTranscript;
          }
        }
        
        var currentRaw = (accumulatedTranscript + interimTranscript).trim();
        
        // Android klavye tahmin motorunun ardışık çift basma ("go go to to") hatalarını temizleme filtresi
        var words = currentRaw.split(/\s+/);
        var cleanWordsArr = [];
        for (var wIdx = 0; wIdx < words.length; wIdx++) {
          if (wIdx === 0 || words[wIdx].toLowerCase() !== words[wIdx - 1].toLowerCase()) {
            cleanWordsArr.push(words[wIdx]);
          }
        }
        
        $("inp").value = cleanWordsArr.join(" ");
      };

      recognitionInstance.onerror = function(err) { 
        console.error("Tanıma hatası:", err); 
      };
      
      recognitionInstance.start();

    } else {
      isRecording = false;
      $("bMic").textContent="🎤";

      if (recognitionInstance) {
        recognitionInstance.stop();
        recognitionInstance = null;
      }

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(function(track) { track.stop(); });
        audioStream = null;
      }

      setTimeout(function() {
        reveal();
      }, 400);
    }
  };

  /* Kendi Sesini Oynatma / Durdurma */
  $("bListenRetry").onclick = function() {
    if (activeAudioObj) {
      stopActiveAudio();
    } else if (audioUrl) {
      activeAudioObj = new Audio(audioUrl);
      $("bListenRetry").textContent = "⏹️";
      activeAudioObj.onended = function() {
        $("bListenRetry").textContent = "👂";
        activeAudioObj = null;
      };
      activeAudioObj.play().catch(function(err){ 
        console.error(err); 
        $("bListenRetry").textContent = "👂";
        activeAudioObj = null;
      });
    }
  };

  function injectLeechWords(sentenceEn) { /* devre dışı: no-op */ }

  async function grade(hard){
    var it=cur;
    var key=(it.kind==="s"?"srs:":"wsrs:")+it.id;
    var rec=srsStep(it.kind==="s"?srs[it.id]:wsrs[it.id], hard);
    if(!hard && mode==="prod" && !lastSemanticOk && !(viaMic && !semanticNo) && lastSc>=0 && lastSc<50){
      rec.interval=Math.max(1,Math.round(rec.interval/2)); rec.due=Date.now()+rec.interval*DAY;
    }
    lastSc=-1; lastSemanticOk=false; semanticNo=false;
    var leech = hard && (rec.lapses||0)>=3;
    
    if(leech){ 
      rec.interval=1; rec.due=Date.now()+DAY; 
      if(it.kind === "s") {
        injectLeechWords(curT.en);
      }
    }
    
    if(it.kind==="s") srs[it.id]=rec; else wsrs[it.id]=rec;
    try { await kvPut(key, rec); } catch(e) {}
    
    if(hard){
      showExplain(curT, leech);
      if(!leech && it.tries<2){ it.tries++; session.push(it); }
      $("grade").style.display="none";
      var go=document.createElement("button"); go.className="b-chk"; go.style.marginTop="10px"; go.textContent="Devam →";
      go.onclick=function(){ go.remove(); doneOrNext(); };
      $("exp").appendChild(go);
      function doneOrNext(){ i++; render(); }
      return;
    }
    doneCount++; i++; render();
  }
  $("bHard").onclick=function(){ grade(true); };
  $("bEasy").onclick=function(){ grade(false); };

  /* Google Translate Entegrasyonu */
  $("bTrans").onclick = function() {
    var correctEn = curT.en;
    var translateUrl = "https://translate.google.com/?sl=en&tl=tr&text=" + encodeURIComponent(correctEn) + "&op=translate";
    window.open(translateUrl, "_blank");
  };

  /* Gelişmiş Gemini Entegrasyonu */
  $("bGemini").onclick = function() {
    var trSentence = curT.tr || "";
    var correctEn = curT.en;
    var userEn = $("inp").value.trim() || "[Kullanıcı boş bıraktı]";
    
    var systemNotes = "";
    if (curT.cm) systemNotes += "\n⚠️ Bu cümle için bilinen tipik hata: " + curT.cm;
    if (curT.exp) systemNotes += "\n💡 Sistem açıklaması: " + curT.exp;

    var promptText = "Bir İngilizce öğrenme uygulamasında TR->EN üretimi çalışıyorum. Aşağıdaki eşleşmeyi analiz et:\n\n" +
                     "🇹🇷 Türkçe Kaynak: " + trSentence + "\n" +
                     "✅ Altın Standart Çeviri: " + correctEn + "\n" +
                     "✍️ Benim Yazdığım Çeviri: " + userEn + "\n" +
                     systemNotes + "\n\n" +
                     "Senden ricam:\n" +
                     "1) Benim cümlemi dil bilgisi ve yazım (spelling) açısından incele.\n" +
                     "2) Eğer yapısal olarak doğruysa ama 'Altın Standart' ile farklıysa, iki cümle arasındaki nüans/anlam farkını (resmiyet, vurgu, ton) açıkla.\n" +
                     "3) Benim yazdığım alternatife 10 üzerinden bir doğallık puanı ver.\n" +
                     "4) Bu cümlenin günlük konuşma dilinde (Spoken English) sıkça kullanılan 1 alternatifini göster.";

    var geminiUrl = "https://gemini.google.com/app?prompt=" + encodeURIComponent(promptText);

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(promptText);
      }
    } catch (e) { console.error(e); }

    window.open(geminiUrl, "_blank");
  };

  $("bMore").onclick=function(){ location.reload(); };
  await loadData();
})();
