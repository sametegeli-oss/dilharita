<script>
/* ☀️ "Günün sıradaki adımı" düğmeleri statikti — plandaki GERÇEK hedefe bağla.

<script>
(async function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var DAY=86400000, SESSION=(/[?&]plan=1/.test(location.search)?15:25), now=Date.now();

  /* 🔬 HATIRLAMA OLAY GÜNLÜĞÜ: kişisel unutma eğrisinin ham verisi.
     Her notlama bir deneydir: "son görüşten X gün sonra hatırlandı mı?"
     rapor.html bu veriden Ebbinghaus eğrini çizer. */
  function dhRecallLog(kind, id, prevLast, prevRep, ok){
    try{
      if(!prevLast) return;                       // ilk görüş: eğriye girmez
      var gapD = Math.round((Date.now()-prevLast)/DAY*10)/10;
      if(gapD < 0.02) return;                     // aynı dakikadaki tekrar: gürültü
      var K="dh-recall-log";
      var log=[]; try{ log=JSON.parse(localStorage.getItem(K)||"[]")||[]; }catch(e){}
      log.push({t:Date.now(), k:kind, id:String(id).slice(0,40), g:gapD, r:prevRep||0, ok:ok?1:0});
      if(log.length>3000) log=log.slice(log.length-3000); // ~3000 olay ≈ 150KB tavan
      localStorage.setItem(K, JSON.stringify(log));
    }catch(e){}
  }

  /* 💛 TEKRAR AFFI (günde 1 kez): 2 haftadan eski birikmiş tekrar dağı,
     kullanıcıyı kaçırtan en büyük etken. 30+ eski öğe birikmişse en kritik
     %30'u (çok takılanlar + en eskiler) bugünde kalır; gerisi SİLİNMEZ,
     önümüzdeki 1-14 güne eşit porsiyonlanır. */
  async function srsAmnesty(){
    try{
      var K="dh-srs-amnesty-"+new Date().toISOString().slice(0,10);
      if(localStorage.getItem(K)) return;
      localStorage.setItem(K,"1");
      var CUT=now-14*DAY, changed=0;
      var groups=[{o:srs,pre:"srs:"},{o:wsrs,pre:"wsrs:"}];
      for(var g=0; g<groups.length; g++){
        var o=groups[g].o, pre=groups[g].pre, old=[];
        for(var id in o){ if(!o.hasOwnProperty(id)) continue;
          var r=o[id]||{}; if((r.due||0)>0 && r.due<=CUT) old.push(id); }
        if(old.length<30) continue;             // küçük birikim: dokunma
        old.sort(function(a,b){                 // kritiklik: çok takılan önce, sonra en eski
          var la=(o[a].lapses||0), lb=(o[b].lapses||0);
          if(lb!==la) return lb-la;
          return (o[a].due||0)-(o[b].due||0);
        });
        var keep=Math.max(15, Math.round(old.length*0.3));
        for(var i=keep;i<old.length;i++){
          var id2=old[i], r2=o[id2];
          r2.due = now + ((i-keep)%14+1)*DAY;
          await kvPut(pre+id2, r2); changed++;
        }
      }
      if(changed && window.dhCoachSay)
        dhCoachSay("Birikmiş "+changed+" eski tekrarı önümüzdeki 2 haftaya porsiyonladım — bugün sadece en kritik olanlara odaklanıyoruz. Borç stresi yok!","tip");
    }catch(e){}
  }
  var PLAN=/[?&]plan=1/.test(location.search);
  var mode=localStorage.getItem("dh-tekrar-mode")||"prod";
  var showOnlyErrors = false; 
  
  var defaultAiPrompt = "Sen deneyimli bir İngilizce öğretmenisin. Öğrencinin cümlesini referans cümleyle karşılaştırıp ANLAM ve DİLBİLGİSİ açısından değerlendiriyorsun.\n\nADİL OL: Yazım hatası (typo) ile anlam/yapı hatasını AYIR. Bir kelime yanlış yazılmış ama hangi kelime olduğu bariz belliyse (ör. 'roundabot' → 'roundabout', 'recieve' → 'receive') bu bir YAZIM hatasıdır, anlam hatası değildir. Kelime dizilimi farkı, birebir eş anlamlı alternatifler ('car'→'automobile', 'start'→'begin', 'I think'→'In my opinion') ve büyük harf/noktalama farkları KABUL EDİLİR; bunlar için reddetme. Anlam yalnızca şu durumlarda bozulur: zaman (tense) uyumsuzluğu, ana ögelerden birinin eksikliği, anlamın gerçekten uzaklaşması veya farklı anlamlı kelime seçimi.\n\nCEVAP BİÇİMİ — sırayla:\n1) İlk kelime SADECE şu üçünden biri: EVET / YAZIM / HAYIR\n2) Sonra TÜRKÇE olarak öğret. Tek satırla geçiştirme:\n   • Doğru yaptığın şey varsa tek cümleyle söyle.\n   • Hata varsa tam olarak NE yanlış ve NEDEN yanlış. Kuralı 2-3 cümleyle anlat — \"böyle olmalı\" deme, \"neden böyle\" anlat.\n   • Doğru cümleyi yaz.\n   • Aynı kuralı kullanan BİR örnek daha ver, altına Türkçesini yaz.\n   • Cümlen kabul edilebilir ama daha doğal bir söyleyiş varsa onu da göster.\nSadece Türkçe ve İngilizce kullan, başka dil kullanma.";
  
  /* Prompt localStorage'a kaydediliyor. Kullanıcı hiç düzenlemese bile eski
     VARSAYILAN metin orada kalmış olabilir; o zaman buradaki güncelleme ona hiç
     ulaşmaz. Eski varsayılanın imzası olan ifadeyi taşıyan kayıtlar yenileniyor.
     Kullanıcının kendi yazdığı özel prompt'a DOKUNULMUYOR. */
  var savedPrompt = localStorage.getItem("dh-custom-ai-prompt") || "";
  if(!savedPrompt || /Başka hiçbir açıklama yapma|SADECE tek kelimeyle cevap ver/i.test(savedPrompt)){
    savedPrompt = defaultAiPrompt;
    try{ localStorage.setItem("dh-custom-ai-prompt", defaultAiPrompt); }catch(e){}
  }
  $("aiPromptInput").value = savedPrompt;

  $("toggleAiSettings").onclick = function() {
    var panel = $("aiSettingsPanel");
    panel.style.display = (panel.style.display === "block") ? "none" : "block";
  };
  
  $("aiPromptInput").oninput = function() {
    localStorage.setItem("dh-custom-ai-prompt", $("aiPromptInput").value);
  };

  var mediaRecorder = null, audioChunks = [], audioUrl = null, audioStream = null, activeAudioObj = null;
  var recognitionInstance = null, isRecording = false, accumulatedTranscript = "";

  if (window.DHCloudSync) {
    window.DHCloudSync.autoPush = false; 
    console.log("Firebase anlık tetikleyicileri bu sayfa için tamamen susturuldu.");
  }

  /* ---- kv ---- */
  function kvOpen(){ return new Promise(function(res){ try{ var r=indexedDB.open("sentence-mode",1); r.onsuccess=function(){res(r.result)}; r.onerror=function(){res(null)}; }catch(e){res(null)} }); }
  async function kvPrefix(pre){
    var db=await kvOpen(); if(!db) return {};
    return new Promise(function(res){
      try{ var out={}, req=db.transaction("kv","readonly").objectStore("kv").openCursor();
        req.onsuccess=function(e){ var c=e.target.result;
          if(c){ var k=String(c.key); if(k.indexOf(pre)===0) out[k.slice(pre.length)]=c.value; c.continue(); }
          else{ db.close(); res(out); } };
        req.onerror=function(){ db.close(); res({}); };
      }catch(e){ try{db.close()}catch(_){ } res({}); } });
  }
  async function kvPut(key,val){
    var db=await kvOpen(); if(!db) return;
    return new Promise(function(res){
      try{ var tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(val,key);
        tx.oncomplete=function(){db.close();res()}; tx.onerror=function(){db.close();res()};
      }catch(e){ try{db.close()}catch(_){ } res(); } });
  }

  /* ---- SM-2 ---- */
  /* Cevap kalitesini (q) gerçek sinyalden türetir.
     ÖNEMLİ: q eskiden sabit 4 yazılıydı ve SM-2 formülünde q=4 iken düzeltme
     terimi TAM OLARAK 0 çıkıyor:  0.1-(5-4)*(0.08+(5-4)*0.02) = 0.1-0.10 = 0
     Yani "kolaylık katsayısı" (ef) başarıda hiç artmıyor, yalnız "Zor"da
     0.2 düşüyordu — tek yönlü bir cırcır. Zamanla her kalemin ef'i 1.3 tabanına
     kayıyor ve iyi bilinen cümleler bile giderek daha sık soruluyordu.
     Uygulama benzerlik yüzdesini zaten hesaplıyor; artık o kullanılıyor. */
  function qualityOf(sc, semanticOk){
    if(typeof sc!=="number" || sc < 0) return 4;      // puan yoksa eski davranış
    if(sc>=90 || (semanticOk && sc>=80)) return 5;     // ef artar
    if(sc>=70) return 4;                               // ef sabit
    return 3;                                          // ef bir miktar düşer
  }
  function srsStep(n, hard, q){
    n=n&&typeof n==="object"?n:{rep:0,ef:2.5,interval:0,due:0,last:0};
    var r=Date.now();
    if(hard){ n.rep=0; n.interval=0; n.ef=Math.max(1.3,(n.ef||2.5)-0.2); n.lapses=(n.lapses||0)+1; }
    else{ n.rep=(n.rep||0)+1;
      if(typeof q!=="number") q=4;
      n.ef=Math.max(1.3,Math.min(3.0,(n.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02))));
      if(n.rep===1) n.interval=1; else if(n.rep===2) n.interval=4;
      else n.interval=Math.round((n.interval||4)*n.ef);
    }
    n.last=r; n.due=r+n.interval*DAY;
    return n;
  }

  /* ---- Levenshtein ---- */
  function getLevenshteinSimilarity(s1, s2) {
    var m = s1.length, n = s2.length;
    if (m === 0) return n === 0 ? 100 : 0;
    if (n === 0) return 0;
    var d = Array.from({ length: m + 1 }, function() { return new Array(n + 1).fill(0); });
    for (var i = 0; i <= m; i++) d[i][0] = i;
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        var cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      }
    }
    var maxLen = Math.max(m, n);
    return Math.round(((maxLen - d[m][n]) / maxLen) * 100);
  }

  var mirror={}; try{ mirror=JSON.parse(localStorage.getItem("dh-progress-mirror-v1")||"{}")||{}; }catch(e){}
  var errs=[]; try{ if(window.LearningErrorDB&&LearningErrorDB.all) errs=await LearningErrorDB.all(); }catch(e){}
  var items=[], seen={};
  function push(kind,id,due,tag){ if(seen[kind+id]) return; seen[kind+id]=1; items.push({kind:kind,id:id,due:due||0,tag:tag||"",tries:0}); }
  
  var CONTRACTIONS = {
    "i'm":"i am","i'll":"i will","i've":"i have","i'd":"i would",
    "you're":"you are","you'll":"you will","you've":"you have","you'd":"you would",
    "we're":"we are","we'll":"we will","we've":"we have","we'd":"we would",
    "they're":"they are","they'll":"they will","they've":"they have","they'd":"they would",
    "he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is",
    "who's":"who is","what's":"what is","let's":"let us",
    "don't":"do not","doesn't":"does not","didn't":"did not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not",
    "couldn't":"could not","shouldn't":"should not","mustn't":"must not",
    "haven't":"have not","hasn't":"has not","hadn't":"had not"
  };
  function expandContractions(t){
    return String(t||"").toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(
      /\b(i'm|i'll|i've|i'd|you're|you'll|you've|you'd|we're|we'll|we've|we'd|they're|they'll|they've|they'd|he's|she's|it's|that's|there's|who's|what's|let's|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|can't|cannot|won't|wouldn't|couldn't|shouldn't|mustn't|haven't|hasn't|hadn't)\b/g,
      function(m){ return CONTRACTIONS[m]||m; });
  }
  function norm(t){ 
    return expandContractions(t)
      .replace(/-/g, " ") 
      .replace(/['\u2019\u2018]/g, "")   
      .replace(/[^a-z0-9 ]+/g," ")
      /* TR kaynak cinsiyet/canlılık taşımaz: 3. tekil zamirler TEK sınıf */
      .replace(/\b(he|she|it|him|her|his|hers|its)\b/g,"o3")
      .replace(/\s+/g," ")
      .trim(); 
  }
  /* Fark çizimi için: karşılaştırma anahtarı + görünen kelime AYRI tutulur.
     (Eski kod kelime-kelime norm çağırıyordu; "didn't"→"did not" 2 kelimeye
     açılınca tek kelimeyle asla eşleşemiyordu — kısaltmalar hep kırmızıydı.) */
  function eqTokens(text){
    return expandContractions(text)
      .replace(/-/g," ").replace(/['\u2019\u2018]/g,"")
      .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()
      .split(" ").filter(Boolean)
      .map(function(w){ return { d:w, k:/^(he|she|it|him|her|his|hers|its)$/.test(w)?"o3":w }; });
  }

  function looksLikeSentence(en){
    var t=String(en||"").trim();
    if(!t) return false;
    var segs=t.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(segs.length>=2){
      var allSingleWords=segs.every(function(s){ return s && !/\s/.test(s) && /^[a-zA-ZçğıöşüÇĞİÖŞÜ'-]+$/.test(s); });
      if(allSingleWords) return false;   
    }
    return true;
  }

  function similarity(a,b){
    a=norm(a); b=norm(b);
    if(!a||!b) return 0;
    if(a===b) return 100;
    if(a.replace(/\s+/g,"") === b.replace(/\s+/g,"")) return 95; 
    var A=a.split(" "), B=b.split(" "), setB={}, hit=0;
    B.forEach(function(w){ setB[w]=(setB[w]||0)+1; });
    A.forEach(function(w){ if(setB[w]){ hit++; setB[w]--; } });
    return Math.round(100*2*hit/(A.length+B.length));
  }

  window.handleWordClick = function(word) {
    if (window.DHWordPop && DHWordPop.lookup) { DHWordPop.lookup(word); return; }
    var cleaned = word.toLowerCase().replace(/[^a-z0-9']+/g, "");
    var d = dict[cleaned];

      $("exp").innerHTML = html;
      $("exp").style.display = "block";
      speak(cleaned);
    }
  };

  function getDiffHtml(userText, correctText) {
    var uArr = eqTokens(userText);
    var cArr = eqTokens(correctText);
    var m = uArr.length, n = cArr.length;
    var dp = Array.from({ length: m + 1 }, function() { return new Array(n + 1).fill(0); });
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        if (uArr[i - 1].k === cArr[j - 1].k) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
    }
    var htmlArr = [];
    var i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && uArr[i - 1].k === cArr[j - 1].k) {
        htmlArr.unshift('<span class="diff-match" onclick="handleWordClick(\''+cArr[j - 1].d+'\')">' + cArr[j - 1].d + '</span>');
        i--; j--;
      } else if (i > 0 && j > 0
                 && getLevenshteinSimilarity(norm(uArr[i - 1].d), norm(cArr[j - 1].d)) >= 75) {
        /* Yazım sürçmesi (bak→back): missing/wrong'a bölünmeden ÖNCE yakala —
           eski sırada bu dala hiç girilemiyordu. */
        htmlArr.unshift('<span class="diff-typo" title="Yazım Hatası! (Doğrusu: ' + cArr[j - 1].d + ')" onclick="handleWordClick(\''+cArr[j - 1].d+'\')">' + uArr[i - 1].d + '</span>');
        i--; j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        htmlArr.unshift('<span class="diff-missing" onclick="handleWordClick(\''+cArr[j - 1].d+'\')">' + cArr[j - 1].d + '</span>');
        j--;
      } else {
        htmlArr.unshift('<span class="diff-wrong" onclick="handleWordClick(\''+uArr[i - 1].d+'\')">' + uArr[i - 1].d + '</span>');
        i--;
      }
    }
    return htmlArr.join("") || "<span style='color:var(--mut)'>[Boş Giriş]</span>";
  }

  function makeTextClickable(text) {
    if (!text) return "";
    var words = text.split(" ");
    return words.map(function(w) {
      var clean = w.replace(/[^a-zA-Z0-9çğıöşüÇĞİÖŞÜ']+/g, "");
      return '<span onclick="handleWordClick(\'' + clean + '\')">' + w + '</span>';
    }).join(" ");
  }

  window.triggerAiSemanticCheck = function(userInputValue, targetValue) {
    var waitEl = document.getElementById("semCheckNote");
    if(!waitEl) {
      waitEl = document.createElement("div");
      waitEl.id = "semCheckNote";
      waitEl.style.cssText = "margin-top:8px;font-size:12px;color:#9fb3d9";
      $("score").appendChild(waitEl);
    }
    
    var btnSem = document.getElementById("btnTriggerSem");
    if(btnSem) btnSem.style.display = "none";
    
    waitEl.style.color = "#9fb3d9";
    waitEl.textContent = "🤖 Cümleniz anlamca kontrol ediliyor…";

    /* Otomatik hakem, sayfadaki genel kritere DEĞİL, eşdeğer yapıları doğru değerlendiren
       kendi net prompt'una dayanır. "work" ↔ "have been working" gibi farklı ama geçerli
       zaman/ifadeleri KABUL eder; sadece anlam gerçekten bozulduysa reddeder. */
    var refereePrompt =
      "Sen adil bir İngilizce sınav değerlendiricisisin. Öğrencinin cümlesi, referans cümleyle "
      + "AYNI ANLAMI taşıyorsa (farklı ama geçerli bir zaman, kip veya eşanlamlı ifade kullanmış olsa bile) GEÇERLİdir. "
      + "Örnek: 'I work from home' ile 'I have been working from home' aynı süregelen durumu anlatır → GEÇERLİ. "
      + "'car'↔'automobile', 'begin'↔'start', geniş zaman↔present perfect gibi farklar KABUL edilir. "
      + "Büyük/küçük harf ve noktalama farkını YOK say. Sadece anlam gerçekten değiştiyse, bir ana öge "
      + "(özne/fiil/nesne) tamamen eksikse ya da yanlış kelime anlamı bozduysa GEÇERSİZ de. "
      + "Cevabın TEK KELİME olsun: GEÇERLİ ya da GEÇERSİZ.";

    var semMsgs = [
      {role:"system",content: refereePrompt},
      {role:"user",content:"Referans: " + targetValue + "\nÖğrenci: " + userInputValue + "\nKarar (GEÇERLİ/GEÇERSİZ):"}
    ];

    function runCheck(tokBudget, isRetry) {
      DHProviders.chat(semMsgs, {temperature:0, max_tokens:tokBudget}).then(function(out){
        var t = String(out||"").trim();
        var lo = t.toLocaleLowerCase("tr");
        var ok = /geçerli|gecerli|\bevet\b|\byes\b|\bvalid\b/.test(lo) && !/geçersiz|gecersiz/.test(lo.slice(0,12));
        var bad = /geçersiz|gecersiz|\bhay[ıi]r\b|\bno\b|invalid/.test(lo);
        if(ok && !bad){
          lastSemanticOk = true;
          waitEl.style.color = "#4ade80";
          waitEl.textContent = "🤖 ✓ Anlamca doğru (farklı ama geçerli bir ifade) — Bildim'e hazır";
          try {
            var dbox = document.querySelector(".diff-box");
            if(dbox) {
              dbox.style.opacity = "0.55";
              var hint = document.getElementById("micHintNote") || document.createElement("div");
              hint.id = "micHintNote"; hint.style.cssText = "margin-top:6px;font-size:11.5px;color:#9fb3d9";
              hint.textContent = "ℹ️ Yazılan alternatif cümle belirlediğin kriterlere göre yapay zeka tarafından onaylandı.";
              dbox.insertAdjacentElement("afterend", hint);
            }
          } catch(e){}
          try{ window.dhCoachSay && window.dhCoachSay("Farklı ama GEÇERLİ bir yapı kurmuşsun ✓ Yapay zekâ hakem onayladı — Bildim'e hazır.","praise"); }catch(e){}
        } else if(bad){
          semanticNo = true;
          waitEl.style.color = "#f87171";
          waitEl.textContent = "🤖 Belirttiğin kriterlere göre anlam veya yapı farklı çıktı — açıklamalara bak.";
          showExplain(curT, false);
          try{ window.dhCoachSay && window.dhCoachSay("Yapay zekâ hakem farkı gerçek buldu — anlam/yapı değişmiş. Doğrusu: "+curT.en,"warn"); }catch(e){}
        } else if(!isRetry){
          runCheck(60, true);
        } else {
          waitEl.style.color = "#f87171";
          waitEl.textContent = "🤖 Model net bir yanıt üretemedi.";
        }
      }).catch(function(err){
        console.warn("[tekrar] semantik kontrol hatası:", err);
        if(!isRetry && err && err.code === "empty") return runCheck(60, true);
        var code = err && err.code;
        waitEl.style.color = "#f87171";
        waitEl.textContent = code === "no-key" ? "🤖 Kontrol başarısız: API anahtarı bulunamadı." : "🤖 Kontrol başarısız: Sağlayıcı şu an yanıt vermiyor.";
      });
    }
    runCheck(40, false);
  };

  /* Cümledeki TÜM tek-harf yazım sürçmelerini düzeltir (birden fazla olsa bile).
     Kelimeleri hizalar; öğrencinin kelimesi referanstakinden 1 harf farklıysa VE
     yanlış yazılan gerçek bir kelime değilse (from→fgom evet, was→has hayır) düzeltir.
     Dönüş: { fixed: düzeltilmiş cümle, typoCount: kaç typo, onlyTypos: typo dışında fark yok mu } */
  function correctTypos(refEn, userEn){
    var lev1 = function(a,b){
      if(a===b) return false;
      var la=a.length, lb=b.length;
      if(Math.abs(la-lb)>1) return false;
      var i=0,j=0,edits=0;
      while(i<la && j<lb){
        if(a[i]===b[j]){ i++; j++; continue; }
        if(++edits>1) return false;
        if(la>lb) i++; else if(lb>la) j++; else { i++; j++; }
      }
      if(i<la || j<lb) edits++;
      return edits<=1;
    };
    var isRealWord = function(w){
      return window.LearningErrorDB && LearningErrorDB.__isCommon ? LearningErrorDB.__isCommon(w) : false;
    };
    var norm=function(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim(); };
    var R=norm(refEn).split(" ").filter(Boolean);
    var U=norm(userEn).split(" ").filter(Boolean);
    if(!R.length || R.length!==U.length) return { fixed:userEn, typoCount:0, onlyTypos:false };
    var typoCount=0, otherDiff=false, out=U.slice();
    for(var k=0;k<R.length;k++){
      if(R[k]===U[k]) continue;
      // tek harf farkı + yanlış yazılan gerçek kelime değil + referans kelime ≥3 harf → typo
      if(R[k].length>=3 && lev1(R[k],U[k]) && !isRealWord(U[k])){
        out[k]=R[k]; typoCount++;
      } else {
        otherDiff=true;   // typo değil, gerçek fark
      }
    }
    return { fixed: out.join(" "), typoCount:typoCount, onlyTypos: (typoCount>0 && !otherDiff) };
  }

  /* Ses tanıma döngüsü — videopractice'teki sağlam mantık:
     Mobil tarayıcı tanımayı kendiliğinden durdurunca (onend), kullanıcı hâlâ
     kayıttaysa OTOMATİK yeniden başlatır. Böylece mikrofon canlı kalır ve
     konuşma kaydı düşmez. manualStop, kullanıcı durdurmasını ayırt eder. */
  function startRecognitionLoop(SR, SGL){
    var rec; try{ rec = new SR(); }catch(e){ return; }
    recognitionInstance = rec;
    rec.lang = "en-US";
    // MOBİL UYUM (sesdalga.html mantığı): mobilde interimResults + continuous KAPALI.
    // Mobil tarayıcılar ara sonuçları enjekte ederken kelimeleri kopyalayıp bozuyor;
    // interim kapatılınca yalnızca stabil, kesinleşmiş metin gelir → bozuk kelime bitiyor.
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    rec.continuous = !isMobile;
    rec.interimResults = !isMobile;
    if (SGL && curT.en) {
      try{
        var gl = new SGL(); var cw = curT.en.toLowerCase().replace(/[^a-z0-9 ]+/g, "");
        gl.addFromString('#JSGF V1.0; grammar targetWords; public <word> = ' + cw.split(" ").join(" | ") + ' ;', 1.5);
        rec.grammars = gl;
      }catch(e){}
    }

    rec.onstart = function(){ if(isRecording) $("bMic").textContent="🔴"; };

    // Bu oturumda (restart'a kadar) duyulan metin. onend'de accumulatedTranscript'e eklenir.
    var sessionText = "";

    rec.onresult = function(e) {
      if (isMobile) {
        // Mobil: bu oturumun tüm sonuçlarını oku → sessionText. Kutuya BİRİKİM + bu oturum yaz.
        var s = "";
        for (var i=0; i<e.results.length; i++){ s += e.results[i][0].transcript + " "; }
        sessionText = s.trim();
        var combinedM = (accumulatedTranscript + " " + sessionText).trim();
        $("inp").value = dedupeAdjacent(combinedM);
      } else {
        // Masaüstü: final'i global birikime ekle, interim'i geçici göster
        var finalTranscript = "", interimTranscript = "";
        for (var k=e.resultIndex; k<e.results.length; k++){
          var transcript = e.results[k][0].transcript;
          if (e.results[k].isFinal) finalTranscript += transcript + " "; else interimTranscript += transcript;
        }
        accumulatedTranscript = (accumulatedTranscript + " " + finalTranscript).trim();
        var combinedD = (accumulatedTranscript + " " + interimTranscript).trim();
        $("inp").value = dedupeAdjacent(combinedD);
      }
    };

    rec.onerror = function(e) {
      var code = (e && e.error) || "";
      if (code === "not-allowed" || code === "service-not-allowed") {
        isRecording = false; manualStop = true; $("bMic").textContent="🎤";
        if (audioStream) { audioStream.getTracks().forEach(function(t){ t.stop(); }); audioStream = null; }
        alert("Mikrofon izni verilmedi.");
        return;
      }
      // no-speech / aborted gibi geçici hatalar: onend zaten restart edecek
    };

    rec.onend = function(){
      // Bu oturumda mobilde duyulanı kalıcı birikime kilitle (restart'ta e.results sıfırlanır).
      if (isMobile && sessionText) {
        accumulatedTranscript = dedupeAdjacent((accumulatedTranscript + " " + sessionText).trim());
        sessionText = "";
        $("inp").value = accumulatedTranscript;
      }
      if (manualStop || !isRecording) { return; }
      // tarayıcı kendiliğinden durdurdu ama kullanıcı hâlâ dinliyor → yeniden başlat
      setTimeout(function(){
        if (isRecording && !manualStop) { try{ rec.start(); }catch(err){ try{ startRecognitionLoop(SR, SGL); }catch(e2){} } }
      }, 150);
    };

    setTimeout(function(){ try{ rec.start(); }catch(e){} }, 150);
  }

  /* Ardışık aynı kelimeleri siler ("shirt shirt shirt" → "shirt"); mobil tanıma
     motorunun ürettiği tekrarları temizler. Meşru tek tekrarları korumak için
     yalnızca ÜÇ+ ardışık tekrarı teke indirir, ikili tekrarlara dokunmaz. */
  function dedupeAdjacent(text){
    var w = String(text||"").trim().split(/\s+/).filter(Boolean);
    var out = [];
    for (var i=0;i<w.length;i++){
      var n=1;
      while(i+n<w.length && w[i+n].toLowerCase()===w[i].toLowerCase()) n++;
      out.push(w[i]);
      if(n>=3){ i+=n-1; }          // 3+ tekrar → teke indir
      else if(n===2){ out.push(w[i]); i++; }  // 2 tekrar → koru
    }
    return out.join(" ");
  }

  /* Referans ile öğrenci cevabı arasında SOMUT kelime farkı:
     hangi kelimeler atlandı (missing), hangileri fazladan yazıldı (extra). */
  function computeWordDiff(refEn, userEn){
    var norm=function(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim(); };
    var ref=norm(refEn).split(" ").filter(Boolean);
    var usr=norm(userEn).split(" ").filter(Boolean);
    if(!ref.length) return null;
    var usrCount={}; usr.forEach(function(w){ usrCount[w]=(usrCount[w]||0)+1; });
    var refCount={}; ref.forEach(function(w){ refCount[w]=(refCount[w]||0)+1; });
    var missing=[]; ref.forEach(function(w){ if((usrCount[w]||0)<(refCount[w]||0)){ if(missing.indexOf(w)<0) missing.push(w); usrCount[w]=(usrCount[w]||0)+1; } });
    var extra=[]; usr.forEach(function(w){ if((refCount[w]||0)<((extra._seen&&extra._seen[w])||0)+1){ } });
    // fazladan: öğrencide olup referansta (sayıca) olmayanlar
    var uc2={}; usr.forEach(function(w){ uc2[w]=(uc2[w]||0)+1; });
    var rc2={}; ref.forEach(function(w){ rc2[w]=(rc2[w]||0)+1; });
    Object.keys(uc2).forEach(function(w){ if(uc2[w]>(rc2[w]||0) && extra.indexOf(w)<0) extra.push(w); });
    return { missing:missing, extra:extra, refLen:ref.length };
  }

  /* Tutarlılık: "✨ Gemini" düğmesi de aynı kontrollü hakem ölçütünü kullanır.
     Böylece iki AI yolu (bu düğme + "Gemini'ye Sor") aynı adil kararı verir,
     farklı sonuçlar çıkmaz. Detaylı geri bildirim için hakemin altına
     nüans/alternatif de istenir. */
  $("bGemini").onclick = function() {
    var userEn = $("inp").value.trim();
    if(!userEn){ alert("Önce çevirini yaz, sonra Gemini'ye sor."); return; }
    if(window.askGeminiReferee){
      window.askGeminiReferee(userEn, curT.en);
    }
  };

  $("bMore").onclick=function(){ location.reload(); };
  await loadData();
})();
</script>
