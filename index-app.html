<!-- GÖRSELLERDEKİ SAĞ PANEL, GRID TAŞMASI VE BUTON EZİLME HATALARINI DÜZELTEN TÜM CSS -->
<style>
  /* 1. Sağ taraftaki kontrol panelinin ana dikey flex akışı */
  div[class*="panel"][class*="right"], 
  div[class*="control-panel"] {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    height: 100% !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
  }

  /* 2. Dokuzlu Grid Buton Grubu (Shadow, AI Test, Benzer vb.) */
  .tools-grid, 
  div[class*="grid"][class*="tool"],
  div[class*="buttons"][class*="container"] {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 8px !important;
    margin-bottom: 12px !important;
    flex-shrink: 0 !important;
  }

  /* Dokuzlu grid butonlarının içindeki yazıların taşmasını ve dikeyde ezilmesini önler */
  .tools-grid button, 
  div[class*='tool-btn'], 
  .tool-btn {
    min-height: 52px !important;
    padding: 6px 2px !important;
    font-size: 13px !important;
    box-sizing: border-box !important;
  }

  /* 3. Zor, Normal, Kolay butonlarının yer aldığı satır */
  .difficulty-buttons-row, 
  div[class*="level"], 
  div[class*="zor"] {
    display: flex !important;
    justify-content: space-between !important;
    gap: 6px !important;
    margin-top: auto !important; /* Esnek boşluğu yukarı alarak grubu alta yaslar */
    margin-bottom: 8px !important;
    flex-shrink: 0 !important;
    position: relative !important;
  }

  /* Zor-Normal-Kolay butonlarının dikey yüksekliğini sabitleyerek Sonraki butonunu sıkıştırmasını önler */
  .btn-diff, 
  button[class*="zor"], 
  button[class*="kolay"], 
  button[class*="normal"] {
    height: 42px !important;
    line-height: 42px !important;
    padding: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  /* 4. En altta ezilen mavi renkli "Sonraki →" butonu ve kapsayıcısı */
  .navigation-buttons, 
  div[class*="sonraki"],
  button[class*="sonraki"] {
    display: block !important;
    width: 100% !important;
    margin-top: 6px !important;
    margin-bottom: 4px !important;
    flex-shrink: 0 !important;
    position: relative !important;
    clear: both !important; /* Üstteki elemanların taşmasını kesin olarak sıfırlar */
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('error', function(e){
  var box=document.getElementById('appErrorBox');
  if(!box){
    box=document.createElement('pre');
    box.id='appErrorBox';
    box.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#220b0b;color:#fecaca;padding:12px;border:1px solid #ef4444;border-radius:10px;white-space:pre-wrap;font:12px monospace';
    document.body.appendChild(box);
  }
  box.textContent += '\n' + (e.message||'error') + '\n' + (e.filename||'') + ':' + (e.lineno||'');
});
</script>
