<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />

<!-- ARAÇLARI VARSAYILAN OLARAK GİZLEYEN VE AÇILIR-KAPANIR YAPAN CSS -->
<style>
  /* 1. Sağ panel ana dikey flex akışı */
  div[class*="panel"][class*="right"], 
  div[class*="control-panel"],
  .right-panel-container {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    height: 100% !important;
    max-height: calc(100vh - 120px) !important;
    box-sizing: border-box !important;
    overflow-y: auto !important;
    padding-bottom: 20px !important;
  }

  /* 2. Dokuzlu Grid Araç Kutusu - VARSAYILAN OLARAK GİZLENDİ */
  .tools-grid, 
  div[class*="grid"][class*="tool"],
  div[class*="buttons"][class*="container"] {
    display: none !important; /* İlk açılışta görünmez yap */
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 8px !important;
    margin-bottom: 12px !important;
    flex-shrink: 0 !important;
  }

  /* .show-tools sınıfı tetiklendiğinde grid görünür olacak */
  .tools-grid.show-tools,
  div[class*="grid"][class*="tool"].show-tools,
  div[class*="buttons"][class*="container"].show-tools {
    display: grid !important;
  }

  .tools-grid button, 
  div[class*='tool-btn'], 
  .tool-btn {
    min-height: 48px !important;
    padding: 4px 2px !important;
    font-size: 12px !important;
    box-sizing: border-box !important;
  }

  /* 3. Zor, Normal, Kolay Buton Satırı */
  .difficulty-buttons-row, 
  div[class*="level"], 
  div[class*="zor"] {
    display: flex !important;
    justify-content: space-between !important;
    gap: 6px !important;
    margin-top: auto !important; /* Esnek boşluğu yukarı alıp butonları alta yaslar */
    margin-bottom: 10px !important;
    flex-shrink: 0 !important;
  }

  .btn-diff, 
  button[class*="zor"], 
  button[class*="kolay"], 
  button[class*="normal"] {
    height: 38px !important;
    line-height: 38px !important;
    padding: 0 !important;
  }

  /* 4. Alt kısımdaki yönlendirme satırları */
  div[class*="sonraki"],
  button[class*="sonraki"],
  .navigation-buttons {
    display: block !important;
    width: 100% !important;
    margin-top: 6px !important;
    margin-bottom: 6px !important;
    flex-shrink: 0 !important;
    clear: both !important;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('error', function(e){
  var box=document.getElementById('appErrorBox');
  if(!box){
    box=document.createElement('pre');
    box.id='appErrorBox';
    box.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#220b0b;color:#fecaca;padding:12px;border:1px solid #ef4444;border-radius:10px;white-space:pre-wrap;font:12px monospace';
    document.body.appendChild(box);
  }
  box.textContent += '\n' + (e.message||'error') + '\n' + (e.filename||'') + ':' + (e.lineno||'');
});
</script>
<script src="./auth-guard.js?v=2"></script>
<script src="./progress-engine.js?v=2"></script>
<script src="./cloud-sync.js?v=6"></script>
<script src="./image-addon.js?v=restore1"></script>
<script src="./teacher-addon.js?v=restore1"></script>

<script src="./index-app-layout.js?v=5"></script>

<!-- DİNAMİK ENJEKTE EDİLEN BUTONA TIKLAMA OLAYINI BAĞLAYAN SCRIPT -->
<script>
  (function() {
    // JS dosyaları arayüzü asenkron çizdiği için sayfa içinde sürekli kontrol eden bir gözlemci kuruyoruz
    var checkTimer = setInterval(function() {
      // İngiliz anahtarı simgesi olan araçlar butonunu bul (görseldeki buton)
      var toolToggleBtn = document.querySelector('button[class*="toggle"], div[class*="toggle"], button:has([class*="anahtar"]), button:contains("🛠")') || 
                          Array.from(document.querySelectorAll('button, div')).find(el => el.textContent.includes('🛠') || el.textContent.includes('Yatay'));

      if (toolToggleBtn) {
        // Buton bulunduğunda tıklama olayını dinle
        toolToggleBtn.removeAttribute('onclick'); // Eğer eski bozuk bir fonksiyon varsa temizle
        toolToggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          // Dokuzlu grid panellerini bul ve "show-tools" sınıfını aç/kapat (toggle)
          var grids = document.querySelectorAll('.tools-grid, div[class*="grid"][class*="tool"], div[class*="buttons"][class*="container"]');
          grids.forEach(function(grid) {
            grid.classList.toggle('show-tools');
          });
        });
        clearInterval(checkTimer); // Eleman bulununca döngüyü sonlandır
      }
    }, 500);
  })();
</script>
</body>
</html>
