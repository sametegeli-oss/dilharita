<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1424">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dil Harita — Cümle Çalışması</title>
<script src="./auth-guard.js?v=1"></script>
<script src="./sentences-loader.js?v=1"></script>
<script src="./profile.js?v=1"></script>
<script src="./study-tracker.js?v=1"></script>
<style>
  :root{ --bg:#0a1424; --panel:#10264a; --panel2:#0b172d; --line:#1e3a5f; --txt:#e8eef7; --dim:#9fb3d9; --gold:#f59e0b; --grn:#059669; --grn2:#10b981; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12315e 0%,var(--bg) 55%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:520px;padding:14px 16px 96px;flex:1;display:flex;flex-direction:column}
  
  /* Tuğla Duvarı Stili (Animasyonlu) */
  .sharedBrickWrap{background:#0b172d; border:1px solid #1e3a5f; border-radius:12px; padding:10px 14px; margin-bottom:14px; display:flex; flex-direction:column; gap:5px;}
  .sharedBrickHeader{font-size:12px; color:#9fb3d9; font-weight:700; display:flex; justify-content:space-between;}
  .sharedBricksGrid{display:flex; gap:4px; flex-wrap:wrap; perspective: 1000px;}
  .s-brick{flex:1; min-width:16px; height:22px; background:#f59e0b; border-radius:3px; transition:all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); position:relative;}
  .s-brick.done{transform: translateY(25px) rotateX(45deg) scale(0.4); opacity:0;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:10px;}
  .btn{background:var(--grn); color:#fff; border:none; padding:12px 20px; border-radius:10px; font-weight:bold; cursor:pointer; width:100%; margin-top:15px;}
  .menuBtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16294a99;backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;z-index:5}
</style>
</head>
<body>
  <div class="wrap">
    
    <!-- 🏗️ TUĞLA DUVARI ENJEKSİYONU -->
    <div class="sharedBrickWrap" id="topBrickContainer">
      <div class="sharedBrickHeader">
        <span>🏗️ Günlük Hedef Duvarı</span>
        <span id="sbTxt">0/5</span>
      </div>
      <div class="sharedBricksGrid" id="sbGrid"></div>
    </div>

    <div class="top" style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn" style="width:auto; margin:0;" onclick="location.href='index.html'">🏠 Koç Moduna Dön</button>
      <span id="progressLbl" style="font-size:13px; color:var(--dim);">Cüme 1/5</span>
    </div>

    <!-- Ana Çalışma Kartı -->
    <div class="card">
      <div style="font-size:12px; color:var(--gold); margin-bottom:8px;">A1 • Present Simple</div>
      <h2 id="sentenceEn" style="font-size:20px; margin:0 0 10px 0;">The project will start tomorrow morning.</h2>
      <p id="sentenceTr" style="color:var(--dim); font-size:15px;">Proje yarın sabah başlayacak.</p>
      
      <button class="btn" onclick="completeSentence()">Doğru Bildim / İlerle</button>
    </div>

  </div>

  <button class="menuBtn" onclick="location.href='menu.html'">≡ Tüm modüller</button>

<script>
/* Saf JS Ses Sentezleyici (Tuğla Yıkılma Sesi) */
function playBrickSound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.12);
  } catch(e){}
}

var lastCompletedCount = -1;

function updateSharedBricks(){
  try{
    var t = JSON.parse(localStorage.getItem("dh-study-tracker-v1") || "{}");
    var todayStr = new Date().toISOString().slice(0,10);
    var d = (t.days || {})[todayStr] || {};
    var completed = d.sentences || 0;
    var goal = 5; 
    try { if(window.DHProfile) goal = DHProfile.hedef(); } catch(e){}

    var grid = document.getElementById("sbGrid");
    if(!grid) return;
    
    // Tuğla sayısı arttığında animasyonlu ses çal
    if(lastCompletedCount !== -1 && completed > lastCompletedCount) {
        playBrickSound();
    }
    lastCompletedCount = completed;

    grid.innerHTML = "";
    document.getElementById("sbTxt").textContent = completed + " / " + goal + " Yıkıldı";

    for(var i = 0; i < goal; i++){
      var b = document.createElement("div");
      b.className = "s-brick" + (i < completed ? " done" : "");
      grid.appendChild(b);
    }
  }catch(e){}
}

// Simülasyon / Test amaçlı cümle tamamlama fonksiyonu
function completeSentence() {
    var t = JSON.parse(localStorage.getItem("dh-study-tracker-v1") || "{}");
    var todayStr = new Date().toISOString().slice(0,10);
    if(!t.days) t.days = {};
    if(!t.days[todayStr]) t.days[todayStr] = {sentences: 0};
    
    // Cümle sayısını artır ve kaydet
    t.days[todayStr].sentences += 1;
    localStorage.setItem("dh-study-tracker-v1", JSON.stringify(t));
    
    updateSharedBricks();
}

setInterval(updateSharedBricks, 800);
window.onload = updateSharedBricks;
</script>
</body>
</html>
