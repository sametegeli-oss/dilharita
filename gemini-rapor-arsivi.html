<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071226"><title>Gemini Rapor Arşivi · Dil Harita</title><link rel="stylesheet" href="./product-improvements.css"><style>
body{margin:0;background:#050914;color:#e6edf8;font-family:Nunito,system-ui,sans-serif}.ga{max-width:900px;margin:auto;padding:28px 18px 110px}.ga-head{display:flex;align-items:center;gap:14px}.ga-head a{color:#cbd5e1;font-size:25px;text-decoration:none}.ga h1{font-size:27px;margin:0}.ga-sub{color:#91a3bc;line-height:1.5}.ga-summary{background:#0d1b31;border:1px solid #225071;border-radius:16px;padding:15px;margin:20px 0}.ga-tags{display:flex;gap:8px;flex-wrap:wrap}.ga-tag{background:#123c38;color:#75e6ba;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:900}.ga-card{background:#0b1629;border:1px solid #263c5a;border-radius:17px;margin:13px 0;overflow:hidden}.ga-card summary{cursor:pointer;padding:16px;display:flex;gap:10px;align-items:center}.ga-date{font-weight:950;color:#7dd3fc}.ga-title{flex:1;font-weight:850}.ga-score{background:#173c2e;color:#6ee7b7;padding:5px 9px;border-radius:99px;font-size:12px}.ga-body{border-top:1px solid #263c5a;padding:16px;color:#c7d3e5;line-height:1.65}.ga-body strong{color:#fff}.ga-body h3{color:#7dd3fc}.ga-empty{text-align:center;padding:60px 15px;color:#91a3bc}.ga-note{font-size:12px;color:#71839d;margin-top:14px}@media(max-width:600px){.ga h1{font-size:21px}.ga-card summary{align-items:flex-start;flex-wrap:wrap}.ga-title{min-width:65%}}
</style></head><body><main class="ga"><header class="ga-head"><a href="./menu.html" aria-label="Menüye dön">←</a><div><h1>Gemini rapor arşivi</h1><div class="ga-sub">Son 30 günlük değerlendirmeler yarının koç planına katkıda bulunur.</div></div></header><section class="ga-summary" id="summary"></section><div id="list"></div><div class="ga-note">Raporlar 30 gün sonra otomatik temizlenir. Gerçek SRS tekrarları korunur; raporlar yalnız çalışma odağını ve sırasını etkiler.</div></main><script>
(function(){var KEY="dh-gemini-daily-archive-v1",list=[];try{list=JSON.parse(localStorage.getItem(KEY)||"[]")||[];}catch(e){}var cut=Date.now()-30*86400000;list=(Array.isArray(list)?list:[]).filter(function(x){return x&&(+x.at||0)>=cut;}).sort(function(a,b){return(+b.at||0)-(+a.at||0);});function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}function fmt(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/^---+$/gm,"<hr>").replace(/^#{1,4}\s+(.+)$/gm,"<h3>$1</h3>").replace(/\n/g,"<br>");}var scores={};list.forEach(function(r){(r.topics||[]).forEach(function(t){scores[t]=(scores[t]||0)+1;});});var top=Object.keys(scores).sort(function(a,b){return scores[b]-scores[a];}).slice(0,5),sum=document.getElementById("summary");sum.innerHTML='<b>'+list.length+' rapor arşivde</b><p class="ga-sub">Koçun gördüğü ağırlıklı konular:</p><div class="ga-tags">'+(top.length?top.map(function(t){return'<span class="ga-tag">'+esc(t)+' · '+scores[t]+'</span>';}).join(""):'<span class="ga-sub">Henüz konu eğilimi oluşmadı.</span>')+'</div>';var host=document.getElementById("list");if(!list.length){host.innerHTML='<div class="ga-empty">Henüz arşivlenmiş Gemini değerlendirmesi yok.</div>';return;}list.forEach(function(r,i){var d=document.createElement("details");d.className="ga-card";if(i===0)d.open=true;d.innerHTML='<summary><span class="ga-date">'+esc(r.date||"")+'</span><span class="ga-title">'+esc(r.title||"Gemini değerlendirmesi")+'</span>'+(r.score!=null?'<span class="ga-score">%'+r.score+'</span>':'')+'</summary><div class="ga-body">'+fmt(r.text||"")+'</div>';host.appendChild(d);});})();
</script><script src="./cloud-sync.js?v=5"></script><script src="./product-improvements.js" defer></script></body></html>
