<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dil Harita — Koç Modu</title>
<!-- GERÇEK VERİ + GİRİŞ: uygulamanın kendi modülleri -->
<script src="./auth-guard.js?v=1"></script>
<script src="./study-tracker.js?v=1"></script>
<script src="./learning-error-system.js?v=2"></script>
<style>
  :root{ --bg:#0a1424; --panel:#10264a; --panel2:#0b172d; --line:#1e3a5f; --txt:#e8eef7; --dim:#9fb3d9; --gold:#f59e0b; --grn:#059669; --grn2:#10b981; --pur:#7c3aed; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12315e 0%,var(--bg) 55%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:520px;padding:14px 16px 96px;flex:1;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .streak{display:flex;align-items:center;gap:6px;background:#2a1206;border:1px solid #7c3f0a;color:#fdba74;padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px}
  .goal{background:#0f1f3a;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:999px;font-size:12px}
  .goal b{color:#fff}
  .sndBtn{display:flex;align-items:center;gap:6px;background:#16294a;border:1px solid var(--line);color:var(--txt);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
  .sndBtn.off{color:var(--dim)}
  .coachWrap{display:flex;flex-direction:column;align-items:center;margin-top:6px}
  .avatarRing{position:relative;width:188px;height:188px;border-radius:50%;padding:5px;background:conic-gradient(from 180deg,var(--gold),var(--grn2),var(--pur),var(--gold));transition:box-shadow .3s}
  .avatarRing.speaking{box-shadow:0 0 0 6px #10b98122,0 0 42px #10b98155}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0f1f3a;display:block}
  .coachName{margin-top:12px;font-weight:900;font-size:17px}
  .coachRole{font-size:12px;color:var(--dim);margin-top:2px}
  .bubble{margin-top:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:15.5px;line-height:1.55;min-height:72px;position:relative;width:100%}
  .bubble:after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .caret{display:inline-block;width:8px;height:18px;background:var(--grn2);vertical-align:-3px;margin-left:2px;animation:bl .8s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .actions{margin-top:16px;display:flex;flex-direction:column;gap:10px;width:100%}
  .act{appearance:none;border:0;cursor:pointer;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;color:#fff;text-align:left;display:flex;align-items:center;gap:10px;transition:.15s;opacity:0;transform:translateY(6px)}
  .act.in{opacity:1;transform:none}
  .act.primary{background:linear-gradient(135deg,var(--grn),var(--grn2))}
  .act.ghost{background:#16294a;border:1px solid var(--line);color:var(--txt)}
  .act:active{transform:scale(.98)}
  .ask{display:flex;gap:8px;margin-top:18px;width:100%}
  .ask input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:14px}
  .ask button{background:var(--pur);border:0;color:#fff;border-radius:12px;padding:0 15px;font-weight:800;cursor:pointer}
  .menuBtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16294a99;backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;z-index:5}
  .sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.open{display:flex}
  .sheetC{background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);width:100%;max-width:520px;max-height:78vh;overflow:auto;padding:16px 16px 26px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}}
  .sheetC h3{margin:4px 0 12px;font-size:15px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--txt);text-decoration:none;display:block}
  .mitem small{display:block;color:var(--dim);font-weight:500;font-size:11.5px;margin-top:3px}
  .hint{text-align:center;color:var(--dim);font-size:13px;margin-top:14px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="pills">
        <div class="streak" id="streakPill" style="display:none">🔥 <span id="streakN">0</span> gün</div>
        <div class="goal">🎯 <b id="goalN">0/5</b> cümle</div>
      </div>
      <button class="sndBtn" id="sndBtn" onclick="toggleSound()">🔊 Sesli</button>
    </div>

    <div class="coachWrap">
      <div class="avatarRing" id="ring"><img class="avatar" id="face" alt="Koç"></div>
      <div class="coachName">Öğretmenin</div>
      <div class="coachRole">Türkçe anlatan İngilizce koçun</div>
    </div>

    <div class="bubble"><span id="say"></span><span class="caret" id="caret" style="display:none"></span></div>
    <div class="actions" id="acts"></div>

    <div class="ask">
      <input id="askIn" placeholder="Koça yaz: bugün ne çalışmak istersin?" autocomplete="off" onkeydown="if(event.key==='Enter')askCoach()">
      <button onclick="askCoach()">Sor</button>
    </div>
    <div class="hint">Bugün ne çalışacağına koçun karar verir — sen sadece onu dinle 👇</div>
  </div>

  <button class="menuBtn" onclick="openSheet()">≡ Tüm modüller</button>
  <div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
    <div class="sheetC"><h3>Tüm modüller <small style="color:#9fb3d9;font-weight:400">(istersen doğrudan gir)</small></h3><div class="mgrid" id="mgrid"></div></div>
  </div>

function soundOn(){ try{ return localStorage.getItem("dh-koc-sesli")!=="0"; }catch(e){ return true; } }

/* ---- konuşma: ağız + yazı + (tercihe göre) TTS ---- */
var mouthT=null, blinkT=null, typeT=null, seq=[FR.small,FR.medium,FR.open,FR.medium], si=0;
function startMouth(){ ring.classList.add("speaking"); stopBlink(); clearInterval(mouthT); si=0; mouthT=setInterval(function(){ face.src=seq[si%seq.length]; si++; },120); }
function stopMouth(){ clearInterval(mouthT); mouthT=null; face.src=FR.idle; ring.classList.remove("speaking"); startBlink(); }
function startBlink(){ stopBlink(); blinkT=setInterval(function(){ if(mouthT) return; face.src=FR.blink; setTimeout(function(){ if(!mouthT) face.src=FR.idle; },140); }, 3800); }
function stopBlink(){ clearInterval(blinkT); blinkT=null; }
function speak(text, done){
  var el=document.getElementById("say"), c=document.getElementById("caret");
  clearTimeout(typeT); el.textContent=""; c.style.display="inline-block"; startMouth();
  try{ if(soundOn()){ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FFFF}☀-➿✓]/gu,"")); u.lang="tr-TR"; u.rate=1; speechSynthesis.speak(u); } }catch(e){}
  var i=0; (function tick(){ if(i<=text.length){ el.textContent=text.slice(0,i); i++; typeT=setTimeout(tick,18); } else { c.style.display="none"; stopMouth(); done&&done(); } })();
}

/* ---- GERÇEK VERİ ---- */
function isoToday(){ return new Date().toISOString().slice(0,10); }
var WEAK={ "missing-word":"eksik kelime","word-order":"kelime sırası","tense":"fiil zamanı","preposition":"edat (in/on/at)","article":"artikel (a/the)","spelling":"yazım","plural":"çoğul","auxiliary":"yardımcı fiil","general":"genel hatalar" };
var GOAL=5;
async function loadReal(){
  var R={streak:null,sentences:0,reviews:0,lessons:0,due:null,weakType:null,weakCount:0};
  try{ var t=JSON.parse(localStorage.getItem("dh-study-tracker-v1")||"{}")||{}; var d=(t.days||{})[isoToday()]||{}; R.sentences=d.sentences||0; R.reviews=d.reviews||0; R.lessons=d.lessons||0; }catch(e){}
  try{ if(window.studyTracker){ var s=(window.studyTracker.getTodayStats&&window.studyTracker.getTodayStats().streak); if(s==null && window.studyTracker.streakData) s=window.studyTracker.streakData.current; if(typeof s==="number") R.streak=s; } }catch(e){}
  if(R.streak==null){ try{ var st=JSON.parse(localStorage.getItem("study_tracker_data")||"{}"); if(st.streakData&&typeof st.streakData.current==="number") R.streak=st.streakData.current; }catch(e){} }
  try{ var pl=JSON.parse(localStorage.getItem("dh-koc-plan-"+isoToday())||"null"); if(pl&&typeof pl.dueCount==="number") R.due=pl.dueCount; }catch(e){}
  try{ if(window.LearningErrorDB&&LearningErrorDB.all){ var all=await LearningErrorDB.all(); var sum=LearningErrorDB.summarize(all||[]); R.weakCount=(sum&&sum.high)||0; if(sum&&sum.byType&&sum.byType[0]) R.weakType=sum.byType[0][0]; } }catch(e){}
  return R;
}
function paintHeader(R){
  document.getElementById("goalN").textContent=Math.min(R.sentences,GOAL)+"/"+GOAL;
  if(R.streak!=null && R.streak>0){ document.getElementById("streakN").textContent=R.streak; document.getElementById("streakPill").style.display="flex"; }
}

/* ---- koçun kararı: gerçek duruma göre SIRADAKİ tek adım ---- */
function decide(R){
  var ad=R.sentences>0||R.reviews>0; var hi=ad?"Tekrar hoş geldin":"Merhaba"; 
  var pre=(R.streak&&R.streak>0)?(hi+" Samet! 🔥 "+R.streak+" günlük serin sürüyor. "):(hi+" Samet! ");
  if(R.due && R.due>0){
    return { msg:pre+"Bekleyen "+R.due+" tekrarın var — 3 dakikada biter. Önce onları halledelim mi?",
      acts:[ {t:"▶ "+R.due+" tekrarı yap",p:1,go:"tekrar.html"}, {t:"Önce bugünün dersi",go:"ders.html"} ] };
  }
  if(R.sentences < GOAL){
    var kalan=GOAL-R.sentences;
    return { msg:pre+(R.reviews>0?"Tekrarlar tamam ✓ ":"")+"Bugünkü cümle hedefin "+R.sentences+"/"+GOAL+". "+kalan+" cümle kaldı, birlikte bitirelim.",
      acts:[ {t:"📸 Fotoğraftan cümle çalış",p:1,go:"foto-ekle.html"}, {t:"🎓 Hazır dersle çalış",go:"ders.html"} ] };
  }
  if(R.weakCount>0){
    var w=WEAK[R.weakType]||R.weakType||"zayıf noktan";
    return { msg:pre+"Cümle hedefin tamam 👏 Son bir şey: en çok "+w+" hatası yapıyorsun. 5 dakikalık mini antrenman tam da buna. Yapalım mı?",
      acts:[ {t:"🏋️ Hata antrenmanı",p:1,go:"index-app.html"}, {t:"Bugünlük yeter",go:null} ] };
  }
  return { msg:pre+"Bugünün planını hakkıyla bitirdin 🎉 Karnen dolu. İstersen serbest çalış, istersen dinlen — yarın görüşürüz!",
    acts:[ {t:"📚 Serbest çalış",p:1,menu:true}, {t:"👋 Bugünlük bu kadar",go:null} ] };
}
function renderDecision(R){
  var st=decide(R); var box=document.getElementById("acts"); box.innerHTML="";
  speak(st.msg, function(){
    st.acts.forEach(function(a,idx){
      var b=document.createElement("button"); b.className="act "+(a.p?"primary":"ghost"); b.textContent=a.t;
      b.onclick=function(){
        if(a.menu){ openSheet(); return; }
        if(a.go){ location.href="./"+a.go; return; }
        speak("Harika, bugünlük planı kapattık. Dinlenmeyi hak ettin 🌙 Yarın aynı yerde bekliyorum.", function(){}); box.innerHTML="";
      };
      box.appendChild(b); setTimeout(function(){ b.classList.add("in"); }, 60+idx*90);
    });
  });
}

function mkBtn(t,cls,fn){ var b=document.createElement("button"); b.className="act "+cls; b.textContent=t; b.onclick=fn; return b; }

/* ---- tüm modüller (gerçek linkler) ---- */
var MODS=[ ["🎓 Bugünkü Dersim","ders.html","öğretmen ders hazırlar"],["🔁 Tekrar","tekrar.html","aralıklı tekrar"],["💬 Sohbet","chat.html","konuşan avatar"],["🎬 Video","videopractice.html","telaffuz"],["📖 Kelime","kelime-ogren.html","kart & quiz"],["🔗 Phrasal","phrasal-verbs.html","öbek fiiller"],["📷 Fotoğraftan ekle","foto-ekle.html","tara & çevir"],["🗺️ İlerleme","harita.html","modül haritası"],["📌 Hata Defteri","hata-defteri.html","hata analizi"],["🎯 Seviye","seviye-testi.html","seviyeni ölç"],["📘 Kılavuz","kilavuz.html","kullanım rehberi"],["📊 Rapor","rapor.html","30 günlük trend"] ];
(function(){ var g=document.getElementById("mgrid"); MODS.forEach(function(m){ var a=document.createElement("a"); a.className="mitem"; a.href="./"+m[1]; a.innerHTML=m[0]+"<small>"+m[2]+"</small>"; g.appendChild(a); }); })();
function openSheet(){ document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }

/* ---- başlangıç ---- */
startBlink();
async function boot(){
  var box=document.getElementById("acts"); box.innerHTML="";
  document.getElementById("say").textContent="Bugünü hazırlıyorum…";
  var R=await loadReal(); paintHeader(R); renderDecision(R);
}
(function firstScreen(){
  var box=document.getElementById("acts");
  var b=mkBtn("👉 Başla — koç seni yönlendirsin","primary",function(){ boot(); });
  box.appendChild(b); setTimeout(function(){b.classList.add("in");},120);
  document.getElementById("say").innerHTML="Merhaba 👋 Ben koçun. Bugün ne çalışacağını düşünme — <b>ben karar veririm, sen sadece başla.</b>";
})();
</script>
