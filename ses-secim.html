<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔊 Avatar Ses Seçimi</title>
<style>
:root{--bg:#0a1628;--card:#0f1f3a;--line:#1e3a5f;--tx:#e8eef7;--mut:#9fb3d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px}
.top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto 14px}
.top a{color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
h1{font-size:17px;margin:0}
.note{max-width:760px;margin:0 auto 14px;color:var(--mut);font-size:12.5px;background:#101c33;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grid{max-width:760px;margin:0 auto;display:grid;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.row img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#1e293b}
.name{font-weight:800}
.sub{color:var(--mut);font-size:12px;margin-bottom:6px}
select{width:100%;background:#0a1628;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 13px system-ui}
.btns{display:flex;gap:8px;margin-top:8px}
button{border:0;border-radius:10px;padding:8px 12px;font:800 12.5px system-ui;cursor:pointer;color:#fff}
.b-try{background:#0e7490}.b-def{background:#334155}
.rate{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mut)}
.rate input{flex:1}
.saved{color:#4ade80;font-size:11px;margin-left:6px}
</style><link rel="stylesheet" href="./atlas-theme.css?v=1">
</head><body>
<div class="top"><a href="./chat.html">←</a><h1>🔊 Avatar Ses Seçimi</h1></div>
<div class="note">Her karakter için bu CİHAZDA farklı bir ses seçebilirsin. Seçim yalnız bu cihazda geçerlidir (telefon ve bilgisayarın ses listeleri farklı olduğundan senkronlanmaz) — her ikisinde de ayrı ayrı ayarla.</div>
<div class="grid" id="grid"></div>
<script>
(function(){
  var CHARS=[
    {slug:"assets/avatars_v3/hotel/",   name:"🏨 Otel — resepsiyonist",  img:"assets/avatars_v3/hotel/idle.webp",       sample:"Hello, welcome to our hotel. Do you have a reservation?"},
    {slug:"assets/avatars_v3/restaurant/",name:"🍽 Restoran — garson",    img:"assets/avatars_v3/restaurant/idle.webp",  sample:"Good evening! Are you ready to order, or do you need more time?"},
    {slug:"assets/avatars_v3/doctor/",  name:"🩺 Doktor",                img:"assets/avatars_v3/doctor/idle.webp",      sample:"Hello, please have a seat. What brings you in today?"},
    {slug:"assets/avatars_v3/airport/", name:"✈️ Havaalanı — görevli",   img:"assets/avatars_v3/airport/idle.webp",     sample:"Good morning, may I see your passport and ticket please?"},
    {slug:"assets/avatars_v3/teacher1/",name:"🎓 Öğretmen 1",            img:"assets/avatars_v3/teacher1/idle.webp",    sample:"Hi there! Ready for today's lesson? Let's get started."},
    {slug:"assets/avatars_v3/teacher2/",name:"🎓 Öğretmen 2",            img:"assets/avatars_v3/teacher2/idle.webp",    sample:"Hello! I'm excited to practice English with you today."}
  ];
  function key(slug){ return "dh-voice:"+slug.replace(/[^a-z0-9]+/gi,"-"); }
  var GLOBAL_KEY="dh-voice:__global__";
  function loadGlobal(){ try{ return JSON.parse(localStorage.getItem(GLOBAL_KEY)||"null")||{}; }catch(e){ return {}; } }
  function saveGlobal(p){ try{ localStorage.setItem(GLOBAL_KEY,JSON.stringify(p)); }catch(e){} }
  function loadPref(slug){ try{ return JSON.parse(localStorage.getItem(key(slug))||"null")||{}; }catch(e){ return {}; } }
  function savePref(slug,p){ try{ localStorage.setItem(key(slug),JSON.stringify(p)); }catch(e){} }

  var grid=document.getElementById("grid");
  var voices=[];
  function refresh(){
    /* Dil filtresi KALDIRILDI: sistemdeki TÜM sesler (bayan dahil, her dil)
       listelensin — kullanıcı duyarak kendisi seçer. Aynı diller bir arada
       görünsün diye dile göre sıralanır. */
    var all=(speechSynthesis.getVoices()||[]).slice();
    all.sort(function(a,b){
      var la=(a.lang||"").toLowerCase(), lb=(b.lang||"").toLowerCase();
      if(la<lb) return -1; if(la>lb) return 1;
      return (a.name||"").localeCompare(b.name||"");
    });
    voices=all;
    paint();
  }
  if(typeof speechSynthesis!=="undefined"){ refresh(); speechSynthesis.onvoiceschanged=refresh; }

  function paint(){
    grid.innerHTML="";
    if(!voices.length){
      grid.innerHTML='<div class="note">Ses listesi yükleniyor… (mobilde birkaç saniye sürebilir; sayfaya bir kez dokun). Sistemdeki tüm sesler burada listelenir — hangisinin kadın/erkek olduğunu ▶ ile dinleyerek anlayabilirsin.</div>';
      return;
    }
    var femRe=/(female|zira|susan|samantha|karen|serena|tessa|fiona|moira|veena|kadın|kadin|woman|girl|hazel|catherine|linda|heera|google uk english female|google us english)/i;
    var malRe=/(male|david|mark|george|daniel|james|john|alex|fred|thomas|guy|brian|ryan|matthew|arthur|oliver|erkek|man)/i;

    /* GLOBAL AYAR: tek merkezi ses seçimi. Karakter-özel seçim yapılmadıysa
       tüm karakterler (chatdoctor dahil) bu sesi kullanır. Tek doğru kaynak burasıdır. */
    var g=loadGlobal();
    var gWrap=document.createElement("div"); gWrap.className="row"; gWrap.style.borderBottom="2px solid #2563eb";
    var gRight=document.createElement("div"); gRight.style.flex="1";
    gRight.innerHTML='<div class="name">🌐 Tüm karakterler için ses<span class="saved" style="display:'+(g.name?"inline":"none")+'">✓ kayıtlı</span></div><div class="sub">Bu, uygulamadaki tüm sohbet karakterlerinin varsayılan sesidir. Aşağıda tek tek değiştirmezsen hepsi bunu kullanır.</div>';
    var gSel=document.createElement("select"); gSel.style.cssText="width:100%;margin-top:6px;padding:8px;border-radius:8px";
    var gO0=document.createElement("option"); gO0.value=""; gO0.textContent="— Sistem varsayılanı —"; gSel.appendChild(gO0);
    voices.forEach(function(v){
      var mark=femRe.test(v.name||"")?"👩 ":(malRe.test(v.name||"")?"👨 ":"");
      var o=document.createElement("option"); o.value=v.name; o.textContent=mark+v.name+" ("+v.lang+")";
      if(g.name===v.name) o.selected=true; gSel.appendChild(o);
    });
    gSel.onchange=function(){
      var v=voices.find(function(x){return x.name===gSel.value;});
      if(v){ saveGlobal({name:v.name,lang:v.lang}); } else { try{ localStorage.removeItem(GLOBAL_KEY); }catch(e){} }
      paint();
    };
    var gBtns=document.createElement("div"); gBtns.style.marginTop="6px";
    var gPlay=document.createElement("button"); gPlay.textContent="▶ Dinle"; gPlay.style.cssText="margin-right:6px;padding:6px 12px;border-radius:8px;cursor:pointer";
    gPlay.onclick=function(){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance("Hello, this is my voice."); var v=voices.find(function(x){return x.name===gSel.value;}); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US"; speechSynthesis.speak(u); }catch(e){} };
    gBtns.appendChild(gPlay);
    gRight.appendChild(gSel); gRight.appendChild(gBtns);
    gWrap.appendChild(gRight); grid.appendChild(gWrap);

    CHARS.forEach(function(ch){
      var pref=loadPref(ch.slug);
      var row=document.createElement("div"); row.className="row";
      var img=document.createElement("img"); img.src=ch.img; img.onerror=function(){ img.style.display="none"; };
      var right=document.createElement("div");
      right.innerHTML='<div class="name">'+ch.name+'<span class="saved" id="sv_'+ch.slug.replace(/[^a-z0-9]/gi,"")+'" style="display:'+(pref.name?"inline":"none")+'">✓ kayıtlı</span></div><div class="sub">Bu karakter hangi sesle konuşsun?</div>';
      var sel=document.createElement("select");
      var femRe=/(female|kadın|samantha|victoria|susan|karen|zira|hazel|moira|tessa|fiona|veena|kate|serena|allison|ava|emma|joanna|salli|kimberly|ivy|aria|jenny|libby|sonia|natasha|olivia|amy|nicole|kendra)/i;
      var malRe=/(male|erkek|david|mark|george|daniel|james|john|alex|fred|thomas|guy|brian|ryan|matthew|arthur|oliver)/i;
      voices.forEach(function(v){
        var g=femRe.test(v.name||"")?"👩 ":(malRe.test(v.name||"")?"👨 ":"");
        var o=document.createElement("option"); o.value=v.name; o.textContent=g+v.name+" ("+v.lang+")";
        if(pref.name===v.name) o.selected=true;
        sel.appendChild(o);
      });

      /* Seçili sesi ANINDA dinlet: cinsiyet isimden anlaşılamıyor (en_AU gibi),
         kullanıcı DUYARAK karar versin. Seçim değişince de otomatik çalar. */
      var listenWrap=document.createElement("div"); listenWrap.className="btns";
      var bListen=document.createElement("button"); bListen.className="b-try"; bListen.textContent="▶ Bu sesi dinle";
      function previewCurrent(){
        try{
          speechSynthesis.cancel();
          var u=new SpeechSynthesisUtterance(ch.sample);
          var v=voices.find(function(x){return x.name===sel.value;}); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
          u.rate=parseFloat(rateInput.value)||0.96; u.pitch=parseFloat(pitchInput.value)||1.0;
          speechSynthesis.speak(u);
        }catch(e){}
      }
      bListen.onclick=previewCurrent;
      sel.addEventListener("change", previewCurrent);
      listenWrap.appendChild(bListen);

      var rateWrap=document.createElement("div"); rateWrap.className="rate";
      var rateVal=pref.rate||0.96;
      rateWrap.innerHTML='Hız: <input type="range" min="0.7" max="1.2" step="0.02" value="'+rateVal+'"><span>'+rateVal+'</span>';
      var rateInput=rateWrap.querySelector("input"), rateLabel=rateWrap.querySelector("span");
      rateInput.oninput=function(){ rateLabel.textContent=rateInput.value; };

      var pitchWrap=document.createElement("div"); pitchWrap.className="rate";
      var pitchVal=pref.pitch!=null?pref.pitch:0.78;
      pitchWrap.innerHTML='Ton: <input type="range" min="0" max="2" step="0.05" value="'+pitchVal+'"><span>'+pitchVal+'</span>';
      var pitchInput=pitchWrap.querySelector("input"), pitchLabel=pitchWrap.querySelector("span");
      pitchInput.oninput=function(){ pitchLabel.textContent=pitchInput.value; };
      /* 📱 Mobil gerçeği: Android çoğu zaman tek-iki cinsiyetsiz ses verir ve
         varsayılan ton (0.78) HER sesi erkek gibi gösterir. Kadın sesi için
         tonu yükseltmek gerekir — tek dokunuş önayarlar: */
      var gWrap=document.createElement("div"); gWrap.className="btns";
      var gNote=document.createElement("div"); gNote.className="sub"; gNote.style.margin="6px 0 2px";
      gNote.textContent="Telefonunda kadın sesi ayrı görünmüyorsa: aşağıdaki tonu yükselterek kadın, düşürerek erkek sesi elde edebilirsin. ▶ ile dinle.";
      var bFem=document.createElement("button"); bFem.className="b-def"; bFem.textContent="👩 Kadın tonu";
      var bMal=document.createElement("button"); bMal.className="b-def"; bMal.textContent="👨 Erkek tonu";
      bFem.onclick=function(){ var f=voices.find(function(v){return femRe.test(v.name||"");}); if(f) sel.value=f.name;
        pitchInput.value=1.3; pitchLabel.textContent="1.3"; rateInput.value=0.98; rateLabel.textContent="0.98"; previewCurrent(); };
      bMal.onclick=function(){ var m=voices.find(function(v){return malRe.test(v.name||"");}); if(m) sel.value=m.name;
        pitchInput.value=0.7; pitchLabel.textContent="0.7"; rateInput.value=0.96; rateLabel.textContent="0.96"; previewCurrent(); };
      gWrap.appendChild(bFem); gWrap.appendChild(bMal);
      var btns=document.createElement("div"); btns.className="btns";
      var bTry=document.createElement("button"); bTry.className="b-try"; bTry.textContent="🔊 Dene ve Kaydet";
      var bDef=document.createElement("button"); bDef.className="b-def"; bDef.textContent="Varsayılana dön";
      btns.appendChild(bTry); btns.appendChild(bDef);
      right.appendChild(sel); right.appendChild(listenWrap); right.appendChild(gNote); right.appendChild(gWrap); right.appendChild(rateWrap); right.appendChild(pitchWrap); right.appendChild(btns);
      row.appendChild(img); row.appendChild(right); grid.appendChild(row);

      bTry.onclick=function(){
        var name=sel.value, rate=parseFloat(rateInput.value), pitch=parseFloat(pitchInput.value);
        savePref(ch.slug,{name:name,rate:rate,pitch:pitch});
        var badge=document.getElementById("sv_"+ch.slug.replace(/[^a-z0-9]/gi,"")); if(badge) badge.style.display="inline";
        try{
          speechSynthesis.cancel();
          var u=new SpeechSynthesisUtterance(ch.sample);
          var v=voices.find(function(x){return x.name===name;}); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
          u.rate=rate; u.pitch=pitch;
          speechSynthesis.speak(u);
        }catch(e){}
      };
      bDef.onclick=function(){ try{ localStorage.removeItem(key(ch.slug)); }catch(e){} paint(); };
    });
  }
  paint();
})();
</script>
</body></html>
