<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DilHarita - Görsel Karşılaştırma & Düet Stüdyosu</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c30;
      --border: #ffffff18;
      --text: #e8eef7;
      --muted: #93a4bd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    h2 { color: #60a5fa; margin: 0 0 10px 0; font-size: 22px; text-align: center; grid-column: 1 / -1; }
    
    .left-column, .right-column { display: flex; flex-direction: column; gap: 12px; }

    .target-phrase-box {
      background: #1e293b;
      border: 1px dashed #38bdf8;
      border-radius: 14px;
      padding: 12px;
    }
    .target-en { font-size: 18px; font-weight: 800; color: #fff; text-align: center; }
    .target-tr { font-size: 12px; color: #94a3b8; margin-top: 4px; font-style: italic; text-align: center; }

    .media-panel {
      background: #070d19;
      border: 1px solid #ffffff10;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .avatar-box {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #34d399;
      background: #050b16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .avatar-box.speaking { box-shadow: 0 0 20px rgba(37, 99, 235, 0.6); border-color: #2563eb; }
    .eyes { display: flex; gap: 14px; margin-bottom: 6px; }
    .eye { width: 7px; height: 7px; background: #e8eef7; border-radius: 50%; }
    .mouth { width: 18px; height: 4px; background: #f87171; border-radius: 99px; transition: all 0.06s linear; }
    .mouth.rest { height: 4px; width: 16px; }
    .mouth.closed { height: 2px; width: 18px; }
    .mouth.wide { height: 8px; width: 20px; border-radius: 50%; }
    .mouth.round { height: 14px; width: 16px; border-radius: 50%; }
    .mouth.open { height: 18px; width: 20px; border-radius: 40% 40% 50% 50%; }

    .live-canvas { width: 100%; height: 35px; background: #020617; border-radius: 8px; }

    .timeline-panel {
      background: #070d19;
      border: 1px solid #ffffff12;
      border-radius: 16px;
      padding: 12px;
    }
    .graph-title { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .legend-box { display: flex; gap: 12px; font-size: 10.5px; margin-bottom: 6px; justify-content: flex-end;}
    .leg-item { display: flex; align-items: center; gap: 4px; color: #94a3b8; }
    .leg-color { width: 10px; height: 12px; border-radius: 2px; }

    .compare-studio-wrapper {
      position: relative;
      width: 100%;
      height: 95px;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #ffffff05;
      overflow: hidden;
    }
    .overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .mentor-report-panel {
      background: #1e1b4b;
      border: 1px solid #818cf844;
      border-radius: 14px;
      padding: 12px;
      text-align: left;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }
    .report-title { font-weight: 900; font-size: 13px; color: #a5b4fc; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
    .report-item { font-size: 13.5px; line-height: 1.6; margin-top: 4px; color: #e0e7ff; }

    .feedback-box {
      padding: 12px;
      border-radius: 16px;
      background: #070d19;
      border: 1px solid #ffffff10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 110px;
    }
    .score-display { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .diff-line { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 14px; font-weight: 700; }
    
    .action-controls { display: flex; flex-direction: column; gap: 6px; }

    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:active { transform: scale(0.99); }
    .btn.recording { background: #ef4444; }
    .btn.play { background: #16a34a; }
    .btn.hoca { background: #0e7490; }
    .btn.analyze-graphs { background: #7c3aed; }
    .btn.duet { background: #d97706; } 
    .btn[disabled] { opacity: 0.3; cursor: default; }
    
    .status { font-size: 12px; color: #93a4bd; text-align: center; min-height: 18px; margin-top: 4px; }

    @media (min-width: 640px) and (orientation: landscape), (min-width: 850px) {
      .container {
        grid-template-columns: 1.1fr 0.9fr; 
        padding: 12px;
        gap: 12px;
        height: 100vh;
        align-content: center;
      }
      h2 { margin-bottom: 0px; font-size: 20px; }
      .left-column { justify-content: center; }
      .right-column { justify-content: center; }
      .feedback-box { flex: 1; min-height: 90px; }
      .compare-studio-wrapper { height: 120px; } /* Yatayda daha ferah ve net grafik alanı */
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Görsel Karşılaştırma Stüdyosu</h2>
  
  <!-- SOL TARAF: AKUSTİK GÖRSEL PANEL -->
  <div class="left-column">
    <div class="target-phrase-box">
      <div class="target-en" id="targetEn">I am not responsible for the loss.</div>
      <div class="target-tr">Kayıptan ben sorumlu değilim.</div>
    </div>

    <div class="media-panel">
      <div class="avatar-box" id="avatarBox">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth rest" id="mouth"></div>
      </div>
      <div style="flex: 1;">
        <canvas class="live-canvas" id="liveVisualizer"></canvas>
      </div>
    </div>

    <div class="timeline-panel">
      <div class="graph-title">🎙️ Akustik Dalga Bindirme Alanı</div>
      <div class="legend-box">
        <div class="leg-item"><div class="leg-color" style="background: #38bdf8;"></div> Hoca <span id="ttsDuration" style="color:#64748b; margin-left:2px;">(0.0s)</span></div>
        <div class="leg-item"><div class="leg-color" style="background: #4ade80;"></div> Sen <span id="userDuration" style="color:#64748b; margin-left:2px;">(0.0s)</span></div>
      </div>
      <div class="compare-studio-wrapper">
        <canvas class="overlay-canvas" id="studioCanvas"></canvas>
      </div>
    </div>

    <div class="mentor-report-panel" id="mentorReportPanel">
      <div class="report-title">🧭 AI Mentor Grafik Kıyaslama Raporu</div>
      <div id="reportContent"></div>
    </div>
  </div>

  <!-- SAĞ TARAF: KONTROL VE DEĞERLENDİRME KULESİ -->
  <div class="right-column">
    <div class="feedback-box">
      <div class="score-display" id="scoreDisplay">--%</div>
      <div class="diff-line" id="diffLine">
        <span style="color:#64748b; font-weight:normal; font-size:13px; text-align: center;">Hoca sesini çizdir ve cümleni oku.</span>
      </div>
    </div>

    <div class="action-controls">
      <button class="btn hoca" id="analyzeTtsBtn">🎓 Önce Hoca Sesini Çizdir</button>
      <button class="btn" id="recordBtn" disabled>🎙️ Mikrofonu Aç ve Cümleyi Oku</button>
      <button class="btn analyze-graphs" id="analyzeGraphsBtn" disabled>🔍 Grafikleri Karşılaştır & Analiz Et</button>
      <button class="btn duet" id="duetBtn" disabled>▶ Hocayı ve Beni Aynı Anda Dinle (Düet)</button>
      <button class="btn play" id="playBtn" disabled>▶ Sadece Kendi Sesimi Dinle</button>
    </div>

    <div class="status" id="statusField">Hazır. Önce "Hoca Sesini Çizdir" butonuna tıkla.</div>
  </div>
</div>

<script>
  "use strict";
  function dhSavedVoicePref(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("dh-voice:")===0){
          var p=JSON.parse(localStorage.getItem(k)||"null");
          if(p&&p.name) return p;
        }
      }
    }catch(e){}
    return null;
  }
  function dhApplyVoice(u){
    try{
      var p=dhSavedVoicePref(); if(!p) return;
      var v=(speechSynthesis.getVoices()||[]).find(function(x){return x.name===p.name;});
      if(v) u.voice=v;
      if(p.rate) u.rate=p.rate;
      if(p.pitch) u.pitch=p.pitch;
    }catch(e){}
  }


  /* 🎯 Resimli öğrenme kartından gelen cümle: ?en=...&tr=...&back=... */
  (function(){
    try{
      var q=new URLSearchParams(location.search);
      var en=q.get("en"), tr=q.get("tr");
      if(en){ document.getElementById("targetEn").textContent=en;
              document.querySelector(".target-tr").textContent=tr||""; }
      var back=q.get("back");
      var b=document.createElement("button");
      b.textContent="← Geri";
      b.style.cssText="position:fixed;left:12px;top:12px;z-index:50;background:#131c30;border:1px solid #ffffff22;color:#e8eef7;border-radius:10px;padding:9px 14px;font:800 13px system-ui;cursor:pointer";
      b.onclick=function(){ if(back) location.href=back; else history.back(); };
      document.body.appendChild(b);
    }catch(e){}
  })();
  const TARGET_TEXT = document.getElementById("targetEn").textContent;

  let mediaStream = null, mediaRecorder = null, recordedChunks = [], voiceUrl = "", teacherAudioUrl = null;
  let isRecording = false, audioCtx = null, analyser = null, dataArray = null, animationFrameId = null, sourceNode = null;
  let recognition = null, heardText = "";

  let ttsTimelineData = [];
  let userTimelineData = [];
  
  let finalTtsData = [];
  let finalUserData = [];

  let cachedTtsBounds = { start: 0, end: 0 };
  let cachedUserBounds = { start: 0, end: 0 };

  let samplingIntervalId = null;
  let playheadProgress = -1; 

  const liveCanvas = document.getElementById("liveVisualizer");
  // --- 🌟 KESİN TAMİR: getContext("2d") parantezleri bu dosyada da düzeltildi! ---
  const liveCtx = liveCanvas.getContext("2d"); 
  const studioCanvas = document.getElementById("studioCanvas");
  const studioCtx = studioCanvas.getContext("2d");

  const recordBtn = document.getElementById("recordBtn");
  const playBtn = document.getElementById("playBtn");
  const duetBtn = document.getElementById("duetBtn");
  const analyzeTtsBtn = document.getElementById("analyzeTtsBtn");
  const analyzeGraphsBtn = document.getElementById("analyzeGraphsBtn");
  const mentorReportPanel = document.getElementById("mentorReportPanel");
  const reportContent = document.getElementById("reportContent");
  const statusField = document.getElementById("statusField");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const diffLine = document.getElementById("diffLine");
  const mouth = document.getElementById("mouth");
  const avatarBox = document.getElementById("avatarBox");

  function setMouth(shape) { mouth.className = "mouth " + (shape || "rest"); }
  function setAvatarSpeaking(on) { avatarBox.classList.toggle("speaking", !!on); }

  const EN_CONTRACTIONS = {
    "i'm":["i","am"],"you're":["you","are"],"we're":["we","are"],"they're":["they","are"],
    "he's":["he","is"],"she's":["she","is"],"it's":["it","is"],"that's":["that","is"],"there's":["there","is"],
    "don't":["do","not"],"doesn't":["does","not"],"didn't":["did","not"],
    "isn't":["is","not"],"aren't":["are","not"],"wasn't":["was","not"],"weren't":["were","not"],
    "can't":["can","not"],"cannot":["can","not"],"couldn't":["could","not"],
    "won't":["will","not"],"wouldn't":["would","not"],"shouldn't":["should","not"],"mustn't":["must","not"],
    "haven't":["have","not"],"hasn't":["has","not"],"hadn't":["had","not"],
    "i've":["i","have"],"you've":["you","have"],"we've":["we","have"],"they've":["they","have"],
    "i'll":["i","will"],"you'll":["you","will"],"he'll":["he","will"],"she'll":["she","will"],"we'll":["we","will"],"they'll":["they","will"],
    "let's":["let","us"]
  };
  function tokenizeEN(s) { return String(s || "").match(/[A-Za-z']+|\d+/g) || []; }
  function normSeqEN(text) {
    const out = [];
    for (const raw of tokenizeEN(text)) {
      const n = raw.toLowerCase().replace(/[\u2019\u2018]/g, "'");
      const __pr = w => /^(he|she|it|him|her|his|hers|its)$/.test(w) ? "o3" : w;  /* TR: cinsiyetsiz 3. tekil */
      if (EN_CONTRACTIONS[n]) EN_CONTRACTIONS[n].forEach(x => out.push({ n: __pr(x), raw: x }));
      else if (n) out.push({ n: __pr(n), raw: raw });
    }
    return out;
  }

  function diffEN(answer, target) {
    const A = normSeqEN(answer), B = normSeqEN(target);
    const m = A.length, n = B.length;
    const dp = Array.from({ length: m + 1 }, () => new Int16Array(n + 1));
    for (let i = m - 1; i >= 0; i--) {
      for (let j = n - 1; j >= 0; j--) {
        dp[i][j] = A[i].n === B[j].n ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const parts = []; let i = 0, j = 0, correct = 0, extra = 0;
    while (i < m && j < n) {
      if (A[i].n === B[j].n) { parts.push({ type: "ok", word: B[j].raw }); correct++; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { parts.push({ type: "extra", word: A[i].raw }); extra++; i++; }
      else { parts.push({ type: "missing", word: B[j].raw }); j++; }
    }
    while (i < m) parts.push({ type: "extra", word: A[i++].raw });
    while (j < n) parts.push({ type: "missing", word: B[j++].raw });
    const score = Math.max(0, Math.round((correct / Math.max(n, 1)) * 100 - Math.min(extra * 4, 12)));
    return { parts, score };
  }

  // --- HOCA ANALİZİ ---


  /* ── SENTETİK RİTİM ŞABLONU (yalnızca YEDEK: mikrofon yoksa/duymadıysa) ── */
  function buildSynthSched(){
    const words=(TARGET_TEXT.match(/[A-Za-z']+|[,;:]/g)||[]);
    const syl=w=>Math.max(1,(w.toLowerCase().match(/[aeiouy]+/g)||[]).length);
    const hash=w=>{let h=0;for(let i=0;i<w.length;i++)h=(h*31+w.charCodeAt(i))|0;return h;};
    let t=0.18; const seg=[];
    words.forEach((w,i)=>{
      if(/^[,;:]$/.test(w)){ t+=0.28; return; }
      const dur=(0.075*syl(w)+0.07)/0.88;
      let amp=44+syl(w)*9+Math.min(12,w.length);
      if(i===words.length-1) amp*=0.82;
      seg.push({a:t,b:t+dur,amp:Math.min(95,amp),h:hash(w)});
      t+=dur+0.085;
    });
    return {seg,total:t};
  }
  function synthVolAt(sched,ts){
    for(const g of sched.seg)
      if(ts>=g.a&&ts<g.b) return Math.max(1,g.amp+7*Math.sin(ts*24+g.h)+4*Math.sin(ts*57+g.h*0.7));
    return 1.5;
  }
  function synthFullCurve(){
    const sc=buildSynthSched(), out=[];
    for(let ts=0; ts<sc.total; ts+=0.04) out.push(synthVolAt(sc,ts));
    return out;
  }

  /* ── HOCA: TTS hoparlörden çalarken MİKROFONLA GERÇEK KAYIT ──
     Tarayıcı TTS sesini doğrudan vermez; hoparlör→mikrofon yoluyla gerçek ses
     dosyası elde ederiz (yankı bastırma KAPALI — yoksa sistem hoca sesini siler).
     Grafik bu kayıttan çizilir, düet bu dosyadan çalar. Mikrofon yoksa ya da
     hocayı duymadıysa (kulaklık) cümle-temelli şablona düşer ve bunu söyler. */
  analyzeTtsBtn.onclick = async function() {
    ttsTimelineData = []; finalTtsData = []; finalUserData = []; playheadProgress = -1;
    teacherAudioUrl = null;
    mentorReportPanel.style.display = "none";
    analyzeGraphsBtn.disabled = true; duetBtn.disabled = true;
    clearStudioCanvas();

    let capStream=null, capAnalyser=null, capData=null, capRec=null, capCtx=null;
    const teacherChunks=[];
    try{
      capStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      capCtx=new (window.AudioContext||window.webkitAudioContext)();
      capAnalyser=capCtx.createAnalyser(); capAnalyser.fftSize=64;
      capData=new Uint8Array(capAnalyser.frequencyBinCount);
      capCtx.createMediaStreamSource(capStream).connect(capAnalyser);
      capRec=new MediaRecorder(capStream);
      capRec.ondataavailable=e=>{ if(e.data.size>0) teacherChunks.push(e.data); };
      capRec.onstop=()=>{ if(teacherChunks.length) teacherAudioUrl=URL.createObjectURL(new Blob(teacherChunks,{type:"audio/webm"})); };
      capRec.start();
      statusField.textContent="🎙️ Hoca kaydediliyor (hoparlörden)...";
    }catch(e){
      statusField.textContent="Mikrofon izni yok — ritim şablonu çizilecek. Hoca cümlesi seslendiriliyor...";
    }

    const synthSched=buildSynthSched();
    let startTime = Date.now();
    try { speechSynthesis.cancel(); } catch(e){}
    const u = new SpeechSynthesisUtterance(TARGET_TEXT); dhApplyVoice(u);
    u.lang = "en-US"; u.rate = 0.88;

    samplingIntervalId = setInterval(() => {
      let t = (Date.now() - startTime) / 1000;
      let vol;
      if(capAnalyser){
        capAnalyser.getByteFrequencyData(capData);
        let total=0; for(let i=0;i<capData.length;i++) total+=capData[i];
        vol = total/capData.length;                     /* kullanıcı hattıyla AYNI ölçüm */
      } else {
        vol = synthVolAt(synthSched, t);
      }
      ttsTimelineData.push(vol);
      finalTtsData = ttsTimelineData;
      drawStudioGraphs();
      document.getElementById("ttsDuration").textContent = `(${t.toFixed(1)}s)`;
    }, 40);

    u.onstart = () => setAvatarSpeaking(true);
    u.onend = () => {
      setTimeout(()=>{                                  /* kuyruk: son hece kayda girsin */
        clearInterval(samplingIntervalId);
        setAvatarSpeaking(false); setMouth("rest");
        try{ if(capRec && capRec.state!=="inactive") capRec.stop(); }catch(e){}
        try{ if(capStream) capStream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
        try{ if(capCtx) capCtx.close(); }catch(e){}
        if(capAnalyser){
          const avgE = ttsTimelineData.reduce((a,b)=>a+b,0)/Math.max(1,ttsTimelineData.length);
          if(avgE < 4){
            finalTtsData = ttsTimelineData = synthFullCurve();
            teacherAudioUrl = null;
            drawStudioGraphs();
            statusField.textContent="⚠️ Mikrofon hocayı duyamadı (kulaklık takılı olabilir) — ritim şablonu kullanıldı. Şimdi cümleyi oku.";
          } else {
            statusField.textContent="✅ Hoca GERÇEK kayıttan çizildi! Şimdi mikrofonu açıp cümleyi oku.";
          }
        } else {
          statusField.textContent="Hoca grafiği (şablon) hazır. Şimdi mikrofonu açıp cümleyi oku.";
        }
        recordBtn.disabled = false;
      }, 260);
    };
    speechSynthesis.speak(u);
  };

  // --- KULLANICI MİKROFON ANALİZİ ---
  recordBtn.onclick = async function() {
    if (!isRecording) {
      recordedChunks = []; userTimelineData = []; finalUserData = []; playheadProgress = -1;
      heardText = ""; playBtn.disabled = true; analyzeGraphsBtn.disabled = true; duetBtn.disabled = true;
      mentorReportPanel.style.display = "none";
      if(liveCanvas) { liveCanvas.width = liveCanvas.clientWidth; liveCanvas.height = liveCanvas.clientHeight; }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser(); analyser.fftSize = 64;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        let liveSource = audioCtx.createMediaStreamSource(mediaStream); liveSource.connect(analyser);

        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          voiceUrl = URL.createObjectURL(new Blob(recordedChunks, { type: 'audio/webm' }));
          playBtn.disabled = false;
          analyzeGraphsBtn.disabled = false;
        };
        mediaRecorder.start();

        const STT = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new STT(); recognition.lang = "en-US"; recognition.interimResults = false;
        recognition.onresult = e => { heardText = e.results[0][0].transcript; };
        recognition.onend = () => { if (isRecording) recordBtn.click(); processComparison(); };
        recognition.start();

        isRecording = true;
        recordBtn.textContent = "■ Bitir ve Grafiği Kaydet";
        recordBtn.classList.add("recording");
        statusField.textContent = "Cümleyi oku, bittiğinde butona tekrar tıkla...";

        let userStartTime = Date.now();
        setAvatarSpeaking(true);
        
        samplingIntervalId = setInterval(() => {
          if (!isRecording) return;
          analyser.getByteFrequencyData(dataArray);
          
          let total = 0;
          for (let i = 0; i < dataArray.length; i++) total += dataArray[i];
          let avg = total / dataArray.length;

          userTimelineData.push(avg);
          finalUserData = userTimelineData;
          drawStudioGraphs();
          
          let dur = (Date.now() - userStartTime) / 1000;
          document.getElementById("userDuration").textContent = `(${dur.toFixed(1)}s)`;

          if(liveCtx) {
            liveCtx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
            liveCtx.fillStyle = "#2563eb";
            let w = liveCanvas.width / dataArray.length;
            for(let i=0; i<dataArray.length; i++) {
              let h = dataArray[i] / 4;
              liveCtx.fillRect(i*w, liveCanvas.height - h, w - 1, h);
            }
          }

          if (avg < 4) setMouth("rest");
          else if (avg < 15) setMouth("closed");
          else if (avg < 35) setMouth("wide");
          else if (avg < 64) setMouth("round");
          else setMouth("open");
        }, 40);

      } catch (e) {
        statusField.textContent = "Mikrofon başlatılamadı.";
        console.error(e);
      }
    } else {
      isRecording = false;
      recordBtn.textContent = "🎙️ Mikrofonu Aç ve Cümleyi Oku";
      recordBtn.classList.remove("recording");
      setAvatarSpeaking(false); setMouth("rest");
      clearInterval(samplingIntervalId);
      if(liveCtx) liveCtx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
      
      if (recognition) { try{ recognition.stop(); }catch(e){} }
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    }
  };

  function processComparison() {
    try{ window.dhBumpDailyTracker && window.dhBumpDailyTracker("speaking"); }catch(e){}
    try{ window.dhLogActivity && window.dhLogActivity("🎙️ Telaffuz stüdyosu: "+TARGET_TEXT.slice(0,40),"speaking"); }catch(e){}
    if (!heardText) {
      scoreDisplay.textContent = "0%";
      diffLine.innerHTML = `<span style="color:#f87171">Ses algılanamadı ama grafikler yüklendi.</span>`;
      return;
    }
    statusField.textContent = `Algılanan Söz: "${heardText}"`;
    const result = diffEN(heardText, TARGET_TEXT);
    scoreDisplay.textContent = result.score + "%";

    diffLine.innerHTML = "";
    result.parts.forEach(p => {
      let span = document.createElement("span");
      span.className = p.type === "ok" ? "wd-ok" : (p.type === "extra" ? "wd-bad" : "wd-missing");
      span.textContent = p.word;
      diffLine.appendChild(span);
    });
  }

  function clearStudioCanvas() {
    studioCanvas.width = studioCanvas.clientWidth;
    studioCanvas.height = studioCanvas.clientHeight;
    studioCtx.clearRect(0, 0, studioCanvas.width, studioCanvas.height);
  }

  function drawStudioGraphs() {
    studioCanvas.width = studioCanvas.clientWidth;
    studioCanvas.height = studioCanvas.clientHeight;
    const W = studioCanvas.width, H = studioCanvas.height;
    studioCtx.clearRect(0, 0, W, H);

    function drawSingleWave(dataPoints, colorHex, isUser) {
      if (!dataPoints.length) return;
      studioCtx.lineWidth = isUser ? 3 : 2.5; 
      studioCtx.strokeStyle = colorHex; studioCtx.lineCap = "round"; studioCtx.lineJoin = "round";
      studioCtx.beginPath();
      
      const stepX = W / Math.max(dataPoints.length - 1, 1);
      
      for (let i = 0; i < dataPoints.length; i++) {
        let val = dataPoints[i];
        let y = H - (val / 100) * (H * 0.82) - 4;
        y = Math.max(2, Math.min(y, H - 2));
        let x = i * stepX;
        if (i === 0) studioCtx.moveTo(x, y); else studioCtx.lineTo(x, y);
      }
      studioCtx.stroke();
      studioCtx.lineTo((dataPoints.length - 1) * stepX, H); studioCtx.lineTo(0, H);
      studioCtx.fillStyle = colorHex + (isUser ? "25" : "12"); studioCtx.fill();
    }

    drawSingleWave(finalTtsData, "#38bdf8", false);
    drawSingleWave(finalUserData, "#4ade80", true);

    if (playheadProgress >= 0 && playheadProgress <= 100) {
      let lineX = (playheadProgress / 100) * W;
      studioCtx.lineWidth = 2; studioCtx.strokeStyle = "#f43f5e"; studioCtx.shadowColor = "#f43f5e"; studioCtx.shadowBlur = 8;
      studioCtx.beginPath(); studioCtx.moveTo(lineX, 0); studioCtx.lineTo(lineX, H); studioCtx.stroke();
      studioCtx.shadowBlur = 0;
    }
  }

  // --- SESSİZLİK BUDAMA VE RAPOR MOTORU ---
  analyzeGraphsBtn.onclick = function() {
    if (!ttsTimelineData.length || !userTimelineData.length) return;

    const SILENCE_THRESHOLD = 8;

    function getTrimBoundsSafe(data) {
      let start = 0; let end = data.length - 1;
      while (start < data.length && data[start] < SILENCE_THRESHOLD) start++;
      while (end > start && data[end] < SILENCE_THRESHOLD) end--;
      if (start >= end) { start = 0; end = data.length - 1; }
      return { start, end };
    }

    cachedTtsBounds = getTrimBoundsSafe(ttsTimelineData);
    cachedUserBounds = getTrimBoundsSafe(userTimelineData);

    finalTtsData = ttsTimelineData.slice(cachedTtsBounds.start, cachedTtsBounds.end + 1);
    finalUserData = userTimelineData.slice(cachedUserBounds.start, cachedUserBounds.end + 1);

    drawStudioGraphs();
    duetBtn.disabled = false; 

    const ttsRealDur = finalTtsData.length * 0.04;
    const userRealDur = finalUserData.length * 0.04;
    const durDiff = Math.abs(ttsRealDur - userRealDur);

    document.getElementById("ttsDuration").textContent = `(${ttsRealDur.toFixed(1)}s Net)`;
    document.getElementById("userDuration").textContent = `(${userRealDur.toFixed(1)}s Net)`;

    const ttsMidStart = Math.floor(finalTtsData.length * 0.25);
    const ttsMidEnd = Math.floor(finalTtsData.length * 0.38);
    let ttsHasPause = false;
    for(let i = ttsMidStart; i < ttsMidEnd; i++) { if (finalTtsData[i] < 8) ttsHasPause = true; }

    const userMidStart = Math.floor(finalUserData.length * 0.25);
    const userMidEnd = Math.floor(finalUserData.length * 0.38);
    let userHasPause = false;
    for(let i = userMidStart; i < userMidEnd; i++) { if (finalUserData[i] < 8) userHasPause = true; }

    let userMax = Math.max(...finalUserData);
    let userMin = Math.min(...finalUserData);
    let userRange = userMax - userMin;

    let reportHtml = "";

    if (durDiff < 0.3) {
      reportHtml += `<div class="report-item">⏱️ <b>Konuşma Hızı:</b> Harika! Hoca ile net hızın tamamen dengeli (Hoca: ${ttsRealDur.toFixed(1)}s, Sen: ${userRealDur.toFixed(1)}s).</div>`;
    } else if (userRealDur > ttsRealDur) {
      reportHtml += `<div class="report-item">⏱️ <b>Konuşma Hızı:</b> Net konuşma süren hoca sesine göre biraz uzun (${userRealDur.toFixed(1)}s vs ${ttsRealDur.toFixed(1)}s). Akıcı bağlamayı dene.</div>`;
    } else {
      reportHtml += `<div class="report-item">⏱️ <b>Konuşma Hızı:</b> Net konuşma süren hoca sesinden kısa (${userRealDur.toFixed(1)}s vs ${ttsRealDur.toFixed(1)}s). Biraz daha tane tane oku.</div>`;
    }

    if (ttsHasPause && !userHasPause) {
      reportHtml += `<div class="report-item">💨 <b>Nefes Kontrolü:</b> Grafiğinde hocanınki gibi belirgin bir vadi (es noktası) yok[cite: 1]. Cümleyi <b>blok halinde tek bir nefeste</b> okumuşsun[cite: 1]. <i>I am not</i> dedikten sonra sesini kesip, <i>responsible</i> kelimesine yeni bir nefesle başla[cite: 1].</div>`;
    } else {
      reportHtml += `<div class="report-item">💨 <b>Nefes Kontrolü:</b> Başarılı! Grafiklerde hoca ile aynı es/duraklama noktasını yakaladın.</div>`;
    }

    if (userRange < 25) {
      reportHtml += `<div class="report-item">🎵 <b>Melodi & Vurgu:</b> Dalgalanma aralığın çok dar. İngilizcenin o melodik yapısı yerine kelimeleri monoton okumuşsun. Özellikle <i>re-<b>SPON</b>-sible</i> hecesine basarken sesini biraz daha patlatıp yükseltmelisin.</div>`;
    } else {
      reportHtml += `<div class="report-item">🎵 <b>Melodi & Vurgu:</b> Çok iyi! Konuşma alanındaki akustik tırmanışların hocanın grafiğindeki akustik tepe noktalarıyla örtüşüyor.</div>`;
    }

    reportContent.innerHTML = reportHtml;
    mentorReportPanel.style.display = "block";
    statusField.textContent = "Grafik hizalama ve telaffuz analizi raporu hazır!";
  };

  // --- PARALEL SES OYNATMA (DÜET MODU) ---
  duetBtn.onclick = function() {
    if (!voiceUrl || !finalUserData.length || !finalTtsData.length) return;
    statusField.textContent = "Düet Oynatılıyor...";
    
    try { speechSynthesis.cancel(); } catch(e){}

    /* hoca gerçek kayıtsa düet iki SES DOSYASINDAN çalar — birebir senkron */
    const teacherAudio = teacherAudioUrl ? new Audio(teacherAudioUrl) : null;
    const ttsAudioUtterance = teacherAudio ? null : (function(){
      const x=new SpeechSynthesisUtterance(TARGET_TEXT); dhApplyVoice(x);
      x.lang="en-US"; x.rate=0.88; return x; })();

    const userAudio = new Audio(voiceUrl);
    const userStartSeconds = cachedUserBounds.start * 0.04;
    
    let totalSamples = Math.max(finalTtsData.length, finalUserData.length);
    let currentSampleIdx = 0;

    ttsAudioUtterance.onstart = () => {
      setAvatarSpeaking(true);
      userAudio.currentTime = userStartSeconds;
      userAudio.play();

      samplingIntervalId = setInterval(() => {
        if (currentSampleIdx >= totalSamples) { clearInterval(samplingIntervalId); return; }
        playheadProgress = (currentSampleIdx / totalSamples) * 100;
        drawStudioGraphs();
        currentSampleIdx++;
      }, 40);
    };

    const stopDuet = () => {
      clearInterval(samplingIntervalId);
      try { speechSynthesis.cancel(); } catch(e){}
      try { userAudio.pause(); } catch(e){}
      setAvatarSpeaking(false); setMouth("rest");
      playheadProgress = -1; drawStudioGraphs();
      statusField.textContent = "Düet oynatımı tamamlandı.";
    };

    userAudio.onended = stopDuet; ttsAudioUtterance.onend = stopDuet;
    if(teacherAudio){ teacherAudio.play(); } else { speechSynthesis.speak(ttsAudioUtterance); }
  };

  // --- SADECE KENDİ SESİNİ DİNLEME AKIŞI ---
  playBtn.onclick = function() {
    if (!voiceUrl || !finalUserData.length) return;
    const audio = new Audio(voiceUrl);
    let totalSamples = finalUserData.length;
    let currentSampleIdx = 0;

    audio.onplay = () => {
      setAvatarSpeaking(true);
      samplingIntervalId = setInterval(() => {
        if (currentSampleIdx >= totalSamples) { clearInterval(samplingIntervalId); return; }
        playheadProgress = (currentSampleIdx / totalSamples) * 100;
        drawStudioGraphs();
        let avg = finalUserData[currentSampleIdx] || 0;
        if (avg < 4) setMouth("rest");
        else if (avg < 15) setMouth("closed");
        else if (avg < 35) setMouth("wide");
        else if (avg < 64) setMouth("round");
        else setMouth("open");
        currentSampleIdx++;
      }, 40);
    };
    audio.onended = () => { clearInterval(samplingIntervalId); setAvatarSpeaking(false); setMouth("rest"); playheadProgress = -1; drawStudioGraphs(); };
    audio.play();
  };
</script>
