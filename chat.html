<!-- CHAT.HTML İÇİN GÜNCELLEMELER -->

<style>
  .gemini-btn { background: linear-gradient(135deg, #1a73e8, #8ab4f8); border:none; color:white; padding:10px 15px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px; width:100%;}
</style>

<!-- Sohbet arayüzünün bir köşesine bu butonu ekle -->
<button class="gemini-btn" onclick="continueInGemini()">Sohbeti Gemini'de Devam Et</button>

<script>
// Sohbeti Gemini'ye Taşıma
function continueInGemini() {
    // Sohbet geçmişini DOM'dan okuyarak birleştir (Chat mesajlarının sınıfına göre ayarla)
    var messages = document.querySelectorAll('.chat-message');
    var historyText = "Aşağıdaki İngilizce sohbet geçmişine göre benimle konuşmaya devam et:\n\n";
    messages.forEach(function(msg) {
        historyText += msg.innerText + "\n";
    });
    
    navigator.clipboard.writeText(historyText);
    alert("Sohbet panoya kopyalandı! Şimdi Gemini sekmesi açılıyor, doğrudan yapıştırıp devam edebilirsin.");
    window.open("https://gemini.google.com", "_blank");
}

// Dinamik Sohbet Konusu Üretici (Sohbeti başlatan fonksiyona entegre et)
function generateDynamicTopic() {
    var topics = ["technology and future", "travel memories", "food and culture", "daily hobbies", "movies and books", "childhood memories"];
    // Her gün sırayla bir konuyu seçmek için LocalStorage kullan
    var topicIndex = parseInt(localStorage.getItem("dh_chat_topic_idx") || "0");
    
    var selectedTopic = topics[topicIndex];
    
    // Endeksi bir artırıp kaydet ki yarın başka konu açılsın
    topicIndex = (topicIndex + 1) % topics.length;
    localStorage.setItem("dh_chat_topic_idx", topicIndex);
    
    return "Let's talk about " + selectedTopic + " today. Can you start the conversation?";
}

// Orijinal sohbet başlatan fonksiyonun ilk prompt kısmını şununla değiştir:
// var initialPrompt = generateDynamicTopic();
</script>
