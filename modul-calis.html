<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modül çalış · Dil Harita</title>
<!-- ══════════════════════════════════════════════════════════════════
     modul-calis.html EMEKLIYE AYRILDI
     ------------------------------------------------------------------
     Kullanici modulleri artik RESMI calisma ekraninda calisiliyor:
     index-app.html. dh-modul-enjekte.js uretilen cumleleri o ekranin
     verisine ekledigi icin modul orada normal bir modul gibi gorunur —
     gorsel, kelime araclari, ogretmen, telaffuz hepsi calisir.

     Iki ayri calisma ekrani tutmak, daha once bugun.html/index.html'de
     yasadigimiz ikilige yol acardi.

     Dosya SILINMEDI: ?m=<modul id> ile gelen eski baglantilar
     modulun adina cevrilip index-app.html'e yonlendirilir.
     ══════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="./dh-tokens.css">
<script src="./dh-modul.js?v=1"></script>
<script>
(function(){
  var hedef = "./index.html";
  try{
    var id = new URLSearchParams(location.search).get("m") || "";
    if (id && window.DHModul){
      var m = DHModul.liste().filter(function(x){ return x.id === id; })[0];
      if (m && m.ad) hedef = "./index-app.html?mod=" + encodeURIComponent(m.ad);
      else hedef = "./modullerim.html";
    } else {
      hedef = "./modullerim.html";
    }
  }catch(e){ hedef = "./modullerim.html"; }
  location.replace(hedef);
})();
</script>
</head>
<body>
<p style="font-family:system-ui;padding:24px">
Çalışma ekranına yönlendiriliyorsun… <a href="./modullerim.html">Modüllerim</a>
</p>
</body>
</html>
