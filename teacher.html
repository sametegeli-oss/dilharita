<title>Öğretmen · Dil Harita</title>
<style>
:root{
  --bg:#0b1120; --bg-soft:#0f172a; --surface:#131c30; --surface-2:#1a2540;
  --border:#ffffff14; --text:#e8eef7; --muted:#93a4bd;
  --accent:#60a5fa; --accent-strong:#3b82f6; --teacher:#34d399;
  --green-strong:#16a34a; --ok:#34d399; --bad:#f87171; --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #14302a 0%, transparent 60%), var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;
  font-family:Nunito,system-ui,-apple-system,sans-serif;
}
.wrap{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-soft);z-index:10}
.keybtn{margin-left:auto;flex:0 0 auto;background:var(--surface,#0f1f3a);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;color:var(--text)}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px;flex-shrink:0;text-decoration:none;display:flex;align-items:center;justify-content:center}
.back:hover{background:var(--surface-2)}
.ava{width:44px;height:44px;border-radius:12px;background:#071226;border:1px solid #34d39999;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 22px #0006}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.teacher-hero{display:flex;align-items:center;justify-content:center;padding:18px 0 14px}
.teacher-photo{width:min(58vw,230px);height:min(58vw,230px);max-width:230px;max-height:230px;border-radius:22px;border:2px solid #34d399aa;background:#050b16;object-fit:contain;box-shadow:0 18px 45px #0008}
@media(max-width:520px){.teacher-hero{padding:14px 0 10px}.teacher-photo{width:170px;height:170px;border-radius:18px}}
.teacher-hero--dual{gap:16px}
.teacher-hero--dual .thero{display:flex;flex-direction:column;align-items:center;gap:7px;margin:0}
.teacher-hero--dual .teacher-photo{width:min(40vw,168px);height:min(40vw,168px)}
.teacher-hero--dual figcaption{font:800 12px Nunito,sans-serif;color:var(--muted);letter-spacing:.02em}
@media(max-width:520px){.teacher-hero--dual .teacher-photo{width:min(42vw,138px);height:min(42vw,138px)}}
.tinfo{flex:1;min-width:0}
.tinfo h1{margin:0;font-family:Fraunces,serif;font-weight:600;font-size:17px}
.tinfo p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.body{flex:1;overflow-y:auto;padding:16px}
.subject{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.subject-en{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:6px}
.subject-tr{font-size:14px;color:var(--muted)}
.subject-play{margin-top:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--accent);border-radius:9px;padding:7px 13px;font:700 12px Nunito,sans-serif;cursor:pointer}
.subject-play:hover{background:var(--accent-strong);color:#fff}
.explain{background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.explain .en{color:var(--green-strong);font-weight:800}
.explain strong{color:var(--text);font-weight:900}
.explain-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.explain-play{background:var(--surface-2);border:1px solid var(--border);color:var(--accent);border-radius:9px;padding:8px 13px;font:800 12px Nunito,sans-serif;cursor:pointer}
.dh-reading{background:rgba(250,204,21,.28);border-radius:5px;box-shadow:0 0 0 2px rgba(250,204,21,.28);transition:background .15s}
.manual-entry{display:flex;gap:8px;margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto}
.manual-entry input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font:600 15px Nunito,sans-serif}
.manual-entry button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:800 14px Nunito,sans-serif;cursor:pointer;white-space:nowrap}
.followup{margin-top:14px;display:flex;gap:8px}
.followup input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px 13px;font:600 14px Nunito,sans-serif}
.followup input:focus{outline:none;border-color:var(--teacher)}
.followup button{background:var(--green-strong);color:#fff;border:none;border-radius:11px;padding:0 16px;font:800 14px Nunito,sans-serif;cursor:pointer}
.qa-q{margin-top:14px;font-weight:800;color:var(--accent);font-size:14px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
.spinner{width:22px;height:22px;border:3px solid var(--surface-2);border-top-color:var(--teacher);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.regen{margin-top:10px;width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px;font:800 14px Nunito,sans-serif;cursor:pointer}
.regen:hover{background:#22304f}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;text-align:center;color:var(--muted)}
.state h2{font-family:Fraunces,serif;color:var(--text);font-weight:600;margin:0;font-size:22px}
.state p{margin:0;font-size:14px;line-height:1.6;max-width:380px}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:12px;padding:13px 22px;font:800 15px Nunito,sans-serif;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--green-strong);color:#fff;border-color:transparent}
.sheet-overlay{position:fixed;inset:0;z-index:1000;background:#000000a6;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:560px){.sheet-overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:0 0 6px}
.sheet p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 12px}
.sheet textarea{width:100%;min-height:240px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font:500 13px ui-monospace,monospace;line-height:1.6;resize:vertical}
.sheet input{width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font:600 14px monospace;margin-bottom:12px}
.quiz{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px}
.quiz-h{font-weight:900;color:var(--teacher);font-size:14px;margin-bottom:6px}
.quiz-q{font-size:15px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:12px 13px;font:700 14px Nunito,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.quiz-opt:hover:not(:disabled){border-color:var(--teacher)}
.quiz-opt:disabled{cursor:default}
.quiz-opt .ltr{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#0b1120;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:900}
.quiz-opt .otx{flex:1;min-width:0}
.quiz-opt.correct{border-color:var(--ok);background:#34d39922}
.quiz-opt.correct .ltr{background:var(--ok);color:#06281c;border-color:transparent}
.quiz-opt.wrong{border-color:var(--bad);background:#f8717122}
.quiz-opt.wrong .ltr{background:var(--bad);color:#3c0d0d;border-color:transparent}
.quiz-exp{margin-top:12px;font-size:14px;line-height:1.65;color:var(--muted);border-top:1px dashed var(--border);padding-top:11px;display:none}
.quiz-exp.show{display:block}
.quiz-verdict{font-weight:900;margin-bottom:4px}
.quiz-verdict.ok{color:var(--ok)}
.quiz-verdict.bad{color:var(--bad)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.note{font-size:13px;min-height:16px;margin:4px 0 8px}.note.bad{color:var(--bad)}.note.ok{color:var(--ok)}

/* Çıktı Alanı Stilleri */
.azar-result-area{margin-top:16px;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:16px}
.clickable-item{cursor:pointer;transition:all .2s ease;border:1px solid transparent;}
.clickable-item:hover{border-color:#60a5fa!important;background:#263554!important;transform:translateY(-2px);}
</style>

<body>
<div class="wrap" id="root"></div>
<script>
(function(){
"use strict";

/* Bu sayfanın anlatım dili Türkçedir; İngilizce olanlar [[ ]] ile işaretli gelir.
   Dil kanıtsız kalırsa seslendirme motoru Türkçeye düşsün (yanlışlıkla İngilizce
   sayılan Türkçe cümleler hem İngilizce sesle okunuyor hem mouth-th kullanıyordu). */
window.DH_DEFAULT_LANG = "tr-TR";

const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODEL = "llama-3.3-70b-versatile";
const KEYS_LS = "groqApiKeys";
function getKeys(){ try{ return (JSON.parse(localStorage.getItem(KEYS_LS)||"[]")||[]).filter(Boolean); }catch{ return []; } }

const PROVIDER_META = {
  groq:     { store:"groqApiKeys",     label:"Groq",     prefix:"gsk_", url:"https://console.groq.com/keys",        note:"En hızlısı, ücretsiz." },
  cerebras: { store:"cerebrasApiKeys", label:"Cerebras", prefix:"csk-", url:"https://cloud.cerebras.ai",            note:"Yüksek hacim, ücretsiz." },
  gemini:   { store:"geminiApiKeys",   label:"Gemini",   prefix:"AIza", url:"https://aistudio.google.com/apikey",  note:"En cömert (Google), ücretsiz." }
};
function getKeysFor(store){ try{ return (JSON.parse(localStorage.getItem(store)||"[]")||[]).filter(Boolean); }catch{ return []; } }
function saveKeyFor(store,k){ const ks=getKeysFor(store); if(!ks.includes(k)) ks.push(k); try{ localStorage.setItem(store, JSON.stringify(ks)); }catch{} }
function removeKeyFor(store,k){ const ks=getKeysFor(store).filter(x=>x!==k); try{ localStorage.setItem(store, JSON.stringify(ks)); }catch{} }

/* OKUMA SESLERİ: Türkçe anlatım ve İngilizce cümle için ayrı ses seçimi.
   Tercih zaten var olan "dh-tts-voice-v1" (DH_TTS) deposuna yazılır; yeni anahtar açılmadı. */
function openVoiceSheet(){
  if(document.querySelector(".sheet-overlay.dh-voicesheet")) return;
  const sheet = document.createElement("div");
  sheet.className = "sheet-overlay dh-voicesheet";
  sheet.innerHTML = `
    <div class="sheet">
      <h3>Okuma sesleri</h3>
      <p>Türkçe anlatım ile İngilizce cümle farklı seslerle okunabilir. Seçim yalnızca bu cihazda saklanır; telefon ve bilgisayarın ses listeleri farklıdır.</p>
      <label class="note" style="display:block;font-weight:800">🇹🇷 Türkçe anlatım sesi</label>
      <div class="row2" style="margin-bottom:10px">
        <select id="vsTr" style="flex:1;min-width:0;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font:600 13px Nunito,sans-serif"></select>
        <button class="btn" id="vsTrTest" style="flex:0 0 auto;padding:11px 14px">▶</button>
      </div>
      <label class="note" style="display:block;font-weight:800">🇬🇧 İngilizce cümle sesi</label>
      <div class="row2" style="margin-bottom:10px">
        <select id="vsEn" style="flex:1;min-width:0;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font:600 13px Nunito,sans-serif"></select>
        <button class="btn" id="vsEnTest" style="flex:0 0 auto;padding:11px 14px">▶</button>
      </div>
      <div class="note" id="vsNote"></div>
      <div class="row2"><button class="btn btn-primary" id="vsClose">Tamam</button></div>
    </div>`;
  document.body.appendChild(sheet);
  const q = id => sheet.querySelector("#"+id);

  function listFor(lang){
    refreshVoices();
    const all = _voiceCache || [];
    const re = /^tr/i.test(lang) ? /^tr/i : /^en/i;
    const hit = all.filter(v => re.test(v.lang||""));
    return hit.length ? hit : all;      /* o dilde ses yoksa tümünü göster */
  }
  function fill(selId, lang, cfgKey){
    const el = q(selId), cur = ttsCfg()[cfgKey] || "";
    const list = listFor(lang);
    el.innerHTML = '<option value="">— Sistem varsayılanı —</option>'
      + list.map(v => `<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)} (${esc(v.lang||"")})</option>`).join("");
    el.value = list.some(v => (v.voiceURI||v.name)===cur) ? cur : "";
    el.onchange = function(){
      const patch = {}; patch[cfgKey] = this.value;
      if(window.DH_TTS && DH_TTS.set) DH_TTS.set(patch);
      else { const c = ttsCfg(); c[cfgKey] = this.value; try{ localStorage.setItem("dh-tts-voice-v1", JSON.stringify(c)); }catch(e){} }
      q("vsNote").textContent = "Kaydedildi.";
      q("vsNote").className = "note ok";
    };
  }
  function paint(){ fill("vsTr","tr-TR","trVoice"); fill("vsEn","en-US","enVoice"); }
  paint();
  /* onvoiceschanged'i EZME: sayfanin kendi refreshVoices baglantisi orada duruyor. */
  const onVoices = function(){ refreshVoices(); paint(); };
  try{ speechSynthesis.addEventListener("voiceschanged", onVoices); }catch(e){}
  if(!(_voiceCache||[]).length) q("vsNote").textContent = "Ses listesi yükleniyor… (mobilde birkaç saniye sürebilir)";

  q("vsTrTest").onclick = () => speak(State.tr || "Bu cümlenin Türkçe anlatımı böyle okunur.", "tr-TR");
  q("vsEnTest").onclick = () => speak(State.en || "This is how the English sentence is read.", "en-US");
  const close = () => {
    try{ speechSynthesis.removeEventListener("voiceschanged", onVoices); }catch(e){}
    sheet.remove(); try{ speechSynthesis.cancel(); }catch(e){}
  };
  q("vsClose").onclick = close;
  sheet.onclick = e => { if(e.target===sheet) close(); };
}

/* API ANAHTAR PANELİ.
   Bu fonksiyon 🔑 düğmesinden, anahtarsız açılıştan ve hata dalından çağrılıyordu
   ama HİÇBİR YERDE TANIMLI DEĞİLDİ → düğmeye basınca ReferenceError, panel açılmıyordu.
   PROVIDER_META/getKeysFor/saveKeyFor/removeKeyFor zaten burada duruyordu, panel onları kullanır. */
function openKeySheet(invalid){
  if(document.querySelector(".sheet-overlay.dh-keysheet")) return;
  const hadKey = !!((window.DHProviders && DHProviders.hasAnyKey && DHProviders.hasAnyKey()) || getKeys().length);
  const ids = Object.keys(PROVIDER_META);
  const sheet = document.createElement("div");
  sheet.className = "sheet-overlay dh-keysheet";
  sheet.innerHTML = `
    <div class="sheet">
      <h3>API anahtarları</h3>
      <p>Anahtarlar yalnızca bu cihazda saklanır. Bir sağlayıcı seç, anahtarı yapıştır. Birden çok anahtar eklenebilir; biri limite girerse diğerine geçilir.</p>
      <select id="keyProv" style="width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font:700 14px Nunito,sans-serif;margin-bottom:10px">
        ${ids.map(id=>`<option value="${id}">${esc(PROVIDER_META[id].label)} — ${esc(PROVIDER_META[id].note)}</option>`).join("")}
      </select>
      <input id="keyInput" type="text" placeholder="${esc(PROVIDER_META[ids[0]].prefix)}..." autocomplete="off" spellcheck="false" />
      <div class="note ${invalid?"bad":""}" id="keyNote">${invalid?"Önceki anahtar geçersizdi, yenisini gir.":""}</div>
      <div class="row2"><button class="btn btn-primary" id="keySave">Kaydet</button><button class="btn" id="keyClose">Kapat</button></div>
      <a id="keyGetLink" href="${PROVIDER_META[ids[0]].url}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-size:13px;color:var(--teacher)">Ücretsiz anahtar al →</a>
      <div id="keyList" style="margin-top:14px"></div>
    </div>`;
  document.body.appendChild(sheet);

  const $$ = id => sheet.querySelector("#"+id);
  const note = (msg, cls) => { const n=$$("keyNote"); n.textContent=msg||""; n.className="note "+(cls||""); };

  function renderList(){
    $$("keyList").innerHTML = ids.map(id=>{
      const ks = getKeysFor(PROVIDER_META[id].store);
      if(!ks.length) return "";
      return `<div style="margin-bottom:10px">
        <div style="font-weight:800;font-size:13px;margin-bottom:5px">${esc(PROVIDER_META[id].label)} (${ks.length})</div>
        ${ks.map(k=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
            <code style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)">${esc(k.slice(0,10))}…${esc(k.slice(-4))}</code>
            <button class="btn dh-keydel" data-store="${PROVIDER_META[id].store}" data-key="${esc(k)}" style="padding:6px 10px;font-size:12px">Sil</button>
          </div>`).join("")}
      </div>`;
    }).join("") || `<div class="note">Kayıtlı anahtar yok.</div>`;
    sheet.querySelectorAll(".dh-keydel").forEach(b=>{
      b.onclick = () => { removeKeyFor(b.getAttribute("data-store"), b.getAttribute("data-key")); renderList(); };
    });
  }
  renderList();

  $$("keyProv").onchange = function(){
    const p = PROVIDER_META[this.value];
    $$("keyInput").placeholder = p.prefix + "...";
    $$("keyGetLink").href = p.url;
  };

  function close(){
    sheet.remove();
    const hasKey = !!((window.DHProviders && DHProviders.hasAnyKey && DHProviders.hasAnyKey()) || getKeys().length);
    if(!hadKey && hasKey && State.en) explain();
  }
  $$("keyClose").onclick = close;
  sheet.onclick = e => { if(e.target===sheet) close(); };

  $$("keySave").onclick = function(){
    const id = $$("keyProv").value, p = PROVIDER_META[id];
    const k = ($$("keyInput").value||"").trim();
    if(!k){ note("Anahtar boş.","bad"); return; }
    if(!k.startsWith(p.prefix)){ note(p.label+" anahtarı '"+p.prefix+"' ile başlamalı.","bad"); return; }
    saveKeyFor(p.store, k);
    $$("keyInput").value = "";
    note(p.label+" anahtarı kaydedildi.","ok");
    renderList();
  };
  $$("keyInput").onkeydown = e => { if(e.key==="Enter") $$("keySave").onclick(); };
  $$("keyInput").focus();
}
let _ki=0;
let _keyBan={};        

function nextUsableKey(keys){
  const now=Date.now();
  Object.keys(_keyBan).forEach(k=>{ if(_keyBan[k]<now) delete _keyBan[k]; });
  for(let e=0;e<keys.length;e++){
    const idx=(_ki+e)%keys.length;
    if(!_keyBan[idx]){ _ki=idx; return {idx, key:keys[idx]}; }
  }
  const soonest=Object.entries(_keyBan).sort((a,b)=>a[1]-b[1])[0];
  return { idx:-1, key:null, waitMs: soonest ? Math.max(0, soonest[1]-now) : 0 };
}

async function groqChat(messages){
  if(window.DHProviders && DHProviders.hasAnyKey && DHProviders.hasAnyKey()){
    try{ return await DHProviders.chat(messages, {temperature:0.3, max_tokens:2500}); }
    catch(e){ throw (e&&e.code?e:{code:"network"}); }
  }
  const keys=getKeys();
  if(!keys.length) throw {code:"no-key"};
  let last=null;
  for(let attempt=0; attempt<keys.length; attempt++){
    const pick=nextUsableKey(keys);
    if(pick.idx===-1){ throw { code:"rate", tried:keys.length, waitMs:pick.waitMs }; }
    try{
      const res=await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+pick.key},body:JSON.stringify({model:GROQ_MODEL,messages,temperature:0.3,max_tokens:2500})});
      if(res.status===401){ last={code:"bad-key"}; _keyBan[pick.idx]=Date.now()+5*60*1000; continue; }
      if(res.status===429){ last={code:"rate", tried:keys.length}; _keyBan[pick.idx]=Date.now()+60*1000; continue; }
      if(!res.ok){ last={code:"http"}; _keyBan[pick.idx]=Date.now()+10*1000; continue; }
      const data=await res.json();
      return data.choices?.[0]?.message?.content?.trim()||"";
    }catch(e){ last={code:"network"}; }
  }
  throw last||{code:"unknown"};
}

/* Tek bir dili suren yuz (TR ve EN icin ayri kurulur). Bu sayfanin KENDI agiz
   motoru; img'lere data-dh-selfdrive="1" konur, boylece tts-avatar-long-sync-fix.js
   bu kareleri ezmez (Turkcede mouth-th kaymasi olmaz). */
class AvatarFace{
  constructor(imgIds, dir, isTr){
    this.imgs = imgIds.map(id=>document.getElementById(id)).filter(Boolean);
    this.dir = dir; this.isTr = !!isTr; this.frames = {};
    for(const [k,v] of Object.entries(FRAME_FILES)) this.frames[k]=dir+v;
    this.blinkTimer=null; this.talkTimer=null; this.endTimer=null;
    this.seq=[]; this.idx=0; this.speaking=false;
    this.imgs.forEach(im=>{ try{ im.dataset.dhSelfdrive="1"; }catch(e){} });
    this.preload(); this.show(this.frames.idle); this.scheduleBlink(1200);
  }
  preload(){ Object.values(this.frames).forEach(src=>{ const im=new Image(); im.src=src; }); }
  show(src){
    if(this.isTr && /mouth-th\.webp/i.test(String(src||""))){
      const um=trVisemeMap();
      const secildi=Object.keys(um).some(k=>um[k]==="mouth-th");
      if(!secildi) src=String(src).replace(/mouth-th\.webp/i,"mouth-i.webp");
    }
    this.imgs.forEach(img=>{ img.src=src; });
  }
  scheduleBlink(delay){
    clearTimeout(this.blinkTimer);
    this.blinkTimer=setTimeout(()=>this.blink(), delay || (2400 + Math.random()*2200));
  }
  blink(){
    if(this.speaking){ this.scheduleBlink(1400); return; }
    this.show(this.frames.blink);
    setTimeout(()=>{ if(!this.speaking) this.show(this.frames.idle); this.scheduleBlink(); }, 330);
  }
  frameForChar(ch,next){
    const isTr=this.isTr;
    ch=(ch||"").toLocaleLowerCase(isTr?"tr-TR":"en-US"); next=(next||"").toLowerCase();
    if(isTr){
      const um=trVisemeMap(), f=um[ch];
      if(f) return this.dir+f+".webp";
    }
    if(ch==="t" && next==="h") return isTr ? this.frames.i : this.frames.th;
    if(isTr && /[tdszscj]/.test(ch)) return this.frames.i;
    if(isTr && /[şç]/.test(ch)) return this.frames.i;
    if(/[oö0]/.test(ch)) return this.frames.o;
    if(/[uüwq]/.test(ch)) return this.frames.u;
    if(/[a]/.test(ch)) return this.frames.a;
    if(/[e]/.test(ch)) return this.frames.e;
    if(/[iıy]/.test(ch)) return this.frames.i;
    if(/[mnbp]/.test(ch)) return this.frames.mbp;
    if(/[fv]/.test(ch)) return this.frames.fv;
    if(/[l]/.test(ch)) return this.frames.l;
    if(/[.,!?;:\s]/.test(ch)) return this.frames.idle;
    return this.frames.i;
  }
  buildSeq(text){
    const s=String(text||""); const seq=[]; const isTr=this.isTr;
    for(let i=0;i<s.length;i++){
      const ch=s[i], next=s[i+1]||"";
      seq.push(this.frameForChar(ch,next));
      if(!isTr && ch.toLowerCase()==="t" && next.toLowerCase()==="h") i++;
    }
    return seq.filter(Boolean);
  }
  speak(text,duration){
    clearInterval(this.talkTimer); clearTimeout(this.endTimer);
    this.speaking=true; this.seq=this.buildSeq(text);
    if(!this.seq.length) this.seq=[this.frames.i,this.frames.e,this.frames.a,this.frames.o,this.frames.u,this.frames.mbp,this.frames.idle];
    this.idx=0;
    this.talkTimer=setInterval(()=>{ this.show(this.seq[this.idx % this.seq.length]); this.idx++; },105);
    this.endTimer=setTimeout(()=>this.stop(), Math.max(900,duration||1800));
  }
  rest(){
    clearInterval(this.talkTimer); clearTimeout(this.endTimer);
    if(this.speaking){ this.speaking=false; this.show(this.frames.idle); }
    this.scheduleBlink(1200);
  }
  stop(){
    clearInterval(this.talkTimer); clearTimeout(this.endTimer);
    this.speaking=false; this.show(this.frames.listen);
    setTimeout(()=>{ if(!this.speaking) this.show(this.frames.idle); },260);
    this.scheduleBlink(1200);
  }
}

function refreshVoices(){ try{ _voiceCache = speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; }catch{ _voiceCache=[]; } }

function ttsCfg(){
  try{
    if(window.DH_TTS && DH_TTS.get) return DH_TTS.get();
    return JSON.parse(localStorage.getItem("dh-tts-voice-v1")||"null") || {};

/* Bu sayfada seçilen ses, DH_TTS.pickVoice'tan ÖNCE gelir: pickVoice İngilizce için
   önce "dh-voice:__global__" (ses-secim.html) ayarına bakıyor, o yüzden buradan
   seçilen İngilizce ses aksi halde yok sayılırdı. */
function savedVoiceFor(lang){
  try{
    const c = ttsCfg();
    const want = /^tr/i.test(lang||"") ? c.trVoice : c.enVoice;
    if(!want) return null;
    refreshVoices();
    return (_voiceCache||[]).find(v => v.voiceURI===want || v.name===want) || null;
  }catch(e){ return null; }
}
function pickVoiceForLang(lang){
  const own = savedVoiceFor(lang); if(own) return own;
  if(window.DH_TTS && DH_TTS.pickVoice){ var v=DH_TTS.pickVoice(lang); if(v) return v; }
  refreshVoices(); const voices = _voiceCache || [];
  const wantTr = /^tr/i.test(lang || "");
  if(wantTr) return voices.find(v=>/^tr/i.test(v.lang||"")) || null;
  return voices.find(v=>/^en/i.test(v.lang||"")) || null;
}
function speak(text, lang){
  try{
    text=String(text||"").trim(); if(!text) return; lang = lang || "tr-TR";
    var spoken = (window.DH_TTS&&DH_TTS.clean) ? DH_TTS.clean(text) : text;
    if(!spoken) return;
    const u=new SpeechSynthesisUtterance(spoken); const voice=pickVoiceForLang(lang);
    if(voice) u.voice=voice; u.lang = voice ? voice.lang : lang;
    if(window.DH_TTS&&DH_TTS.apply) DH_TTS.apply(u, /^tr/i.test(lang)?"tr-TR":"en-US");
    else { u.rate = /^tr/i.test(lang) ? 0.92 : 0.95; u.pitch = 0.86; }
    speechSynthesis.cancel();
    if(TeacherAvatar) TeacherAvatar.speakText(spoken, estimateSpeechDuration(spoken), /^tr/i.test(lang));
    u.onend=()=>{ if(TeacherAvatar) TeacherAvatar.stop(); };
    u.onerror=()=>{ if(TeacherAvatar) TeacherAvatar.stop(); };
    u.__longTTSAvatarSync = true;
    speechSynthesis.speak(u);
  }catch{ if(TeacherAvatar) TeacherAvatar.stop(); }
}
function speakEnglish(text){ speak(text, "en-US"); }
function speakTurkish(text){ speak(text, "tr-TR"); }

function speakFromScreen(boxEl){
  if(!boxEl) return false;
  try{
    if(window.speechSynthesis){
      if(speechSynthesis.paused && speechSynthesis.speaking){
        window.__dhUserPaused = false; speechSynthesis.resume(); return false;
      }
      if(speechSynthesis.speaking){
        window.__dhUserPaused = true; speechSynthesis.pause(); return false;
      }
    }
  }catch(e){}
  window.__dhUserPaused = false; var segs=[];
  (function walk(node){
    var kids=Array.prototype.slice.call(node.childNodes);
    kids.forEach(function(ch){
      if(ch.nodeType===3){
        var t=ch.textContent;
        if(t && t.trim()){
          var sp=document.createElement("span"); sp.className="dh-seg"; sp.textContent=t;
          if(ch.parentNode){ ch.parentNode.replaceChild(sp, ch); }
          segs.push({text:t, lang:"tr-TR", el:sp});
        }
      } else if(ch.nodeType===1){
        if(ch.classList && ch.classList.contains("en")){
          var et=ch.textContent; if(et && et.trim()) segs.push({text:et, lang:"en-US", el:ch});
        } else { walk(ch); }
      }
    });
  })(boxEl);
  if(segs.length && window.DH_speakSegments){ window.DH_speakSegments(segs); return true; }
  if(window.DH_speakMixed){ window.DH_speakMixed(boxEl.textContent||""); return true; }
  speakTurkish(boxEl.textContent||""); return true;
}

/* SESLENDİRMEDE DURAKLAT / DEVAM.
   Duraklatma mantığı zaten vardı ama görünür düğmesi yoktu: speakFromScreen
   ikinci tıklamada gizlice duraklatıyordu ve tts-avatar-long-sync-fix.js
   watchdog'u window.__dhUserPaused bayrağını okuyor. Düğme aynı bayrağı kullanır,
   yoksa watchdog duraklatmayı "takılma" sanıp resume ederdi. */
let _pauseBtn=null, _pauseTimer=null, _idlePolls=0;
function ttsState(){
  try{ return { active: !!(speechSynthesis.speaking||speechSynthesis.pending), paused: !!speechSynthesis.paused }; }
  catch(e){ return { active:false, paused:false }; }
}
function ensurePauseBtn(){
  if(_pauseBtn) return _pauseBtn;
  const b=document.createElement("button");
  b.id="dhTtsPauseBtn"; b.type="button";
  b.style.cssText="position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;display:none;"
    +"background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;"
    +"padding:11px 16px;font:800 14px Nunito,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45)";
  b.onclick=function(){
    const st=ttsState();
    try{
      if(st.paused || window.__dhUserPaused){ window.__dhUserPaused=false; speechSynthesis.resume(); }
      else { window.__dhUserPaused=true; speechSynthesis.pause(); }
    }catch(e){}
    syncPauseBtn();
  };
  document.body.appendChild(b); _pauseBtn=b; return b;
}
function syncPauseBtn(){
  const b=ensurePauseBtn(), st=ttsState();
  /* Sıradaki cümleye geçerken motor kısa süre "konuşmuyor" görünüyor;
     tek ölçümle gizlersek düğme yanıp söner. İki ölçüm bekle. */
  if(!st.active){
    if(++_idlePolls < 2) return;
    if(window.__dhUserPaused) window.__dhUserPaused=false;
    b.style.display="none"; return;
  }
  _idlePolls=0;
  b.style.display="block";
  b.textContent = (st.paused || window.__dhUserPaused) ? "▶ Devam" : "⏸ Duraklat";
}
function startPauseWatch(){ if(_pauseTimer) return; _pauseTimer=setInterval(syncPauseBtn,400); }

function parseQuiz(text){
  try{
    var src=String(text||"");
    var mHead=/(?:^|\n)[^\S\n]*(?:#{1,4}[^\S\n]*)?(?:\*\*)?[^\S\n]*(?:9[.)][^\S\n]*)?M[İI]N[İI][^\S\n]+TEST[^\n]*\n/i.exec(src);
    if(!mHead) return null;
    var head=mHead.index + mHead[0].length;
    var body=src.slice(head);
    var before=src.slice(0, mHead.index);

    var optRe=/(?:^|\n)[^\S\n]*(?:\*\*)?[^\S\n]*([A-D])[).\-:][^\S\n]*(?:\*\*)?[^\S\n]*([^\n]+)/g;
    var opts=[], seen={}, m;
    while((m=optRe.exec(body))){
      var L=m[1].toUpperCase(); if(seen[L]) continue;
      var t=m[2].replace(/\*\*/g,"").trim(); if(!t) continue;
      seen[L]=1; opts.push({letter:L, text:t, at:m.index});
    }
    if(opts.length!==4) return null;

    var q=body.slice(0, opts[0].at).replace(/\*\*/g,"").trim();
    if(!q) return null;

    var tail=body.slice(opts[3].at + 1);
    var mAns=/Cevap[^A-D]{0,20}?(?:\*\*)?\s*\(?([A-D])\)?(?![a-zA-ZçğıöşüÇĞİÖŞÜ])/i.exec(tail);
    if(!mAns) mAns=/(?:^|\n)[^\n]*Cevap[^\n]*?\(?([A-D])\)?[^\S\n]*(?:şıkkı|şık|seçeneği|seçenek)/i.exec(tail);
    if(!mAns) return null;
    var ans=mAns[1].toUpperCase();
    if(!seen[ans]) return null;

    var exp=tail.slice(mAns.index + mAns[0].length).replace(/\*\*/g,"");
    var ansTxt=(opts.filter(function(o){return o.letter===ans;})[0]||{}).text||"";
    exp=exp.replace(/^[\s:—\-–.)]*/,"");
    if(ansTxt && exp.indexOf(ansTxt)===0) exp=exp.slice(ansTxt.length);
    exp=exp.replace(/^[\s:—\-–.)]*/,"").trim();

    return { before:before, question:q, options:opts, answer:ans, explain:exp };
  }catch(e){ return null; }
}

    { name: "past_perfect_passive", regex: /\bhad\s+been\s+(\w+ed|done|seen|taken|given|written|broken|chosen|driven|eaten|spoken|built|made|held|left|sent|paid|sold|spent|found|moved|postponed|delayed)\b/i, weight: 90 },
    { name: "present_perfect_passive", regex: /\b(has|have)\s+been\s+(\w+ed|done|seen|taken|given|written|broken|chosen|driven|eaten|spoken|built|made|held|left|sent|paid|sold|spent|found)\b/i, weight: 80 },

    { name: "cond_type3", regex: /\bif\b.*\bhad\b.*\b(would|could|should|might)\s+have\b/i, weight: 90 },
    { name: "cond_type2", regex: /\bif\b.*\b(were|did|\w+ed)\b.*\b(would|could)\b/i, weight: 70 },
    { name: "past_perfect", regex: /\bhad\s+(?:already|never|just)?\s*(\w+ed|done|seen|taken|given|written|broken|chosen|driven|eaten|spoken|built|made|held|left|sent|paid|sold|spent|found)\b/i, weight: 50 }
  ];

  var activePatterns = [];

  var stopWords = new Set([
    "the", "a", "an", "is", "are", "was", "were", "be", "been", "being",
    "in", "on", "at", "to", "it", "and", "or", "of", "for", "with", "that", "this", "by", "as",
    "do", "does", "did", "have", "has", "had", "you", "your", "yours", "my", "me", "he", "his", "him",
    "she", "her", "we", "our", "us", "they", "them", "their", "there", "here", "what", "where", "when",
    "why", "how", "said", "told", "asked", "if", "would", "could", "should"
  ]);

  var words = currentClean.split(" ");
  var meaningfulWords = words.filter(function(w) { return w.length > 2 && !stopWords.has(w); });

  fetch('./data/excelveri.json')
    .then(function(res) {
      if (!res.ok) throw new Error("data/excelveri.json dosyasına ulaşılamadı.");
      return res.json();
    })
    .then(function(data) {
      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = "<div style='padding:15px; background:#450a0a; color:#fca5a5; border-radius:8px;'>❌ excelveri.json dosyasında veri bulunamadı.</div>";
        return;
      }

      var scoredData = data.map(function(item) {
        var en = item.ingilizce || "";
        var tr = item.türkçe || "";
        var candidateClean = normalizeText(en);
        var score = 0;

        if (!candidateClean || candidateClean === currentClean) {
          return { item: item, score: -1 };
        }

        var matchedTags = [];
        activePatterns.forEach(function(p) {
          if (p.regex.test(candidateClean)) {
            score += p.weight;
            matchedTags.push(p.name);
          }
        });

        var candidateWordSet = new Set(candidateClean.split(" "));
        var wordMatchCount = 0;
        meaningfulWords.forEach(function(w) {
          if (candidateWordSet.has(w)) wordMatchCount++;
        });

        if (activePatterns.length > 0) {
          if (matchedTags.length > 0) {
            score += (wordMatchCount * 4);
          }
        } else {
          score += (wordMatchCount * 8);
        }

        return { item: item, score: score, matchedTags: matchedTags };
      });

      scoredData.sort(function(a, b) { return b.score - a.score; });

      // Eşik: özel bir gramer kalıbı yakalandıysa yüksek (kesin eşleşme), yoksa
      // düşük tut ki basit/kısa cümlelerde de kelime benzerliğine göre sonuç gelsin.
      var threshold = activePatterns.length > 0 ? 50 : 8;
      var matches = scoredData
        .filter(function(m) { return m.score >= threshold; })
        .slice(0, 25)
        .map(function(m) { return m.item; });

      // Yine de boşsa: skoru pozitif olan en iyi 15 cümleyi göster (asla tamamen boş kalmasın)
      if (matches.length === 0) {
        matches = scoredData
          .filter(function(m) { return m.score > 0; })
          .slice(0, 15)
          .map(function(m) { return m.item; });
      }

      if (matches.length === 0) {
        container.innerHTML = "<div style='padding:15px; background:#1e293b; color:#93a4bd; border-radius:8px; margin-top:15px;'>⚠️ Bu cümleyle ortak kelime/yapı taşıyan bir cümle Excel veritabanında bulunamadı. Farklı bir cümle deneyin.</div>";
        return;
      }

      var html = "<div style='background:#0f172a; border:1px solid #14b8a6; border-radius:12px; padding:18px; margin-top:15px; color:#e2e8f0;'>";
      html += "<div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #1e293b; padding-bottom:8px;'>";
      html += "<h3 style='margin:0; color:#14b8a6; font-size:16px;'>🎲 Excel'deki Benzer Cümleler (" + matches.length + " Adet Bulundu)</h3>";
      html += "<span style='font-size:11px; background:#1e293b; color:#34d399; padding:3px 8px; border-radius:6px;'>Tıkla ve Öğretmene Çalıştır</span>";
      html += "</div>";

      html += "<div style='max-height: 450px; overflow-y: auto; padding-right: 5px;'>";

      matches.forEach(function(item, idx) {
        var safeEn = esc(item.ingilizce || "");
        var safeTr = esc(item.türkçe || "");

        html += `<div class='clickable-item' onclick="selectSentence('${safeEn.replace(/'/g, "\\'")}', '${safeTr.replace(/'/g, "\\'")}')" style='background:#1e293b; border-radius:8px; padding:12px; margin-bottom:12px; border-left:3px solid #14b8a6;'>`;
        html += "<div style='display:flex; justify-content:space-between; font-weight:bold; color:#34d399; margin-bottom:6px; font-size:12px;'>";
        html += "<span>#" + (idx + 1) + " — Excel Gramer Eşleşmesi</span>";
        html += "<span style='color:#60a5fa;'>👉 Öğretmene Anlattır</span>";
        html += "</div>";
        html += "<div style='font-weight:700; color:#e8eef7; font-size:15px; margin-bottom:4px;'>" + safeEn + "</div>";
        if(safeTr) html += "<div style='color:#93a4bd; font-size:13px;'>" + safeTr + "</div>";
        html += "</div>";
      });

      html += "</div></div>";
      container.innerHTML = html;
    })
    .catch(function(err) {
      container.innerHTML = "<div style='padding:15px; background:#450a0a; color:#fca5a5; border-radius:8px;'>❌ Hata: " + err.message + "</div>";
    });
}

// 📖 ÇEVİRİ KILAVUZU (translation_guide.json) ÇAĞIRMA FONKSİYONU
function runTranslationGuideSearch(queryText) {
  var rawSentence = (queryText || State.en || "").trim().toLowerCase();
  var container = document.getElementById("azar-result-container");
  if (!container) return;

  container.innerHTML = "<div style='padding:15px; text-align:center; color:#34d399;'>📖 Çeviri kılavuzundaki tüm eşleşmeler taranıyor...</div>";

  var stopWords = new Set(["the", "a", "an", "is", "are", "was", "were", "in", "on", "at", "to", "it", "and", "or", "of", "for", "with", "that", "this", "by", "as", "be"]);
  var words = rawSentence.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").split(/\s+/);
  var meaningfulWords = words.filter(function(w) {
    return w.length > 2 && !stopWords.has(w);
  });

  if (meaningfulWords.length === 0 && rawSentence.length > 2) {
    meaningfulWords = [rawSentence.slice(0, 5)];
  }

  fetch('./translation_guide.json')
    .then(function(res) {
      if (!res.ok) throw new Error("translation_guide.json dosyasına ulaşılamadı.");
      return res.json();
    })
    .then(function(data) {
      var searchableData = data.filter(function(item) {
        return item.id > 125;
      });

      var scoredMatches = searchableData.map(function(item) {
        var content = String(item.content || "").toLowerCase();
        var section = String(item.section || "").toLowerCase();
        var score = 0;

        meaningfulWords.forEach(function(word) {
          if (content.indexOf(word) !== -1) score += 2;
          if (section.indexOf(word) !== -1) score += 1;
        });

        return { item: item, score: score };
      });

      scoredMatches.sort(function(a, b) {
        return b.score - a.score;
      });

      var matches = scoredMatches.filter(function(m) {
        return m.score > 0;
      }).map(function(m) {
        return m.item;
      });

      if (matches.length === 0 && meaningfulWords.length > 0) {
        var fallbackWord = meaningfulWords[0];
        matches = searchableData.filter(function(item) {
          return String(item.content || "").toLowerCase().indexOf(fallbackWord) !== -1;
        });
      }

      if (matches.length === 0) {
        container.innerHTML = "<div style='padding:15px; background:#451a03; color:#fcd34d; border-radius:8px; margin-top:10px;'>⚠️ Çeviri kılavuzunda bu ifadeyle eşleşen kural bulunamadı.</div>";
        return;
      }

      var html = "<div style='background:#0f172a; border:1px solid #34d399; border-radius:12px; padding:18px; margin-top:15px; color:#e2e8f0;'>";
      html += "<div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #1e293b; padding-bottom:8px;'>";
      html += "<h3 style='margin:0; color:#34d399; font-size:16px;'>📖 Çeviri Kılavuzu - Tüm Eşleşen Kayıtlar (" + matches.length + " Adet)</h3>";
      html += "<span style='font-size:11px; background:#1e293b; color:#60a5fa; padding:3px 8px; border-radius:6px;'>Eksiksiz Liste</span>";
      html += "</div>";

      html += "<div style='max-height: 450px; overflow-y: auto; padding-right: 5px;'>";

      matches.forEach(function(m, idx) {
        var badge = m.type === "E" ? "🇬🇧 İngilizce Örnek" : (m.type === "K" ? "⚖️ Karşılaştırmalı" : "🇹🇷 Kural / Açıklama");
        var color = m.type === "E" ? "#60a5fa" : (m.type === "K" ? "#f43f5e" : "#34d399");

        html += "<div style='background:#1e293b; border-radius:8px; padding:12px; margin-bottom:12px; border-left:3px solid " + color + ";'>";
        html += "<div style='display:flex; justify-content:space-between; font-size:11px; font-weight:bold; color:" + color + "; margin-bottom:4px;'>";
        html += "<span>#" + (idx + 1) + " [" + badge + "] — Bölüm: " + m.section + "</span>";
        html += "<span style='color:#94a3b8;'>ID: " + m.id + "</span>";
        html += "</div>";
        html += "<div style='font-size:13px; color:#cbd5e1; line-height:1.5;'>" + m.content + "</div>";
        html += "</div>";
      });

      html += "</div></div>";
      container.innerHTML = html;
    })
    .catch(function(err) {
      container.innerHTML = "<div style='padding:15px; background:#450a0a; color:#fca5a5; border-radius:8px;'>❌ Hata: " + err.message + "</div>";
    });
}

function bindQuiz(quiz){
  const box=document.getElementById("quizOpts");
  const expEl=document.getElementById("quizExp");
  if(!box) return;
  box.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.onclick=()=>{
      const picked=btn.getAttribute("data-l");
      const ok=(picked===quiz.answer);
      const correctOpt=quiz.options.find(o=>o.letter===quiz.answer);
      const pickedOpt=quiz.options.find(o=>o.letter===picked);

      box.querySelectorAll(".quiz-opt").forEach(b=>{
        b.disabled=true;
        const L=b.getAttribute("data-l");
        if(L===quiz.answer) b.classList.add("correct");
        else if(L===picked) b.classList.add("wrong");
      });

      if(expEl){
        expEl.innerHTML = `<div class="quiz-verdict ${ok?"ok":"bad"}">`
          + (ok ? "✅ Doğru!" : "❌ Yanlış — doğrusu "+quiz.answer+") "+esc(correctOpt?correctOpt.text:""))
          + `</div>` + (quiz.explain ? renderRich(quiz.explain) : "");
        expEl.classList.add("show");
      }

      try{
        if(window.dhCoachEvaluate) window.dhCoachEvaluate({
          ok: ok,
          en: State.en || (correctOpt?correctOpt.text:""),
          answer: pickedOpt?pickedOpt.text:picked,
          sentenceId: State.en ? ("teacher:"+State.en.slice(0,60)) : "",
          trackKind: "lesson",
          module: "teacher",
          topic: "dilbilgisi"
        });
      }catch(e){}
    };
  });
}

async function askFollowup(q){
  q = (q||"").trim(); if (!q) return;
  const out = document.getElementById("out");
  const qa = document.createElement("div");
  qa.innerHTML = `<div class="qa-q">❓ ${esc(q)}</div><div class="loading"><div class="spinner"></div> Yanıtlanıyor…</div>`;
  out.appendChild(qa);
  State.history.push({ role:"user", content:q });
  try{
    const reply = await groqChat(State.history);
    State.history.push({ role:"assistant", content:reply });
    qa.innerHTML = `<div class="qa-q">❓ ${esc(q)}</div><div class="explain qaExplain">${renderRich(reply)}</div><div class="explain-actions"><button class="explain-play qaListen">🔊 Oku</button></div>`;
    const btn = qa.querySelector(".qaListen");
    if(btn) btn.onclick = () => speakFromScreen(qa.querySelector(".qaExplain"));
  }catch(e){
    qa.querySelector(".loading").outerHTML = `<div class="note bad">Yanıt alınamadı.</div>`;
    handleError(e, true);
  }
}

function handleError(e, silent){
  const code = e && e.code;
  if (code==="no-key" || code==="bad-key"){ openKeySheet(code==="bad-key"); if(!silent) setOut(""); return; }
  let msg="Bir sorun oluştu, tekrar dene.";
  if (code==="rate"){
    var t = e && e.tried ? e.tried : 1;
    var w = e && e.waitMs ? Math.ceil(e.waitMs/1000) : 0;
    if (t > 1) msg = t + " API anahtarının hepsi şu an limitte" + (w?(" (~"+w+" sn sonra açılır)"):"") + ". Farklı Groq hesaplarından anahtar eklersen kesinti azalır.";
    else msg = "API limiti doldu (tek anahtar). Birkaç dakika bekle veya '🔑 Anahtarlar'dan ek anahtar gir.";
  }
  else if (code==="network") msg="İnternet bağlantısı yok gibi görünüyor.";
  if (!silent) setOut(`<div class="state"><h2>Olmadı</h2><p>${msg}</p><button class="btn btn-primary" onclick="location.reload()">Tekrar dene</button></div>`);
}
