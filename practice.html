<script type="module">

<script>
(function(){
"use strict";

const DB_NAME = "sentence-mode", STORE = "kv", PREFIX = "srs:", DAY = 1440 * 60 * 1000;
let _db = null;

// Modüler Katman Arayüzleri (UI Components Splitting)
const Components = {
  renderOrderLayer: function(s, toks, bank, placed, sttOK) {
    return `
      <div class="layer-label"><span class="dot"></span>Kelimeleri doğru sıraya diz${sttOK ? " — veya mikrofonla oku" : ""}</div>
      <div class="build-line" id="buildLine"></div>
      <div class="bank" id="bank"></div>
      ${sttOK ? `<div class="mic-row"><button class="mic-btn" id="micOrder">🎙️ Cümleyi oku</button></div>` : ""}
      <div class="actions">
        <button class="btn btn-ghost" id="clearBtn">Temizle</button>
        <button class="btn btn-primary" id="checkBtn" disabled>Kontrol et</button>
      </div>`;
  },
  renderClozeLayer: function(s, toks, gapIdx) {
    let html = `<div class="layer-label"><span class="dot"></span>Eksik kelimeyi yazın</div><div class="cloze-sentence">`;
    toks.forEach((w, i) => {
      if (gapIdx.has(i)) {
        html += `<input class="cloze-input-inline" data-gi="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(70, w.length * 16)}px;" /> `;
      } else {
        html += `<span class="cloze-word">${w}</span> `;
      }
    });
    html += `</div><div class="actions"><button class="btn btn-ghost" id="hearBtn">🔊 Dinle</button><button class="btn btn-primary" id="checkBtn">Kontrol et</button></div>`;
    return html;
  },
  renderFullLayer: function(s, sttOK) {
    return `
      <div class="layer-label"><span class="dot"></span>İngilizce cümlenin tamamını kurun</div>
      <textarea class="full-input" id="fullInput" placeholder="İngilizce cümleyi yazın veya sesli söyleyin..." autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      <div class="mic-row">${sttOK ? `<button class="mic-btn" id="micBtn">🎙️ Söyle</button>` : ""}</div>
      <div class="actions"><button class="btn btn-ghost" id="hearBtn">🔊 İpucu sesi</button><button class="btn btn-primary" id="checkBtn">Kontrol et</button></div>`;
  },
  renderListenLayer: function(s, sttOK) {
    return `
      <div class="layer-label"><span class="dot"></span>Duyduğun cümleyi yaz veya mikrofonla tekrarla</div>
      <textarea class="full-input" id="listenInput" placeholder="Duyduğunu buraya yaz..." autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      ${sttOK ? `<div class="mic-row"><button class="mic-btn" id="listenMic">🎙️ Tekrarla (söyle)</button></div>` : ""}
      <div class="actions"><button class="btn btn-primary" id="checkBtn">Kontrol et</button></div>`;
  }
};

const State = {
  sentences: null, byModule: null, byLevel: null, srs: {}, mode: "produce", queue: [], idx: 0, sessionTitle: "", answered: false, currentRawUserAnswer: ""
};

const root = document.getElementById("root");

async function openDB(){
  if (_db) return _db;
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function srsGet(id, pfx){
  const key = (pfx || PREFIX) + id;
  try { const db = await openDB(); return await new Promise((res, rej) => { const rq = db.transaction(STORE,"readonly").objectStore(STORE).get(key); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); }); } catch { try{ return JSON.parse(localStorage.getItem(key) || "null"); }catch{ return null; } }
}
async function srsSet(id, val, pfx){
  const key = (pfx || PREFIX) + id;
  try { const db = await openDB(); await new Promise((res, rej) => { const rq = db.transaction(STORE,"readwrite").objectStore(STORE).put(val, key); rq.onsuccess = () => res(); rq.onerror = () => rej(rq.error); }); } catch { try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
}
async function srsAll(pfx){
  const P = pfx || PREFIX;
  try { const db = await openDB(); return await new Promise((res, rej) => { const store = db.transaction(STORE,"readonly").objectStore(STORE); const out = {}; const rq = store.openCursor(); rq.onsuccess = () => { const c = rq.result; if (c){ if (typeof c.key === "string" && c.key.startsWith(P)) out[c.key.slice(P.length)] = c.value; c.continue(); } else res(out); }; rq.onerror = () => rej(rq.error); }); } catch { const out = {}; for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith(P)){ try{ out[k.slice(P.length)] = JSON.parse(localStorage.getItem(k)); }catch{} } } return out; }
}

const LISTEN_PREFIX = "lsrs:";
function modePrefix(){ return State.mode === "listen" ? LISTEN_PREFIX : PREFIX; }
function mAll(){ return srsAll(modePrefix()); }
function srsDefault(){ return { rep:0, ef:2.5, interval:0, due:0, last:0 }; }

// Text normalizer ve Diff Motoru[cite: 2]
const CONTRACTIONS = { "i'm":["i","am"], "you're":["you","are"], "we're":["we","are"], "they're":["they","are"], "he's":["he","is"], "she's":["she","is"], "it's":["it","is"] };
function tokenize(s){ return (s.match(/[A-Za-z']+(?:-[A-Za-z']+)*|\d+/g) || []); }
function norm(w){ return w.toLowerCase().replace(/[\u2019\u2018]/g, "'").replace(/[.,!?;:"()]/g, "").trim(); }
function normSeq(text){
  const out = [];
  for (const raw of tokenize(text)){
    const n = norm(raw);
    if (CONTRACTIONS[n]) out.push(...CONTRACTIONS[n].map(x => ({n:x, raw}))); else out.push({n, raw});
  }
  return out;
}
function diffWords(answer, target){
  const a = normSeq(answer), b = normSeq(target), m = a.length, k = b.length;
  const dp = Array.from({length:m+1}, () => new Int32Array(k+1));
  for (let i=m-1;i>=0;i--) for (let j=k-1;j>=0;j--) dp[i][j] = a[i].n === b[j].n ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i=0, j=0;
  while (i<m && j<k){
    if (a[i].n === b[j].n){ out.push({type:"ok", word:b[j].raw}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]){ out.push({type:"extra", word:a[i].raw}); i++; }
    else { out.push({type:"missing", word:b[j].raw}); j++; }
  }
  while (i<m) out.push({type:"extra", word:a[i++].raw});
  while (j<k) out.push({type:"missing", word:b[j++].raw});
  return { parts: out, correct: out.filter(o=>o.type==="ok").length, total: k, ratio: k ? out.filter(o=>o.type==="ok").length/k : 0 };
}

function autoGrade(ratio, hadExtra){ if (ratio >= 0.999 && !hadExtra) return "easy"; if (ratio >= 0.75) return "good"; return "hard"; }
function chooseLayer(srs){ const rep = (srs && srs.rep) || 0; if (rep <= 0) return "order"; if (rep <= 2) return "cloze"; return "full"; }

function speak(text){ try{ const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch{} }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadData(){
  State.sentences = await (await fetch("data/sentences.json")).json();
  const byModule = new Map(), byLevel = new Map();
  for (const s of State.sentences){ if (!byModule.has(s.module)) byModule.set(s.module, []); byModule.get(s.module).push(s); }
  for (const [mod, arr] of byModule){ arr.sort((a,b)=>(a.order||0)-(b.order||0)); const lv = arr[0].level; if (!byLevel.has(lv)) byLevel.set(lv, []); byLevel.get(lv).push(mod); }
  State.byModule = byModule; State.byLevel = byLevel; State.srs = await mAll();
}

function renderPicker(){
  const listen = State.mode === "listen", now = Date.now();
  const due = Object.values(State.srs).filter(s => (s.due||0) <= now && (s.rep||0) > 0).length;
  let html = `<div class="picker"><div class="picker-top"><a href="./index.html" class="home-link">← Ana uygulama</a><div id="cloudBar"></div></div>
    <div class="mode-tabs"><button class="mode-tab${listen?'':' active'}" id="pMod">✍️ Üretim</button><button class="mode-tab${listen?' active':''}" id="lMod">🎧 Dinleme</button></div>
    <button class="due-cta" id="dueBtn" ${due?'':'disabled'}>${due?`🔥 Tekrar zamanı gelen ${due} cümleyi çalış`:'Tekrar bekleyen cümle yok'}</button>`;
  
  for (const lv of ["A1","A2","B1","B2","C1","C2"].filter(l=>State.byLevel.has(l))){
    html += `<div class="lv-group"><div class="lv-head"><span class="lv-badge">${lv}</span></div><div class="mod-grid">`;
    for (const mod of State.byLevel.get(lv)){
      const arr = State.byModule.get(mod) || [], learned = arr.filter(s=>State.srs[s.id] && State.srs[s.id].rep>0).length;
      html += `<button class="mod-tile" data-mod="${esc(mod)}"><span class="mod-name">${esc(mod.replace(/^[A-C]\d-M\d+\s*/,""))}</span><span class="mod-prog-txt">%${Math.round(learned/(arr.length||1)*100)}</span></button>`;
    }
    html += `</div></div>`;
  }
  root.innerHTML = html + `</div>`;
  
  document.getElementById("pMod").onclick = () => { State.mode="produce"; renderPicker(); };
  document.getElementById("lMod").onclick = () => { State.mode="listen"; renderPicker(); };
  if(due) document.getElementById("dueBtn").onclick = () => startDueSession();
  root.querySelectorAll(".mod-tile").forEach(t => t.onclick = () => startModuleSession(t.dataset.mod));
}

function startModuleSession(mod){ State.queue = State.byModule.get(mod) || []; State.idx = 0; State.sessionTitle = mod; renderCard(); }
function startDueSession(){ const now = Date.now(); State.queue = State.sentences.filter(s=>State.srs[s.id] && (State.srs[s.id].due||0)<=now && State.srs[s.id].rep>0); State.idx=0; State.sessionTitle="Tekrar Oturumu"; renderCard(); }

function renderCard(){
  if (State.idx >= State.queue.length) { root.innerHTML = `<div class="state"><h2>✅ Oturum Tamamlandı!</h2><button class="btn btn-primary" onclick="location.reload()">Baştan Başla</button></div>`; return; }
  const s = State.queue[State.idx], srs = State.srs[s.id] || srsDefault(), layer = chooseLayer(srs), listen = State.mode === "listen", sttOK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  State.answered = false;

  root.innerHTML = `
    <div class="top"><button class="back" onclick="location.reload()">←</button><div class="top-title"><h1>${esc(State.sessionTitle)}</h1><p>${esc(s.module)}</p></div><div class="queue-pill"><b>${State.idx+1}</b>/${State.queue.length}</div></div>
    <div class="prog"><span style="width:${(State.idx/State.queue.length)*100}%"></span></div>
    <div class="stage"><div class="card practice-v5">
      <div class="pv5-left">
        <div class="pv5-panel pv5-prompt">
          <div class="meta"><span class="chip chip-lv">${s.level}</span><span class="chip chip-mode">${listen?'Dinle ve Yaz':layer}</span></div>
          ${listen ? `<button class="btn btn-primary" id="listenHero" style="padding:20px; font-size:18px;">🔊 Cümleyi Dinle</button>` : `<div class="tr-prompt">Türkçesi</div><div class="tr-text">${esc(s.tr)}</div>`}
        </div>
        <div class="pv5-panel" id="feedbackArea"></div>
      </div>
      <div class="pv5-center"><div class="pv5-panel pv5-answer" id="answerArea"></div></div>
      <div class="pv5-right"><div class="pv5-panel"><div class="pv5-level-title">SRS Kart Notu</div><div id="gradeDock"><p style="color:var(--muted); font-size:13px;">Yanıtınızı kontrol ettikten sonra hafıza derecelendirmesi burada açılacaktır.</p></div></div></div>
    </div></div>`;

  const area = document.getElementById("answerArea");
  if (listen) {
    area.innerHTML = Components.renderListenLayer(s, sttOK);
    document.getElementById("listenHero").onclick = () => speak(s.en);
    AppBinder.bindListen(s);
  } else if (layer === "order") {
    const toks = tokenize(s.en);
    area.innerHTML = Components.renderOrderLayer(s, toks, shuffle(toks), [], sttOK);
    AppBinder.bindOrder(s, toks);
  } else if (layer === "cloze") {
    const toks = tokenize(s.en), gap = new Set([toks.length - 1]);
    area.innerHTML = Components.renderClozeLayer(s, toks, gap);
    AppBinder.bindCloze(s, toks, gap);
  } else {
    area.innerHTML = Components.renderFullLayer(s, sttOK);
    AppBinder.bindFull(s);
  }
}

// Olay Bağlayıcılar ve İş Akış Mantıkları (App Operations Control)
const AppBinder = {
  bindOrder: function(s, toks) {
    const bankEl = document.getElementById("bank"), lineEl = document.getElementById("buildLine"), checkBtn = document.getElementById("checkBtn"), bank = shuffle(toks).map((w,i)=>({w,i})), placed = [];
    const draw = () => {
      bankEl.innerHTML = bank.map((t,bi)=>`<button class="tok-btn ${placed.some(p=>p.bi===bi)?'placed':''}" data-bi="${bi}">${esc(t.w)}</button>`).join("");
      lineEl.innerHTML = placed.map((p,pi)=>`<button class="tok-chip" data-pi="${pi}">${esc(bank[p.bi].w)}</button>`).join("");
      checkBtn.disabled = placed.length !== toks.length;
      bankEl.querySelectorAll(".tok-btn").forEach(b => b.onclick = () => { const bi = +b.dataset.bi; if(!placed.some(p=>p.bi===bi)){ placed.push({bi}); draw(); } });
      lineEl.querySelectorAll(".tok-chip").forEach(c => c.onclick = () => { placed.splice(+c.dataset.pi, 1); draw(); });
    };
    draw();
    document.getElementById("clearBtn").onclick = () => { placed.length = 0; draw(); };
    checkBtn.onclick = () => evaluate(s, placed.map(p=>bank[p.bi].w).join(" "));
  },
  bindCloze: function(s, toks, gap) {
    const btn = document.getElementById("checkBtn"), inp = document.querySelector(".cloze-input-inline");
    if(inp) inp.focus();
    document.getElementById("hearBtn").onclick = () => speak(s.en);
    btn.onclick = () => {
      const ans = toks.map((w,i)=>gap.has(i)?(inp.value.trim()||"___"):w).join(" ");
      evaluate(s, ans);
    };
  },
  bindFull: function(s) {
    document.getElementById("hearBtn").onclick = () => speak(s.en);
    document.getElementById("checkBtn").onclick = () => evaluate(s, document.getElementById("fullInput").value.trim());
  },
  bindListen: function(s) {
    document.getElementById("checkBtn").onclick = () => evaluate(s, document.getElementById("listenInput").value.trim());
  }
};

async function evaluate(s, answer){
  if (State.answered) return;
  State.answered = true;
  State.currentRawUserAnswer = answer;
  
  const d = diffWords(answer, s.en), grade = autoGrade(d.ratio, d.parts.some(p=>p.type==="extra"));
  const next = { rep: (srsDefault().rep)+1, due: Date.now() + 3*DAY }; // Basit mock SRS yazımı
  await srsSet(s.id, next);
  State.srs[s.id] = next;

  const diffHtml = d.parts.map(p => `<span class="w-${p.type}">${esc(p.word)}</span>`).join(" ");
  const isExact = grade === "easy";

  document.getElementById("feedbackArea").innerHTML = `
    <div class="feedback">
      <div class="verdict ${isExact?'verdict-ok':'verdict-miss'}">
        <span class="verdict-emoji">${isExact?'🎯':'📌'}</span><span class="verdict-text">${isExact?'Tam İsabet!':'Gözden Geçirelim'}</span>
      </div>
      <div class="diff">${diffHtml}</div>
      <div class="answer-reveal">Doğrusu: <b class="answer-en">${esc(s.en)}</b></div>
      ${!isExact ? `<button class="dynamic-explain-btn" id="askAIBtn">💡 Ben Nerede Hata Yaptım? (AI Canlı Analiz)</button>` : ''}
    </div>`;

  document.getElementById("gradeDock").innerHTML = `
    <div class="grade-row">
      <div class="grade-q">Sistem kaydı tamamlandı:</div>
      <div class="grade-btns">
        <button class="gbtn g-hard ${grade==='hard'?'sel':''}">Zor</button>
        <button class="gbtn g-good ${grade==='good'?'sel':''}">Normal</button>
        <button class="gbtn g-easy ${grade==='easy'?'sel':''}">Kolay</button>
      </div>
    </div>
    <button class="next-btn" id="nextBtn">İleri ›</button>`;

  document.getElementById("nextBtn").onclick = () => { State.idx++; renderCard(); };
  
  // DİNAMİK CANLI HATA AÇIKLAMA BAĞLANTISI (Yapay Zeka Neden Hata Yaptım Köprüsü)[cite: 2]
  const aiBtn = document.getElementById("askAIBtn");
  if(aiBtn) {
    aiBtn.onclick = async () => {
      aiBtn.disabled = true;
      aiBtn.innerText = "🤖 Yapay Zeka Hatanızı İnceliyor...";
      
      const prompt = `Öğrenci cümlenin İngilizcesini kurarken hata yaptı.\nReferans Doğru Cümle: "${s.en}"\nÖğrencinin Hatalı Varyasyonu: "${State.currentRawUserAnswer}"\n\nLütfen öğrenciye yaptığı hatayı, mantıklı gramer sebebini ve doğrusunu şu formata sadık kalarak Türkçe açıkla:\nSen: (Hata)\nSebep: (Neden yanlış?)\nDoğrusu: (Kural)`;
      
      try {
        const out = await DHProviders.chat([{role:"user", content:prompt}], {temperature:0.2});
        const box = document.createElement("div");
        box.className = "learn-box ai-dynamic";
        box.innerHTML = `<div class="learn-label">✨ AI Canlı Feedback Laboratuvarı</div><div class="learn-text" style="white-space:pre-line;">${esc(out)}</div>`;
        document.getElementById("feedbackArea").appendChild(box);
        aiBtn.remove();
      } catch(e) {
        aiBtn.disabled = false;
        aiBtn.innerText = "Bağlantı hatası, tekrar deneyin.";
      }
    };
  }
}

async function boot(){
  try { await loadData(); renderPicker(); } catch(e) { root.innerHTML = `<div class="state"><h2>Yükleme Başarısız</h2></div>`; }
}
boot();

})();
</script>
