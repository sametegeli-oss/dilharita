<!doctype html>
<html lang="tr">
<head>
<script src="./auth-guard.js?v=1"></script>
<script src="./storage-bridge.js?v=3"></script>
<script src="./ai-providers.js?v=1"></script>
<script src="./gemini-quality-tools.js?v=4"></script>
<script src="./progress-engine.js?v=2"></script>
<script src="./dh-plan.js?v=3"></script>
<script src="./dh-session-summary.js?v=1"></script>
<script src="./coach-bubble.js?v=1"></script>
<!-- Karma gün sonu pratiği: o gün çalışılan cümle + kalıp + kelimeleri
     harmanlayıp öğretmen sohbetine devreder (Günü Kapat paneline eklenir). -->
<script src="./dh-gun-sonu.js?v=1"></script>
<script src="./teacher-policy.js?v=3"></script>
<script src="./mastery-engine.js?v=1"></script>
<script src="./level-badge.js?v=1"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1120" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<title>Üretim · Dil Harita</title>
<style>
:root{
  --bg:#0b1120; --bg-soft:#0f172a; --surface:#131c30; --surface-2:#1a2540;
  --border:#ffffff14; --text:#e8eef7; --muted:#93a4bd;
  --accent:#60a5fa; --accent-strong:#3b82f6;
  --ok:#34d399; --ok-soft:#34d39922; --warn:#fbbf24; --bad:#f87171; --bad-soft:#ef444422;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2540 0%, transparent 60%),
    var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;
  font-family:Nunito,system-ui,-apple-system,sans-serif;
}
.wrap{max-width:680px;margin:0 auto;min-height:100%;padding:16px;display:flex;flex-direction:column}

/* ---- header ---- */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);
  width:40px;height:40px;border-radius:11px;cursor:pointer;font-size:18px;flex-shrink:0}
.back:hover{background:var(--surface-2)}
.top-title{flex:1;min-width:0}
.top-title h1{margin:0;font-family:Fraunces,serif;font-weight:600;font-size:19px;letter-spacing:-.3px}
.top-title p{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-pill{background:var(--surface);border:1px solid var(--border);border-radius:99px;
  padding:6px 12px;font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0}
.queue-pill b{color:var(--accent)}

/* ---- progress ---- */
.prog{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#34d399);transition:width .3s}

/* ---- the stage / card ---- */
.stage{flex:1;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;display:flex;flex-direction:column}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{background:var(--surface-2);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700}
.chip-lv{background:var(--accent-strong);color:#fff}
.chip-mode{background:#a78bfa22;color:#c4b5fd}

/* the Turkish prompt is the hero of production mode */
.tr-prompt{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.tr-text{font-family:Fraunces,serif;font-size:25px;font-weight:600;line-height:1.4;letter-spacing:-.2px;margin-bottom:6px}
.pron-hint{color:var(--warn);opacity:.85;font-style:italic;font-size:14px;margin-bottom:4px;display:none}
.pron-hint.show{display:block}

.layer-label{margin:20px 0 12px;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.layer-label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ---- LAYER 1: word ordering ---- */
.build-line{min-height:54px;border:1.5px dashed var(--border);border-radius:12px;
  padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin-bottom:14px;
  background:var(--bg-soft);transition:border-color .15s}
.build-line.filled{border-style:solid;border-color:#60a5fa55}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.tok-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:8px 13px;font:700 15px Nunito,sans-serif;cursor:pointer;
  transition:transform .1s,background .12s,opacity .15s}
.tok-btn:hover{background:#22304f}
.tok-btn:active{transform:scale(.94)}
.tok-btn.placed{opacity:.32;pointer-events:none}
.tok-chip{background:var(--accent-strong);border:1px solid transparent;color:#fff;
  border-radius:10px;padding:8px 13px;font:700 15px Nunito,sans-serif;cursor:pointer}
.tok-chip:active{transform:scale(.94)}

/* ---- LAYER 2: cloze ---- */
.cloze-sentence{font-size:21px;line-height:1.9;font-weight:600;margin-bottom:14px}
.cloze-word{color:var(--text)}
.cloze-gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent);
  margin:0 3px;text-align:center;color:var(--accent);font-weight:800}
.cloze-input{background:var(--bg-soft);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);font:700 17px Nunito,sans-serif;padding:12px 14px;width:100%;margin-bottom:6px}
.cloze-input:focus{outline:none;border-color:var(--accent)}

/* ---- LAYER 3: full production ---- */
.full-input{background:var(--bg-soft);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);font:600 17px Nunito,sans-serif;padding:14px;width:100%;min-height:80px;
  resize:vertical;line-height:1.5;margin-bottom:6px}
.full-input:focus{outline:none;border-color:var(--accent)}
.mic-row{display:flex;gap:8px;margin-bottom:6px}
.mic-btn{flex:1;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;border:none;
  border-radius:12px;padding:13px;font:800 15px Nunito,sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.mic-btn:active{transform:scale(.98)}
.mic-btn.listening{background:linear-gradient(135deg,#f59e0b,#d97706)}
.mic-btn:disabled{opacity:.4;cursor:default}
.mic-pulse{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mic-note{font-size:11px;color:var(--muted);text-align:center}

/* ---- action buttons ---- */
.actions{display:flex;gap:8px;margin-top:8px}
.teacher-ask-row{display:flex;margin:14px 0 2px}
.teacher-ask-btn{width:100%;border:1px solid #34d39955;background:linear-gradient(135deg,#34d399,#16a34a);
  color:#fff;border-radius:12px;padding:12px 14px;font:900 15px Nunito,sans-serif;cursor:pointer;
  box-shadow:0 10px 24px #00000022;transition:transform .1s,filter .12s}
.teacher-ask-btn:hover{filter:brightness(1.05)}
.teacher-ask-btn:active{transform:scale(.97)}
.btn{flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:12px;padding:13px;font:800 15px Nunito,sans-serif;cursor:pointer;
  transition:transform .1s,background .12s,opacity .15s}
.btn:hover{background:#22304f}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn-primary{background:var(--accent-strong);color:#fff;border-color:transparent;flex:2}
.btn-primary:hover{background:#2f6fe0}
.btn-ghost{background:transparent}

/* ---- feedback ---- */
.feedback{margin-top:20px;border-top:1px solid var(--border);padding-top:18px;
  animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.verdict-emoji{font-size:34px;line-height:1}
.verdict-text{font-size:20px;font-weight:900}
.verdict-ok .verdict-text{color:var(--ok)}
.verdict-close .verdict-text{color:var(--warn)}
.verdict-miss .verdict-text{color:var(--bad)}

/* diff view */
.diff{font-size:20px;line-height:1.7;font-weight:700;margin-bottom:14px;
  background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:14px}
.diff .w-ok{color:var(--ok)}
.diff .w-bad{color:var(--bad);text-decoration:underline wavy var(--bad);text-decoration-thickness:1.5px}
.diff .w-missing{color:var(--bad);opacity:.55;text-decoration:line-through}
.diff .w-extra{color:var(--warn);font-style:italic;opacity:.7}
.answer-reveal{font-size:13px;color:var(--muted);margin-bottom:14px}
.answer-reveal b{color:var(--text);font-weight:800}
.answer-ipa{font-family:'Courier New',monospace;color:var(--muted);font-size:13px;margin-top:2px}
.answer-trpron{color:var(--warn);font-style:italic;font-size:14px;margin-top:6px}
.answer-tr{color:var(--text);opacity:.9;font-size:15px;margin-top:6px}
.mode-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:5px;margin-bottom:4px}
.mode-tab{flex:1;background:transparent;border:none;color:var(--muted);border-radius:9px;padding:11px;font:800 14px Nunito,sans-serif;cursor:pointer;transition:background .12s,color .12s}
.mode-tab.active{background:var(--accent-strong);color:#fff}
.listen-hero{width:100%;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:14px;padding:20px;font:800 18px Nunito,sans-serif;cursor:pointer;margin-bottom:8px}
.listen-hero:active{transform:scale(.98)}
.listen-slow{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font:700 14px Nunito,sans-serif;cursor:pointer;margin-bottom:6px}
.listen-slow:hover{background:#22304f}
.answer-en .wp-tok{cursor:pointer;border-radius:5px;padding:0 2px;transition:background .12s}
.answer-en .wp-tok:hover{background:#60a5fa33}
.wp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wp-word{font-family:Fraunces,serif;font-weight:600;font-size:26px;margin:0;
  background:linear-gradient(120deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wp-close{background:var(--surface-2);color:var(--text);border:none;border-radius:9px;width:34px;height:34px;font-size:14px;cursor:pointer}
.wp-close:hover{background:#22304f}
.wp-badges{display:flex;gap:6px;margin-bottom:10px}
.wp-badge{border-radius:7px;padding:3px 9px;font-size:11px;font-weight:800}
.wp-badge-level{background:var(--accent-strong);color:#fff}
.wp-badge-freq{color:#4ade80;background:#22c55e2e}
.wp-oku{color:var(--warn);font-style:italic;font-size:15px;margin-bottom:12px}
.wp-section-title{color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:12px;font-weight:800;margin:14px 0 8px}
.wp-meanings{display:flex;flex-direction:column;gap:4px;margin:0;padding-left:20px}
.wp-meanings li{font-size:15px}
.wp-empty{color:var(--muted);font-size:14px}
.wp-examples{display:flex;flex-direction:column;gap:10px}
.wp-ex{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:12px 42px 12px 12px;position:relative}
.wp-ex-en{font-size:15px;font-weight:700;line-height:1.4}
.wp-ex-tr{color:var(--muted);margin-top:4px;font-size:13px}
.wp-ex-play{background:var(--surface-2);width:28px;height:28px;color:var(--accent);border:none;border-radius:8px;font-size:12px;cursor:pointer;position:absolute;top:10px;right:10px}
.wp-ex-play:hover{background:var(--accent-strong);color:#fff}

/* mistake / explain boxes shown on error */
.learn-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;
  padding:13px;margin-bottom:12px}
.learn-box.mistake{border-color:#ef444455;background:#ef44440d}
.learn-label{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.learn-box.mistake .learn-label{color:var(--bad)}
.learn-text{font-size:14px;line-height:1.6}

/* grade override row */
.grade-row{margin-top:6px}
.grade-q{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
.grade-btns{display:flex;gap:8px}
.gbtn{flex:1;border:none;color:#fff;border-radius:11px;padding:12px;
  font:800 14px Nunito,sans-serif;cursor:pointer}
.gbtn:active{transform:scale(.96)}
/* Notlama düğmeleri VARSAYILAN GRİ durur; sistemin verdiği not (.sel) renklenir.
   Böylece hangi notun kaydedildiği tek bakışta belli olur. */
.gbtn{background:#334155;color:#94a3b8}
.gbtn:hover{background:#475569;color:#cbd5e1}
.g-hard.sel{background:#ef4444;color:#fff}
.g-good.sel{background:#3b82f6;color:#fff}
.g-easy.sel{background:#22c55e;color:#fff}
.gbtn.sel{outline:2px solid #fff;outline-offset:2px}

.next-btn{margin-top:14px;width:100%;background:linear-gradient(135deg,#16a34a,#15803d);
  color:#fff;border:none;border-radius:12px;padding:15px;font:800 16px Nunito,sans-serif;cursor:pointer}
.next-btn:active{transform:scale(.98)}

/* ---- audio replay ---- */
.audio-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--accent);
  border-radius:9px;padding:6px 12px;font:700 12px Nunito,sans-serif;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.audio-btn:hover{background:var(--accent-strong);color:#fff}

/* ---- AI anlam kontrolü + Gemini (tekrar.html ile aynı mantık) ---- */
.sem-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b-sem-chk{background:#1e293b;border:1px solid #38bdf855;color:#7dd3fc;border-radius:9px;
  padding:7px 12px;font:800 12px Nunito,sans-serif;cursor:pointer}
.b-sem-chk:hover{background:#0284c7;color:#fff}
.b-gemini{background:#4f46e5;border:1px solid #6366f1;color:#fff;border-radius:9px;
  padding:7px 12px;font:800 12px Nunito,sans-serif;cursor:pointer}
.b-gemini:hover{background:#6366f1}
.sem-note{margin-top:8px;font-size:12px;color:#9fb3d9;line-height:1.5}
.ai-settings-toggle{color:var(--muted);font-size:11.5px;text-decoration:underline;cursor:pointer;
  display:block;margin-top:10px;text-align:right}
.ai-settings-panel{background:#071120;border:1px solid var(--border);border-radius:10px;
  padding:10px;margin-top:8px;display:none}
.ai-settings-panel textarea{width:100%;height:110px;background:#0a1628;color:#fff;
  border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;
  resize:vertical;font-family:system-ui}

/* ---- states ---- */
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;min-height:55vh;color:var(--muted);text-align:center;padding:0 20px}
.state h2{font-family:Fraunces,serif;color:var(--text);font-weight:600;margin:0;font-size:24px}
.state p{margin:0;font-size:15px;line-height:1.6;max-width:380px}
.spinner{width:34px;height:34px;border:3px solid var(--surface-2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state .btn{flex:none;padding:13px 26px}

/* ---- picker (level/module selection) ---- */
.picker{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.pick-intro{text-align:center;padding:10px 0 4px}
.pick-intro h1{font-family:Fraunces,serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-.5px;
  background:linear-gradient(120deg,#60a5fa,#a78bfa,#34d399);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.pick-intro p{color:var(--muted);font-size:14px;margin:8px auto 0;max-width:420px;line-height:1.6}
.due-cta{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;
  border-radius:14px;padding:16px;font:800 16px Nunito,sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px}
.due-cta:active{transform:scale(.98)}
.due-cta:disabled{opacity:.5;cursor:default;background:var(--surface-2);color:var(--muted)}
.lv-group{margin-bottom:4px}
.lv-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:14px;color:var(--muted)}
.lv-badge{background:var(--accent-strong);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:800}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mod-tile{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;color:var(--text);padding:14px;display:flex;flex-direction:column;gap:7px;
  transition:transform .12s,border-color .12s,background .12s}
.mod-tile:hover{background:var(--surface-2);border-color:#60a5fa80;transform:translateY(-2px)}
.mod-name{font-size:14px;font-weight:700;line-height:1.3}
.mod-count{font-size:12px;color:var(--muted)}
.mod-prog{display:flex;align-items:center;gap:6px;margin-top:2px}
.mod-prog-bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.mod-prog-bar>span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#34d399)}
.mod-prog-txt{font-size:10px;color:var(--muted);font-weight:700}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;padding:18px 0 6px;margin-top:auto}
.legend-item{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

@media (max-width:520px){
  .tr-text{font-size:22px}
  .actions{flex-wrap:wrap}
}

/* ---- resume badge (modül tile) ---- */
.resume-badge{display:inline-block;align-self:flex-start;background:#f59e0b22;color:#fbbf24;
  border:1px solid #f59e0b44;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:800;margin-top:2px}
.mod-tile.has-resume{border-color:#f59e0b55}

/* ---- backup link ---- */
.backup-link{display:block;width:100%;margin:6px 0 18px;background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:12px;padding:12px;font:700 13px Nunito,sans-serif;cursor:pointer;
  transition:background .12s,color .12s}
.backup-link:hover{background:var(--surface);color:var(--text)}
.home-link{align-self:flex-start;color:var(--muted);text-decoration:none;font:700 13px Nunito,sans-serif;padding:6px 0}
.home-link:hover{color:var(--text)}
.picker-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cloud-bar{display:flex;align-items:center;gap:8px;font-size:12px}
.cloud-mail{color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-ok{color:var(--ok);font-weight:700}
.cloud-sync{color:var(--warn);font-weight:700}
.cloud-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:6px 11px;font:700 12px Nunito,sans-serif;cursor:pointer}
.cloud-btn:hover{background:var(--surface-2)}
.cloud-connect{background:var(--accent-strong);color:#fff;border-color:transparent}
.cloud-connect:hover{background:#2f6fe0}
.auth-fields{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.auth-input{background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font:600 14px Nunito,sans-serif}
.auth-input:focus{outline:none;border-color:var(--accent)}
.auth-link{background:none;border:none;color:#93c5fd;font:700 13px Nunito,sans-serif;cursor:pointer;padding:8px 0;display:block;margin:0 auto 4px}

/* ---- bottom sheet (resume / backup) ---- */
.sheet-overlay{position:fixed;inset:0;z-index:1000;background:#000000a6;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:shFade .15s}
@keyframes shFade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  animation:shUp .2s}
@keyframes shUp{from{transform:translateY(30px)}to{transform:translateY(0)}}
@media (min-width:560px){.sheet-overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-title{font-family:Fraunces,serif;font-weight:600;font-size:21px;margin:0 0 6px}
.sheet-desc{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}

<script>/* ============================================================
   Üretim Çalışması — Dil Harita
   Bağımsız modül. Ana app.js'e dokunmaz, aynı veriyi ve aynı
   IndexedDB SRS deposunu (sentence-mode/kv, "srs:" anahtarları)
   paylaşır. SM-2 grade fonksiyonu ana uygulamayla birebir aynıdır.
   ============================================================ */
(function(){
"use strict";

/* ---------- veri yolları (repo: data/ altında) ---------- */
const DATA_PATHS = {
  sentences: ["data/sentences.json", "sentences.json", "./data/sentences.json"],
  dictionary: ["data/dictionary.json", "dictionary.json", "./data/dictionary.json"],
};

/* ---------- SRS: IndexedDB (ana uygulamayla paylaşımlı) ---------- */
const DB_NAME = "sentence-mode", STORE = "kv", PREFIX = "srs:";
const DAY = 1440 * 60 * 1000;

let _db = null;
function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej("no-idb");
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function srsGet(id, pfx){
  const key = (pfx || PREFIX) + id;
  try{
    const db = await openDB();
    return await new Promise((res, rej) => {
      const rq = db.transaction(STORE,"readonly").objectStore(STORE).get(key);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  }catch{
    try{ return JSON.parse(localStorage.getItem(key) || "null"); }catch{ return null; }
  }
}
async function srsSet(id, val, pfx){
  const key = (pfx || PREFIX) + id;
  try{
    const db = await openDB();
    await new Promise((res, rej) => {
      const rq = db.transaction(STORE,"readwrite").objectStore(STORE).put(val, key);
      rq.onsuccess = () => res();
      rq.onerror = () => rej(rq.error);
    });
  }catch{
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch{}
  }
}
async function srsAll(pfx){
  const P = pfx || PREFIX;
  try{
    const db = await openDB();
    return await new Promise((res, rej) => {
      const store = db.transaction(STORE,"readonly").objectStore(STORE);
      const out = {};
      const rq = store.openCursor();
      rq.onsuccess = () => {
        const c = rq.result;
        if (c){
          if (typeof c.key === "string" && c.key.startsWith(P))
            out[c.key.slice(P.length)] = c.value;
          c.continue();
        } else res(out);
      };
      rq.onerror = () => rej(rq.error);
    });
  }catch{
    const out = {};
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (k && k.startsWith(P)){
        try{ out[k.slice(P.length)] = JSON.parse(localStorage.getItem(k)); }catch{}
      }
    }
    return out;
  }
}

// iki SRS haritasını birleştir: aynı id'de 'last' büyük olan kazanır
function mergeSrs(a, b){
  const out = Object.assign({}, a);
  for (const id in b){
    const inb = b[id], ina = out[id];
    if (!ina || (inb && (inb.last||0) >= (ina.last||0))) out[id] = inb;
  }
  return out;
}

// cihazdaki tüm ilerlemeyi (üretim + dinleme SRS + pozisyonlar) buluta yaz
/* ══════════════════════════════════════════════════════════════════
   ÇÖZÜLEN HATA
     FirebaseError [resource-exhausted]:
       "Write stream exhausted maximum allowed queued writes"

   SEBEP
     cloudSaveSoon() her kart cevaplandığında çağrılıyordu (bkz. srsGrade
     sonrası) ve her çağrıda TÜM SRS haritasını yazıyordu — ölçüldü:
     progress belgesi 485 KB, 1712 alan. Debounce 1,2 sn idi ama UÇUŞ
     KİLİDİ YOKTU: önceki yazma sürerken 1,2 sn sonra yenisi yola
     çıkıyordu. 485 KB'lık bir yazma mobil bağlantıda saniyeler sürer;
     kuyruk hiç boşalmadan büyüyüp Firestore'un 500 bekleyen yazma
     sınırına dayanıyordu. (Cloud.syncing vardı ama yalnızca rozeti
     boyuyordu, kimse ona bakmıyordu.)

   ÇÖZÜM
     1) Uçuş kilidi: yazma sürerken yeni yazma başlamaz; bu sırada gelen
        istekler tek bir bekleyen isteğe indirgenir (coalescing).
     2) Debounce 1,2 sn → 6 sn, ayrıca iki yazma arası en az 15 sn.
     3) Sayfadan ayrılırken (pagehide) bekleyen değişiklik varsa bir kez
        zorla yazılır — gecikmeyi artırmak veri kaybına yol açmasın.
   ══════════════════════════════════════════════════════════════════ */
const CLOUD_DEBOUNCE = 6000;      // son değişiklikten sonra beklenen süre
const CLOUD_MIN_ARA  = 15000;     // iki yazma arasındaki asgari süre
let _saveTimer = null;
let _saveBusy = false;            // uçuş kilidi
let _savePending = false;         // uçuş sırasında gelen istek
let _saveLastTs = 0;              // son BAŞARILI yazma zamanı
let _saveDirty = false;           // yazılmayı bekleyen değişiklik var mı

async function cloudSaveRun(){
  if (!Cloud.user || !fb()) return;
  if (_saveBusy){ _savePending = true; return; }
  _saveBusy = true;
  try{
    Cloud.syncing = true; updateCloudBadge();
    const srs  = await srsAll();                  // üretim
    const lsrs = await srsAll(LISTEN_PREFIX);     // dinleme
    await fb().saveProgress(Cloud.user.uid, { srs, lsrs, positions: allPositions() });
    _saveLastTs = Date.now();
    _saveDirty = false;
  }catch(e){ /* sessizce geç; bir sonraki değişiklikte tekrar dener */ }
  finally{
    _saveBusy = false;
    Cloud.syncing = false; updateCloudBadge();
    if (_savePending){ _savePending = false; cloudSaveSoon(); }
  }
}

function cloudSaveSoon(){
  if (!Cloud.user || !fb()) return;
  _saveDirty = true;
  if (_saveBusy){ _savePending = true; return; }
  clearTimeout(_saveTimer);
  const kalan = Math.max(0, CLOUD_MIN_ARA - (Date.now() - _saveLastTs));
  _saveTimer = setTimeout(cloudSaveRun, Math.max(CLOUD_DEBOUNCE, kalan));
}

/* Ayrılırken bekleyen değişikliği kaçırma */
window.addEventListener("pagehide", function(){
  if (!_saveDirty || _saveBusy) return;
  clearTimeout(_saveTimer);
  cloudSaveRun();
});

// girişten sonra: buluttan çek, cihazdakiyle birleştir, ikisini de güncelle
async function cloudInitialSync(){
  if (!Cloud.user || !fb()) return;
  Cloud.syncing = true; updateCloudBadge();
  try{
    const remote = await fb().loadProgress(Cloud.user.uid);
    const rd = (remote && remote.data) || {};
    // geriye uyumluluk: eski format düz srs haritasıydı; yeni format { srs, lsrs, positions }
    const remoteSrs = rd.srs || (rd.rep === undefined && typeof rd === "object" && !rd.lsrs ? rd : {});
    const remoteLsrs = rd.lsrs || {};
    const remotePos = rd.positions || null;

    // üretim SRS birleştir
    const localSrs = await srsAll();
    const mergedSrs = mergeSrs(localSrs, remoteSrs);
    for (const id in mergedSrs){
      const cur = localSrs[id];
      if (!cur || (mergedSrs[id].last||0) !== (cur.last||0)) await srsSet(id, mergedSrs[id]);
    }
    // dinleme SRS birleştir
    const localLsrs = await srsAll(LISTEN_PREFIX);
    const mergedLsrs = mergeSrs(localLsrs, remoteLsrs);
    for (const id in mergedLsrs){
      const cur = localLsrs[id];
      if (!cur || (mergedLsrs[id].last||0) !== (cur.last||0)) await srsSet(id, mergedLsrs[id], LISTEN_PREFIX);
    }
    // aktif moda göre State.srs'i ayarla
    State.srs = State.mode === "listen" ? mergedLsrs : mergedSrs;
    applyPositions(remotePos);
    await fb().saveProgress(Cloud.user.uid, { srs: mergedSrs, lsrs: mergedLsrs, positions: allPositions() });
  }catch(e){ /* çevrimdışı olabilir; yerel veriyle devam */ }
  finally{ Cloud.syncing = false; updateCloudBadge(); }
}

      const k = localStorage.key(i);

// bulut/yerel pozisyonları birleştir (at=zaman damgası büyük olan kazanır) ve yerele yaz
function applyPositions(remotePos){
  if (!remotePos) return;
  const local = allPositions();
  for (const mod in remotePos){
    const r = remotePos[mod], l = local[mod];
    if (r && (!l || (r.at||0) >= (l.at||0))){
      try{
        if (r.idx <= 0 || r.idx >= r.total) localStorage.removeItem(POS_PREFIX + mod);
        else localStorage.setItem(POS_PREFIX + mod, JSON.stringify(r));
      }catch{}
    }
  }
}

/* SM-2 grade — ana app.js'teki E() fonksiyonunun BİREBİR kopyası */
function srsGrade(prev, grade){
  const n = Object.assign(srsDefault(), prev || {});
  const r = Date.now();
  if (grade === "hard"){
    n.rep = 0; n.interval = 0; n.ef = Math.max(1.3, n.ef - 0.2);
  } else {
    const q = grade === "easy" ? 5 : 4;
    n.ef = Math.max(1.3, n.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
    n.rep += 1;
    if (n.rep === 1)      n.interval = grade === "easy" ? 3 : 1;
    else if (n.rep === 2) n.interval = grade === "easy" ? 7 : 4;
    else                  n.interval = Math.round(n.interval * n.ef * (grade === "easy" ? 1.3 : 1));
  }
  n.last = r;
  n.due  = r + n.interval * DAY;
  return n;
}

    }

}

/* ---------- metin yardımcıları ---------- */
// kasıllaşmalar: "I'm" ile "I am" eşit sayılmalı. Token dizisini açılmış forma indirger.
const CONTRACTIONS = {
  "i'm":["i","am"], "you're":["you","are"], "we're":["we","are"], "they're":["they","are"],
  "he's":["he","is"], "she's":["she","is"], "it's":["it","is"], "that's":["that","is"],
  "there's":["there","is"], "here's":["here","is"], "what's":["what","is"], "who's":["who","is"],
  "i've":["i","have"], "you've":["you","have"], "we've":["we","have"], "they've":["they","have"],
  "i'll":["i","will"], "you'll":["you","will"], "we'll":["we","will"], "they'll":["they","will"],
  "he'll":["he","will"], "she'll":["she","will"], "it'll":["it","will"],
  "i'd":["i","would"], "you'd":["you","would"], "we'd":["we","would"], "they'd":["they","would"],
  "isn't":["is","not"], "aren't":["are","not"], "wasn't":["was","not"], "weren't":["were","not"],
  "don't":["do","not"], "doesn't":["does","not"], "didn't":["did","not"],
  "haven't":["have","not"], "hasn't":["has","not"], "hadn't":["had","not"],
  "won't":["will","not"], "wouldn't":["would","not"], "can't":["can","not"], "cannot":["can","not"],
  "couldn't":["could","not"], "shouldn't":["should","not"], "mustn't":["must","not"],
  "let's":["let","us"],
};
// "I'm a teacher." -> ["I'm","a","teacher"]
function tokenize(s){
  return (s.match(/[A-Za-z']+(?:-[A-Za-z']+)*|\d+/g) || []);
}
function norm(w){
  return w.toLowerCase()
    .replace(/[\u2019\u2018]/g, "'")          // akıllı tırnak -> düz
    .replace(/[.,!?;:"()]/g, "")
    .trim();
}
// normalize edilmiş token dizisi; kasıllaşmaları açar (karşılaştırma için)
function normSeq(text){
  const out = [];
  for (const raw of tokenize(text)){
    const n = norm(raw);
    if (CONTRACTIONS[n]) out.push(...CONTRACTIONS[n].map(x => ({n:x, raw})));
    else out.push({n, raw});
  }
  return out;
}
/* Türkçe kaynak cümle cinsiyet belirtmez ("O" = he/she/it) — İngilizce hedef tek cinsiyet
   seçmek zorunda kalır. Cevap yalnız zamir seçiminde farklıysa (başka hiçbir kelime farklı
   değilse) doğru kabul edilir. */
const PRONOUN_GROUPS = [["he","she","it"],["him","her","it"],["his","her","its"],["himself","herself","itself"]];
function pronounEquivalent(answer, target){
  const a = normSeq(answer), b = normSeq(target);
  if (a.length !== b.length) return false;
  for (let i=0;i<a.length;i++){
    if (a[i].n === b[i].n) continue;
    const grp = PRONOUN_GROUPS.find(g => g.includes(a[i].n) && g.includes(b[i].n));
    if (!grp) return false;
  }
  return true;
}
// iki cümleyi kelime kelime karşılaştır (LCS tabanlı diff, kasıllaşma-duyarlı)
function diffWords(answer, target){
  const a = normSeq(answer);
  const b = normSeq(target);
  // LCS matrisi
  const m = a.length, k = b.length;
  const dp = Array.from({length:m+1}, () => new Int32Array(k+1));
  for (let i=m-1;i>=0;i--)
    for (let j=k-1;j>=0;j--)
      dp[i][j] = a[i].n === b[j].n ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  // geri izleme -> hizalanmış diff
  const out = []; let i=0,j=0;
  while (i<m && j<k){
    if (a[i].n === b[j].n){ out.push({type:"ok", word:b[j].raw}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]){ out.push({type:"extra", word:a[i].raw}); i++; }
    else { out.push({type:"missing", word:b[j].raw}); j++; }
  }
  while (i<m){ out.push({type:"extra", word:a[i++].raw}); }
  while (j<k){ out.push({type:"missing", word:b[j++].raw}); }
  // aynı raw'ın açılmış parçaları yan yana tekrar etmesin (görsel temizlik)
  const seen = [], dedup = [];
  for (const p of out){
    const last = dedup[dedup.length-1];
    if (last && last.type === p.type && last.word === p.word && p.word.includes("'")) continue;
    dedup.push(p);
  }
  const correct = out.filter(o=>o.type==="ok").length;
  const total = k;
  return { parts: dedup, correct, total, ratio: total ? correct/total : 0 };
}

/* doğruluk -> otomatik not.  tam=easy, küçük hata=good, kötü=hard */
function autoGrade(ratio, hadExtra){
  if (ratio >= 0.999 && !hadExtra) return "easy";
  if (ratio >= 0.999 && hadExtra)  return "good";   // doğru ama fazladan kelime
  if (ratio >= 0.75)               return "good";
  return "hard";
}

/* ---------- cloze: gizlenecek kelime(leri) akıllı seç ---------- */
const FUNCTION_WORDS = new Set(("am is are was were be been being have has had do does did " +
  "will would can could shall should may might must to of in on at for from by with " +
  "about into over under than as not no a an the").split(" "));
function pickClozeIndices(target, tags){
  const toks = tokenize(target);
  if (toks.length <= 2) return [Math.max(0, toks.length-1)];
  const tagStr = (tags || "").toLowerCase();
  const score = toks.map((w,i) => {
    const n = norm(w);
    let s = 0;
    if (FUNCTION_WORDS.has(n)) s += 3;                  // gramer çekirdeği
    if (tagStr.includes("be") && /^(am|is|are|was|were|been)$/.test(n)) s += 4;
    if (tagStr.includes("preposition") && /^(in|on|at|for|to|of|with|from|by|about)$/.test(n)) s += 4;
    if (tagStr.includes("present-perfect") && /^(have|has|had)$/.test(n)) s += 4;
    if (tagStr.includes("modal") && /^(can|could|may|might|must|should|would|will)$/.test(n)) s += 4;
    if (tagStr.includes("passive") && /^(been|by)$/.test(n)) s += 3;
    if (i>0 && i<toks.length-1) s += 1;                 // ortadakileri biraz tercih et
    return s;
  });
  // en yüksek skorlu 1 (uzun cümlede 2) kelimeyi seç
  const order = toks.map((_,i)=>i).sort((x,y)=>score[y]-score[x]);
  const k = toks.length >= 9 ? 2 : 1;
  return order.slice(0, k).sort((a,b)=>a-b);
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

async function fetchFirst(paths){

    try{ const r = await fetch(p); if (r.ok) return await r.json(); }catch{}
  }
  throw new Error("Veri dosyaları bulunamadı: " + paths[0]);

async function loadData(){
  /* PARÇALI VERİ: eskiden data/sentences.json (8,5 MB / gzip 1,7 MB) tamamen
     inip bellekte gruplanıyordu. Artık yalnız index (gzip ~27 KB) iniyor;
     bir modülün cümleleri ancak o modüle girilince (gzip ~5 KB) yükleniyor.
       State.modMeta  : modül adı -> {lvl,mod,f,n,ids}   (index'ten)
       State.byModule : YALNIZCA yüklenmiş modüller + OCR (tembel önbellek)
       State.sentences: bellekteki tüm cümleler (örnek arama için) */
  const ix = await DHSent.index();
  State.index = ix;
  const byModule = new Map(), byLevel = new Map(), modMeta = new Map();
  for (const m of ix.modules){
    modMeta.set(m.mod, m);
    if (!byLevel.has(m.lvl)) byLevel.set(m.lvl, []);
    byLevel.get(m.lvl).push(m.mod);
  }
  State.modMeta = modMeta;
  State.byModule = byModule;
  State.byLevel = byLevel;
  State.sentences = [];
  State.srs = await srsAll();
  // OCR ile fotoğraftan eklenen cümleleri özel modül olarak ekle
  try{
    const ocr = JSON.parse(localStorage.getItem("dh-ocr-sentences-v1")||"[]")||[];
    if(Array.isArray(ocr) && ocr.length){
      const OCR_MODULE = "📷 OCR Cümlelerim";
      const arr = ocr.filter(s=>s&&s.en).map((s,i)=>({
        en:s.en, tr:s.tr||"", module:OCR_MODULE, level:"OCR", order:s.order!=null?s.order:i,
        id:s.id||("ocr-"+i)
      }));
      arr.sort((a,b)=>(a.order||0)-(b.order||0));
      State.byModule.set(OCR_MODULE, arr);
      /* OCR cümleleri index'te yok (yerel kayıtlar). Örnek arama ve id ile
         bulma bellekteki havuzdan yapıldığı için oraya da eklenmeleri gerekiyor. */
      for (const x of arr) State.sentences.push(x);
      if(!State.byLevel.has("OCR")) State.byLevel.set("OCR", []);
      State.byLevel.get("OCR").push(OCR_MODULE);
    }
  }catch(e){}
  /* Örnek cümle havuzunu arka planda yükle — açılışı bloklamaz, gelince
     baloncuk tüm cümlelerde arayabilir hâle gelir. */
  State.examples = [];
  DHSent.examples().then(function(ex){ State.examples = ex || []; }).catch(function(){});
  // sözlüğü arka planda yükle (popup için); başarısız olsa da uygulama çalışır
  try{ State.dictionary = await fetchFirst(DATA_PATHS.dictionary); }
  catch{ State.dictionary = {}; }
}

/* Bir modülün cümlelerini getirir; indirilmişse önbellekten verir.
   OCR gibi yerel (index'te olmayan) modüller doğrudan byModule'de durur. */
async function ensureModule(mod){
  if (State.byModule.has(mod)) return State.byModule.get(mod);
  const arr = await DHSent.module(mod);
  State.byModule.set(mod, arr);
  /* örnek arama bellekteki cümlelerden yapıldığı için havuza da ekle */
  for (const x of arr) State.sentences.push(x);
  return arr;
}
/* Bellekte olmayan id'leri parçalardan çeker (OCR gibi yerel kayıtlar dahil). */
async function sentencesByIds(ids){
  const yerel = new Map();
  for (const arr of State.byModule.values())
    for (const x of arr) yerel.set(String(x.id), x);
  const eksik = ids.filter(id => !yerel.has(String(id)));
  if (eksik.length){
    try{
      const m = await DHSent.byIds(eksik);
      for (const k in m) yerel.set(String(k), m[k]);
    }catch(e){}
  }
  return ids.map(id => yerel.get(String(id))).filter(Boolean);
}

/* bir kelimeyi içeren örnek cümleler (popup için) */
function examplesFor(word){
  const n = word.toLowerCase().replace(/[.,!?;:"()]/g,"");
  const out = [];
  /* KAPSAM: tüm 9417 cümlede aranır. Bir ara yalnız yüklenmiş modüllerde
     arıyordu; o zaman kullanıcının açmadığı modüldeki kelimeler için örnek
     çıkmıyordu. State.examples arka planda inen tam havuz (gzip ~294 KB);
     State.sentences ise OCR gibi havuzda olmayan yerel cümleleri taşıyor. */
  const havuz = (State.examples && State.examples.length)
    ? State.examples.concat(State.sentences.filter(s => String(s.id).indexOf("ocr-") === 0))
    : State.sentences;
  for (const s of havuz){
    if (tokenize(s.en).some(t => norm(t) === n)){ out.push(s); if (out.length >= 4) break; }
  }
  return out;
}

const LEVEL_ORDER = ["A1","A2","B1","B2","C1","C2"];
function dueCount(){
  const now = Date.now();
  return Object.values(State.srs).filter(s => (s.due||0) <= now && (s.rep||0) > 0).length;
}
function moduleProgress(mod){
  /* Cümleleri indirmeden say: index her modülün id listesini taşıyor.
     OCR gibi yerel modüller için bellekteki diziye düşer. */
  const meta = State.modMeta && State.modMeta.get(mod);
  const ids = meta ? (meta.ids || [])
                   : (State.byModule.get(mod) || []).map(s => s.id);
  let learned = 0;
  for (const id of ids){ const r = State.srs[id]; if (r && r.rep > 0) learned++; }
  return { learned, total: ids.length };
}

function openAuthSheet(){
  if (!fb()){

    return;
  }
  const sheet = document.createElement("div");
  sheet.className = "sheet-overlay";
  sheet.innerHTML = `
    <div class="sheet">
      <h3 class="sheet-title">Buluta bağlan</h3>
      <p class="sheet-desc">E-posta ve şifreyle bağlan; ilerlemen tüm cihazlarında otomatik eşitlensin. Hesabın yoksa aşağıdan oluştur.</p>
      <div class="auth-fields">
        <input class="auth-input" id="authEmail" type="email" placeholder="E-posta" autocomplete="email" />
        <input class="auth-input" id="authPass" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password" />

      <button class="btn sheet-btn" id="authSignup">Yeni hesap oluştur</button>
      <button class="auth-link" id="authReset">Şifremi unuttum</button>
      <button class="btn btn-ghost sheet-btn" id="authCancel">Kapat</button>
    </div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  const msg = sheet.querySelector("#authMsg");
  const email = () => sheet.querySelector("#authEmail").value.trim();
  const pass = () => sheet.querySelector("#authPass").value;
  sheet.onclick = e => { if (e.target === sheet) close(); };
  sheet.querySelector("#authCancel").onclick = close;

  function err(e){
    const code = (e && e.code) || "";
    if (code.includes("invalid-email")) return "E-posta adresi geçersiz.";
    if (code.includes("missing-password") || code.includes("weak-password")) return "Şifre en az 6 karakter olmalı.";
    if (code.includes("email-already-in-use")) return "Bu e-posta zaten kayıtlı. Giriş yapmayı dene.";
    if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "E-posta veya şifre hatalı.";
    if (code.includes("network")) return "İnternet bağlantısı yok gibi görünüyor.";
    return "Bir sorun oluştu. Tekrar dene.";
  }
  function busy(on){ sheet.querySelectorAll("button").forEach(b=>b.disabled=on); }

  sheet.querySelector("#authLogin").onclick = async () => {
    if (!email() || !pass()){ msg.textContent="E-posta ve şifre gir."; msg.className="sheet-note bad"; return; }
    busy(true); msg.textContent="Giriş yapılıyor…"; msg.className="sheet-note";
    try{ await fb().signIn(email(), pass()); close(); }
    catch(e){ busy(false); msg.textContent=err(e); msg.className="sheet-note bad"; }
  };
  sheet.querySelector("#authSignup").onclick = async () => {
    if (!email() || !pass()){ msg.textContent="E-posta ve şifre gir."; msg.className="sheet-note bad"; return; }
    busy(true); msg.textContent="Hesap oluşturuluyor…"; msg.className="sheet-note";
    try{ await fb().signUp(email(), pass()); close(); }
    catch(e){ busy(false); msg.textContent=err(e); msg.className="sheet-note bad"; }
  };
  sheet.querySelector("#authReset").onclick = async () => {
    if (!email()){ msg.textContent="Önce e-posta adresini yaz."; msg.className="sheet-note bad"; return; }
    try{ await fb().resetPassword(email()); msg.textContent="Sıfırlama bağlantısı e-postana gönderildi."; msg.className="sheet-note ok"; }
    catch(e){ msg.textContent=err(e); msg.className="sheet-note bad"; }
  };
}

/* ---------- yedek al / geri yükle sheet'i ---------- */
const LAST_BACKUP_KEY = "pmode:lastBackup";
function getLastBackup(){
  try{ return JSON.parse(localStorage.getItem(LAST_BACKUP_KEY) || "null"); }catch{ return null; }
}
function setLastBackup(info){
  try{ localStorage.setItem(LAST_BACKUP_KEY, JSON.stringify(info)); }catch{}
}
function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString("tr-TR", { day:"numeric", month:"long", year:"numeric" }) +
      " " + d.toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit" });
  }catch{ return iso; }
}
function daysSince(iso){
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

async function openBackupSheet(){
  const all = await srsAll();
  const count = Object.keys(all).length;
  const last = getLastBackup();
  const stale = last && daysSince(last.at) >= 7;

  // son yedek durumu metni
  let lastLine;
  if (!last) lastLine = `<span class="bk-status warn">Henüz hiç yedek almadın.</span>`;
  else if (stale) lastLine = `<span class="bk-status warn">Son yedek: ${fmtDate(last.at)} — ${daysSince(last.at)} gün önce. Güncellemek iyi olur.</span>`;
  else lastLine = `<span class="bk-status ok">Son yedek: ${fmtDate(last.at)}</span>`;

  const sheet = document.createElement("div");
  sheet.className = "sheet-overlay";
  sheet.innerHTML = `
    <div class="sheet">
      <h3 class="sheet-title">İlerlemeni taşı / yedekle</h3>

        <label class="btn sheet-btn bk-file-label">
          ⬆ Yedek dosyasını seç ve geri yükle
          <input type="file" id="bkFile" accept="application/json,.json" hidden />
        </label>
        <div class="bk-hint">Drive’dan indirdiğin <b>.json</b> dosyasını seç. İlerlemen birleştirilir; daha yeni olan kayıt korunur.</div>
      </div>

      <div id="bkPreview" class="bk-preview" hidden></div>
      <p class="sheet-note" id="bkMsg"></p>
      <button class="btn btn-ghost sheet-btn" id="bkCancel">Kapat</button>
    </div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  const msg = sheet.querySelector("#bkMsg");
  const preview = sheet.querySelector("#bkPreview");
  sheet.onclick = e => { if (e.target === sheet) close(); };
  sheet.querySelector("#bkCancel").onclick = close;

  // --- indir ---
  sheet.querySelector("#bkDownload").onclick = async () => {
    const at = new Date().toISOString();
    // Ek veriler: prompt, günlük takip, API anahtarları (localStorage) + hata defteri (IndexedDB)
    const extraKeys = ["dh_ai_prompt_teacher", "dh-study-tracker-v1", "groqApiKeys"];
    const ls = {};
    extraKeys.forEach(k => { try{ const v = localStorage.getItem(k); if (v != null) ls[k] = v; }catch(e){} });
    let errors = [];
    try{ if (window.LearningErrorDB && LearningErrorDB.all) errors = await LearningErrorDB.all(); }catch(e){}
    const payload = {
      app: "sentence-mode-practice",
      version: 2,
      exportedAt: at,
      count,
      srs: all,
      ls,
      errors,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dilharita-yedek-${at.slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setLastBackup({ at, count });
    msg.textContent = "✓ Tam yedek indirildi (ilerleme + prompt + hata defteri + takip).";
    msg.className = "sheet-note ok";
    const st = sheet.querySelector(".bk-status");
    if (st){ st.textContent = `Son yedek: ${fmtDate(at)}`; st.className = "bk-status ok"; }
  };

  // --- dosya seç → önce ÖNİZLE, sonra onayla ---
  sheet.querySelector("#bkFile").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try{
        data = JSON.parse(reader.result);
        const hasAny = data && (data.srs || data.ls || (Array.isArray(data.errors) && data.errors.length));
        if (!hasAny) throw new Error("biçim");
      }catch{
        preview.hidden = true;
        msg.textContent = "Bu dosya okunamadı. Uygulamadan indirdiğin .json yedeğini seçtiğinden emin ol.";
        msg.className = "sheet-note bad";
        return;
      }
      const incomingCount = data.srs ? Object.keys(data.srs).length : 0;
      const errCount = Array.isArray(data.errors) ? data.errors.length : 0;
      const hasExtras = !!(data.ls && Object.keys(data.ls).length);
      const when = data.exportedAt ? fmtDate(data.exportedAt) : "tarih bilinmiyor";
      msg.textContent = "";
      preview.hidden = false;
      preview.innerHTML = `
        <div class="bk-preview-head">Bu yedek yüklensin mi?</div>

        ${hasExtras ? `<div class="bk-preview-row"><span>Ayarlar (prompt, takip)</span><b>var</b></div>` : ""}
        <div class="bk-preview-row"><span>Alınma zamanı</span><b>${when}</b></div>
        <div class="bk-preview-actions">
          <button class="btn btn-ghost" id="bkCancelRestore">Vazgeç</button>
          <button class="btn btn-primary" id="bkConfirmRestore">Evet, yükle</button>
        </div>`;
      preview.querySelector("#bkCancelRestore").onclick = () => {
        preview.hidden = true; e.target.value = "";
      };
      preview.querySelector("#bkConfirmRestore").onclick = async () => {
        let written = 0, skipped = 0;
        // 1) SRS (cümle ilerlemesi) — daha yeni olanı koru
        if (data.srs){
          for (const id of Object.keys(data.srs)){
            const incoming = data.srs[id];
            if (!incoming || typeof incoming.rep !== "number") { skipped++; continue; }
            const existing = State.srs[id];
            if (!existing || (incoming.last||0) >= (existing.last||0)){
              await srsSet(id, incoming);
              State.srs[id] = incoming;
              written++;
            } else skipped++;
          }
        }
        // 2) Ayarlar: prompt, günlük takip, API anahtarları (localStorage)
        let lsWritten = 0;
        if (data.ls){
          for (const k of Object.keys(data.ls)){
            const v = data.ls[k];
            if (v == null || v === "") continue;
            try{ localStorage.setItem(k, v); lsWritten++; }catch(e){}
          }
        }
        // 3) Hata defteri — buluttan birleştirme mantığıyla (kopyasız)
        let errMerged = 0;
        if (Array.isArray(data.errors) && data.errors.length && window.LearningErrorDB && LearningErrorDB.bulkMerge){
          try{ errMerged = await LearningErrorDB.bulkMerge(data.errors); }catch(e){}
        }
        preview.hidden = true;
        const parts = [`${written} cümle güncellendi`];
        if (errMerged) parts.push(`${errMerged} hata kaydı eklendi`);
        if (lsWritten) parts.push(`ayarlar geri yüklendi`);
        msg.textContent = `✓ Geri yüklendi: ${parts.join(", ")}.`;
        msg.className = "sheet-note ok";
        cloudSaveSoon();
        setTimeout(() => { close(); renderPicker(); }, 1300);
      };
    };
    reader.readAsText(file);
  };
}

async function startModuleSession(mod, resumeIdx){
  State.srs = await mAll();   // aktif moda ait SRS'i yükle (üretim ya da dinleme)
  const arr = (await ensureModule(mod) || []).slice();
  const now = Date.now();
  // Öncelik: (1) vadesi gelmiş tekrarlar [en geciken önce], (2) hiç çalışılmamış yeni
  // cümleler [modül sırasıyla], (3) ileride vadesi gelecek olgunlar [en yakın önce].
  function bucket(s){
    const r = State.srs[s.id];
    if (!r || (r.rep||0) === 0) return 1;                 // yeni
    if ((r.due||0) <= now) return 0;                      // vadesi gelmiş tekrar
    return 2;                                             // beklemede
  }
  arr.sort((a,b) => {
    const ba = bucket(a), bb = bucket(b);
    if (ba !== bb) return ba - bb;
    if (ba === 0) return (State.srs[a.id].due||0) - (State.srs[b.id].due||0); // en geciken
    if (ba === 1) return (a.order||0) - (b.order||0);                          // modül sırası
    return (State.srs[a.id].due||0) - (State.srs[b.id].due||0);                // en yakın vade
  });
  arr=arr.filter(function(s){return !practiceIgnored(s.id);});
  State.queue = arr;
  // kaldığın yerden devam: kuyruk yeniden kurulduğu için idx'i sınırla
  State.idx = resumeIdx ? Math.min(Math.max(0, resumeIdx), arr.length - 1) : 0;
  State.activeModule = mod;            // pozisyon kaydı için
  State.sessionTitle = mod.replace(/^[A-C]\d-M\d+\s*/, "");
  renderCard();
}
async function startDueSession(){
  State.srs = await mAll();
  const now = Date.now();
  /* Eskiden 9417 cümlenin tamamı taranıyordu. Vadesi gelmiş olabilecek tek şey
     SRS kaydı OLAN cümleler; o yüzden doğrudan SRS anahtarlarından gidiyoruz —
     hem doğru hem çok daha az veri. */
  const dueIds = Object.keys(State.srs)
    .filter(id => { const r = State.srs[id]; return r && (r.due||0) <= now && r.rep > 0; })
    .sort((a,b) => (State.srs[a].due||0) - (State.srs[b].due||0));
  const due = await sentencesByIds(dueIds);
  // interleaving: farklı modüllerden karışsın
  State.queue = due.filter(function(s){return !practiceIgnored(s.id);});
  State.idx = 0;
  State.activeModule = null;           // due oturumu pozisyon kaydı tutmaz
  State.sessionTitle = "Tekrar oturumu";
  renderCard();
}

   Her kaynak kendi başlığını ve sayacını taşır; hata telafisi yeni cümle

function isoDay(d){ var x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function asSentence(x,prefix,i){
  if(!x)return null;
  if(typeof x==="string")x={en:x};
  var en=String(x.en||x.target||x.sentenceEN||x.correctEnglish||"").trim(), tr=String(x.tr||x.sentenceTR||"").trim();
  if(!en)return null;
  return {id:String(x.id||prefix+"-"+i),en:en,tr:tr,module:x.module||"Kişisel çalışma",level:x.level||"",topic:x.topic||"",grammarStructure:x.grammar||x.grammarStructure||"",commonMistake:x.commonMistake||"",_errorId:x._errorId||"",_source:prefix};
}
async function idsToSentences(ids){ return (await sentencesByIds(Array.from(new Set(ids.filter(Boolean))))||[]); }
async function sourceItems(kind){
  var day=isoDay(), now=Date.now(), out=[], i=0;
  if(kind==="today"||kind==="pronunciation"||kind==="weekly"){
    var mir={}; try{mir=JSON.parse(localStorage.getItem("dh-progress-mirror-v1")||"{}")||{};}catch(e){}
    var since=kind==="weekly"?now-7*86400000:new Date(day+"T00:00:00").getTime();
    /* Yeni cümle ekranı ilerlemeyi doğrudan ortak sentence-mode IndexedDB'sindeki
       srs:<id>.last alanına yazar. DHProgress aynası o ekranda yüklenmediği için
       yalnızca aynaya bakmak, ana sayfada 5/5 görünen bir günde boş kuyruk
       üretip "Bugüne dön" döngüsüne sokuyordu. İki kanıtı birleştiriyoruz. */
    var ids=Object.keys(mir).filter(function(k){return k.indexOf("sentence:")===0&&Number(mir[k]&&mir[k][1]||0)>=since;}).map(function(k){return k.slice(9);});
    Object.keys(State.srs||{}).forEach(function(id){
      var r=State.srs[id]||{};
      if(Number(r.last||0)>=since)ids.push(id);
    });
    /* Aynı gün üretimde cevaplanan cümleleri yeniden sorma; böylece 1/3'ten
       dönüldüğünde gerçekten kalan 2 cümleyle devam edilir. */
    if(kind==="today"){
      var done={}; try{done=JSON.parse(localStorage.getItem("dh-practice-evidence-"+day)||"{}")||{};}catch(e){}
      ids=ids.filter(function(id){return !done["today:"+id];});
    }
    out=await idsToSentences(ids);
  }
  if(kind==="errors"||kind==="chat-errors"||kind==="level-gap"||kind==="weekly"){
    var er=[]; try{er=await LearningErrorDB.all();}catch(e){}
    er=er.filter(function(r){
      var due=new Date(r.dueAt||0).getTime()||0; if(due>now)return false;
      if(kind==="chat-errors")return /chat|teacher|conversation|speaking/i.test(String(r.source||""));
      if(kind==="level-gap"){ var order=["A1","A2","B1","B2","C1","C2"], me=String(localStorage.getItem("dh-level")||""), a=order.indexOf(String(r.level||"")), b=order.indexOf(me); return a>=0&&b>0&&a<b; }
      return true;
    });
    out=out.concat(er.map(function(r){var s=asSentence(r,"error",i++);if(s)s._errorId=r.id;return s;}).filter(Boolean));
  }
  if(kind==="gemini"||kind==="weekly"){
    try{var gr=JSON.parse(localStorage.getItem("dh-gemini-report-v1")||"null"), roots=gr&&gr.data&&gr.data.kokNedenler||[];
      if(roots.length){var ri=Math.floor(new Date(day+"T12:00:00").getTime()/86400000)%roots.length;
        (roots[ri].alistirmalar||[]).forEach(function(q){out.push(asSentence(q,"gemini-"+ri,i++));});}}
    catch(e){}
  }
  if(kind==="hard-reviews"||kind==="weekly"){
    try{var hard=JSON.parse(localStorage.getItem("dh-hard-reviews-"+day)||"[]")||[];out=out.concat(hard.map(function(x){return asSentence(x,"hard",i++);}).filter(Boolean));}catch(e){}
  }
  if(kind==="speaking-prep"){
    try{var km=JSON.parse(localStorage.getItem("dh-konusma-gun-"+day)||"null");out=(km&&km.cumleler||[]).map(function(x){return asSentence(x,"speak",i++);}).filter(Boolean);}catch(e){}
  }
  /* aynı İngilizce cümleyi tek oturumda iki kez sorma */
  var seen={}; return out.filter(function(s){if(typeof practiceIgnored==="function"&&practiceIgnored(s.id))return false;var k=s.en.toLowerCase().replace(/[^a-z0-9']+/g," ").trim();if(seen[k])return false;seen[k]=1;return true;});
}

  State.queue=arr.slice(0,n); State.idx=0; State.activeModule=null; State.sessionTitle=SOURCE_TITLE[kind]||"Üretim çalışması";

/* ---------- ENTER KISAYOLU (tek yerde, bir kez kurulur) ----------
   İki aşamalı:
     • Cevap verilmemişken  -> "Kontrol et"
     • Cevap verilmiş/notlanmışken -> "İleri"
   Metin kutuları kendi Enter'ını zaten işliyor (cloze sıradaki boşluğa geçer,
   full/listen doğrudan kontrol eder) — orada bu dinleyici DEVREYE GİRMEZ, çift
   tetikleme olmasın diye. Buradaki asıl işlev: (a) "kelimeleri sırala" katmanında
   klavyeden kontrol, (b) her katmanda cevap sonrası Enter ile İleri. */
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;

  var t=e.target, tag=(t && t.tagName || "").toLowerCase();
  var typing = (tag==="textarea" || tag==="input" || (t && t.isContentEditable));

  if (!State.answered){
    // Cevap aşaması: metin kutusundaysa oranın kendi Enter mantığı çalışsın, karışma.
    if (typing) return;
    var cb=document.getElementById("checkBtn");
    if (cb && !cb.disabled){ e.preventDefault(); cb.click(); }
    return;
  }

  // Not verilmiş: Enter = İleri (metin kutusunda olsa bile, cevap bitti).
  var nb=document.getElementById("nextBtn");
  if (nb){ e.preventDefault(); nb.click(); }
});

/* ---- LAYER 1: kelime sıralama ---- */
function renderOrderLayer(s){
  const target = s.en;
  const toks = tokenize(target);
  const bank = shuffle(toks.map((w,i) => ({w, i})));
  const placed = []; // {w, i}

  const area = document.getElementById("answerArea");
  const sttOK = !!STT;
  area.innerHTML = `
    <div class="layer-label"><span class="dot"></span>Kelimeleri doğru sıraya diz${sttOK ? " — ya da mikrofonla oku" : ""}</div>
    <div class="build-line" id="buildLine"></div>
    <div class="bank" id="bank"></div>
    ${sttOK ? `<div class="mic-row"><button class="mic-btn" id="micOrder">🎙️ Cümleyi oku</button></div>` : ""}
    <div class="actions">
      <button class="btn btn-ghost" id="clearBtn">Temizle</button>
      <button class="btn btn-primary" id="checkBtn" disabled>Kontrol et</button>
    </div>`;

  const bankEl = document.getElementById("bank");
  const lineEl = document.getElementById("buildLine");
  const checkBtn = document.getElementById("checkBtn");

  function draw(){
    bankEl.innerHTML = bank.map((t,bi) => {
      const used = placed.some(p => p.bi === bi);
      return `<button class="tok-btn ${used?"placed":""}" data-bi="${bi}">${esc(t.w)}</button>`;
    }).join("");
    lineEl.innerHTML = placed.map((p,pi) =>
      `<button class="tok-chip" data-pi="${pi}">${esc(bank[p.bi].w)}</button>`).join("");
    lineEl.classList.toggle("filled", placed.length>0);
    checkBtn.disabled = placed.length !== toks.length;
    bankEl.querySelectorAll(".tok-btn").forEach(b => b.onclick = () => {
      const bi = +b.dataset.bi;
      if (placed.some(p=>p.bi===bi)) return;
      placed.push({bi}); draw();
    });
    lineEl.querySelectorAll(".tok-chip").forEach(c => c.onclick = () => {
      placed.splice(+c.dataset.pi, 1); draw();
    });
  }
  draw();

  // mikrofonla otomatik dizme: söylenen kelimeleri bankadaki kelimelerle eşleştir
  if (sttOK){
    const micBtn = document.getElementById("micOrder");
    let rec = null, listening = false;
    micBtn.onclick = () => {
      if (listening){ rec && rec.stop(); return; }
      rec = new STT();
      rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onstart = () => { listening = true; micBtn.classList.add("listening"); micBtn.innerHTML = `<span class="mic-pulse"></span> Dinleniyor…`; };
      rec.onresult = e => {
        const heard = tokenize(e.results[0][0].transcript).map(norm);
        // duyulan sırayla bankadan eşleştir
        placed.length = 0;
        const usedBi = new Set();
        for (const hw of heard){
          let bi = bank.findIndex((t,i) => !usedBi.has(i) && norm(t.w) === hw);
          if (bi === -1) continue;
          usedBi.add(bi); placed.push({bi});
        }
        draw();
      };
      rec.onerror = () => {};
      rec.onend = () => { listening = false; micBtn.classList.remove("listening"); micBtn.innerHTML = "🎙️ Cümleyi oku"; };
      try{ rec.start(); }catch{}
    };
  }

  document.getElementById("clearBtn").onclick = () => { placed.length = 0; draw(); };
  checkBtn.onclick = () => {
    const answer = placed.map(p => bank[p.bi].w).join(" ");
    evaluate(s, answer, "order");
  };
}

/* ---- LAYER 2: cloze ---- */
function renderClozeLayer(s){
  const target = s.en;
  const toks = tokenize(target);
  const gapIdx = new Set(pickClozeIndices(target, s.grammarTags));
  // cümleyi parçalara böl: gizli olanlar input olur
  let html = `<div class="layer-label"><span class="dot"></span>Eksik kelimeyi yaz</div><div class="cloze-sentence">`;
  let inputN = 0;
  // token'ları orijinal metindeki sırayla yeniden kur (basit join, noktalama kabası)
  toks.forEach((w,i) => {
    if (gapIdx.has(i)){
      html += `<input class="cloze-input-inline" data-gi="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" style="display:inline-block;width:${Math.max(70, w.length*16)}px;min-width:70px;background:var(--bg-soft);border:none;border-bottom:2px solid var(--accent);color:var(--accent);font:800 19px Nunito,sans-serif;text-align:center;margin:0 3px;padding:2px 4px" /> `;
      inputN++;
    } else {
      html += `<span class="cloze-word">${esc(w)}</span> `;
    }
  });
  html += `</div>
    <div class="actions">
      <button class="btn btn-ghost" id="hearBtn">🔊 Dinle</button>
      <button class="btn btn-primary" id="checkBtn">Kontrol et</button>
    </div>`;
  const area = document.getElementById("answerArea");
  area.innerHTML = html;

  const inputs = [...area.querySelectorAll(".cloze-input-inline")];
  if (inputs[0]) inputs[0].focus();
  inputs.forEach((inp, k) => {
    inp.onkeydown = e => {
      if (State.answered) return;   // cevap verildi -> Enter "İleri" olsun
      if (e.key === "Enter" && !e.isComposing){
        e.preventDefault();
        if (k < inputs.length-1) inputs[k+1].focus();   // sıradaki boşluğa geç
        else document.getElementById("checkBtn").click();
      }
    };
  });
  document.getElementById("hearBtn").onclick = () => speak(s.en);
  document.getElementById("checkBtn").onclick = () => {
    // cevabı tam cümle olarak yeniden kur (gizli yerlere kullanıcının yazdığını koy)
    const answerToks = toks.map((w,i) => {
      if (gapIdx.has(i)){
        const inp = inputs.find(x => +x.dataset.gi === i);
        return (inp && inp.value.trim()) || "___";
      }
      return w;
    });
    // BOŞLUK PUANLAMASI: cloze'da yalnız GİZLENEN kelimeler test edilir — kısaltmalar (isn't = is not)
    // de eşdeğer kabul edilir (mevcut CONTRACTIONS haritası kullanılır).
    function expandForCompare(w){
      var n=norm(w);
      var exp=CONTRACTIONS[n];
      return exp ? exp.join(" ") : n;
    }
    var gapTotal=0, gapCorrect=0;
    gapIdx.forEach(function(i){
      gapTotal++;
      var inp = inputs.find(x => +x.dataset.gi === i);
      var userRaw = ((inp && inp.value)||"").trim();
      var userExp = userRaw.split(/\s+/).map(expandForCompare).join(" ");
      var correctExp = expandForCompare(toks[i]);
      if(userRaw && userExp===correctExp) gapCorrect++;
    });
    window.__dhClozeGapStats = { correct:gapCorrect, total:gapTotal };
    evaluate(s, answerToks.join(" "), "cloze");
  };
}

/* ============================================================
   DEĞERLENDİRME + GERİ BİLDİRİM
   ============================================================ */
async function evaluate(s, answer, layer){
  if (State.answered) return;
  State.answered = true;
  State.aiHistory.push({reference:s.en,studentAnswer:answer,turkish:s.tr||"",layer:layer,module:s.module||""});
  // grade-override doğru hesaplansın diye notlamadan ÖNCEKİ durumu sakla
  State._gradeBase = State._gradeBase || {};
  State._gradeBase[s.id] = await mGet(s.id);   // null olabilir (ilk kez)
  const d = diffWords(answer, s.en);
  const hadExtra = d.parts.some(p => p.type === "extra");
  var grade;
  if(pronounEquivalent(answer, s.en)){
    grade="easy"; d.ratio=100; d.parts=d.parts.map(p=>({type:"ok",word:p.word}));  // zamir dışında tam doğru
  } else if(layer==="cloze" && window.__dhClozeGapStats && window.__dhClozeGapStats.total>0){
    var gs=window.__dhClozeGapStats; window.__dhClozeGapStats=null;
    var gapRatio = gs.correct/gs.total;
    grade = gapRatio>=0.999 ? "easy" : gapRatio>=0.5 ? "good" : "hard";
    d.ratio = Math.round(gapRatio*100);   // geri bildirim ekranında da gerçek (boşluk bazlı) skor görünsün
  } else {
    grade = autoGrade(d.ratio, hadExtra);
  }
  /* Esdeger/alternatif kelime dizilimi sonucunda karar dogruysa fark satiri
     kirmizi "hata" gostermemeli. Ekrandaki karar ile renklendirme ayni olsun. */
  if(grade==="easy") d.parts=tokenize(answer).map(function(w){return {type:"ok",word:w};});
  const next = srsGrade(State._gradeBase[s.id], grade);
  await mSet(s.id, next);
  State.srs[s.id] = next;   // yereli güncelle
  recordSourceProgress(s);
  /* Hata Defteri kaynağından gelen kayıt da kendi SRS durumunu ilerletsin.
     Üç doğru çözümde ana kayıt mezun edilir; practice SRS'si ayrı kalmaz. */
  if(s._errorId&&window.LearningErrorDB&&LearningErrorDB.markReviewed){
    try{var rr=await LearningErrorDB.markReviewed(s._errorId,{grade:grade,score:d.ratio});if(grade==="easy"&&rr&&Number(rr.reviewCount||0)>=3)await LearningErrorDB.deleteMany([s._errorId]);}catch(e){}
  }
  cloudSaveSoon();
  // Hata defterine yaz (yanlış/eksik cevapları). easy+yüksek skor kendi filtrelenir.
  try{
    if (window.LearningErrorDB && typeof window.LearningErrorDB.logFromPractice === "function"){
      window.LearningErrorDB.logFromPractice({ sentence:s, answer:answer, grade:grade, layer:layer, diff:d });
    }
  }catch(e){ console.warn("Hata defteri kaydı atlandı:", e); }
  renderFeedback(s, d, grade, layer);
  try{ if(window.DHProgress&&DHProgress.recordResult) DHProgress.recordResult("sentence:"+s.id, (grade==="easy"||grade==="good")); }catch(e){}
  try{ window.dhCoachEvaluate && window.dhCoachEvaluate({sentenceId:s.id, en:s.en, answer:answer, ok:(grade==="easy"||grade==="good"), grade:grade, commonMistake:s.commonMistake, grammar:s.grammarStructure||s.pattern||"", module:s.module||"", layer:layer, score:d.ratio!=null?(d.ratio<=1?d.ratio*100:d.ratio):null}); }catch(e){}
  // tekrar.html ile AYNI MANTIK: cevap tam doğru değilse iki düğme sunulur —
  // (1) 🤖 AI'ya "anlamca doğru mu?" diye sor (düzenlenebilir kriter promptuyla)
  // (2) ✨ Gemini'de aç (anahtar gerekmez, karşılaştırmayı yeni sekmede açar)
  // Otomatik çağrı YOK: token ancak sen istersen harcanır.
  //
  // EŞİK NOTU: alt sınır (%15) yalnız "full"da anlamlı — orada gerçekten alakasız
  // bir şey yazılmış olabilir. cloze/order'da d.ratio BOŞLUK oranıdır (tek boşluklu
  // cümlede yanlış cevap = 0), oysa answer yine TAM CÜMLEDİR; alt sınır uygulanırsa
  // düğmeler hiç çıkmaz. Bu yüzden alt sınır sadece full katmanında uygulanır.
  var _r = (d.ratio!=null && d.ratio<=1) ? d.ratio*100 : d.ratio;   // 0-1 veya 0-100 gelebiliyor
  var _minOk = (layer==="full") ? (_r>=15) : true;
  if(grade!=="easy" && answer.trim().length>2 && _minOk && _r<99.9){
    renderSemRow(s, answer);
  }
}

/* AI'ya EVET/HAYIR sorar. NOT: notu (SRS) DEĞİŞTİRMEZ — sadece bilgi verir.
   "Kolay"a çevirmek istersen aşağıdaki grade düğmelerini kullanabilirsin. */
function dhSemanticCheck(s, answer, row){
  var btn=document.getElementById("btnTriggerSem");
  if(btn) btn.style.display="none";
  var note=document.createElement("div");
  note.className="sem-note";
  note.textContent="🤖 Cümlen anlamca kontrol ediliyor…";
  row.insertAdjacentElement("afterend", note);

  var semMsgs=[
    {role:"system", content: dhGetAiPrompt()},
    {role:"user",   content: "Referans: "+s.en+"\nÖğrenci: "+answer}
  ];
  function runCheck(tok, isRetry){
    DHProviders.chat(semMsgs,{temperature:0,max_tokens:tok,cacheType:"practice-answer-evaluation",cacheInput:semMsgs.filter(function(m){return m.role!=="system";})}).then(function(out){
      var t=String(out||"").trim();
      if(/evet|yes/i.test(t)){
        note.style.color="#4ade80";
        note.innerHTML="🤖 ✓ Anlamca doğru — farklı ama geçerli bir ifade kurmuşsun."
          + "<br><span style='color:#9fb3d9'>Notunu değiştirmek istersen aşağıdan <b>Kolay</b>'ı seçebilirsin.</span>";
      } else if(/hayır|hayir|no/i.test(t)){
        note.style.color="#f87171";
        note.textContent="🤖 Belirlediğin kriterlere göre anlam veya yapı farklı çıktı — yukarıdaki açıklamalara bak.";
      } else if(!isRetry){
        runCheck(220, true);
      } else {
        note.style.color="#f87171";
        note.textContent="🤖 Model net bir yanıt üretemedi.";
      }
    }).catch(function(err){
      if(!isRetry && err && err.code==="empty") return runCheck(220, true);
      note.style.color="#f87171";
      note.textContent = (err && err.code==="no-key")
        ? "🤖 Kontrol başarısız: API anahtarı bulunamadı."
        : "🤖 Kontrol başarısız: Sağlayıcı şu an yanıt vermiyor.";
    });
  }
  runCheck(120, false);
}

function verdictMeta(grade){
  if (grade === "easy") return { cls:"verdict-ok", emoji:"🎯", text:"Tam isabet!" };
  if (grade === "good") return { cls:"verdict-close", emoji:"👍", text:"Neredeyse!" };
  return { cls:"verdict-miss", emoji:"📌", text:"Birlikte bakalım" };
}

function renderFeedback(s, d, grade, layer){
  const v = verdictMeta(grade);
  const diffHtml = d.parts.map(p => {
    if (p.type === "ok")      return `<span class="w-ok">${esc(p.word)}</span>`;
    if (p.type === "extra")   return `<span class="w-extra">${esc(p.word)}</span>`;
    if (p.type === "missing") return `<span class="w-missing">${esc(p.word)}</span>`;
    return esc(p.word);
  }).join(" ");

  const showLearn = grade === "hard" || grade === "good";
  let learnHtml = "";
  if (showLearn && s.commonMistake){
    learnHtml += `<div class="learn-box mistake">
      <div class="learn-label">Sık yapılan hata</div>
      <div class="learn-text">${esc(s.commonMistake)}</div></div>`;
  }
  if (showLearn && s.aiExplain){
    learnHtml += `<div class="learn-box">
      <div class="learn-label">Neden böyle?</div>
      <div class="learn-text">${esc(s.aiExplain)}</div></div>`;
  }

  const fb = document.getElementById("feedbackArea");
  fb.innerHTML = `
    <div class="feedback">
      <div class="verdict ${v.cls}">
        <span class="verdict-emoji">${v.emoji}</span>
        <span class="verdict-text">${v.text}</span>
      </div>

        ${s.trPron ? `<div class="answer-trpron">🗣️ ${esc(s.trPron)}</div>` : ""}

      </div>
      <button class="audio-btn" id="fbAudio">🔊 Doğru telaffuzu dinle</button>

  const dock = document.getElementById("gradeDock");
  const gradeHtml = `

        <div class="grade-btns">

        </div>
      </div>
      <button class="next-btn" id="nextBtn">İleri ›</button>
      <button class="btn btn-ghost" id="neverAskBtn" type="button" style="width:100%;margin-top:10px;color:#fca5a5;border-color:#7f1d1d">🚫 Bunu tekrar sorma</button>`;
  if (dock) dock.innerHTML = gradeHtml;
  else fb.querySelector(".feedback").insertAdjacentHTML("beforeend", gradeHtml);

  document.getElementById("fbAudio").onclick = () => speak(s.en);
  fb.querySelectorAll(".wp-tok").forEach(t => t.onclick = () => openWordPopup(t.textContent));
  if (layer !== "order") setTimeout(() => speak(s.en), 250);

  const gradeRoot = dock || fb;
  gradeRoot.querySelectorAll(".gbtn").forEach(b => b.onclick = async () => {
    // Odağı düğmede bırakma: aksi halde sonraki Enter, tarayıcının varsayılan
    // davranışıyla AYNI not düğmesini tekrar tıklar. Enter "İleri" olmalı.
    try{ b.blur(); }catch(e){}
    const g = b.dataset.g;
    const prevBase = State._gradeBase && State._gradeBase[s.id];
    const base = prevBase !== undefined ? prevBase : null;
    const next = srsGrade(base, g);
    await mSet(s.id, next);
    State.srs[s.id] = next;
    cloudSaveSoon();
    gradeRoot.querySelectorAll(".gbtn").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    const q = gradeRoot.querySelector(".grade-q");
    if (q) q.innerHTML = `Güncellendi: <b>${gradeTR(g)}</b>`;
  });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn){
    nextBtn.onclick = () => {
      State.idx++;
      if (State.activeModule){ savePos(State.activeModule, State.idx, State.queue.length); cloudSaveSoon(); }
      renderCard();
    };
  }
  const neverAskBtn=document.getElementById("neverAskBtn");
  if(neverAskBtn) neverAskBtn.onclick=function(){ practiceNeverAsk(s); };
}
function gradeTR(g){ return g==="hard"?"Zor":g==="easy"?"Kolay":"Normal"; }

/* ============================================================
   EKRAN: oturum bitti
   ============================================================ */
function markInsightDone(){
  if(State.source!=="errors"&&State.source!=="chat-errors"&&State.source!=="level-gap")return;
  try{var q=new URLSearchParams(location.search),type=q.get("odak")||"all";localStorage.setItem("dh-insight-done-"+isoDay()+"-"+type,JSON.stringify({at:Date.now(),source:State.source,total:State.queue.length}));}catch(e){}
}
function renderSessionDone(){
  markInsightDone();
  // oturum tamamlandı: bu modülün "devam et" pozisyonunu sil
  if (State.activeModule){ clearPos(State.activeModule); cloudSaveSoon(); }
  root.innerHTML = `
  <div class="state">
    <div style="font-size:48px">✅</div>
    <h2>Oturum tamam</h2>
    <p>${State.queue.length} cümleyi çalıştın. İlerlemen kaydedildi — tekrar zamanı geldiğinde bu cümleler yeniden karşına çıkacak.</p>
    ${new URLSearchParams(location.search).get("next")?'<button class="btn btn-primary" id="nextBtn">Sonraki ad?ma ge?</button>':''}
    <button class="btn btn-primary" id="homeBtn">Ana sayfaya dön</button>
    <button class="btn btn-ghost" id="sessionGeminiBtn">💎 Tüm oturumu Gemini'ye değerlendir</button>
  </div>`;
  document.getElementById("homeBtn").onclick = () => renderPicker();
  document.getElementById("sessionGeminiBtn").onclick = function(){ if(window.DHGeminiQuality) DHGeminiQuality.sessionReport(State.aiHistory,State.sessionTitle||"Cümle oturumu"); };
  var nb=document.getElementById("nextBtn"); if(nb)nb.onclick=function(){ location.href=new URLSearchParams(location.search).get("next")||"./index.html"; };
  if(window.DHSessionSummary) DHSessionSummary.enhance(root.querySelector(".state"),{title:State.sessionTitle||"Cümle oturumu tamam",total:State.queue.length});
}

/* ============================================================
   BAŞLAT
   ============================================================ */
async function boot(){
  renderLoading();
  // storage-bridge belleği IndexedDB'den yüklenene kadar bekle; yoksa
  // localStorage.getItem (OCR cümleleri, prompt vb.) boş dönebilir.
  await waitForStorage();
  try{
    await loadData();
    const restored = await restoreTeacherReturnIfNeeded();
    if (!restored){
      var qp = new URLSearchParams(location.search);
      var wantMod = qp.get("mod");
      var autoKind=qp.get("auto")||"", wantAuto = autoKind==="due";
      if(wantMod && ((State.modMeta && State.modMeta.has(wantMod)) || (State.byModule && State.byModule.has(wantMod)))) await startModuleSession(wantMod);
      else if(wantAuto) await startDueSession();
      else if(["today","errors","gemini","hard-reviews","chat-errors","speaking-prep","pronunciation","level-gap","weekly"].indexOf(autoKind)>=0) await startSourceSession(autoKind,qp.get("limit"));
      else renderPicker();
    }
    setupCloud();
  }catch(e){
    renderError(e.message || String(e));
  }
}

function waitForStorage(){
  return new Promise(function(resolve){
    if (typeof window.__dhStorageReady === "undefined" || window.__dhStorageReady){ resolve(); return; }
    var done=false;
    function go(){ if(done) return; done=true; resolve(); }
    window.addEventListener("dh-storage-ready", go, { once:true });
    setTimeout(go, 2000);  // güvenlik: en fazla 2 sn bekle
  });
}

// Firebase hazır olunca auth dinleyicisini kur
function setupCloud(){
  const start = () => {
    if (!fb()) { updateCloudBadge(); return; }   // SDK yüklenemedi (offline vb.) — yerel devam
    fb().onAuth(async (user) => {
      if (user){
        Cloud.user = { uid: user.uid, email: user.email };
        updateCloudBadge();
        await cloudInitialSync();
        // senkron sonrası ekranı tazele (yeni gelen ilerleme görünsün)
        if (document.querySelector(".picker")) renderPicker();
      } else {
        Cloud.user = null;
        updateCloudBadge();
      }
    });
  };
  if (window.__fb || window.__fbError) start();
  else window.addEventListener("fb-ready", start, { once:true });
}
boot();

})();
