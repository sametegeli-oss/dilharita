name: Quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Content validation
        run: node tools/validate-content.mjs
      - name: Automated tests
        shell: pwsh
        run: ./run-tests.ps1
      - name: Atlas V2 tests
        working-directory: atlas-v2
        run: npm ci && npm test
