<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dil Harita — Koç Modu (Prototip)</title>
<style>
  :root{ --bg:#0a1424; --panel:#10264a; --panel2:#0b172d; --line:#1e3a5f; --txt:#e8eef7; --dim:#9fb3d9; --gold:#f59e0b; --grn:#059669; --grn2:#10b981; --pur:#7c3aed; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12315e 0%,var(--bg) 55%);color:var(--txt);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:520px;padding:16px 16px 96px;flex:1;display:flex;flex-direction:column}
  /* üst şerit */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .streak{display:flex;align-items:center;gap:7px;background:#2a1206;border:1px solid #7c3f0a;color:#fdba74;
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
  .goal{font-size:12px;color:var(--dim)}
  /* koç */
  .coachWrap{display:flex;flex-direction:column;align-items:center;margin-top:8px}
  .avatarRing{position:relative;width:190px;height:190px;border-radius:50%;padding:5px;
    background:conic-gradient(from 180deg,var(--gold),var(--grn2),var(--pur),var(--gold));transition:.3s}
  .avatarRing.speaking{box-shadow:0 0 0 6px #10b98122, 0 0 40px #10b98155}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#e9e4dc;display:block}
  .coachName{margin-top:12px;font-weight:900;font-size:17px}
  .coachRole{font-size:12px;color:var(--dim);margin-top:2px}
  /* balon */
  .bubble{margin-top:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:18px;padding:16px 18px;font-size:15.5px;line-height:1.55;min-height:74px;position:relative;width:100%}
  .bubble:after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:16px;height:16px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .caret{display:inline-block;width:8px;height:18px;background:var(--grn2);vertical-align:-3px;margin-left:2px;animation:bl .8s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  /* aksiyonlar */
  .actions{margin-top:16px;display:flex;flex-direction:column;gap:10px;width:100%}
  .act{appearance:none;border:0;cursor:pointer;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;
    color:#fff;text-align:left;display:flex;align-items:center;gap:10px;transition:.15s;opacity:0;transform:translateY(6px)}
  .act.in{opacity:1;transform:none}
  .act.primary{background:linear-gradient(135deg,var(--grn),var(--grn2))}
  .act.ghost{background:#16294a;border:1px solid var(--line);color:var(--txt)}
  .act:active{transform:scale(.98)}
  /* alt bar */
  .ask{display:flex;gap:8px;margin-top:18px;width:100%}
  .ask input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:14px}
  .ask button{background:var(--pur);border:0;color:#fff;border-radius:12px;padding:0 15px;font-weight:800;cursor:pointer}
  .menuBtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16294a99;backdrop-filter:blur(6px);
    border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;z-index:5}
  /* çekmece */
  .sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.open{display:flex}
  .sheetC{background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);
    width:100%;max-width:520px;max-height:78vh;overflow:auto;padding:16px 16px 26px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}}
  .sheetC h3{margin:4px 0 12px;font-size:15px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--txt)}
  .mitem small{display:block;color:var(--dim);font-weight:500;font-size:11.5px;margin-top:3px}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0d9488;color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:30;pointer-events:none}
  .toast.show{opacity:1}
  .hint{text-align:center;color:var(--dim);font-size:13px;margin-top:14px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="streak">🔥 <span id="streakN">11</span> gün</div>
      <div class="goal">🎯 Günlük hedef: <b id="goalN" style="color:#fff">0/5</b> cümle</div>
    </div>

    <div class="coachWrap">
      <div class="avatarRing" id="ring"><img class="avatar" id="face" alt="Koç"></div>
      <div class="coachName">Koç · Mr. Ali</div>
      <div class="coachRole">Türkçe anlatan İngilizce öğretmenin</div>
    </div>

    <div class="bubble"><span id="say"></span><span class="caret" id="caret" style="display:none"></span></div>
    <div class="actions" id="acts"></div>

    <div class="ask">
      <input id="askIn" placeholder="Koça yaz: bugün ne çalışmak istersin?" autocomplete="off">
      <button id="askBtn" onclick="askCoach()">Sor</button>
    </div>
    <div class="hint">Bugün ne çalışacağına koçun karar verir — sen sadece onu dinle 👇</div>
  </div>

  <button class="menuBtn" onclick="openSheet()">≡ Tüm modüller</button>

  <div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
    <div class="sheetC">
      <h3>Tüm modüller <small style="color:#9fb3d9;font-weight:400">(istersen doğrudan da girebilirsin)</small></h3>
      <div class="mgrid" id="mgrid"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

var face=document.getElementById("face"), ring=document.getElementById("ring");
face.src=FR.rest;
[FR.half,FR.open,FR.wide].forEach(function(s){var i=new Image();i.src=s;});

/* ---- koç konuşma (ağız + yazı + TTS) ---- */
var mouthT=null, typeT=null, seq=[FR.half,FR.open,FR.wide,FR.open,FR.half,FR.rest], si=0;
function startMouth(){ ring.classList.add("speaking"); clearInterval(mouthT); si=0;
  mouthT=setInterval(function(){ face.src=seq[si%seq.length]; si++; },120); }
function stopMouth(){ clearInterval(mouthT); mouthT=null; face.src=FR.rest; ring.classList.remove("speaking"); }
function speak(text, done){
  var el=document.getElementById("say"), c=document.getElementById("caret");
  clearTimeout(typeT); el.textContent=""; c.style.display="inline-block"; startMouth();
  try{ if(window.__ttsOn){ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.replace(/[🔥🎯👏🎉👋👇✓]/g,"")); u.lang="tr-TR"; u.rate=1; speechSynthesis.speak(u); } }catch(e){}
  var i=0; (function tick(){ if(i<=text.length){ el.textContent=text.slice(0,i); i++; typeT=setTimeout(tick, 18); }
    else { c.style.display="none"; stopMouth(); done&&done(); } })();
}

/* ---- plan (koçun karar verdiği akış) ---- */
var goal=0;
function setGoal(n){ goal=n; document.getElementById("goalN").textContent=goal+"/5"; }
var STEPS={
  greet:{ msg:"Günaydın Samet! 🔥 11 günlük serin sürüyor. Bugünü birlikte, adım adım halledelim. İlk iş: bekleyen 10 tekrarın var, 3 dakikada biter. Başlayalım mı?",
    acts:[ {t:"▶ Tekrarlara başla",p:1,go:"tekrar.html",next:"afterRev"},
           {t:"Önce bugünün dersini istiyorum",go:"ders.html",next:"lesson"} ] },
  lesson:{ msg:"Tamam, önce ders. Öğretmen sana özel bir ders hazırlıyor… Bitince tekrarlara döneriz.",
    acts:[ {t:"Dersi bitirdim ✓",p:1,next:"afterRev"} ] },
  afterRev:{ msg:"Süper! 10 tekrar tamam ✓ Sırada bugünün cümle hedefi: 5 cümle. Nasıl çalışalım?",
    acts:[ {t:"📸 Fotoğraftan çalış",p:1,go:"foto-ekle.html",next:"afterSent",goal:5},
           {t:"🎓 Hazır dersle çalış",go:"ders.html",next:"afterSent",goal:5} ] },
  afterSent:{ msg:"5 cümle tamam, harikasın 👏 Son bir şey: son günlerde 'missing-word' hataların artmış. 5 dakikalık mini antrenman tam da bu zayıf noktana. Yapalım mı?",
    acts:[ {t:"🏋️ Antrenmana başla",p:1,go:"index-app.html",next:"done"},
           {t:"Bugünlük bu kadar yeter",next:"done"} ] },
  done:{ msg:"Bugünlük plan tamam 🎉 Karnen A+. Serin 12 güne çıktı 🔥 Yarın aynı saatte görüşürüz — şimdi dinlenmeyi hak ettin, iyi çalışmalar!",
    acts:[ {t:"👋 Görüşürüz",next:"greet",restart:true} ] }
};
function render(key){
  var st=STEPS[key]; if(st.goal) setGoal(st.goal);
  var box=document.getElementById("acts"); box.innerHTML="";
  speak(st.msg, function(){
    st.acts.forEach(function(a,idx){
      var b=document.createElement("button");
      b.className="act "+(a.p?"primary":"ghost"); b.textContent=a.t;
      b.onclick=function(){ if(a.go) toast("Gerçek uygulamada açılır: "+a.go); if(a.restart){ setGoal(0); } setTimeout(function(){ render(a.next); }, a.go?650:120); };
      box.appendChild(b); setTimeout(function(){ b.classList.add("in"); }, 60+idx*90);
    });
  });
}

/* ---- kullanıcı koça yazınca ---- */
var ROUTE=[ [/kelime|word/i,"kelime-ogren.html","Kelime çalışması"], [/video|telaffuz/i,"videopractice.html","Video pratiği"],
  [/phrasal|öbek/i,"phrasal-verbs.html","Phrasal verbs"], [/sohbet|konuş|chat/i,"chat.html","Sohbet"],
  [/tekrar|review/i,"tekrar.html","Tekrar"], [/hata|defter/i,"hata-defteri.html","Hata defteri"] ];
function askCoach(){
  var v=(document.getElementById("askIn").value||"").trim(); if(!v) return;
  document.getElementById("askIn").value="";
  var box=document.getElementById("acts"); box.innerHTML="";
  var hit=ROUTE.find(function(r){ return r[0].test(v); });
  if(hit){ speak("Olur, "+hit[2].toLowerCase()+" açıyorum — ama planını da unutma, birazdan kaldığımız yerden devam ederiz.", function(){
      toast("Gerçek uygulamada açılır: "+hit[1]); var b=mkBtn("↩ Koçun planına dön","primary",function(){render("greet");}); box.appendChild(b); b.classList.add("in"); }); }
  else { speak("Anladım. Onu da planına ekleyebilirim; ama en verimlisi şu an önerdiğim adımdan gitmen. Hazırsan başlayalım.", function(){
      var b=mkBtn("👉 Koçun dediğini yap","primary",function(){render("greet");}); box.appendChild(b); b.classList.add("in"); }); }
}
function mkBtn(t,cls,fn){ var b=document.createElement("button"); b.className="act "+cls; b.textContent=t; b.onclick=fn; return b; }

/* ---- tüm modüller çekmecesi ---- */
var MODS=[ ["🎓 Bugünkü Dersim","ders.html","öğretmen ders hazırlar"], ["🔁 Tekrar","tekrar.html","aralıklı tekrar"],
  ["💬 Sohbet","chat.html","konuşan avatar"], ["🎬 Video","videopractice.html","telaffuz"],
  ["📖 Kelime","kelime-ogren.html","kart & quiz"], ["🔗 Phrasal","phrasal-verbs.html","öbek fiiller"],
  ["📷 Fotoğraftan ekle","foto-ekle.html","tara & çevir"], ["🗺️ İlerleme","harita.html","modül haritası"],
  ["📌 Hata Defteri","hata-defteri.html","hata analizi"], ["🎯 Seviye","seviye-testi.html","seviyeni ölç"],
  ["📘 Kılavuz","kilavuz.html","kullanım rehberi"], ["⚙️ Ayarlar","index.html#ayarlar","bildirim & yedek"] ];
(function(){ var g=document.getElementById("mgrid");
  MODS.forEach(function(m){ var d=document.createElement("div"); d.className="mitem"; d.innerHTML=m[0]+"<small>"+m[2]+"</small>";
    d.onclick=function(){ closeSheet(); toast("Gerçek uygulamada açılır: "+m[1]); }; g.appendChild(d); }); })();
function openSheet(){ document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }

/* ---- toast ---- */
var tT=null; function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tT); tT=setTimeout(function(){t.classList.remove("show");},1900); }

/* ---- başlangıç: kullanıcı yüz yüze gelince başlar ---- */
document.getElementById("acts").innerHTML="";
document.getElementById("say").textContent="";
(function firstScreen(){
  var box=document.getElementById("acts");
  var b=mkBtn("👉 Başla — koç seni yönlendirsin","primary",function(){ window.__ttsOn=true; render("greet"); });
  box.appendChild(b); setTimeout(function(){b.classList.add("in");},120);
  document.getElementById("say").innerHTML="Merhaba 👋 Ben koçun. Bugün ne çalışacağını düşünme — <b>ben karar veririm, sen sadece başla.</b>";
})();
