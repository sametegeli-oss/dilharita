<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📅 İlerleme Raporu — Dil Harita</title>
<style>
:root{--bg:#0a1628;--card:#0f1f3a;--line:#1e3a5f;--tx:#e8eef7;--mut:#9fb3d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px}
.top{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto 16px}
.top a{color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
h1{font-size:17px;margin:0}
.card{max-width:820px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:13px;color:#60a5fa;text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.cal .d{aspect-ratio:1;border-radius:4px;background:#0a1628}
.cal .d.a1{background:#14532d}.cal .d.a2{background:#166534}.cal .d.a3{background:#22c55e}
.legend{display:flex;gap:10px;margin-top:10px;font-size:11px;color:var(--mut);align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.stat{background:#0a1628;border-radius:10px;padding:10px 14px;flex:1;min-width:100px}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--mut)}
.trend-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff0f}
.trend-item:last-child{border:0}
.trend-item .bar{flex:1;margin:0 12px;height:8px;background:#0a1628;border-radius:4px;overflow:hidden}
.trend-item .bar div{height:100%}
.up{color:#f87171}.down{color:#4ade80}
.empty{color:var(--mut);text-align:center;padding:20px;font-size:13px}
</style></head><body>
<div class="top"><a href="./index.html">←</a><h1>📅 30 Günlük İlerleme Raporu</h1></div>

<div class="card">
  <h2>Aktivite Takvimi (son 30 gün)</h2>
  <div class="cal" id="cal"></div>
  <div class="legend">
    <span><span class="sw" style="background:#0a1628"></span>pasif</span>
    <span><span class="sw" style="background:#14532d"></span>az</span>
    <span><span class="sw" style="background:#166534"></span>orta</span>
    <span><span class="sw" style="background:#22c55e"></span>yoğun</span>
  </div>
  <div class="stat-row" id="statRow"></div>
</div>

<div class="card">
  <h2>Hata Türü Eğilimleri (önceki 15 gün → son 15 gün)</h2>
  <div id="trendList"><div class="empty">Yükleniyor…</div></div>
</div>

<script>
(function(){
  var tr={}; try{ tr=JSON.parse(localStorage.getItem("dh-study-tracker-v1")||"{}")||{}; }catch(e){}
  var days=tr.days||{}, d=new Date(), cells=[], active=0, lessons=0, sentences=0, reviews=0;
  for(var i=29;i>=0;i--){
    var dd=new Date(); dd.setDate(dd.getDate()-i);
    var key=dd.toISOString().slice(0,10), rec=days[key];
    var n=rec ? (rec.lessons||0)+(rec.sentences||0)/5+(rec.reviews||0)/3 : 0;
    var cls = n<=0 ? "" : n<3 ? "a1" : n<8 ? "a2" : "a3";
    cells.push('<div class="d '+cls+'" title="'+key+(rec?(" — "+(rec.lessons||0)+" ders, "+(rec.sentences||0)+" cümle"):" — pasif")+'"></div>');
    if(rec){ active++; lessons+=rec.lessons||0; sentences+=rec.sentences||0; reviews+=rec.reviews||0; }
  }
  document.getElementById("cal").innerHTML=cells.join("");
  document.getElementById("statRow").innerHTML=
    '<div class="stat"><b>'+active+'/30</b><span>aktif gün</span></div>'
    +'<div class="stat"><b>'+lessons+'</b><span>tamamlanan ders</span></div>'
    +'<div class="stat"><b>'+sentences+'</b><span>çalışılan cümle</span></div>'
    +'<div class="stat"><b>'+reviews+'</b><span>tekrar</span></div>';
})();

(async function(){
  var out=document.getElementById("trendList");
  try{
    if(!(window.LearningErrorDB&&LearningErrorDB.all)){ out.innerHTML='<div class="empty">Hata defteri modülü yüklü değil.</div>'; return; }
    var errs=await LearningErrorDB.all();
    if(!errs||!errs.length){ out.innerHTML='<div class="empty">Henüz hata kaydı yok.</div>'; return; }
    var now=Date.now(), cut15=now-15*86400000, cut30=now-30*86400000;
    var older={}, recent={};
    errs.forEach(function(r){
      var ts=r.ts||0; if(ts<cut30) return;
      var types=Array.isArray(r.types)&&r.types.length ? r.types : (r.type?[r.type]:[]);
      types.forEach(function(t){ if(ts>=cut15) recent[t]=(recent[t]||0)+1; else older[t]=(older[t]||0)+1; });
    });
    var all={}; Object.keys(older).forEach(function(t){all[t]=1;}); Object.keys(recent).forEach(function(t){all[t]=1;});
    var rows=Object.keys(all).map(function(t){ return {t:t,o:older[t]||0,r:recent[t]||0}; })
      .filter(function(x){ return x.o||x.r; })
      .sort(function(a,b){ return (b.r-b.o)-(a.r-a.o); });
    if(!rows.length){ out.innerHTML='<div class="empty">Son 30 günde yeterli veri yok.</div>'; return; }
    var max=Math.max.apply(null, rows.map(function(x){return Math.max(x.o,x.r);}))||1;
    out.innerHTML=rows.map(function(x){
      var improving=x.r<x.o, worsening=x.r>x.o;
      var cls=improving?"down":(worsening?"up":"");
      var icon=improving?"↓ iyileşiyor":(worsening?"↑ dikkat":"= sabit");
      var pct=Math.round(100*x.r/max);
      var col=improving?"#4ade80":(worsening?"#f87171":"#64748b");
      return '<div class="trend-item"><span>'+x.t+'</span><div class="bar"><div style="width:'+pct+'%;background:'+col+'"></div></div>'
        +'<span class="'+cls+'">'+x.o+'→'+x.r+' <small>('+icon+')</small></span></div>';
    }).join("");
  }catch(e){ out.innerHTML='<div class="empty">Rapor oluşturulamadı.</div>'; }
})();
</script>
</body></html>
