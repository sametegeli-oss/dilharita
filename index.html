<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1424">
<link rel="preload" as="image" href="./assets/avatars_v3/teacher/idle.webp" fetchpriority="high">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dil Harita — Koç Modu</title>
<script src="./auth-guard.js?v=1"></script>
<script src="./sentences-loader.js?v=1"></script>
<script src="./profile.js?v=1"></script>
<script src="./viseme-lang.js?v=1"></script>
<script src="./onboarding-guard.js?v=1"></script>
<script src="./study-tracker.js?v=1"></script>
<script src="./learning-error-system.js?v=2"></script>
<style>
  :root{ --bg:#0a1424; --panel:#10264a; --panel2:#0b172d; --line:#1e3a5f; --txt:#e8eef7; --dim:#9fb3d9; --gold:#f59e0b; --grn:#059669; --grn2:#10b981; --pur:#7c3aed; --brick-todo:#f59e0b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12315e 0%,var(--bg) 55%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:520px;padding:14px 16px 96px;flex:1;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .streak{display:flex;align-items:center;gap:6px;background:#2a1206;border:1px solid #7c3f0a;color:#fdba74;padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px}
  .goal{background:#0f1f3a;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:999px;font-size:12px}
  .sndBtn{display:flex;align-items:center;gap:6px;background:#16294a;border:1px solid var(--line);color:var(--txt);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer}
  
  /* Tuğla Duvarı Görselleştirme (Düşme Animasyonlu) */
  .brickWallWrap{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
  .brickWallTitle{font-size:11.5px;color:var(--dim);font-weight:700;display:flex;justify-content:space-between}
  .bricksGrid{display:flex;gap:5px;flex-wrap:wrap;align-items:center; perspective: 1000px;}
  .brick{flex:1;min-width:18px;height:24px;background:var(--brick-todo);border-radius:4px;border:1px solid rgba(255,255,255,0.2); transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); position:relative;}
  .brick.done{transform: translateY(30px) rotateX(45deg) scale(0.5); opacity: 0; pointer-events: none;}

  .coachWrap{display:flex;flex-direction:column;align-items:center;margin-top:2px}
  .avatarRing{position:relative;width:188px;height:188px;border-radius:50%;padding:5px;background:conic-gradient(from 180deg,var(--gold),var(--grn2),var(--pur),var(--gold));transition:box-shadow .3s}
  .avatarRing.speaking{box-shadow:0 0 0 6px #10b98122,0 0 42px #10b98155}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0f1f3a;display:block}
  .coachName{margin-top:12px;font-weight:900;font-size:17px}
  .bubble{margin-top:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:15.5px;line-height:1.55;min-height:72px;position:relative;width:100%}
  .bubble:after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .actions{margin-top:16px;display:flex;flex-direction:column;gap:10px;width:100%}
  .act{appearance:none;border:0;cursor:pointer;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;color:#fff;text-align:left;transition:.15s;opacity:0;transform:translateY(6px)}
  .act.in{opacity:1;transform:none}
  .act.primary{background:linear-gradient(135deg,var(--grn),var(--grn2))}
  .act.ghost{background:#16294a;border:1px solid var(--line);color:var(--txt)}
  .act.gemini{background:linear-gradient(135deg, #1a73e8, #8ab4f8); border:1px solid #1a73e8;}
  .menuBtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16294a99;backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;z-index:5}
  
  /* Gemini Plan Modal */
  #geminiModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99;display:none;align-items:center;justify-content:center;padding:20px;}
  .gm-content{background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:400px;}
  .gm-content textarea{width:100%; height:120px; background:var(--panel); border:1px solid var(--line); color:#fff; border-radius:8px; padding:10px; margin-top:10px; resize:none;}
  .gm-content button{width:100%; padding:12px; border-radius:8px; border:none; background:var(--pur); color:#fff; font-weight:bold; margin-top:10px; cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="pills">
        <div class="streak" id="streakPill" style="display:none">🔥 <span id="streakN">0</span> gün</div>
        <div class="goal">🎯 <b id="goalN">0/5</b> cümle</div>
      </div>
      <button class="sndBtn" id="sndBtn" onclick="toggleSound()">🔊 Sesli</button>
    </div>

    <!-- Tuğla Duvarı -->
    <div class="brickWallWrap">
      <div class="brickWallTitle">
        <span>🏗️ Hedef Duvarı</span>
        <span id="brickStatusText">0 / 5 Tuğla Yıkıldı</span>
      </div>
      <div class="bricksGrid" id="bricksGrid"></div>
    </div>

    <div class="coachWrap">
      <div class="avatarRing" id="ring"><img class="avatar" id="face" src="./assets/avatars_v3/teacher/idle.webp"></div>
      <div class="coachName">Öğretmenin</div>
    </div>

    <div class="bubble"><span id="say"></span></div>
    <div class="actions" id="acts"></div>
  </div>

  <button class="menuBtn" onclick="location.href='menu.html'">≡ Tüm modüller</button>

  <!-- Gemini'den Plan Alma Modalı -->
  <div id="geminiModal">
    <div class="gm-content">
      <h3 style="margin-top:0">Gemini'den Plan Yapıştır</h3>
      <p style="font-size:13px; color:var(--dim)">Kişisel verilerini içeren prompt Gemini'ye kopyalandı. Gemini'den dönen JSON planını buraya yapıştır:</p>
      <textarea id="gmInput" placeholder='Örn: {"hedef": 8, "sure_dakika": 25, "odak": "kelime"}'></textarea>
      <button onclick="applyGeminiPlan()">Planı Uygula ve Başla</button>
      <button style="background:var(--panel2); border:1px solid var(--line)" onclick="document.getElementById('geminiModal').style.display='none'">İptal</button>
    </div>
  </div>

<script>
var AV="./assets/avatars_v3/teacher/";
var FR={ idle:AV+"idle.webp", small:AV+"mouth-small.webp", open:AV+"mouth-open.webp" };
var face=document.getElementById("face"), ring=document.getElementById("ring");

function soundOn(){ return localStorage.getItem("dh-koc-sesli")!=="0"; }
function toggleSound(){ localStorage.setItem("dh-koc-sesli", soundOn()?"0":"1"); location.reload(); }

function playBrickSound() {
  if(!soundOn()) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.1);
  } catch(e){}
}

function speak(text, done){
  var el=document.getElementById("say"); el.textContent="";
  var i=0; 
  ring.classList.add("speaking"); face.src=FR.open;
  
  if(soundOn()){
    var u=new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FFFF}]/gu,"")); 
    u.lang="tr-TR"; u.rate=1.1; speechSynthesis.speak(u);
  }
  
  (function tick(){
    if(i<=text.length){ el.textContent=text.slice(0,i); i++; setTimeout(tick,20); } 
    else { ring.classList.remove("speaking"); face.src=FR.idle; done&&done(); }
  })();
}

function renderBricks(doneCount, totalGoal){
  var grid = document.getElementById("bricksGrid");
  grid.innerHTML = "";
  document.getElementById("brickStatusText").textContent = doneCount + " / " + totalGoal + " Yıkıldı";
  for(var i = 0; i < totalGoal; i++){
    var b = document.createElement("div");
    b.className = "brick" + (i < doneCount ? " done" : "");
    grid.appendChild(b);
  }
}

var GOAL = 5; 
try { if(window.DHProfile) GOAL = DHProfile.hedef(); } catch(e){}

function isoToday(){ return new Date().toISOString().slice(0,10); }

async function computeDue(){ return new Promise(function(res){ try{
  var r=indexedDB.open("sentence-mode",1);
  r.onsuccess=function(){ var db=r.result;
    if(!db.objectStoreNames.contains("kv")){ try{db.close();}catch(e){} return res(null); }
    var due=0, now=Date.now();
    try{ var q=db.transaction("kv","readonly").objectStore("kv").openCursor();
      q.onsuccess=function(e){ var c=e.target.result;
        if(c){ var kk=String(c.key), v=c.value||{}; if(kk.indexOf("srs:")===0 && (v.due||0)<=now) due++; c.continue(); }
        else { try{db.close();}catch(_){} res(due); } };
      q.onerror=function(){ try{db.close();}catch(_){} res(null); };
    }catch(e2){ try{db.close();}catch(_){} res(null); } };
  r.onerror=function(){ res(null); };
}catch(e){ res(null); } }); }

var WEAK={ "missing-word":"eksik kelime","word-order":"kelime sırası","tense":"fiil zamanı","preposition":"edat (in/on/at)","article":"artikel (a/the)","spelling":"yazım","plural":"çoğul","auxiliary":"yardımcı fiil","general":"genel hatalar" };

async function loadReal(){
  var R={streak:null,sentences:0,reviews:0,due:null,weakType:null,weakCount:0};
  try{ var t=JSON.parse(localStorage.getItem("dh-study-tracker-v1")||"{}"); var d=(t.days||{})[isoToday()]||{}; R.sentences=d.sentences||0; R.reviews=d.reviews||0; }catch(e){}
  try{ var st=JSON.parse(localStorage.getItem("study_tracker_data")||"{}"); if(st.streakData&&typeof st.streakData.current==="number") R.streak=st.streakData.current; }catch(e){}
  try{ var dc=await computeDue(); if(typeof dc==="number") R.due=dc; }catch(e){}
  try{ if(window.LearningErrorDB&&LearningErrorDB.all){ var all=await LearningErrorDB.all(); var sum=LearningErrorDB.summarize(all||[]); R.weakCount=(sum&&sum.high)||0; if(sum&&sum.byType&&sum.byType[0]) R.weakType=sum.byType[0][0]; } }catch(e){}
  return R;
}

async function buildDailyProposal(R){
  var strongText = R.streak && R.streak > 1 ? (R.streak + " günlük istikrarlı bir serin var") : "çalışmalarında düzenli bir tempon var";
  var weakDesc = R.weakType ? (WEAK[R.weakType] || R.weakType) : "kelime dizilimi ve temel yapılar";
  return { strong: strongText, weak: weakDesc, todayTarget: GOAL };
}

async function boot(){
  var box=document.getElementById("acts"); box.innerHTML="";
  var R = await loadReal();
  var plan = await buildDailyProposal(R);
  
  var t = JSON.parse(localStorage.getItem("dh-study-tracker-v1") || "{}");
  var dData = (t.days || {})[isoToday()] || {sentences:0};
  renderBricks(dData.sentences, GOAL);
  
  if(localStorage.getItem("dh_coach_state") === "tekrar_done") {
      speak("Tekrarlarını başarıyla tamamladın, harika! Şimdi günlük tuğlalarımızı yıkmak için cümle modülüne geçelim.", function(){
          var b = mkBtn("🚀 Cümle Çalışmasına Geç", "primary", function(){ location.href="index-app.html"; });
          box.appendChild(b); b.classList.add("in");
          localStorage.removeItem("dh_coach_state");
      });
      return;
  }

  var intro = "Günaydın Samet! Kuvvetli yönlerin: " + plan.strong + ". Zayıf kalan yönlerin için " + plan.weak + " çalışacağız. Bugün önümüzde " + GOAL + " tuğla var. Zamanına göre plan yapalım mı?";
  
  speak(intro, function(){
    var actionsHTML = [
      { t: "✅ Planı Onayla ve Başla", cls: "primary", action: function(){ location.href="tekrar.html"; } },
      { t: "⏱️ Zamanım Az (Hedefi Düşür)", cls: "ghost", action: function(){ 
          GOAL = Math.max(2, Math.floor(GOAL/2)); 
          renderBricks(dData.sentences, GOAL);
          box.innerHTML=""; speak("Hedefi "+GOAL+" tuğlaya düşürdüm. Başlayalım mı?", function(){
             box.appendChild(mkBtn("🚀 Başla", "primary", function(){ location.href="tekrar.html"; }));
             box.lastChild.classList.add("in");
          });
      }},
      { t: "🤖 Gemini'den Detaylı Plan Al", cls: "gemini", action: openGeminiPrompt }
    ];

    actionsHTML.forEach(function(act, idx){
      var b = mkBtn(act.t, act.cls, act.action);
      box.appendChild(b);
      setTimeout(function(){ b.classList.add("in"); }, 60 + idx * 90);
    });
  });
}

function mkBtn(t,cls,fn){ var b=document.createElement("button"); b.className="act "+cls; b.textContent=t; b.onclick=fn; return b; }

async function openGeminiPrompt() {
    var R = await loadReal();
    var plan = await buildDailyProposal(R);
    
    // Güçlü/zayıf yönlerini, serini ve süre beklentisini içeren akıllı prompt
    var smartPrompt = 
      "Sen benim Türkçe anlatan İngilizce koçumsun. Bugün benimle süre (dakika) ve çalışma adımları dahil detaylı bir günlük plan üzerine müzakere edeceksin.\n" +
      "Güncel İstatistiklerim ve Verilerim:\n" +
      "- Günlük Serim (Streak): " + (R.streak || 0) + " gün\n" +
      "- Vadesi Gelen Tekrar (SRS): " + (R.due || 0) + " adet\n" +
      "- Hedef Cümle Sayım: " + plan.todayTarget + "\n" +
      "- Kuvvetli Yönlerim: " + plan.strong + "\n" +
      "- En Sık Yaptığım Hatalar (Zayıf Yönler): " + plan.weak + "\n\n" +
      "Lütfen bu verilere dayanarak bana özel, tahmini çalışma süresini de içeren (örn: 20 dakika normal tempo) profesyonel bir günlük plan hazırla. " +
      "Açıklamayı Türkçe yap ve en sonda mutlaka şu formatta JSON ver:\n" +
      "{\"hedef\": SAYI, \"sure_dakika\": SAYI, \"odak\": \"açıklama\"}";

    navigator.clipboard.writeText(smartPrompt);
    document.getElementById("say").innerHTML = 
      "Kişisel performansın, zayıf noktaların (" + plan.weak + ") ve süre beklentin prompt içine eklenip panoya kopyalandı!<br>" +
      "<a href='https://gemini.google.com' target='_blank' style='color:#1a73e8'>Gemini'yi Aç (Yeni Sekme)</a> ve yapıştır.";
      
    document.getElementById("geminiModal").style.display = "flex";
}

function applyGeminiPlan() {
    var val = document.getElementById("gmInput").value;
    try {
        var plan = JSON.parse(val);
        GOAL = plan.hedef || 5;
        document.getElementById("geminiModal").style.display = "none";
        renderBricks(0, GOAL);
        var box=document.getElementById("acts"); box.innerHTML="";
        speak("Gemini planı onaylandı: " + GOAL + " hedef, öngörülen süre " + plan.sure_dakika + " dakika (" + plan.odak + "). Başlayalım!", function(){
            box.appendChild(mkBtn("🚀 Plana Başla", "primary", function(){ location.href="index-app.html"; }));
            box.lastChild.classList.add("in");
        });
    } catch(e) {
        alert("Geçersiz JSON formatı! Lütfen Gemini'den dönen JSON metnini doğru kopyaladığından emin ol.");
    }
}

window.onload = boot;
</script>
</body>
</html>
