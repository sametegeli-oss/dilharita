<!DOCTYPE html>
<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F7A5A">
<title>Dil Harita</title>

<link rel="stylesheet" href="./dh-tokens.css">
<link rel="stylesheet" href="./dh-ui.css">

<link rel="preload" as="image" href="./assets/avatars_v3/teacher/idle.webp" fetchpriority="high">
<link rel="prefetch" as="image" href="./assets/avatars_v3/teacher/blink.webp">
<link rel="prefetch" as="image" href="./assets/avatars_v3/teacher/mouth-small.webp">
<link rel="prefetch" as="image" href="./assets/avatars_v3/teacher/mouth-medium.webp">
<link rel="prefetch" as="image" href="./assets/avatars_v3/teacher/mouth-open.webp">

<!-- KOC ZINCIRININ BAGIMLILIKLARI — sira onemli, koc.js en sonda.
     study-tracker  -> dh-study-tracker-v1 (activityTrend30 bunu okur)
     learning-error -> LearningErrorDB     (errorTrend30 + checkAndSetGoal)
     sentences-loader -> DHSent.index()    (pickNextModule)
     ai-providers   -> DHProviders         (plan uretimi; yoksa sessiz duser) -->
<script src="./auth-guard.js?v=1"></script>
<script src="./storage-bridge.js?v=3"></script>
<script src="./sentences-loader.js?v=1"></script>
<script src="./profile.js?v=1"></script>
<script src="./onboarding-guard.js?v=1"></script>
<script src="./study-tracker.js?v=1"></script>
<script src="./learning-error-system.js?v=2"></script>
<script src="./ai-providers.js?v=1"></script>
</head>
<body>

<main class="dh-sayfa">

  <header class="dh-ust">
    <div class="dh-ust__sol">
      <span class="dh-seri" id="seriRozet" hidden>
        <span aria-hidden="true">▲</span><span id="seriN">0</span> gün
      </span>
    </div>
    <div class="dh-ust__sag">
      <button class="dh-ikon-btn" id="sesBtn" aria-label="Sesi aç veya kapat">◍</button>
      <a class="dh-ikon-btn" href="./rapor.html" aria-label="30 günlük rapor">◔</a>
      <a class="dh-ikon-btn" href="./menu.html" aria-label="Tüm modüller">☰</a>
    </div>
  </header>

  <!-- KOC: avatar kucuk, sahneyi kaplamaz -->
  <div class="dh-koc">
    <div class="dh-avatar" id="kocAvatar"></div>
    <p class="dh-koc__soz" id="kocSoz">Bugünü hazırlıyorum…</p>
  </div>

  <!-- Kocun gerekcesi: sari kutu degil, ikincil satir -->
  <p class="dh-etiket" id="kocNeden" style="margin:-8px 0 20px 60px" hidden></p>

  <!-- 30 GUNLUK ZINCIRDEN GELEN ONERILER -->
  <a class="dh-kart dh-kart--vurgu dh-gir" id="seviyeKart" href="./seviye-testi.html"
     style="display:none;margin-bottom:12px;text-decoration:none;color:inherit">
    <div class="dh-cip dh-cip--marka" style="margin-bottom:8px">Seviye</div>
    <div style="font-size:var(--dh-fs-kontrol);font-weight:var(--dh-fw-orta)">Seviye yükseltme zamanı olabilir</div>
    <div class="dh-etiket" id="seviyeNeden" style="margin-top:4px"></div>
  </a>

  <div class="dh-kart dh-kart--sessiz" id="hedefKart" style="display:none;margin-bottom:12px">
    <div class="dh-bolum-basligi">Bu haftanın hedefi</div>
    <div id="hedefMetin" style="font-size:var(--dh-fs-kontrol)"></div>
    <div class="dh-etiket" id="hedefSonuc" style="margin-top:6px"></div>
  </div>

  <!-- GUNUN PLANI -->
  <div class="dh-bolum-basligi" id="planBaslik">Bugünün planı</div>
  <div class="dh-plan" id="plan"></div>

  <!-- HAFTALIK RITIM: koc.js ile ayni kaynak (dh-study-tracker-v1) -->
  <section style="margin-top:28px" aria-labelledby="haftaB">
    <h2 id="haftaB" class="dh-bolum-basligi">Son 7 gün</h2>
    <div class="dh-hafta" id="hafta"></div>
    <p class="dh-etiket" id="haftaOzet" style="margin:10px 0 0"></p>
  </section>

  <!-- ILERLEME: ham "tekrar bekleyen" toplami GOSTERILMEZ.
       koc.js profile() icindeki kendi kurali: bu toplami kullaniciya asla soyleme. -->
  <section class="dh-izgara dh-izgara--2" style="margin-top:20px" aria-label="İlerleme">
    <div class="dh-metrik">
      <div class="dh-metrik__etiket">Öğrenilmiş</div>
      <div class="dh-metrik__deger" id="mOgrenilmis">0</div>
    </div>
    <div class="dh-metrik">
      <div class="dh-metrik__etiket">Çalışılıyor</div>
      <div class="dh-metrik__deger" id="mCalisiliyor">0</div>
    </div>
  </section>

  <div class="dh-alt">
    <a class="dh-btn dh-btn--birincil dh-btn--tam" id="devam" href="./ders.html">Başla</a>
    <button class="dh-btn dh-btn--sade dh-btn--tam" id="sonrakiGun" style="margin-top:8px">
      Sonraki günü başlat
    </button>
  </div>

  <!-- koc.js kanca hata verirse eski cizime dusebilsin diye korunur -->
  <div id="dhKocContainer" hidden></div>
  <span id="dhDaySub" hidden></span>

</main>

<script src="./dh-avatar.js"></script>
<script>
/* index.html — KOC EKRANI
   ================================================================
   BU DOSYA HESAPLAMA YAPMAZ. koc.js'in 30 gunluk zinciri aynen calisir:

     activityTrend30()  30 gun aktif/ders/cumle/tekrar + ilk15↔son15 trend
     errorTrend30()     30 gun hata kayitlari, tur bazinda older↔recent
     profile()          ikisini + seri + mirror + SRS due/leech birlestirir
     __dhLevelSuggest   active>=20 && iyilesen>=2 && kotulesen==0
     checkAndSetGoal()  haftalik hata hedefi, 7 gun sonra kendi kontrolu
     pickNextModule()   3 kademeli deterministik modul secimi
     valid()            AI ciktisini garantili iskelete indirger
     liveStats()        her acilista canli sayilar (onbelleklenmez)
     freshenPlan()      why/note'u AI'siz tazeler

   Buraya yalnizca SONUC gelir (window.DHKocRender kancasi).
   Kanca koc.js'e 18 satirlik tek bir blok olarak eklendi; geri kalan
   dosya bayt bayt ayni.

   DEGISENLER (davranis degil, sunum ve iki hata):
     - "Samet" sabit kodluydu -> profilden okunur
     - ham "tekrar bekleyen" toplami gosterilmez (koc.js'in kendi kurali)
     - emoji ikon degil, cizgi isaret
     - maximum-scale kaldirildi
*/
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var GUN = new Date().toISOString().slice(0,10);
  var cizildi = false;

  function kacir(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  function oku(k, vars){
    try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : vars; }
    catch(e){ return vars; }
  }

  /* ---------- kullanicinin adi: ARTIK SABIT KODLU DEGIL ---------- */
  function ad(){
    try{
      if (window.DHProfile && DHProfile.get){
        var p = DHProfile.get() || {};
        if (p.ad) return String(p.ad).trim();
      }
    }catch(e){}
    var pr = oku("dh-profile-v1", {}) || {};
    if (pr.ad) return String(pr.ad).trim();
    try{
      var mail = localStorage.getItem("dh_logged_email") || "";
      if (mail){
        var n = mail.split("@")[0].replace(/[._-]+/g," ").trim();
        if (n) return n.charAt(0).toLocaleUpperCase("tr") + n.slice(1);
      }
    }catch(e){}
    return null;
  }
  function selam(){
    var a = ad();
    return a ? ("Merhaba " + a + ". ") : "Merhaba. ";
  }

  /* ---------- ses tercihi ---------- */
  function sesAcik(){
    try{ return localStorage.getItem("dh-koc-sesli") !== "0"; }catch(e){ return true; }
  }
  function sesBoya(){
    $("sesBtn").textContent = sesAcik() ? "◍" : "◌";
    $("sesBtn").setAttribute("aria-pressed", sesAcik() ? "true" : "false");
  }
  $("sesBtn").onclick = function(){
    try{ localStorage.setItem("dh-koc-sesli", sesAcik() ? "0" : "1"); }catch(e){}
    if (!sesAcik()){ try{ speechSynthesis.cancel(); }catch(e){} }
    sesBoya();
  };
  sesBoya();

  /* ---------- adim tamamlanma: koc.js paint() ile AYNI mantik ----------
     Kaynak: dh-koc-steps-done-<gun>. Guvenlik denetimi de ayni —
     bugun gercek aktivite yoksa hicbir adim "tamamlandi" gosterilmez. */
  function bitenAdimlar(){
    var set = oku("dh-koc-steps-done-" + GUN, {}) || {};
    var gercekAktivite = false;
    try{
      var tr = oku("dh-study-tracker-v1", {}) || {};
      var bugun = (tr.days || {})[GUN];
      gercekAktivite = !!(bugun && ((bugun.sentences||0) + (bugun.reviews||0) +
                                    (bugun.lessons||0) + (bugun.videos||0) > 0));
    }catch(e){}
    if (!gercekAktivite) set = {};
    var sohbetVar = Object.keys(set).some(function(k){
      return /^chat[a-z]*\.html$/.test(k);
    });
    return { set:set, sohbetVar:sohbetVar };
  }

  /* ---------- adim tipini href'ten cikar (ikon icin) ---------- */
  function tipOf(href){
    var h = String(href||"");
    if (h.indexOf("tekrar") === 0) return "tekrar";
    if (h.indexOf("chat") === 0) return "sohbet";
    if (h.indexOf("hata-defteri") === 0) return "hata";
    if (h.indexOf("kelime") === 0) return "kelime";
    return "yeni";
  }
  var ISARET = { tekrar:"↻", yeni:"+", sohbet:"◇", hata:"!", kelime:"▪" };

  /* ================= ANA CIZIM (koc.js kancasi) ================= */
  window.DHKocRender = function(plan, ctx){
    cizildi = true;
    ctx = ctx || {};

    /* --- kocun sozu: focus + note. Ad artik profilden. --- */
    var soz = selam() + String(plan.focus || "Bugüne başlayalım.");
    if (plan.note) soz += " " + plan.note;
    $("kocSoz").textContent = soz;
    konustur(soz);

    if (plan.why){
      $("kocNeden").textContent = plan.why;
      $("kocNeden").hidden = false;
    }

    /* --- seviye onerisi: 30 gunluk zincirden, AI'dan degil --- */
    if (ctx.seviyeOner){
      $("seviyeNeden").textContent = ctx.seviyeNeden || "";
      $("seviyeKart").style.display = "block";
    }

    /* --- haftalik hata hedefi --- */
    var g = ctx.hedef;
    if (g && (g.goal || g.result)){
      if (g.goal){
        $("hedefMetin").textContent =
          g.goal.type + " hatasını " + g.goal.baseline + "'ten " +
          g.goal.targetCount + "'e indir";
      }
      if (g.result){
        $("hedefSonuc").textContent =
          (g.result.achieved ? "Geçen haftaki hedefini tuttun. " : "Geçen haftaki hedefe tam ulaşamadın. ") +
          g.result.type + ": " + g.result.before + " → " + g.result.now;
      }
      $("hedefKart").style.display = "block";
    }

    /* --- adimlar --- */
    var b = bitenAdimlar();
    var kap = $("plan");
    kap.innerHTML = "";
    var aktifVar = false;

    (plan.steps || []).forEach(function(s){
      var sayfa = String(s.href||"").split("?")[0];
      var bitti = !!b.set[sayfa] || (sayfa === "chat.html" && b.sohbetVar);
      var aktif = !bitti && !aktifVar;
      if (aktif) aktifVar = true;

      var a = document.createElement("a");
      a.href = "./" + s.href;
      a.className = "dh-plan-satir" +
        (aktif ? " dh-plan-satir--aktif" : "") +
        (bitti ? " dh-plan-satir--bitti" : "");
      a.innerHTML =
        '<div class="dh-plan-satir__ust">' +
          '<span class="dh-plan-satir__ikon" aria-hidden="true">' +
            (bitti ? "✓" : (ISARET[tipOf(s.href)] || "·")) +
          '</span>' +
          '<span class="dh-plan-satir__ad">' + kacir(s.label) + '</span>' +
        '</div>';
      kap.appendChild(a);

      if (aktif) $("devam").href = "./" + s.href;
    });

    $("planBaslik").textContent = "Bugünün planı · " + (plan.steps||[]).length + " adım";
    $("devam").textContent = aktifVar
      ? (Object.keys(b.set).length ? "Kaldığın yerden devam" : "Başla")
      : "Bugünlük tamam";
    if (!aktifVar) $("devam").href = "./rapor.html";

    /* --- canli sayilar: liveStats() sonucu. due GOSTERILMEZ. --- */
    var st = plan.stats || {};
    $("mOgrenilmis").textContent  = (st.s2||0) + (st.w2||0);
    $("mCalisiliyor").textContent = (st.s1||0) + (st.w1||0);

    haftaCiz();
    seriCiz();
  };

  /* ================= HAFTALIK RITIM =================
     koc.js'in 7 gunluk mini grafigi ile AYNI kaynak ve ayni formul:
     deger = ders + cumle/5 + tekrar/3 */
  function haftaCiz(){
    var tr = oku("dh-study-tracker-v1", {}) || {};
    var gunler = tr.days || {};
    var kap = $("hafta");
    kap.innerHTML = "";
    var aktif = 0;

    for (var i=6; i>=0; i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      var k = d.toISOString().slice(0,10);
      var r = gunler[k];
      var v = r ? ((r.lessons||0) + (r.sentences||0)/5 + (r.reviews||0)/3) : 0;

      var el = document.createElement("span");
      el.className = "dh-hafta__gun" +
        (v > 0 ? " dh-hafta__gun--tuttu" : (i === 0 ? " dh-hafta__gun--bugun" : ""));
      el.title = k;
      kap.appendChild(el);
      if (v > 0) aktif++;
    }
    $("haftaOzet").textContent = aktif + "/7 gün çalıştın";
  }

  /* ================= SERI =================
     koc.js profile() icindeki seri sayimiyla ayni mantik. */
  function seriCiz(){
    try{
      var tr = oku("dh-study-tracker-v1", {}) || {};
      var gunler = tr.days || {};
      var d = new Date(), n = 0;
      if (!gunler[d.toISOString().slice(0,10)]) d.setDate(d.getDate()-1);
      while (gunler[d.toISOString().slice(0,10)]){ n++; d.setDate(d.getDate()-1); }
      if (n > 0){
        $("seriN").textContent = n;
        $("seriRozet").hidden = false;
      }
    }catch(e){}
  }

  /* ================= AVATAR ================= */
  var avatar = null;
  function avatarKur(){
    if (!window.DHAvatar) return;
    try{
      avatar = DHAvatar.olustur($("kocAvatar"), { yol:"./assets/avatars_v3/teacher/" });
    }catch(e){}
  }
  function konustur(metin){
    if (!avatar) return;
    avatar.hazir.then(function(){
      avatar.konus(metin, { ses: sesAcik(), dil:"tr-TR" });
    });
  }
  avatarKur();

  /* ================= YEDEK CIZIM =================
     koc.js AI anahtari yoksa run() paint()'e HIC gelmez ve kanca
     tetiklenmez. Eski davranista kart "API anahtari ekleyince plan
     gorunecek" diyordu — oysa iskelet zaten deterministik.
     Burada ayni deterministik iskelet AI'siz cizilir. */
  function yedekCiz(){
    if (cizildi) return;

    var tr = oku("dh-study-tracker-v1", {}) || {};
    var bugun = (tr.days || {})[GUN] || {};
    var yapilanCumle = bugun.sentences || 0;

    var hedef = 5;
    try{ if (window.DHProfile && DHProfile.hedef) hedef = DHProfile.hedef() || 5; }catch(e){}

    var adimlar = [];
    /* Ham due sayisi okunur ama EKRANA CIKMAZ; yalnizca adimin
       gosterilip gosterilmeyecegine karar verir. */
    bekleyenSay(function(due){
      if (due > 0){
        adimlar.push({ label:"Vadesi gelen kelime/cümleleri tekrarla", href:"tekrar.html?plan=1" });
      }
      if (yapilanCumle < 25){
        adimlar.push({ label:"Yeni cümleler öğren", href:"index-app.html" });
      }
      adimlar.push({ label:"1 dakika konuş", href:"chat.html" });

      DHKocRender(
        { focus:"Bugün planına başlayalım.", steps:adimlar, stats:{} },
        {}
      );
      $("kocNeden").hidden = true;
    });
  }

  function bekleyenSay(gel){
    try{
      var r = indexedDB.open("sentence-mode", 1);
      r.onsuccess = function(){
        var db = r.result, n = 0, now = Date.now();
        if (!db.objectStoreNames.contains("kv")){ try{db.close();}catch(e){} return gel(0); }
        try{
          var q = db.transaction("kv","readonly").objectStore("kv").openCursor();
          q.onsuccess = function(e){
            var c = e.target.result;
            if (c){
              var k = String(c.key), v = c.value || {};
              if (k.indexOf("srs:") === 0 && (v.due||0) <= now) n++;
              c.continue();
            } else { try{db.close();}catch(_){}
              try{ localStorage.setItem("dh-son-bekleyen", String(n)); }catch(_){}
              gel(n);
            }
          };
          q.onerror = function(){ try{db.close();}catch(_){} gel(0); };
        }catch(e2){ try{db.close();}catch(_){} gel(0); }
      };
      r.onerror = function(){ gel(0); };
    }catch(e){ gel(0); }
  }

  /* koc.js run() 1200ms gecikmeyle basliyor; ona sure taniyip yedege dusuyoruz. */
  setTimeout(yedekCiz, 2600);

  /* ================= SONRAKI GUNU BASLAT =================
     koc.js'teki #dhResetToday ile AYNI islem — hicbir ogrenme verisi
     silinmez, yalnizca gunun plani ve isaretleri sifirlanir. */
  $("sonrakiGun").onclick = function(){
    try{
      localStorage.removeItem("dh-koc-plan-" + GUN);
      localStorage.removeItem("dh-koc-steps-done-" + GUN);
      localStorage.removeItem("dh-day-closed-" + GUN);
      localStorage.removeItem("dh-coach-last-generic-tip");
      var tr = oku("dh-study-tracker-v1", {}) || {};
      var d = (tr.days || {})[GUN] || {};
      localStorage.setItem("dh-koc-epoch-" + GUN, JSON.stringify({
        sentences:d.sentences||0, reviews:d.reviews||0,
        lessons:d.lessons||0, videos:d.videos||0
      }));
    }catch(e){}
    location.reload();
  };

  /* ilk boyama — plan gelmeden once de ritim ve seri gorunsun */
  haftaCiz();
  seriCiz();
})();
</script>

<!-- koc.js EN SONDA: kanca (window.DHKocRender) tanimli olmali -->
<script src="./koc.js?v=3"></script>
