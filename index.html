<script>
/* index.html — KOC EKRANI
   ================================================================
   HESAPLAMA YAPMAZ. koc.js'in 30 gunluk zinciri (activityTrend30,
   errorTrend30, profile, checkAndSetGoal, pickNextModule, valid,
   liveStats, freshenPlan) aynen calisir; buraya window.DHKocRender
   kancasiyla yalnizca SONUC gelir.

   ── BU SURUMDE COZULEN: "geri donunce bastan plan yapiyor" ──
   Iki ayri sorun vardi:

   1) GECIKME. koc.js run()'i 1200ms gecikmeyle basliyor, ustune
      IndexedDB taramasi biniyor. O sure boyunca ekranda "Bugunu
      hazirliyorum..." yaziyordu — calismis kullaniciya sifirdan
      basliyormus gibi gorunuyor. Artik sayfa ACILIR ACILMAZ, koc.js
      beklenmeden, localStorage'dan SENKRON okunan gercek durum
      basiliyor. koc.js sonra gelip ustune ekliyor.

   2) SABAHIN METNI. plan.focus AI tarafindan sabah yaziliyor ve
      freshenPlan() yalnizca why/note'u tazeliyor, focus'a dokunmuyor.
      Yani 0 cumle de yapsan 30 cumle de yapsan koc ayni cumleyi
      kuruyordu. Artik bugun aktivite VARSA koc once ne yapildigini
      soyluyor, focus ikincil kaliyor.

   Kaynaklar (hepsi salt okuma, hicbiri hesaplama degil):
     dh-study-tracker-v1     bugunku cumle/tekrar/ders/video
     dh-koc-plan-<gun>       koc.js'in dondurdugu gunun plani
     dh-koc-steps-done-<gun> tamamlanan adimlar
     dh-ders-oturum-<gun>    yarim kalan ders (dh-ders-oturum.js)
     dh-tekrar-gun-<gun>     tekrar.html'in dondurulmus gun hedefi
*/
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var GUN = new Date().toISOString().slice(0,10);
  var kocGeldi = false;
  var sonPlan = null, sonCtx = {};

  function kacir(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  function oku(k, vars){
    try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : vars; }
    catch(e){ return vars; }
  }

  /* ---------- ad: sabit kodlu degil ---------- */
  function ad(){
    try{
      if (window.DHProfile && DHProfile.get){
        var p = DHProfile.get() || {};
        if (p.ad) return String(p.ad).trim();
      }
    }catch(e){}
    var pr = oku("dh-profile-v1", {}) || {};
    if (pr.ad) return String(pr.ad).trim();
    try{
      var mail = localStorage.getItem("dh_logged_email") || "";
      if (mail){
        var n = mail.split("@")[0].replace(/[._-]+/g," ").trim();
        if (n) return n.charAt(0).toLocaleUpperCase("tr") + n.slice(1);
      }
    }catch(e){}
    return null;
  }

  /* DHPlan defterinden bir adimi href ile bul */
  function defterAdimi(defter, href){
    if (!defter || !defter.adimlar) return null;
    var id = adimKimligi(href);
    for (var i=0; i<defter.adimlar.length; i++){
      if (defter.adimlar[i].id === id) return defter.adimlar[i];
    }
    return null;
  }

  /* ================= BUGUNUN DURUMU (SENKRON) ================= */
  function durum(){
    var tr = oku("dh-study-tracker-v1", {}) || {};
    var b  = (tr.days || {})[GUN] || {};
    var d = {
      cumle:  b.sentences || 0,
      tekrar: b.reviews   || 0,
      ders:   b.lessons   || 0,
      video:  b.videos    || 0
    };
    d.toplamIs = d.cumle + d.tekrar + d.ders + d.video;
    d.calisti  = d.toplamIs > 0;

    /* yarim kalan ders */
    d.dersOturum = null;
    var o = oku("dh-ders-oturum-" + GUN, null);
    if (o && o.ders && o.ders.steps && o.ders.steps.length){
      var t = o.ders.steps.length, i = Math.max(0, Math.min(t, o.idx|0));
      if (i > 0 && i < t) d.dersOturum = { yapilan:i, toplam:t };
    }

    /* tekrar.html'in dondurulmus gun hedefi */
    d.tekrarGun = null;
    var tg = oku("dh-tekrar-gun-" + GUN, null);
    if (tg && tg.hedef) {
      d.tekrarGun = { hedef: tg.hedef|0, yapilan: Math.min(tg.yapilan|0, tg.hedef|0) };
    }

    /* plan + biten adimlar — koc.js paint() ile AYNI mantik */
    d.plan = oku("dh-koc-plan-" + GUN, null);
    var set = oku("dh-koc-steps-done-" + GUN, {}) || {};
    if (!d.calisti) set = {};                       // guvenlik denetimi (koc.js ile ayni)
    d.bitenSet = set;
    d.sohbetVar = Object.keys(set).some(function(k){ return /^chat[a-z]*\.html$/.test(k); });

    /* DHPlan defteri — adim basina hedef/yapilan burada */
    d.defter = null;
    try{ if (window.DHPlan) d.defter = DHPlan.bugun(); }catch(e){}
    if (d.defter && d.defter.dinlenme) d.dinlenme = true;

    d.adimToplam = 0; d.adimBiten = 0;
    if (d.plan && d.plan.steps){
      d.adimToplam = d.plan.steps.length;
      d.plan.steps.forEach(function(s){
        var sayfa = String(s.href||"").split("?")[0];
        /* Bir adim iki yoldan bitmis sayilir:
             a) DHPlan defterinde yapilan >= hedef  (gercek ilerleme)
             b) dh-koc-steps-done isaretli           (sayfa ziyareti, eski yol)
           Ikisinin BIRLESIMI alinir ki eski davranis kaybolmasin. */
        if (set[sayfa] || (sayfa === "chat.html" && d.sohbetVar)) { d.adimBiten++; return; }
        var a = d.defter ? defterAdimi(d.defter, s.href) : null;
        if (a && a.yapilan >= a.hedef) d.adimBiten++;
      });
    }
    return d;
  }

  /* ══════════════════════════════════════════════════════════════════
     KOC PLANI  →  DHPlan ADIMLARI
     ------------------------------------------------------------------
     koc.js'in urettigi adimlarin BIRIM SAYISI YOK: {label, href}'ten
     ibaretler. Bu yuzden "7/12 · 5 kaldi" denemiyordu.

     Burada her adima bir hedef TURETILIR ve DHPlan'a yazilir. DHPlan
     gun icinde hedefi dondurur; ders.html ve tekrar.html ilerlemeyi
     oraya isler, boylece ilerleme TUM ekranlarda ayni anda gorunur.

     koc.js'in hesaplama katmanina dokunulmaz — yalnizca ciktisi
     ceviriliyor.
     ══════════════════════════════════════════════════════════════════ */
  /* Adim kimligi ANLAMSAL olmali, dosya adi degil.
     Cunku ders.html ve tekrar.html ilerlemeyi bu kimliklerle isliyor:
       ders.html  ->  DHPlan.ilerlet("yeni") / ("tekrar") / ("telaffuz")
     Dosya adindan (index-app) turetilseydi eslesme tutmazdi ve ders
     ilerlemesi ana ekrana hic yansimazdi. tipOf() ile ayni sozluk. */
  function adimKimligi(href){
    return tipOf(href);
  }
  function hedefTuret(href, due){
    var h = String(href||"").split("?")[0];
    /* tekrar.html?plan=1 zaten 15'lik oturum aliyor; ham bekleyen
       toplami degil, gunun porsiyonu hedeftir. */
    if (h.indexOf("tekrar") === 0) return Math.max(1, Math.min(due || 15, 15));
    if (h.indexOf("index-app") === 0){
      var g = 5;
      try{ if (window.DHProfile && DHProfile.hedef) g = DHProfile.hedef() || 5; }catch(e){}
      return Math.max(1, g);
    }
    return 1;   /* konusma, hata defteri, kelime, bonus adim */
  }
  function planiKur(kocPlan){
    if (!window.DHPlan || !kocPlan || !kocPlan.steps || !kocPlan.steps.length) return;
    if (DHPlan.varMi()) return;                 /* gun icinde bir kez */
    var due = 0;
    try{ due = (kocPlan.stats && kocPlan.stats.due) || kocPlan.dueCount || 0; }catch(e){}
    if (!due){ try{ due = parseInt(localStorage.getItem("dh-son-bekleyen")||"0",10)||0; }catch(e){} }

    var gorulen = {};
    DHPlan.kur(kocPlan.steps.map(function(st){
      var kimlik = adimKimligi(st.href);
      /* Ayni tipte iki adim gelirse kimlik cakisir; tekillestir. */
      if (gorulen[kimlik]) kimlik = kimlik + "-" + (++gorulen[kimlik]);
      else gorulen[kimlik] = 1;
      return {
        id: kimlik,
        tip: tipOf(st.href),
        etiket: st.label,
        href: st.href,
        hedef: hedefTuret(st.href, due)
      };
    }));
  }

  /* ---------- "sunu calistin" ---------- */
  function yapilanlar(d){
    var p = [];
    if (d.cumle)  p.push(d.cumle + " cümle");
    if (d.tekrar) p.push(d.tekrar + " tekrar");
    if (d.ders)   p.push(d.ders + " ders");
    if (d.video)  p.push(d.video + " video");
    if (!p.length) return "";
    if (p.length === 1) return p[0];
    return p.slice(0,-1).join(", ") + " ve " + p[p.length-1];
  }

  /* ---------- "su kaldi" ---------- */
  function kalanAdim(d){
    if (!d.plan || !d.plan.steps) return null;
    for (var i=0; i<d.plan.steps.length; i++){
      var s = d.plan.steps[i];
      var sayfa = String(s.href||"").split("?")[0];
      var bitti = d.bitenSet[sayfa] || (sayfa === "chat.html" && d.sohbetVar);
      if (!bitti) return s;
    }
    return null;
  }

  /* ================= KOCUN SOZU =================
     Bugun calisilmissa ONCE ne yapildigi soylenir; sabahin focus
     metni ikincil kalir. Calisilmamissa focus one gecer. */
  function soz(d, plan){
    var a = ad();
    var selam = a ? ("Merhaba " + a + ". ") : "";

    if (!d.calisti){
      return selam + String((plan && plan.focus) || "Bugüne başlayalım.")
        + (plan && plan.note ? " " + plan.note : "");
    }

    var y = yapilanlar(d);
    var k = kalanAdim(d);

    /* SIRALAMA ONEMLI. Once en ozgul devam noktasi, sonra bitis,
       en son genel durum. Bitis kontrolu tekrar sayacindan ONCE gelmeli:
       plan adimlarinin hepsi bittiginde, tekrar.html'in dondurulmus gun
       sayaci yarim gorunse bile gun bitmistir — yoksa koc bitmis bir
       gunde "tekrardan N kaldi" diyordu. */
    if (d.dersOturum){
      return "Bugün " + y + " yaptın. Dersin " +
        d.dersOturum.yapilan + "/" + d.dersOturum.toplam +
        " adımında kalmıştın, oradan devam edelim.";
    }
    if (d.adimToplam && d.adimBiten >= d.adimToplam){
      return "Bugünün planını bitirdin: " + y + ". Yarın görüşürüz.";
    }
    if (d.tekrarGun && d.tekrarGun.yapilan < d.tekrarGun.hedef){
      return "Bugün " + y + " yaptın. Tekrardan " +
        (d.tekrarGun.hedef - d.tekrarGun.yapilan) + " tane kaldı.";
    }
    if (k){
      return "Bugün " + y + " yaptın. Sırada " +
        String(k.label||"").toLocaleLowerCase("tr") + " var.";
    }
    return "Bugün " + y + " yaptın. Devam edelim.";
  }

  /* ================= DURUM KARTI ================= */
  function durumCiz(d){
    if (!d.calisti){ $("durumKart").hidden = true; return; }
    $("durumKart").hidden = false;

    var hucre = function(etiket, deger){
      return '<div class="dh-metrik" style="padding:var(--dh-b-2) var(--dh-b-3)">' +
        '<div class="dh-metrik__etiket">' + etiket + '</div>' +
        '<div class="dh-metrik__deger" style="font-size:var(--dh-fs-govde)">' + deger + '</div></div>';
    };
    var h = "";
    h += hucre("Cümle",  d.cumle);
    h += hucre("Tekrar", d.tekrar);
    h += hucre(d.video ? "Video" : "Ders", d.video ? d.video : d.ders);
    $("durumSayilar").innerHTML = h;

    /* gunun adim ilerlemesi: planlanan / yapilan / kalan */
    if (d.adimToplam){
      var t = "";
      for (var i=0; i<d.adimToplam; i++){
        t += '<span class="dh-tugla__bir' + (i < d.adimBiten ? " dh-tugla__bir--dolu" : "") + '"></span>';
      }
      $("gunTugla").innerHTML = t;
      $("gunYazi").textContent = d.adimBiten + "/" + d.adimToplam + " adım · " +
        (d.adimToplam - d.adimBiten > 0 ? (d.adimToplam - d.adimBiten) + " kaldı" : "tamam");
    } else {
      $("gunTugla").innerHTML = "";
      $("gunYazi").textContent = "";
    }
  }

  /* ================= YARIM KALAN DERS ================= */
  function dersDevamCiz(d){
    if (!d.dersOturum){ $("dersDevam").hidden = true; return; }
    $("dersDevamAd").textContent =
      "Derse devam · " + d.dersOturum.yapilan + "/" + d.dersOturum.toplam +
      " adım · " + (d.dersOturum.toplam - d.dersOturum.yapilan) + " kaldı";
    $("dersDevam").hidden = false;
  }

  /* ================= ADIM LISTESI ================= */
  var ISARET = { tekrar:"↻", yeni:"+", sohbet:"◇", hata:"!", kelime:"▪" };
  function tipOf(href){
    var h = String(href||"");
    if (h.indexOf("tekrar") === 0) return "tekrar";
    if (h.indexOf("chat") === 0) return "sohbet";
    if (h.indexOf("hata-defteri") === 0) return "hata";
    if (h.indexOf("kelime") === 0) return "kelime";
    return "yeni";
  }

  function adimlarCiz(d, plan){
    var kap = $("plan");
    if (!plan || !plan.steps || !plan.steps.length){
      kap.innerHTML = "";
      $("planBaslik").hidden = true;
      return;
    }
    $("planBaslik").hidden = false;
    kap.innerHTML = "";
    var aktifVar = false;

    plan.steps.forEach(function(s){
      var sayfa = String(s.href||"").split("?")[0];
      var bitti = !!d.bitenSet[sayfa] || (sayfa === "chat.html" && d.sohbetVar);
      var aktif = !bitti && !aktifVar;
      if (aktif) aktifVar = true;

      var a = document.createElement("a");
      a.href = "./" + s.href;
      a.className = "dh-plan-satir" +
        (aktif ? " dh-plan-satir--aktif" : "") +
        (bitti ? " dh-plan-satir--bitti" : "");

      var ic = '<div class="dh-plan-satir__ust">' +
          '<span class="dh-plan-satir__ikon" aria-hidden="true">' +
            (bitti ? "✓" : (ISARET[tipOf(s.href)] || "·")) +
          '</span>' +
          '<span class="dh-plan-satir__ad">' + kacir(s.label) + '</span>' +
        '</div>';

      /* HER adimda tugla sayaci (bugun.html'den tasindi).
         Kaynak onceligi:
           1) tekrar adimi ise tekrar.html'in dondurulmus gun hedefi
           2) yoksa DHPlan defteri
         Ham bekleyen TOPLAMI hicbir kosulda gosterilmez. */
      var hedef = 0, yapilan = 0;
      if (tipOf(s.href) === "tekrar" && d.tekrarGun){
        hedef = d.tekrarGun.hedef; yapilan = d.tekrarGun.yapilan;
      } else {
        var da = d.defter ? defterAdimi(d.defter, s.href) : null;
        if (da){ hedef = da.hedef; yapilan = Math.min(da.yapilan, da.hedef); }
      }
      if (bitti && hedef) yapilan = hedef;

      /* Tek birimlik adimda (konusma gibi) tugla gurultu yaratir */
      if (hedef > 1){
        var t = "", n = Math.min(hedef, 24);
        for (var i=0; i<n; i++){
          var esik = Math.round((i / n) * hedef);
          t += '<span class="dh-tugla__bir' + (esik < yapilan ? " dh-tugla__bir--dolu" : "") + '"></span>';
        }
        ic += '<div class="dh-tugla" style="margin-bottom:0">' +
              '<div class="dh-tugla__sira">' + t + '</div>' +
              '<div class="dh-tugla__yazi">' + yapilan + "/" + hedef +
              " · " + Math.max(0, hedef - yapilan) + ' kaldı</div></div>';
      }
      a.innerHTML = ic;
      kap.appendChild(a);
    });

    $("planBaslik").textContent = "Bugünün planı · " +
      (d.adimBiten ? (d.adimBiten + "/" + d.adimToplam + " tamam") : (plan.steps.length + " adım"));
  }

  /* ================= BIRINCIL EYLEM ================= */
  function devamCiz(d, plan){
    var b = $("devam");
    if (d.dersOturum){
      b.textContent = "Derse devam et";
      b.href = "./ders.html";
      return;
    }
    var k = kalanAdim(d);
    if (k){
      b.textContent = d.calisti ? "Kaldığın yerden devam" : "Başla";
      b.href = "./" + k.href;
      return;
    }
    if (d.adimToplam && d.adimBiten >= d.adimToplam){
      b.textContent = "Bugünlük tamam";
      b.href = "./ilerleme.html";
      return;
    }
    b.textContent = d.calisti ? "Devam et" : "Başla";
    b.href = "./ders.html";
  }

  /* ================= AVATAR ================= */
  var avatar = null;
  function sesAcik(){
    try{ return localStorage.getItem("dh-koc-sesli") !== "0"; }catch(e){ return true; }
  }
  function sesBoya(){
    $("sesBtn").textContent = sesAcik() ? "◍" : "◌";
    $("sesBtn").setAttribute("aria-pressed", sesAcik() ? "true" : "false");
  }
  $("sesBtn").onclick = function(){
    try{ localStorage.setItem("dh-koc-sesli", sesAcik() ? "0" : "1"); }catch(e){}
    if (!sesAcik()){ try{ speechSynthesis.cancel(); }catch(e){} }
    sesBoya();
  };
  sesBoya();

  try{
    if (window.DHAvatar) avatar = DHAvatar.olustur($("kocAvatar"), { yol:"./assets/avatars_v3/teacher/" });
  }catch(e){}

  /* Ayni metni her donuste yeniden seslendirme — gun icinde 5 kez
     ana ekrana ugrayan kullaniciya 5 kez ayni cumle okunmasin. */
  function konustur(metin){
    if (!avatar) return;
    var son = null;
    try{ son = sessionStorage.getItem("dh-koc-son-soz"); }catch(e){}
    if (son === metin) return;
    try{ sessionStorage.setItem("dh-koc-son-soz", metin); }catch(e){}
    avatar.hazir.then(function(){ avatar.konus(metin, { ses: sesAcik(), dil:"tr-TR" }); });
  }

  /* ================= HAFTA + SERI ================= */
  function haftaCiz(){
    var tr = oku("dh-study-tracker-v1", {}) || {};
    var gunler = tr.days || {};
    var kap = $("hafta");
    kap.innerHTML = "";
    var aktif = 0;
    for (var i=6; i>=0; i--){
      var dd = new Date(); dd.setDate(dd.getDate()-i);
      var k = dd.toISOString().slice(0,10);
      var r = gunler[k];
      var v = r ? ((r.lessons||0) + (r.sentences||0)/5 + (r.reviews||0)/3) : 0;
      var el = document.createElement("span");
      el.className = "dh-hafta__gun" +
        (v > 0 ? " dh-hafta__gun--tuttu" : (i === 0 ? " dh-hafta__gun--bugun" : ""));
      el.title = k;
      kap.appendChild(el);
      if (v > 0) aktif++;
    }
    $("haftaOzet").textContent = aktif + "/7 gün çalıştın";
  }
  function seriCiz(){
    try{
      var tr = oku("dh-study-tracker-v1", {}) || {};
      var gunler = tr.days || {};
      var d = new Date(), n = 0;
      if (!gunler[d.toISOString().slice(0,10)]) d.setDate(d.getDate()-1);
      while (gunler[d.toISOString().slice(0,10)]){ n++; d.setDate(d.getDate()-1); }
      if (n > 0){ $("seriN").textContent = n; $("seriRozet").hidden = false; }
    }catch(e){}
  }

  /* ================= TEK CIZIM NOKTASI ================= */
  function ciz(plan, ctx){
    var d = durum();
    plan = plan || d.plan;

    /* koc plani geldiyse DHPlan defterini bir kez kur */
    if (plan && plan.steps) planiKur(plan);
    d = durum();                              /* defter yeni kurulduysa tazele */

    /* DINLENME GUNU (bugun.html'den tasindi) */
    if (d.dinlenme){
      $("kocSoz").textContent = "Dinlenme günü. Serin bozulmadı, yarın aynı yerdeyim.";
      $("durumKart").hidden = true;
      $("dersDevam").hidden = true;
      $("plan").innerHTML = '<div class="dh-kart dh-kart--sessiz">' +
        '<p class="dh-etiket" style="margin:0">Dinlenme günü planın parçası — ' +
        'seriyi kırmaz. Fikrini değiştirirsen aşağıdan başlayabilirsin.</p></div>';
      $("planBaslik").textContent = "Bugün dinlenme günü";
      $("devam").textContent = "Yine de çalış";
      $("devam").href = "./ders.html";
      $("dinlenme").hidden = true;
      haftaCiz(); seriCiz();
      konustur($("kocSoz").textContent);
      return;
    }

    $("kocSoz").textContent = soz(d, plan);
    durumCiz(d);
    dersDevamCiz(d);
    adimlarCiz(d, plan);
    devamCiz(d, plan);
    haftaCiz();
    seriCiz();

    /* koc.js'ten gelen ek bilgiler */
    if (plan && plan.why && !d.calisti){
      $("kocNeden").textContent = plan.why;
      $("kocNeden").hidden = false;
    } else if (plan && plan.why && d.calisti){
      /* calisilmis gunde sabahin gerekcesi bayat olabilir; freshenPlan()
         onu zaten tazeliyor, o yuzden gosterilir ama ikincil kalir. */
      $("kocNeden").textContent = plan.why;
      $("kocNeden").hidden = false;
    } else {
      $("kocNeden").hidden = true;
    }

    if (ctx && ctx.seviyeOner){
      $("seviyeNeden").textContent = ctx.seviyeNeden || "";
      $("seviyeKart").style.display = "block";
    }
    var g = ctx && ctx.hedef;
    if (g && (g.goal || g.result)){
      if (g.goal){
        $("hedefMetin").textContent = g.goal.type + " hatasını " +
          g.goal.baseline + "'ten " + g.goal.targetCount + "'e indir";
      }
      if (g.result){
        $("hedefSonuc").textContent =
          (g.result.achieved ? "Geçen haftaki hedefini tuttun. " : "Geçen haftaki hedefe tam ulaşamadın. ") +
          g.result.type + ": " + g.result.before + " → " + g.result.now;
      }
      $("hedefKart").style.display = "block";
    }

    /* canli sayilar — yalnizca koc.js'ten gelir; ham due GOSTERILMEZ */
    if (plan && plan.stats){
      $("mOgrenilmis").textContent  = (plan.stats.s2||0) + (plan.stats.w2||0);
      $("mCalisiliyor").textContent = (plan.stats.s1||0) + (plan.stats.w1||0);
    }

    konustur($("kocSoz").textContent);
  }

  /* ================= KOC KANCASI ================= */
  window.DHKocRender = function(plan, ctx){
    kocGeldi = true;
    sonPlan = plan; sonCtx = ctx || {};
    ciz(plan, sonCtx);
  };

  /* ================= ILK BOYAMA (SENKRON) =================
     koc.js beklenmez. Depodaki gercek durum ANINDA basilir; boylece
     calismis kullanici "Bugunu hazirliyorum..." gormez. */
  ciz(null, {});

  /* ================= YEDEK PLAN =================
     AI anahtari yoksa koc.js run() paint()'e hic gelmez. Iskelet zaten
     deterministik oldugu icin ayni plan burada AI'siz kurulur. */
  setTimeout(function(){
    if (kocGeldi) return;
    var d = durum();
    if (d.plan && d.plan.steps && d.plan.steps.length) return;   // onbellekte plan var

    bekleyenSay(function(due){
      var adimlar = [];
      if (due > 0) adimlar.push({ label:"Vadesi gelen kelime/cümleleri tekrarla", href:"tekrar.html?plan=1" });
      if (d.cumle < 25) adimlar.push({ label:"Yeni cümleler öğren", href:"index-app.html" });
      adimlar.push({ label:"1 dakika konuş", href:"chat.html" });
      ciz({ focus:"Bugün planına başlayalım.", steps:adimlar }, {});
    });
  }, 2600);

  /* Ham due sayisi okunur ama EKRANA CIKMAZ; yalnizca adimin
     gosterilip gosterilmeyecegine karar verir. */
  function bekleyenSay(gel){
    try{
      var r = indexedDB.open("sentence-mode", 1);
      r.onsuccess = function(){
        var db = r.result, n = 0, now = Date.now();
        if (!db.objectStoreNames.contains("kv")){ try{db.close();}catch(e){} return gel(0); }
        try{
          var q = db.transaction("kv","readonly").objectStore("kv").openCursor();
          q.onsuccess = function(e){
            var c = e.target.result;
            if (c){
              var k = String(c.key), v = c.value || {};
              if (k.indexOf("srs:") === 0 && (v.due||0) <= now) n++;
              c.continue();
            } else { try{db.close();}catch(_){}
              try{ localStorage.setItem("dh-son-bekleyen", String(n)); }catch(_){}
              gel(n);
            }
          };
          q.onerror = function(){ try{db.close();}catch(_){} gel(0); };
        }catch(e2){ try{db.close();}catch(_){} gel(0); }
      };
      r.onerror = function(){ gel(0); };
    }catch(e){ gel(0); }
  }

  /* Baska sekmeden / bulut senkronundan sonra taze kalsin.
     Geri tusuyla (bfcache) donuste de yeniden cizilir — asil sikayet buydu. */
  window.addEventListener("pageshow", function(){ ciz(sonPlan, sonCtx); });
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") ciz(sonPlan, sonCtx);
  });
  window.addEventListener("dh-cloud-synced", function(){ ciz(sonPlan, sonCtx); });

  $("dinlenme").onclick = function(){
    try{ if (window.DHPlan) DHPlan.dinlenmeyeAl(); }catch(e){}
    try{ sessionStorage.removeItem("dh-koc-son-soz"); }catch(e){}
    ciz(sonPlan, sonCtx);
  };

  /* ================= SONRAKI GUNU BASLAT =================
     koc.js'teki #dhResetToday ile ayni islem. Ogrenme verisi silinmez. */
  $("sonrakiGun").onclick = function(){
    try{
      localStorage.removeItem("dh-koc-plan-" + GUN);
      localStorage.removeItem("dh-koc-steps-done-" + GUN);
      localStorage.removeItem("dh-day-closed-" + GUN);
      localStorage.removeItem("dh-coach-last-generic-tip");
      localStorage.removeItem("dh-ders-oturum-" + GUN);
      localStorage.removeItem("dh-gun-plan-" + GUN);
      var tr = oku("dh-study-tracker-v1", {}) || {};
      var d = (tr.days || {})[GUN] || {};
      localStorage.setItem("dh-koc-epoch-" + GUN, JSON.stringify({
        sentences:d.sentences||0, reviews:d.reviews||0,
        lessons:d.lessons||0, videos:d.videos||0
      }));
      sessionStorage.removeItem("dh-koc-son-soz");
    }catch(e){}
    location.reload();
  };
})();
</script>
