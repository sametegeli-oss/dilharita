<!-- Altındaki o uzun applyUniqueVoice() script kodlarını tamamen sildik -->

<script src="./chat-core.js?v=18"></script>
<script src="./coach-bubble.js?v=10"></script>
<script>
// --- HAVAALANI İÇİN ÖZEL SES ENJEKSİYONU (Havaalanı Sıra No: 3) ---
function applyUniqueVoice() {
    if ('speechSynthesis' in window) {
        try {
            const voices = window.speechSynthesis.getVoices();
            const englishVoices = voices.filter(v => v.lang.startsWith('en') || v.lang.startsWith('EN'));
            
            if (englishVoices.length > 0) {
                // 3. sesi al (indeks 2)
                const selectedVoice = englishVoices[2 % englishVoices.length];
                window.CHAT_SCENARIO.voiceName = selectedVoice.name;
                window.CHAT_SCENARIO.lang = selectedVoice.lang;
            } else {
                console.warn('Havaalanı: İngilizce ses bulunamadı.');
            }
        } catch(e) {
            console.warn('Ses seçimi sırasında hata:', e);
        }
    }
}

if ('speechSynthesis' in window) {
    // Sesler zaten yüklüyse hemen uygula, değilse olayı bekle
    if (window.speechSynthesis.getVoices().length > 0) {
        applyUniqueVoice();
    } else {
        window.speechSynthesis.onvoiceschanged = function() {
            applyUniqueVoice();
            window.speechSynthesis.onvoiceschanged = null; // tekrar tetiklenmesin
        };
    }
}
// -----------------------------------------------------------------
</script>
