<!DOCTYPE html><html><body><script src="node_modules/@vladmandic/face-api/dist/face-api.js"></script>
<script>
window.go=async(F)=>{ await faceapi.nets.ssdMobilenetv1.loadFromUri('node_modules/@vladmandic/face-api/model'); await faceapi.nets.faceLandmark68Net.loadFromUri('node_modules/@vladmandic/face-api/model');
 const out={}; for(const f of F){ const img=new Image(); img.src='yeni2/'+f+'.png'; await img.decode();
   const r=await faceapi.detectSingleFace(img).withFaceLandmarks(); out[f]=r?r.landmarks.positions.map(p=>[+p.x.toFixed(1),+p.y.toFixed(1)]):null; } return out; };
</script></body></html>
