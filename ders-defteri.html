<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ders Defterim · Dil Harita</title>
<script src="./auth-guard.js?v=19"></script>
<script src="./gemini-bridge.js?v=t23"></script>
<script src="./dh-ders-defteri.js?v=3"></script>
<link rel="stylesheet" href="./kolay-kullanim.css?v=13">
<script src="./kolay-kullanim.js?v=29"></script>
<style>
:root{--bg:#0b1220;--surface:#111a2e;--surface-2:#1c2a45;--border:#24365a;--text:#e6eefc;--muted:#93a4bd;--accent:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.55 Nunito,system-ui,sans-serif}
.ust{position:sticky;top:0;z-index:5;background:#0d1628;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.ust a.geri{color:var(--text);text-decoration:none;font-weight:800;border:1px solid var(--border);border-radius:10px;padding:7px 11px}
.ust h1{font-size:18px;margin:0;flex:1}
.ic{max-width:760px;margin:0 auto;padding:14px}
.ara{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font:600 15px Nunito,sans-serif;margin-bottom:10px}
.not{color:var(--muted);font-size:13px;margin:0 0 12px}
.kart{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.kart-bas{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.kart-bas b{display:block;font-size:16px}
.kart-bas small{color:var(--muted)}
.kart-bas .say{margin-left:auto;white-space:nowrap;font:800 12px Nunito,sans-serif;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.kart-ic{display:none;border-top:1px solid var(--border);padding:12px 14px}
.kart.acik .kart-ic{display:block}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dugmeler button{border:0;border-radius:12px;padding:10px 14px;font:800 14px Nunito,sans-serif;color:#fff;cursor:pointer}
.d-ogr{background:#16a34a}.d-dz{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.aciklama{background:#0d1628;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.aciklama h1,.aciklama h2,.aciklama h3{font-size:15px;color:var(--accent);margin:10px 0 6px}
.dh-tablo{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--border);border-radius:10px}
.dh-tablo table{width:100%;border-collapse:collapse;font-size:14px}
.dh-tablo th{background:var(--surface-2);text-align:left;padding:7px 9px}
.dh-tablo td{padding:7px 9px;border-top:1px solid rgba(148,163,184,.12);vertical-align:top}
.m{margin:8px 0;padding:9px 12px;border-radius:12px;max-width:92%}
.m small{display:block;font:800 11.5px Nunito,sans-serif;color:var(--muted);margin-bottom:3px}
.m.sen{background:#14532d;margin-left:auto}
.m.ogr{background:var(--surface-2)}
.m.dz{background:#1e2a5a}
.bos{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>
<div class="ust"><a class="geri" href="./teacher.html">← Öğretmen</a><h1>📒 Ders Defterim</h1></div>
<div class="ic">
  <input class="ara" id="ara" type="search" placeholder="Cümle ya da konuşmalarda ara…" autocomplete="off">
  <p class="not">Öğretmenle ve Deniz'le yaptığın bütün çalışmalar burada. Hiçbir kayıt silinmez; aynı cümleye dönünce kaldığın yerden devam edersin.</p>
  <div id="liste"><div class="bos">Yükleniyor…</div></div>
</div>
<script>
(function(){
  "use strict";
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var md=function(t){ return window.DHGemini&&DHGemini.markdown ? DHGemini.markdown(String(t||"")) : esc(t).replace(/\n/g,"<br>"); };
  var tarih=function(t){ try{ return new Date(t).toLocaleString("tr-TR",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
  var tum=[];
  function ciz(){
    var q=(document.getElementById("ara").value||"").toLocaleLowerCase("tr-TR").trim();
    var l=tum.filter(function(d){ if(!q) return true; var h=(d.cumle+" "+(d.tr||"")+" "+(d.aciklama||"")+" "+(d.mesajlar||[]).map(function(m){return m.metin;}).join(" ")).toLocaleLowerCase("tr-TR"); return h.indexOf(q)>=0; });
    var el=document.getElementById("liste");
    if(!l.length){ el.innerHTML='<div class="bos">'+(tum.length?"Aramana uyan kayıt yok.":"Henüz kayıt yok. Öğretmen sayfasında bir cümle çalıştığında burada görünür.")+'</div>'; return; }
    el.innerHTML=l.map(function(d,i){
      var ms=(d.mesajlar||[]).map(function(m){
        var c=m.kim==="Sen"?"sen":m.kim==="Deniz"?"dz":"ogr";
        var ad=m.kim==="Sen"?("Sen"+(m.yer?" → "+m.yer:"")):(m.kim==="Deniz"?"🎥 Deniz":"📘 Öğretmen");
        return '<div class="m '+c+'"><small>'+esc(ad)+' · '+esc(tarih(m.t))+'</small>'+(c==="sen"?esc(m.metin):md(m.metin))+'</div>';
      }).join("");
      return '<div class="kart" data-i="'+i+'"><div class="kart-bas"><div><b>'+esc(d.cumle)+'</b><small>'+esc(d.tr||"")+(d.tr?" · ":"")+esc(tarih(d.guncel))+'</small></div><span class="say">'+(d.mesajlar||[]).length+' mesaj</span></div>'
        +'<div class="kart-ic"><div class="dugmeler"><button class="d-ogr" data-ac="ogr" data-id="'+esc(d.id)+'">📘 Öğretmende aç</button><button class="d-dz" data-ac="dz" data-id="'+esc(d.id)+'">🎥 Deniz\'le çalış</button></div>'
        +(d.aciklama?'<div class="aciklama">'+md(d.aciklama)+'</div>':'')+ms+'</div></div>';
    }).join("");
  }
  document.getElementById("liste").addEventListener("click",function(e){
    var b=e.target.closest("button[data-ac]");
    if(b){
      DHDefter.ac(b.dataset.id).then(function(d){
        if(!d) return;
        if(b.dataset.ac==="ogr") location.href="./teacher.html?defter=1";
        else { try{ localStorage.setItem("dh-deniz-analiz",JSON.stringify({cumle:d.cumle,tr:d.tr||"",src:"Ders defteri",kim:"",ozet:"",kurallar:localStorage.getItem("dh_ai_prompt_teacher")||"",t:Date.now(),defter:true,odak:null})); }catch(x){} location.href="./konuskan.html?deniz=analiz"; }
      });
      return;
    }
    var k=e.target.closest(".kart-bas"); if(k) k.parentNode.classList.toggle("acik");
  });
  document.getElementById("ara").addEventListener("input",ciz);
  DHDefter.listele().then(function(a){ tum=a.filter(function(d){return d&&d.cumle;}); ciz(); });
})();
</script>
</body>
</html>
